// Live countdown to 11:59:59 PM IST on the offer's last day (2026-10-20, direct
// request: "can we add a countdown timer till 11:59PM?"). Ticks every second;
// once it reaches zero it says the offer has ended (a reload then drops the line).
function OfferCountdown({ deadline }) {
  const end = React.useMemo(() => new Date(String(deadline).slice(0, 10) + 'T23:59:59+05:30').getTime(), [deadline]);
  const [now, setNow] = React.useState(() => Date.now());
  React.useEffect(() => {
    if (end - Date.now() <= 0) return;
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, [end]);
  const left = Math.max(0, Math.floor((end - now) / 1000));
  if (left <= 0) return <span className="c28-offer-ends c28-offer-ends--today">Offer ended</span>;
  const pad = n => String(n).padStart(2, '0');
  const h = Math.floor(left / 3600), m = Math.floor((left % 3600) / 60), sec = left % 60;
  return (
    <span className="c28-offer-ends c28-offer-ends--today" role="timer" aria-live="off" aria-label={'Offer ends today at 11:59 PM, ' + h + ' hours ' + m + ' minutes left'}>
      <span className="c28-offer-icon" aria-hidden="true"><span className="c28-today-dot" /></span>
      <span>Ends in <span className="c28-countdown">{pad(h)}:{pad(m)}:{pad(sec)}</span></span>
    </span>
  );
}

const ComboCard = React.memo(function ComboCard({ c, pricing }) {
  const p = pricing;
  // Phones only: long includes lists show the first few items behind a
  // "Show all" toggle (CSS hides the rest under 600px; desktop ignores it).
  const [inclOpen, setInclOpen] = React.useState(false);
  const [projOpen, setProjOpen] = React.useState(false);
  const inclPeek = c.includesPeek || 0;
  const live = !!p;
  const pd = p || {};
  const price            = pd.price    ? fmtPrice(pd.price)    : '-';
  const priceOld         = pd.priceOld ? fmtPrice(pd.priceOld) : null;
  const discountRaw      = pd.discount || null;
  const discount         = discountRaw ? (isNaN(discountRaw) ? discountRaw : discountRaw + '% off') : null;
  // A card with liveOfferUntil (the 2028 card: super early bird until Oct 20)
  // drops its whole offer line after that date (IST), so it never shows a
  // past "Offer ends" or the default offer name once the offer is over. The
  // price itself moves to 11999 via netlify/functions/pricing-2028-cutover.js.
  // Any card's offer line (reason + "Offer ends ...") also hides itself once
  // its /team discount_deadline has passed in IST (direct request 2026-10-07,
  // "hide the line only"): no past "Offer ends" date is ever shown. Only the
  // line; the price and % pill stay as /team has them.
  const todayIST         = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
  const liveOfferOver    = !!(c.liveOfferUntil && todayIST > c.liveOfferUntil) ||
                           !!(pd.discountDeadline && todayIST > pd.discountDeadline);
  const discountDeadline = pd.discountDeadline && !liveOfferOver ? fmtDeadline(pd.discountDeadline) : null;
  // Last day of the offer (2026-10-19, "can this be ends today on october 20th in red"):
  // the 2028 card's price box reads "Ends today" in red on the deadline date (IST).
  const offerEndsToday   = !!(pd.discountDeadline && !liveOfferOver && todayIST === String(pd.discountDeadline).slice(0, 10));
  // The 2028 card defaults to 'Super early bird offer' once live (2026-10-05,
  // direct request); a discount reason set in /team still wins.
  const discountReason   = liveOfferOver ? null : (pd.discountReason  || (c.comingSoon && pd.price && pd.enrollUrl ? c.liveOffer : null) || null);
  const saving           = c.saving;
  // A preview card (the 2028 course) keeps its own layout and amber look
  // for good, but its "coming soon" state switches off by itself once
  // /team has BOTH a price and an enrol link for it (2026-10-04, direct
  // request), so launch day needs no code change or deploy: the price
  // unblurs, "Enrol now" appears, and the launch row disappears.
  const isPreviewCard = !!c.comingSoon;
  // Only decided once /team pricing has actually loaded (2026-10-08): while
  // it's still fetching, the card renders in its live layout with a plain
  // "-" price, instead of flashing the blurred coming-soon placeholder.
  const comingSoon = isPreviewCard && !!_sitePricingCache && !(pd.price && pd.enrollUrl);
  const [showEnrolNote, setShowEnrolNote] = React.useState(false);
  const closeEnrolNote = React.useCallback(() => setShowEnrolNote(false), []);
  // This card's own enrollment cutoff, separate from discountDeadline
  // (a pricing field driving the unrelated ⏳ discount-offer line
  // below) — isn't a price change, it's "this batch stops accepting
  // students." IST midnight, matching every other server/client
  // date-cutoff on this site (see e.g. todayIST() in lib/supabase.js)
  // rather than the visitor's own local timezone, so it flips at the
  // same real moment for everyone regardless of where they are.
  // Live site_pricing.sold_out_date (2026-09-23 cutover) wins when set,
  // falling back to this card's own hardcoded value — so an admin can
  // now change, or newly set, a sold-out cutover for ANY combo from
  // /team without a code change, while a card with no live row yet
  // (nothing ever set in Supabase for it) keeps behaving exactly as
  // before this cutover shipped.
  const soldOutDate = pd.soldOutDate || c.soldOutDate || null;
  const soldOutAt = soldOutDate ? new Date(soldOutDate + 'T00:00:00+05:30') : null;
  const isSoldOut = !!(soldOutAt && new Date() >= soldOutAt);
  const launchAt = c.launchDate ? new Date(c.launchDate + 'T00:00:00+05:30') : null;
  const msToLaunch = launchAt ? launchAt - new Date() : null;
  const launchUpcoming = msToLaunch != null && msToLaunch > -86400000; // through launch day itself
  const daysUntilLaunch = launchUpcoming ? Math.max(0, Math.ceil(msToLaunch / 86400000)) : null;
  const launchShort = launchAt ? launchAt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'Asia/Kolkata' }) : '';
  const daysUntilSoldOut = soldOutAt && !isSoldOut
    ? Math.max(1, Math.ceil((soldOutAt - new Date()) / 86400000))
    : null;
  // A real live-data validity (pd.validity) never exists for a comingSoon
  // course (nothing in pricingMap for an id with no real offer yet) — so
  // this reads the date straight off the combo's own data instead, the
  // same "known, hardcoded, not fetched" treatment its accent/badge get.
  const validity = pd.validity ? fmtValidity(pd.validity) : (isPreviewCard && c.validityDate ? fmtValidity(c.validityDate) : '-');
  const featured = c.badge === 'best' || c.featured;
  const cls = 'combo-card card' + (featured ? ' featured' : '') + (c.theme ? ` combo-${c.theme}` : '') + (isPreviewCard ? ' coming-soon' : '');
  const spotlightProps = {
    onMouseMove: e => { const r = e.currentTarget.getBoundingClientRect(); e.currentTarget.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%'); e.currentTarget.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%'); },
    onMouseLeave: e => { e.currentTarget.style.setProperty('--mx', '-200%'); e.currentTarget.style.setProperty('--my', '-200%'); }
  };
  // A diagonal rubber-stamp, not a banner — sits centered over the
  // includes list specifically (see combo-includes-wrap below, same
  // positioning trick the 2028 card's own coming-soon overlay already
  // uses), with that list blurred out underneath it rather than hidden
  // outright — reads as "here's what you're missing," the same "shape
  // of real content, just not accessible" language the coming-soon card
  // already established for its own blur.
  const soldOutStampEl = (
    <div className="combo-sold-out-overlay">
      <div className="combo-sold-out-stamp">Sold Out</div>
    </div>
  );
  // The plain "Best value"/"Bundle" pill; shown on every card that isn't sold out.
  const badgeEl = <div className={'combo-badge ' + c.badge}><Icon.Sparkle />{c.badgeLabel}</div>;
  // Redesigned 2026-10-04 ("make this portion look better"): the corner
  // pill, the 30-day progress bar (an approximation, not real data) and
  // the dim pulsing date line became one readable deadline row under the
  // tagline: bell + "6 days left" in amber, then the exact close date.
  // The card's normal badge sits back at the top.
  const countdownDetailEl = daysUntilSoldOut != null && (
    <div className="combo-deadline">
      {/* The sold-out date is the first day enrolment is CLOSED (the card
          sells out at 00:00 IST that day), so the count includes today and
          the date shown is the day before: the last day to enrol (2026-10-07,
          when the 2027 course's date moved to Oct 11). */}
      <span className="combo-deadline-left"><Icon.Bell size={14} />{daysUntilSoldOut === 1 ? 'Last day' : `${daysUntilSoldOut} days left`}</span>
      <span className="combo-deadline-date">{daysUntilSoldOut === 1 ? 'Enrolment closes at midnight' : 'Last day to enrol ' + fmtDate(new Date(new Date(soldOutDate + 'T00:00:00+05:30').getTime() - 86400000).toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' }))}</span>
    </div>
  );
  // A floated spacer (not padding-right on the whole title) reserves room
  // for the corner badge — padding-right narrows every wrapped line, not
  // just the top one near the badge, which on a narrow mobile card crushed
  // this exact title into an ugly one-word-per-line 4-line wrap ("GATE" /
  // "2027" / "Full" / "Course") — the same failure mode already rejected
  // once this session for a different layout. A float only pushes the
  // lines that actually share the badge's vertical band; once the text
  // wraps past the float's height, later lines reclaim the full width.
  const titleEl = (
    <div className="combo-title">
      {c.title}
    </div>
  );
  const taglineEl = c.tagline && <div className="combo-tagline">{c.tagline}</div>;
  const validityEl = (
    <div className={`combo-validity${live ? ' data-fade-in' : ''}`} style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
      {validity}
      {c.validityNote && <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase', background: 'linear-gradient(135deg,var(--pink),var(--purple))', color: '#fff', padding: '2px 8px', borderRadius: 999 }}>{c.validityNote}</span>}
    </div>
  );
  // Direct request: blur this too, not just the price — the subject list
  // for 2028 isn't finalized yet either, so showing it crisp would read
  // as more locked-in than it actually is. aria-hidden for the same
  // reason the blurred price is: nothing legible for a screen reader to
  // announce here. Sold-out reuses the exact same blur, on request —
  // "features blurred out below" the stamp.
  const includesEl = (
    <div className={'combo-includes' + (isSoldOut ? ' combo-includes-blurred' : '') + (inclPeek && !isSoldOut ? ' is-collapsible' + (inclOpen ? ' is-open' : '') : '')} aria-hidden={isSoldOut || undefined} inert={isSoldOut ? '' : undefined}>
      <ul>
        {c.includes.map((item, i) => (
          <li key={i} className={inclPeek && i >= inclPeek ? 'combo-incl-more' : undefined} style={{ '--delay': `${i * 48}ms` }}>
            <span className="combo-check">
              <svg viewBox="0 0 10 8" fill="none">
                <path d="M1 4l3 3 5-5" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            </span>
            {(() => {
              // "Label: detail" items show the label in bold (2026-10-19, "make this better looking").
              const k = item.indexOf(': ');
              return k > 0 && k < 32
                ? <span className="combo-incl-text"><b>{item.slice(0, k + 1)}</b> {withDiscordLink(item.slice(k + 2))}</span>
                : <span className="combo-incl-text">{withDiscordLink(item)}</span>;
            })()}
          </li>
        ))}
      </ul>
      {inclPeek > 0 && !isSoldOut && (
        <button type="button" className="combo-incl-toggle" aria-expanded={inclOpen} onClick={() => setInclOpen(v => !v)}>
          {inclOpen ? 'Show less' : `Show all ${c.includes.length} included`}
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d={inclOpen ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6'} /></svg>
        </button>
      )}
    </div>
  );
  const priceRowEl = (
    <div className={`combo-price-row${live ? ' price-loaded' : ''}`}>
      {comingSoon
        // No real price exists yet — pricingMap has no entry for this
        // id, so `price` would just be '-' (a real, if boring, honest
        // state). Direct ask was a *blurred* price specifically, which
        // reads as "a real number exists, it's just not public yet" —
        // a bare '-' doesn't communicate that at all. A plausible,
        // slightly-above-2027 placeholder figure, blurred via CSS (see
        // .combo-price-blurred) rather than real digits — never sent
        // anywhere, purely decorative, and aria-hidden since a screen
        // reader has nothing meaningful to read from a blurred number.
        ? <div className="combo-price combo-price-blurred" aria-hidden="true">₹13,999</div>
        // Sold out: the real price (unlike comingSoon, a genuine one
        // already exists in pricingMap) blurs the same way, on request —
        // still legible as "a real number," just not worth reading once
        // this batch isn't taking enrollments.
        : isSoldOut
          ? (c.soldOutPrice
              ? <div className="combo-final-price"><span>MRP</span><div className="combo-price">{fmtPrice(c.soldOutPrice)}</div></div>
              : <div className="combo-price combo-price-blurred" aria-hidden="true">{price}</div>)
          : <div className="combo-price">{price}</div>}
      {!comingSoon && !isSoldOut && priceOld && <div className="combo-price-old">{priceOld}</div>}
      {!comingSoon && !isSoldOut && discount && <div className="combo-discount">{discount}</div>}
    </div>
  );
  // On request: once sold out, "Enrol now" (which would just 404/mislead
  // against a batch that's no longer taking students) is replaced with a
  // direct line to support instead of quietly disappearing or staying
  // clickable.
  const ctaEl = isSoldOut
    ? <a href={'mailto:support@taai.live?subject=' + encodeURIComponent(c.title)} className="btn btn-primary btn-full"><Icon.Mail size={15} /> Confident? Contact us</a>
    : isPreviewCard
      ? <button type="button" className="btn btn-primary btn-full" onClick={() => setShowEnrolNote(true)}>Enrol now <Icon.ArrowRight /></button>
      : <a href={pd.enrollUrl || c.href} target="_blank" rel="noopener noreferrer" className="btn btn-primary btn-full">Enrol now <Icon.ArrowRight /></a>;
  // comingSoon has no button. Since 2026-10-04 its What's-included list
  // is readable (only the price stays blurred) and the "Coming Soon"
  // status is carried by the badge alone; the big overlay that used to
  // sit over the blurred list was removed with the blur.

  // comingSoon gets a genuinely different structure (two side-by-side
  // halves on desktop — see .combo-horizontal), not just the same flat
  // stack recolored — direct request, since a single spotlighted preview
  // card has room to do more with its "own row" than a same-shaped
  // duplicate of the vertical cards below it. Every other combo (2027,
  // the two bundles) keeps the exact original flat structure, untouched.
  const inner = isPreviewCard ? (
    <div id={c.id} className={cls} {...spotlightProps}>
      <div className="combo-num">{c.num}</div>
      <div className="combo-accent" style={{ background: c.accent }} />
      <div className="c28">
        <div className="c28-head">
          <div className="c28-main">
            {titleEl}
            {taglineEl}
            {comingSoon && launchUpcoming && (
              <div className="combo-deadline combo-launch">
                <span className="combo-deadline-left"><Icon.Bell size={14} />{daysUntilLaunch === 0 ? 'Launching today' : `Launches in ${daysUntilLaunch} ${daysUntilLaunch === 1 ? 'day' : 'days'}`}</span>
                <span className="combo-deadline-date">{fmtDate(c.launchDate)}</span>
              </div>
            )}
            {!comingSoon && !isSoldOut && countdownDetailEl}
            {!isSoldOut && validityEl}
            {/* Fills the space beside the price box (2026-10-19). The "one
                enrolment, two attempts" label and chips were removed the same
                day at direct request; only the career line remains. */}
            <div className="c28-attempts">
              <span className="c28-attempts-note">Your entry point to an ML career: a master's at an IIT through GATE DA, then research or a high-paying job building AI.</span>
            </div>
          </div>
          <div className="c28-buy">
            {priceRowEl}
            {c.priceNote && <div className={'combo-price-note' + (comingSoon ? ' combo-includes-blurred' : '')} aria-hidden={comingSoon || undefined}>{c.priceNote}</div>}
            {comingSoon ? (
              <span className="btn btn-full combo-soon-btn" aria-disabled="true">{launchUpcoming ? (daysUntilLaunch === 0 ? 'Launching today' : `Launching ${launchShort}`) : 'Coming soon'}</span>
            ) : (
              <div className="combo-live-cta">
                {!isSoldOut && (discountReason || discountDeadline) && <div className="combo-saving c28-offer">{discountReason && <span className="c28-offer-line"><span className="c28-offer-icon" aria-hidden="true">⏳</span><span>{discountReason}</span></span>}{discountDeadline && (offerEndsToday
                  ? <OfferCountdown deadline={pd.discountDeadline} />
                  : <span className="c28-offer-ends">{discountDeadline}</span>)}</div>}
                {ctaEl}
              </div>
            )}
          </div>
        </div>
        <div className="c28-includes">
          <div className="combo-includes-label">What's included</div>
          <div className="combo-includes-wrap">
            {includesEl}
            {isSoldOut && soldOutStampEl}
          </div>
        </div>
        {c.projects && (
          <div className="combo-projects c28-projects">
            <div className="c28-projects-top">
              {(() => { const [pre, post] = c.projectsLabel.split(': '); return post
                ? <h4 className="combo-includes-label c28-projects-title">{pre}: <mark>{post}</mark></h4>
                : <h4 className="combo-includes-label c28-projects-title">{c.projectsLabel}</h4>; })()}
              <div className="c28-seehow"><span className="c28-seehow-lead">All built on the maths you study for GATE.</span><a href="#projects-map" className="c28-seehow-btn">See how<span className="c28-seehow-arrow" aria-hidden="true"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" /></svg></span></a></div>
            </div>
            <ul className={'combo-projects-list' + (projOpen ? ' is-open' : '')}>
              {c.projects.map(p => (
                <li key={p.art}>
                  <b className="c28-proj-count" aria-label={p.count + (p.count > 1 ? ' projects' : ' project')}>×{p.count}</b>
                  <span><b>{p.title}</b><span className="combo-projects-pitch">{p.caption}</span></span>
                </li>
              ))}
            </ul>
            <button type="button" className="combo-incl-toggle combo-proj-toggle" aria-expanded={projOpen} onClick={() => setProjOpen(v => !v)}>
              {projOpen ? 'Show less' : "See what you'll build"}
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d={projOpen ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6'} /></svg>
            </button>
            {c.projectsNote && <p className="combo-projects-note">{c.projectsNote}</p>}
          </div>
        )}
      </div>
    </div>
  ) : (
    <div id={c.id} className={cls} {...spotlightProps}>
      {/* On request, off a screenshot: the countdown now sits where the
          ghost corner numeral used to (replacing it, not just avoiding
          it — see the numeral's own now-inverted comment above), with
          the title brought back to being the first thing at the top of
          the card. Only for cards that actually have a countdown
          (daysUntilSoldOut != null, currently only full-course) — every
          other combo keeps its plain badge-then-title order untouched. */}
      {daysUntilSoldOut == null && <div className="combo-num">{c.num}</div>}
      <div className="combo-accent" style={{ background: c.accent }} />
      {!isSoldOut && badgeEl}
      {titleEl}
      {taglineEl}
      {!isSoldOut && countdownDetailEl}
      {/* "Valid until Feb 15, 2027" reads as "still on offer" — directly
          contradicts the sold-out stamp a few lines below it, real
          feedback from a screenshot. Hidden once sold out rather than
          replaced with something else; the stamp + contact button
          already say everything that needs saying here. */}
      {!isSoldOut && validityEl}
      <div className="combo-divider" />
      <div className="combo-includes-label">What's included</div>
      {isSoldOut ? (
        <div className="combo-includes-wrap">
          {includesEl}
          {soldOutStampEl}
        </div>
      ) : includesEl}
      {priceRowEl}
      {(discountReason || discountDeadline) && <div className="combo-saving" style={{ color: '#e05a2b', fontWeight: 600 }}>⏳ {[discountReason, discountDeadline].filter(Boolean).join(' · ')}</div>}
      {saving && <div className="combo-saving">{saving}</div>}
      {ctaEl}
    </div>
  );
  const note = showEnrolNote && <EnrolNote href={pd.enrollUrl || c.href} onClose={closeEnrolNote} />;
  if (featured) return <div className={'combo-featured-frame' + (isPreviewCard ? ' coming-soon' : '')}>{inner}{note}</div>;
  return <>{inner}{note}</>;
});

const CourseCard = React.memo(function CourseCard({ c, pricing }) {
  const p        = pricing || {};
  const price    = p.price    ? fmtPrice(p.price)    : '-';
  const priceOld = p.priceOld ? fmtPrice(p.priceOld) : null;
  const validity = p.validity ? fmtValidity(p.validity) : '-';
  const pct = (Number(p.price) > 0 && Number(p.priceOld) > Number(p.price)) ? Math.round((1 - Number(p.price) / Number(p.priceOld)) * 100) : null;
  // A comingSoon card goes live the moment /team gives it a price.
  const soon = !!c.comingSoon && !(Number(p.price) > 0);
  const enrollHref = p.enrollUrl || c.href;
  return (
    <div id={c.id} className={`course-card card${soon ? ' course-soon' : ''}`} style={{ '--course-grad': c.grad, '--course-shadow': c.shadow }}>
      <div className="course-accent" style={{ background: c.grad }} />
      <div className="course-head">
        <div className="course-icon" style={{ background: c.grad }}>{c.icon}</div>
        <div className="course-head-text">
          <div className="course-title">{c.title}</div>
          {!(soon && !p.validity) && <div className={`course-validity mono${p.validity ? ' data-fade-in' : ''}`}>{validity}</div>}
        </div>
      </div>
      <div className="course-topics-label">What you'll cover</div>
      <div className="course-topics">
        {c.topics.map((t, i) => (
          <div key={i} className="course-topic" style={{ '--td': `${i * 55}ms` }}>{t}</div>
        ))}
      </div>
      {c.note && <div className="course-note"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.5" stroke="currentColor" strokeWidth="1.6"/><path d="M8 7.2v4M8 4.6v.1" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg><span>{c.note}</span></div>}
      <div className={`course-price-row${p.price ? ' price-loaded' : ''}`}>
        {soon ? <div className="course-price course-price-soon">Coming soon</div> : <>
          <div className="course-price">{price}</div>
          {priceOld && <div className="course-price-old">{priceOld}</div>}
          {pct && <div className="course-pct">{pct}% off</div>}
        </>}
      </div>
      <div className="ticket-notch"><div className="ticket-notch-line" /></div>
      {(!soon && enrollHref)
        ? <a target="_blank" rel="noopener noreferrer" href={enrollHref} className="btn btn-ghost btn-full">Get course <Icon.ArrowRight /></a>
        : <span className="btn btn-ghost btn-full course-btn-soon" aria-disabled="true">{soon ? 'Opens soon' : 'Enrolment opens soon'}</span>}
    </div>
  );
});

              onMouseLeave={e=>{e.currentTarget.style.setProperty('--mx','-200%');e.currentTarget.style.setProperty('--my','-200%');}}>
              <div className="incl-orb1" style={{ background: f.color }} />

function BackToTop() {
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {

function App() {

    }
  }, []);

  // from — CSV as the base, live site_pricing data winning per-field
  // where it has one. See mergePricingRow's own comment for exactly how
  // the two combine.
  const effectivePricingMap = React.useMemo(() => {
    const ids = new Set(Object.keys(pricingMap).concat(Object.keys(sitePricing)));
    const merged = {};
    ids.forEach(id => { merged[id] = mergePricingRow(pricingMap[id], sitePricing[id]); });
    return merged;
  }, [pricingMap, sitePricing]);

  const sortedCombos = React.useMemo(() => sortByDisplayOrder(COMBOS, sitePricing), [sitePricing]);
  const sortedIndividual = React.useMemo(() => sortByDisplayOrder(INDIVIDUAL, sitePricing), [sitePricing]);

    if (!Object.keys(effectivePricingMap).length) return;
    const el = document.getElementById('course-jsonld');
    if (!el) return;
    try {
      const data = JSON.parse(el.textContent);
      const list = data['@graph'].find(g => g['@type'] === 'ItemList');
      list.itemListElement.forEach(li => {
        const id = COURSE_JSONLD_IDS[li.position];
        const row = id && effectivePricingMap[id];
        if (row && row.price && li.item.offers) {
          li.item.offers.price = String(row.price);
          if (row.validity) li.item.offers.priceValidUntil = row.validity;
        }
      });
      el.textContent = JSON.stringify(data);
    } catch (e) { /* leave static fallback in place */ }
  }, [effectivePricingMap]);

  React.useEffect(() => {
    const mobile = window.matchMedia('(max-width: 768px)').matches;
    // Elements genuinely on-screen at page load (before anyone has
    // scrolled) skip the animation — sliding/fading in something that
    // was never actually hidden looks wrong. Real bug caught from
    // testing, not assumed: this used to be re-derived from
    // getBoundingClientRect() *inside* show(), at the moment each
    // observer's callback fired — which happens to work for the `io`
    // observer below (its 200px rootMargin means the callback usually
    // fires slightly BEFORE the element is actually on-screen, so the
    // recheck still correctly reads false for a real scroll-triggered
    // reveal), but is a straight-up tautology for `ioRow` (no
    // rootMargin): its callback can only ever fire once the element
    // already has >=10% real overlap with the viewport, so the "is it
    // on-screen right now" recheck was always true — meaning the
    // combo-full-row's slide-in never actually played on scroll, it
    // just snapped straight to its final state every time. Computed
    // once per element, synchronously, before any scrolling can have
    // happened yet, so it reflects the true page-load state regardless
    // of which observer (or rootMargin) later reports the reveal.
    const alreadyVisibleAtLoad = new WeakSet();
    const markInitialVisibility = el => {
      const rect = el.getBoundingClientRect();
      if (rect.top < window.innerHeight && rect.bottom > 0) alreadyVisibleAtLoad.add(el);
    };
    const show = el => {
      if (alreadyVisibleAtLoad.has(el)) {
        el.style.transition = 'none';
        el.classList.add('visible');
        void el.offsetHeight; // force reflow so transition:none takes effect before restoring
        el.style.transition = '';
      } else {
        el.classList.add('visible');
      }

      // `obs` is a local const closed over by THIS instance's own
      // callback — a real bug caught before shipping: an earlier version
      // referenced an outer-scoped `io` variable here instead, which
      // meant the SECOND observer's own callback (ioRow, below) would
      // have called unobserve on the FIRST observer instead of itself.
      const obs = new IntersectionObserver((entries) => {
        const hit = entries.filter(e => e.isIntersecting);
        hit.sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
        hit.forEach((e, i) => {
          obs.unobserve(e.target);

          if (delay) setTimeout(() => show(e.target), delay);

    };

    // ON screen (its top inside the upper ~88% of the viewport). The 200px
    // early margin desktop uses meant, measured on a 390px phone, 30 of 32
    // elements got revealed while still ~190px BELOW the visible screen, so
    // their 0.58s animation finished before anyone could see it ("the
    // scroll animations have disappeared" on mobile, 2026-10-01).

    const io = makeObserver(touchLayout
      // -25%, not the earlier -12% (2026-10-07, "the scroll animation on
      // phone is still non existent"): at -12% the reveal played in the
      // bottom eighth of the screen, which on an iPhone sits behind
      // Safari's toolbar and the scrolling thumb, so it was over before the
      // element reached where anyone was looking.
      ? { threshold: 0, rootMargin: '0px 0px -25% 0px' }
      : { threshold: 0.1, rootMargin: '0px 0px 200px 0px' });
    const pendingReveal = new Set();
    document.querySelectorAll('.fade-in:not(.combo-full-row)').forEach((el) => { markInitialVisibility(el); io.observe(el); pendingReveal.add(el); });
    // Cards that only get their own reveal on phones/tablets (see .fade-in-touch).
    if (touchLayout) document.querySelectorAll('.fade-in-touch').forEach((el) => { markInitialVisibility(el); io.observe(el); pendingReveal.add(el); });
    // Safety net for the negative margin: something sitting in the last
    // ~12% of the page could otherwise never reach the trigger line once
    // the page can't scroll any further. At the very bottom, reveal
    // whatever is still waiting.
    const revealRestAtBottom = () => {
      if (window.innerHeight + window.scrollY < document.documentElement.scrollHeight - 4) return;
      pendingReveal.forEach((el) => { if (!el.classList.contains('visible')) { io.unobserve(el); show(el); } });
      pendingReveal.clear();
      window.removeEventListener('scroll', revealRestAtBottom);
    };
    if (touchLayout) window.addEventListener('scroll', revealRestAtBottom, { passive: true });

    // Real feedback: "the animation happens too early" — the shared 200px
    // early rootMargin above barely registers on the ordinary fade-in's
    // small 24px nudge, but the 2028 row's own horizontal slide (70px,
    // a slower 700ms overshoot transition — see .combo-full-row.fade-in)
    // easily finishes within that 200px head start, so by the time the
    // row actually scrolled into view it had already settled — no slide
    // was ever visibly seen. A separate observer with NO early margin
    // (fires only once the row is genuinely on-screen) fixes this
    // specifically, without touching the shared 200px timing every
    // other fade-in element on the page already relies on.
    const ioRow = makeObserver({ threshold: 0.1 });

    // same line the observer uses (75% down the screen); the observers stay
    // as a backup. Stops listening once everything has been revealed.

      // once per frame); deferring to requestAnimationFrame still lagged in
      // WebKit during fast scrolls.
      const check = () => {
        const line = window.innerHeight * 0.75;
        let remaining = 0;
        watched.forEach((el) => {

          const r = el.getBoundingClientRect();
          if (r.height === 0) return; // hidden at this width; the bottom-of-page safety net covers it
          if (r.top < line) { io.unobserve(el); ioRow.unobserve(el); show(el); }
          else remaining++;
        });
        if (!remaining) window.removeEventListener('scroll', onScrollCheck);
      };
      onScrollCheck = check;
      window.addEventListener('scroll', onScrollCheck, { passive: true });

function scrollToEl(hash) {
  var el = document.querySelector(hash);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return true; }
  return false;
}
// Cross-page: retry until React has rendered
(function tryOnLoad(n) {
  var hash = window.location.hash;
  if (!hash) return;
  if (scrollToEl(hash)) return;
  if (n > 0) setTimeout(function() { tryOnLoad(n - 1); }, 150);
})(8);
// Same-page: intercept hash link clicks directly
document.addEventListener('click', function(e) {
  if (e.defaultPrevented) return; // a link that scrolled itself (e.g. the projects map button)
  var a = e.target.closest('a[href]');
  if (!a) return;
  var href = a.getAttribute('href');
  if (!href || href.indexOf('#') === -1) return;
  var hash = href.slice(href.indexOf('#'));
  var pagePart = href.slice(0, href.indexOf('#'));
  var currentPage = window.location.pathname.split('/').pop() || 'index.html';
  if (pagePart && pagePart !== currentPage) return;
  var el = document.querySelector(hash);
  if (!el) return;
  e.preventDefault();
  history.pushState(null, '', hash);
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
