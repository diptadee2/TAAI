  }
  @media (prefers-reduced-motion: reduce) { .pmap-detail, .pmap-uses li { animation: none; } }

  /* Richer look for the three cards (2026-10-11: "the layout is good, the
     designs are a bit bland"). Same idiom as the home offer cards: a faint
     flat accent tint, accent border, solid accent icon tile. Drawings
     animate once when the card is revealed (.visible from the shared
     reveal observer); reduced motion shows them finished. */
  .bd-card { background: linear-gradient(rgba(var(--ac-rgb), .045), rgba(var(--ac-rgb), .045)), #fff; border-color: rgba(var(--ac-rgb), .2); transition-property: opacity, transform, border-color; }
  .bd-card:hover { border-color: rgba(var(--ac-rgb), .45); }
  .bd-icon { width: 38px; height: 38px; border-radius: 11px; align-items: center; justify-content: center; background: var(--ac); color: #fff !important;
    box-shadow: 0 6px 14px -6px rgba(var(--ac-rgb), .7); }
  .bd-icon svg { width: 22px; height: 22px; }
  .bd-head { gap: 12px; }
  .bd-head h3 { font-size: 20px; }
  /* Papers */
  .bd-compare { grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .bd-compare-arrow { color: var(--ac); display: inline-flex; }
  .bd-paper { box-shadow: 0 1px 0 rgba(17,24,39,.04), 0 8px 16px -10px rgba(17,24,39,.18); }
  .bd-paper--cse { transform: rotate(-2.5deg); opacity: .85; }
  .bd-paper--da { transform: rotate(1.5deg); background: #fff; border: 1.5px solid rgba(var(--ac-rgb), .45); }
  .bd-paper--da .bd-chip { background: rgba(var(--ac-rgb), .08); }
  .bd-chip { display: flex; align-items: center; gap: 6px; }
  .bd-mark { font-size: 11px; font-weight: 800; line-height: 1; }
  .bd-paper--cse .bd-mark { color: #EF4444; text-decoration: none; }
  .bd-paper--da .bd-mark { color: #16A34A; }
  /* Visual tiles: graph paper */
  .bd-visual-art { background-color: #fff; border-color: rgba(var(--ac-rgb), .25);
    background-image: linear-gradient(rgba(var(--ac-rgb), .08) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--ac-rgb), .08) 1px, transparent 1px);
    background-size: 9px 9px; background-position: -1px -1px; transition: border-color .2s; }
  .bd-visual:hover .bd-visual-art { border-color: rgba(var(--ac-rgb), .6); }
  .bd-visual-term { color: var(--ink); }
  .va-draw { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .7s cubic-bezier(.4,0,.2,1) var(--vd, 0s); }
  .va-pop { opacity: 0; transition: opacity .4s ease var(--vd, 0s); }
  .bd-play .va-draw { stroke-dashoffset: 0; }
  .bd-play .va-pop { opacity: 1; }
  .va-ball { opacity: 0; transform: translate(-22px, -16px); }
  .bd-play .va-ball { animation: va-roll 1.3s cubic-bezier(.45,0,.25,1) .7s forwards; }
  .bd-visual:hover .va-ball { animation: va-roll 1.1s cubic-bezier(.45,0,.25,1) forwards; }
  @keyframes va-roll { 0% { opacity: 1; transform: translate(-22px, -16px); } 45% { transform: translate(-13px, -4px); } 75% { transform: translate(-5px, 0); } 100% { opacity: 1; transform: none; } }
  /* Admits */
  .bd-admit { background: #fff; border-color: rgba(var(--ac-rgb), .18); opacity: 0; transform: translateY(6px); transition: opacity .45s ease var(--vd), transform .45s ease var(--vd), border-color .2s; }
  .bd-play .bd-admit { opacity: 1; transform: none; }
  .bd-admit:hover { border-color: var(--mc); }
  .bd-admit-mono { background: var(--mc); box-shadow: 0 4px 10px -4px var(--mc); }
  .bd-admit-text { flex: 1; }
  .bd-admit-tick { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #DCFCE7; color: #16A34A; }
  .prep-projects { --ac: #D97706; --ac-rgb: 217,119,6; background: linear-gradient(rgba(var(--ac-rgb), .04), rgba(var(--ac-rgb), .04)), #fff; border-color: rgba(var(--ac-rgb), .22); }
  .prep-projects-title { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; }
  .prep-projects-title p { grid-column: 1 / -1; margin-top: 8px; }
  @media (prefers-reduced-motion: reduce) {
    .va-draw { stroke-dashoffset: 0; transition: none; }
    .va-pop, .bd-admit { opacity: 1; transform: none; transition: none; }
    .va-ball, .bd-play .va-ball, .bd-visual:hover .va-ball { opacity: 1; transform: none; animation: none; }
  }

/* "Before you enrol" note for the GATE 2028 card (2026-10-04, direct
   request): shown when its live Enrol now is clicked, explaining what
   unlocks now vs after GATE DA 2027, then continues to the enrol page. */
.enrol-note-backdrop { position: fixed; inset: 0; z-index: 10000; background: rgba(5,4,12,0.72); display: flex; align-items: center; justify-content: center; padding: 16px; animation: enrol-note-fade .18s ease both; }
.enrol-note { width: 100%; max-width: 440px; background: #14102B; border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; padding: 26px 24px 22px; color: #fff; font-family: inherit; animation: enrol-note-rise .22s ease both; }
.enrol-note h3 { margin: 0 0 16px; font-size: 20px; font-weight: 700; line-height: 1.3; }
.enrol-note-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.enrol-note-list li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 14.5px; line-height: 1.5; color: rgba(255,255,255,0.78); }
.enrol-note-list b { color: #fff; font-weight: 600; }
.enrol-note-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; margin-top: 1px; }
.enrol-note-dot.now { background: rgba(74,222,128,0.16); color: #4ADE80; }
.enrol-note-dot.later { background: rgba(252,211,77,0.14); color: #FCD34D; }
.enrol-note-callout { margin: 18px 0 0; padding: 12px 14px; border-radius: 12px; background: rgba(167,139,250,0.12); border: 1px solid rgba(167,139,250,0.28); font-size: 14px; line-height: 1.5; color: #E9E3FF; }
.enrol-note-actions { display: flex; gap: 10px; margin-top: 20px; }
.enrol-note-actions .btn { flex: 1; justify-content: center; }
.enrol-note .enrol-note-go { background: #fff; color: #14102B; border: none; box-shadow: none; font-weight: 600; }
.enrol-note .enrol-note-go:hover { background: #EDE9FE; transform: none; box-shadow: none; }
.enrol-note-cancel { background: transparent; color: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.18); box-shadow: none; cursor: pointer; }
.enrol-note-cancel:hover { color: #fff; border-color: rgba(255,255,255,0.35); transform: none; box-shadow: none; }
@keyframes enrol-note-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes enrol-note-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (max-width: 420px) { .enrol-note-actions { flex-direction: column-reverse; } }
@media (prefers-reduced-motion: reduce) { .enrol-note-backdrop, .enrol-note { animation: none; } }

/* Every course includes, tab showcase (mirrors Why TAAI on landing page) */
.incl-layout {
  display: grid; grid-template-columns: 360px 1fr; gap: 0; align-items: stretch;
  border-radius: var(--radius-xl); overflow: hidden;
  background: rgba(10,6,28,0.92);
  backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: 0 24px 64px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.14);
}
.incl-tabs {
  display: flex; flex-direction: column; gap: 6px; justify-content: center;
  background: none; border-radius: 0; padding: 20px;
  border: none; border-right: 1px solid rgba(255,255,255,0.07); box-shadow: none;
}
.incl-tab {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 16px; border-radius: var(--radius-md);
  cursor: pointer; text-align: left; width: 100%;
  background: transparent; border: 1px solid transparent;
  border-left: 3px solid transparent;
  box-shadow: none;
  transition: background .2s, border-color .2s, box-shadow .24s ease, transform .22s cubic-bezier(.34,1.1,.64,1);
  font-family: inherit; position: relative; overflow: hidden;
  animation: tabSlideIn .38s cubic-bezier(.34,1.1,.64,1) calc(var(--i,0) * 55ms + 100ms) both;
}
@keyframes tabSlideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
.incl-tab:hover { background: rgba(255,255,255,0.06); border-color: transparent; border-left-color: var(--tab-color, var(--purple)); box-shadow: none; transform: translateX(3px); }
.incl-tab.active { background: rgba(255,255,255,0.10); border-color: transparent; border-left-color: var(--tab-color, var(--purple)); box-shadow: none; transform: translateX(5px); }
.incl-tab-icon { width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; display: grid; place-items: center; color: #fff; transition: transform .22s cubic-bezier(.34,1.2,.64,1); }
.incl-tab.active .incl-tab-icon { transform: scale(1.12) rotate(-4deg); }
.incl-tab:hover:not(.active) .incl-tab-icon { transform: scale(1.06); }
.incl-tab-info { min-width: 0; flex: 1; }
.incl-tab-label { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: rgba(255,255,255,0.82); line-height: 1.2; }
.incl-tab-sub { font-size: 12px; color: rgba(255,255,255,0.38); margin-top: 2px; transition: color .2s; }
.incl-tab.active .incl-tab-sub { color: var(--tab-color, var(--purple)); }
.incl-tab-chevron { margin-left: auto; flex-shrink: 0; opacity: 0; transform: translateX(-4px); transition: opacity .2s, transform .22s cubic-bezier(.34,1.1,.64,1); color: var(--tab-color, var(--purple)); }
.incl-tab.active .incl-tab-chevron { opacity: 1; transform: translateX(0); }
.incl-panel {
  background-color: transparent;
  background-image: radial-gradient(circle at var(--mx, -200%) var(--my, -200%), rgba(139,92,246,0.28) 0%, transparent 55%);
  background-size: 100% 100%;
  padding: 48px; position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: center;
  min-height: 440px;
}
.incl-orb1, .incl-orb2 { position: absolute; border-radius: 50%; pointer-events: none; transition: background .55s ease; }
.incl-orb1 { width: 340px; height: 340px; top: -100px; right: -70px; opacity: 0.22; filter: blur(72px); }
.incl-orb2 { width: 200px; height: 200px; bottom: -60px; left: -30px; opacity: 0.14; filter: blur(56px); }
.incl-icon-bg { position: absolute; top: 36px; right: 36px; pointer-events: none; color: #fff; }
.incl-icon-bg svg { width: 108px; height: 108px; opacity: 0.05; }
@keyframes inclIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.incl-content { position: relative; z-index: 1; animation: inclIn 0.32s cubic-bezier(.4,0,.2,1) both; }
.incl-eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: rgba(255,255,255,0.38); margin-bottom: 14px; }
.incl-ptitle { font-family: var(--font-display); font-size: clamp(26px,3vw,40px); font-weight: 600; letter-spacing: -0.035em; line-height: 1.06; color: #fff; margin-bottom: 16px; }
.incl-pdesc { font-size: 15px; color: rgba(255,255,255,0.56); line-height: 1.66; margin-bottom: 32px; max-width: 400px; }
.incl-pstat { display: flex; align-items: baseline; gap: 10px; }
.incl-pstat-num { font-family: var(--font-display); font-size: clamp(34px, 5vw, 52px); font-weight: 600; letter-spacing: -0.01em; line-height: 1; }
.incl-pstat-lbl { font-size: 13px; color: rgba(255,255,255,0.42); }
@media (max-width: 1024px) { .incl-layout { grid-template-columns: 1fr; } .incl-tabs { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.07); } }

/* Scroll fade-in */
.fade-in { opacity: 0; transform: translateY(24px); transition: opacity .7s cubic-bezier(.4,0,.2,1), transform .7s cubic-bezier(.4,0,.2,1); }
.fade-in.visible { opacity: 1; transform: translateY(0); }
@media (max-width: 768px) {
  .fade-in { transform: translateY(36px) scale(0.96); transition: opacity .5s cubic-bezier(.34,1.1,.64,1), transform .5s cubic-bezier(.34,1.1,.64,1); }
  .fade-in.visible { transform: translateY(0) scale(1); }
}
@media (max-width: 600px) {
  .fade-in:has(> .combo-featured-frame) { transform: none !important; transition: opacity .5s ease; }
  .fade-in:has(> .combo-featured-frame).visible { opacity: 1; transform: none !important; }
}

.courses-chat-footer { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 48px; font-size: 13px; color: var(--ink-soft); }
.courses-chat-footer a { color: var(--purple); text-decoration: none; font-weight: 600; transition: color .18s ease, gap .18s cubic-bezier(.34,1.4,.64,1); display: inline-flex; align-items: center; gap: 4px; }
.courses-chat-footer a:hover { color: #7c3aed; }

/* Footer */
.footer { padding: 40px 0; border-top: 1px solid var(--line); }
.footer-inner { display: flex; flex-direction: row; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
.footer-socials { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.footer-socials a {
  width: 54px; height: 54px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--bg-soft); color: var(--ink-dim);
  border: 1px solid var(--line); text-decoration: none;
  transition: background .28s cubic-bezier(.4,0,.2,1), color .28s cubic-bezier(.4,0,.2,1), transform .28s cubic-bezier(.34,1.15,.64,1), border-color .28s;
}
.footer-socials a:hover { background: var(--purple); color: #fff; border-color: var(--purple); transform: translateY(-3px); }
.footer-socials a svg { display: block; width: 22px; height: 22px; }
/* Scoped to this one element, not the shared --ink-soft token (#857CAE,
   used broadly elsewhere at sizes/weights that pass contrast fine) —
   #857CAE on this footer's white background measures 3.82:1 at 12px,
   below the 4.5:1 WCAG AA minimum for normal text. #6A6094 keeps the
   same purple-grey hue, darkened just enough to clear it (5.65:1,
   computed, not eyeballed). */
.footer-copy { font-size: 12px; color: #6A6094; letter-spacing: .02em; }
.footer-email { font-size: 12px; color: var(--ink-dim); text-decoration: none; letter-spacing: .02em; transition: color .2s; }
.footer-email:hover { color: var(--purple); }
.footer-legal { display: inline-flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
.scroll-progress { position: fixed; top: 0; left: 0; z-index: 100; height: 3px; background: linear-gradient(90deg, var(--pink), var(--purple)); pointer-events: none; transition: width 120ms linear; }
.back-to-top { position: fixed; bottom: 24px; right: 24px; z-index: 90; width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #0d9488, #0891b2); color: #fff; border: none; cursor: pointer; display: grid; place-items: center; box-shadow: 0 4px 16px rgba(8,145,178,0.45); opacity: 0; transform: translateY(12px) scale(0.88); transition: opacity .28s ease, transform .4s cubic-bezier(.34,1.56,.64,1), box-shadow .2s; pointer-events: none; }
.back-to-top.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
.back-to-top:hover { box-shadow: 0 6px 28px rgba(8,145,178,0.6); transform: translateY(-2px) scale(1.06); transition-delay: 0ms; }
.back-to-top:active { transform: scale(0.93); }

/* Bundle comparison */
.compare-wrap { margin-top: var(--section-pad); background: #f7f6ff; border-radius: var(--radius-xl); padding: 32px 28px; }
@media (max-width: 600px) { .compare-wrap { display: none; } }
.compare-label { font-size: 15px; font-weight: 700; letter-spacing: .01em; text-transform: none; color: var(--ink); margin-bottom: 20px; }
.compare-outer { position: relative; border-radius: var(--radius-xl); border: 1px solid var(--line); overflow: hidden; }
.compare-scroll { overflow-x: auto; scroll-behavior: smooth; border-radius: var(--radius-xl); scrollbar-width: none; }
.compare-scroll::-webkit-scrollbar { display: none; }
.compare-scroll-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%) scale(0.85); width: 44px; height: 44px; border-radius: 50%; background: var(--purple); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 4px 16px rgba(107,75,255,0.35); opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; }
.compare-scroll-btn.visible { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }
.compare-scroll-btn:hover { background: var(--pink); box-shadow: 0 6px 22px rgba(236,72,153,0.4); }
.compare-scroll-btn:active { transform: translateY(-50%) scale(0.94); }
.compare-table { min-width: 540px; }
.compare-head { display: grid; grid-template-columns: 1.8fr repeat(3, 1fr); background: var(--bg-soft); border-bottom: 1px solid var(--line); }
.compare-head-cell { padding: 14px 16px; font-size: 11px; font-weight: 700; text-align: center; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); line-height: 1.4; }
.compare-head-cell:first-child { position: sticky; left: 0; background: var(--bg-soft); z-index: 2; text-align: left; }
.compare-head-cell.featured { background: rgba(139,92,246,0.08); color: var(--purple); position: relative; }
.compare-head-cell.featured::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--purple), var(--pink)); }
.compare-head-cell.featured span { font-size: 9px; font-weight: 700; letter-spacing: .06em; display: inline-block; background: rgba(139,92,246,0.14); color: var(--purple); border: 1px solid rgba(139,92,246,0.26); padding: 2px 8px; border-radius: 999px; margin-top: 5px; }
@keyframes compareRowIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
.compare-row { display: grid; grid-template-columns: 1.8fr repeat(3, 1fr); border-top: 1px solid var(--line); transition: background .15s; animation: compareRowIn .18s ease both; }
.compare-row:hover { background: var(--bg-soft); }
.compare-cell { padding: 11px 16px; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.compare-cell.feat-name { justify-content: flex-start; color: var(--ink-dim); font-weight: 500; position: sticky; left: 0; background: #fff; z-index: 1; box-shadow: 3px 0 8px rgba(0,0,0,0.04); }
.compare-row:hover .compare-cell.feat-name { background: var(--bg-soft); }
.compare-cell.featured { background: rgba(139,92,246,0.055); }
.compare-row:hover .compare-cell.featured { background: rgba(139,92,246,0.1); }
.compare-yes { color: var(--purple); display: flex; }
.compare-no { color: #b0b0c0; display: flex; opacity: 0.7; }
.compare-footer { display: grid; grid-template-columns: 1.8fr repeat(3, 1fr); border-top: 1.5px solid var(--line); background: var(--bg-soft); }
.compare-footer-cell { padding: 18px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.compare-footer-cell:first-child { position: sticky; left: 0; background: var(--bg-soft); z-index: 1; }
.compare-footer-cell.featured { background: rgba(139,92,246,0.08); border-bottom: 3px solid var(--purple); }
.compare-price { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
.compare-price.best { color: var(--purple); }

.compare-row.zebra { background: rgba(0,0,0,0.018); }
.compare-head-sub { display: block; margin-top: 6px; font-style: normal; font-size: 11.5px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink-dim); }
.compare-head-cell.featured .compare-head-sub { color: var(--purple); }
.compare-row.compare-group, .compare-row.compare-group:hover { background: #f1eefe; animation: none; }
.compare-row.compare-group .compare-cell { padding-top: 14px; padding-bottom: 8px; font-size: 12px; font-weight: 700; color: var(--ink); }
.compare-row.compare-group .compare-cell.feat-name { background: #f1eefe; color: var(--ink); text-transform: uppercase; letter-spacing: .05em; font-size: 11px; box-shadow: none; }
.compare-row.compare-group .compare-cell.featured { background: rgba(139,92,246,0.12); color: var(--purple); }
.compare-row.compare-group .compare-cell:not(.feat-name):not(.featured) { color: var(--ink-dim); font-weight: 600; }
.compare-row.zebra .compare-cell.feat-name { background: #f9f9fc; }
.compare-row.zebra .compare-cell.featured { background: rgba(139,92,246,0.065); }
.compare-enroll-btn { display: inline-flex; align-items: center; justify-content: center; padding: 9px 20px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-decoration: none; background: var(--ink); color: #fff; transition: opacity .18s, transform .18s, box-shadow .18s; white-space: nowrap; }
.compare-enroll-btn:hover { opacity: 0.82; transform: scale(1.05); }
.compare-enroll-btn.featured { background: linear-gradient(135deg, var(--purple) 0%, #6b4bff 60%, #4f46e5 100%); box-shadow: 0 3px 18px rgba(139,92,246,0.42); }
.compare-enroll-btn.featured:hover { opacity: 1; box-shadow: 0 6px 28px rgba(139,92,246,0.6); transform: scale(1.05); }
.compare-val-text { font-size: 11px; font-weight: 600; color: var(--ink-dim); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.compare-val-note { font-size: 9px; font-weight: 700; letter-spacing: .04em; background: rgba(139,92,246,0.13); color: var(--purple); padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
@media (max-width: 768px) {
  .compare-table { min-width: 420px; }
  .compare-head { grid-template-columns: 1.3fr repeat(3, 1fr); }
  .compare-row { grid-template-columns: 1.3fr repeat(3, 1fr); }

  .compare-footer { grid-template-columns: 1.3fr repeat(3, 1fr); }
  .compare-head-cell { padding: 12px 10px; font-size: 10px; }
  .compare-cell { padding: 10px 10px; font-size: 12px; }
  .compare-cell.feat-name { font-size: 12px; }
  .compare-footer-cell { padding: 12px 8px; gap: 8px; }
  .compare-price { font-size: 17px; }
  .compare-enroll-btn { font-size: 10px; padding: 6px 10px; }
}

@media (max-width: 1024px) {
  .combos-grid { grid-template-columns: minmax(0, 1fr); }
  .included-grid { grid-template-columns: repeat(2, 1fr); }
}
/* Mobile accordion for "every course includes" */
.incl-accordion { display: flex; flex-direction: column; gap: 8px; }
.incl-accordion-item { border-radius: var(--radius-md); border: 1.5px solid var(--line); background: #fff; overflow: hidden; }
.incl-accordion-btn { display: flex; align-items: center; gap: 14px; padding: 15px 16px; width: 100%; background: none; border: none; font-family: inherit; cursor: pointer; text-align: left; }
.incl-accordion-item .incl-tab-label { color: var(--ink); }
.incl-accordion-item .incl-tab-sub { color: var(--ink-dim); }
.incl-accordion-item.active .incl-accordion-btn { border-bottom: 1px solid rgba(255,255,255,0.1); }
.incl-accordion-chevron { margin-left: auto; flex-shrink: 0; color: var(--purple); transition: transform .26s cubic-bezier(.4,0,.2,1); }
.incl-accordion-item.active .incl-accordion-chevron { transform: rotate(90deg); }
.incl-accordion-body {
  background: var(--ink);
  max-height: 0; overflow: hidden;
  padding: 0 20px;
  transition: max-height .38s cubic-bezier(.4,0,.2,1), padding .34s cubic-bezier(.4,0,.2,1), opacity .28s ease;
  opacity: 0;
}
.incl-accordion-item.active .incl-accordion-body {
  max-height: 500px;
  padding: 22px 20px 26px;
  opacity: 1;
}
.incl-accordion-body-title { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; margin-bottom: 10px; }
.incl-accordion-body-desc { font-size: 14px; color: rgba(255,255,255,0.56); line-height: 1.65; margin-bottom: 16px; }

@media (max-width: 768px) {
  :root { --section-pad: 56px; }
  .courses-grid { grid-template-columns: 1fr; }
  .included-grid { grid-template-columns: 1fr; }
  .placement-card { gap: 32px; padding: 32px 24px 36px; }
  .placement-right { grid-template-columns: minmax(0,1fr); gap: 24px; }
  .placement-btns .btn { justify-content: center; width: 100%; }
  .footer-inner { flex-direction: column; align-items: center; text-align: center; }
  .footer-socials a { width: 44px; height: 44px; }
  .footer-socials a svg { width: 18px; height: 18px; }
  .combo-price-row { flex-wrap: wrap; align-items: center; row-gap: 2px; column-gap: 8px; }
  .combo-price-old { order: 1; }
  .combo-discount { order: 2; }
  .combo-price { order: 3; width: 100%; }
}

/* ── Touch-device interaction overrides ─────────────────────── */
@media (hover: none) {
  /* iOS can transiently match :hover on tap - keep btn-stories' resting look unchanged */
  .btn-stories:hover { color: var(--purple); border-color: var(--purple); box-shadow: none; transform: none; background: transparent; }
  .btn-stories:hover::before { transform: translateX(-102%); }
  .btn-stories:hover svg { transform: none; }
  .orientation-pill:hover { transform: none; background: var(--purple-soft); border-color: rgba(139,92,246,0.22); color: var(--purple); }
  .orientation-pill:active { transform: scale(0.97); transition-duration: .12s; }
  /* Combo/bundled price cards — fully static on touch.
     pointer-events:none on the card div prevents :hover ever matching (the div has
     no click handler; only the <a> button inside navigates). */
  .combo-card, .combo-featured-frame {
    pointer-events: none !important;
  }
  .combo-card .btn-primary, .combo-card .btn-primary * { pointer-events: auto !important; }
  /* Every other link/button inside a card too (2026-10-12): only the
     Enrol button used to be re-enabled, so on phones/iPads the inline
     Discord links, the 2028 card's "See how" link and its Show-all
     toggles did nothing when tapped. */
  .combo-card a, .combo-card a *, .combo-card button, .combo-card button * { pointer-events: auto !important; }
  .combo-card, .combo-card::before, .combo-card::after,
  .combo-card *, .combo-card *::before, .combo-card *::after,
  .combo-featured-frame, .combo-featured-frame::before, .combo-featured-frame::after {
    transition: none !important; animation: none !important;
    -webkit-tap-highlight-color: transparent !important;
    -webkit-touch-callout: none !important;
    user-select: none !important; touch-action: manipulation !important;
  }
  .combo-card:hover, .combo-card:active,
  .combo-card.card:hover { transform: none !important; box-shadow: none !important; border-color: rgba(255,255,255,0.09) !important; }
  .combo-card.combo-blue:hover, .combo-card.combo-blue:active { border-color: rgba(77,139,255,0.22) !important; }
  .combo-card.combo-pink:hover, .combo-card.combo-pink:active { border-color: rgba(255,65,108,0.22) !important; }
  .combo-featured-frame:hover, .combo-featured-frame:active { transform: none !important; }
  .combo-card.featured:active { transform: none !important; box-shadow: none !important; }
  /* Course cards — pointer-events:none on the card div; only <a> button is tappable */
  .course-card { pointer-events: none !important; }
  .course-card .btn-ghost, .course-card .btn-ghost * { pointer-events: auto !important; }
  /* Course cards fully static on touch — no tap, no hold, no hover flash */
  .course-card,
  .course-card::before,
  .course-card::after,
  .course-card *,
  .course-card *::before,
  .course-card *::after {
    transition: none !important;
    animation: none !important;
    -webkit-tap-highlight-color: transparent !important;
    -webkit-touch-callout: none !important;
    user-select: none !important;
    touch-action: manipulation !important;
  }
  .course-card,
  .course-card:hover,
  .course-card:active,
  .course-card:focus { transform: none !important; box-shadow: 0 2px 12px rgba(0,0,0,0.05) !important; border-color: var(--line) !important; }
  .course-card:hover::before, .course-card:active::before { opacity: 0.18 !important; }
  .course-card:hover .course-icon,
  .course-card:active .course-icon { transform: none !important; box-shadow: none !important; }
  .course-card:hover .course-title,
  .course-card:active .course-title { color: inherit !important; }
  .course-card:hover .course-validity,
  .course-card:active .course-validity { color: var(--ink-soft) !important; }
  .course-card:hover .course-price,
  .course-card:active .course-price { color: var(--ink) !important; }
  .course-card:hover .course-price-old,
  .course-card:active .course-price-old { color: var(--ink-soft) !important; }
  .course-card:hover .ticket-notch-line,
  .course-card:active .ticket-notch-line { border-color: var(--line) !important; }
  .course-card:hover .btn-ghost,
  .course-card:active .btn-ghost { background: transparent !important; color: var(--ink) !important; border-color: var(--line) !important; }
  .course-card:hover .btn-ghost svg,
  .course-card:active .btn-ghost svg { transform: none !important; }
  /* Topics are visible at rest on every device now — this just locks
     their color against a tap-triggered :hover flash, same as every
     other .course-card element above. */
  .course-card:hover .course-topic,
  .course-card:active .course-topic { color: var(--ink-dim) !important; }
  .course-card:hover .course-topic::before,
  .course-card:active .course-topic::before { background: var(--purple) !important; }
  /* Combo includes — always visible, hover/active locked to resting */
  .combo-includes li { opacity: 1; transform: translateX(0); }
  .combo-check svg path { stroke-dashoffset: 0; }
  .combo-card:hover .combo-includes li,
  .combo-card:active .combo-includes li { color: rgba(255,255,255,0.62) !important; }
  .combo-card:hover .combo-num,
  .combo-card:active .combo-num { opacity: 0.035 !important; transform: none !important; }
  /* Restore featured-card box-shadow */

}

@media (max-width: 768px) {
  .combo-card.featured.visible:active { transform: scale(0.975); }

  /* Individual course cards — always expanded, no animations, scroll-up reveal only */
  .course-card { animation: none !important; }
  .course-card::before,
  .course-card .course-icon,
  .course-card .course-title,
  .course-card .course-validity,
  .course-card .course-price,
  .course-card .course-price-old,
  .course-card .btn-ghost,
  .course-card .btn-ghost svg,
  .course-card .ticket-notch-line,
  .course-card .course-topics,
  .course-card .course-topic {
    transition: none !important;
    animation: none !important;
  }
  .course-card:active,
  .course-card:hover { transform: none; }
}

/* YouTube link wiggle */
@keyframes yt-wiggle {
  0%   { transform: rotate(0deg); }
  20%  { transform: rotate(-1.5deg); }
  45%  { transform: rotate(1deg); }
  68%  { transform: rotate(-0.5deg); }
  85%  { transform: rotate(0.2deg); }
  100% { transform: rotate(0deg); }
}
a[href*="youtube"]:hover svg, a[href*="youtu.be"]:hover svg {
  animation: yt-wiggle 0.6s cubic-bezier(.4,0,.2,1);
}
/* ── Menu overlay ───────────────────────────────────── */
.menu-overlay { display: none; }
@media (max-width: 768px) {
  .menu-overlay { display: block; position: fixed; inset: 0; z-index: 48; background: rgba(14,10,35,0.52); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  .menu-overlay.open { opacity: 1; pointer-events: auto; }
}

/* ── Mobile hamburger menu ──────────────────────────── */
.nav-hamburger { display: none; flex-direction: column; gap: 5px; align-items: center; justify-content: center; width: 40px; height: 40px; border: none; background: none; cursor: pointer; border-radius: 8px; transition: background .2s; flex-shrink: 0; padding: 0; }
.nav-hamburger:hover { background: rgba(139,92,246,0.08); }
.nav-hamburger span { display: block; width: 22px; height: 2px; border-radius: 2px; background: var(--ink); transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .2s; }
.nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.mobile-menu { position: fixed; top: 86px; left: 0; right: 0; z-index: 49; background: rgba(248,246,255,0.72); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border-bottom: 1px solid rgba(139,92,246,0.15); padding: 8px 12px 20px; display: flex; flex-direction: column; gap: 2px; transform: translateY(-10px); opacity: 0; pointer-events: none; transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .22s ease; box-shadow: 0 8px 40px rgba(20,16,43,0.12); overflow: hidden; }
.mobile-menu.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
@keyframes menuItemIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
.mobile-menu-link { font-family: var(--font-nav); display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--ink-dim); text-decoration: none; letter-spacing: .05em; text-transform: uppercase; transition: background .18s, color .18s, transform .12s ease; position: relative; }
.mobile-menu.open .mobile-menu-link { animation: menuItemIn .3s both cubic-bezier(.4,0,.2,1); }
.mobile-menu-link:active { transform: scale(0.97) !important; }
.mobile-menu-link:hover { background: rgba(139,92,246,0.08); color: var(--purple); }
.mobile-menu-link.active { background: rgba(139,92,246,0.1); color: var(--purple); }
.mobile-menu-link.active::before { content: ''; position: absolute; left: 0; top: 22%; bottom: 22%; width: 3px; border-radius: 2px; background: var(--purple); }
.mobile-menu-link-icon { opacity: 0.5; flex-shrink: 0; transition: opacity .18s; display: flex; align-items: center; }
.mobile-menu-link.active .mobile-menu-link-icon, .mobile-menu-link:hover .mobile-menu-link-icon { opacity: 1; }
.mobile-menu-link-label { flex: 1; }
.mobile-menu-link-chevron { opacity: 0.22; flex-shrink: 0; display: flex; align-items: center; transition: opacity .18s, transform .2s; }
.mobile-menu-link:hover .mobile-menu-link-chevron, .mobile-menu-link.active .mobile-menu-link-chevron { opacity: 0.65; transform: translateX(3px); }
.mobile-menu-divider { height: 1px; background: linear-gradient(90deg, rgba(139,92,246,0.25), rgba(139,92,246,0.06), transparent); margin: 8px 4px; }
.mobile-menu-actions { display: flex; flex-direction: row; gap: 10px; padding-top: 4px; }
.mobile-menu.open .mobile-menu-divider { animation: menuItemIn .25s both cubic-bezier(.4,0,.2,1); animation-delay: .22s; }
.mobile-menu.open .mobile-menu-contact { animation: menuItemIn .3s both cubic-bezier(.4,0,.2,1); animation-delay: .40s; }
@keyframes menuBtnIn { from { opacity: 0; transform: translateY(18px) scale(0.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
.mobile-menu.open .mobile-menu-actions .btn-nav-signin { animation: menuBtnIn .42s both cubic-bezier(.34,1.15,.64,1); animation-delay: .26s; }

.why-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }

   this rule's row regardless of which class list order this button's
   own className string put them in, so the icon and text were stacking
   vertically instead of sitting side by side. The compound selector's
   higher specificity makes this immune to source order from here on. */
.why-pillar.why-pillar--featured {

/* Scaled up to match the featured pillar's own bigger footprint, and

   scale factor, not each element getting its own arbitrary bump. Caught

   already land close to this by coincidence, but sub (14→16 was only

   left edge and its 68px inset (+1px border) matches where "Proven Results" starts. */
@media (min-width: 1025px) {
  .why-pillar.why-pillar--featured { grid-template-columns: auto minmax(0,1fr) calc(50% - 8px); column-gap: 14px; }
  .why-pillar--featured .why-text { padding-right: 16px; }
  .why-contrast { margin-left: 0; padding-left: 68px; border-left: 1px solid rgba(255,255,255,0.1); }
}

/* ── Sticky contact buttons ───────────────────────────── */
@keyframes mcb-slide-up {
  from { transform: translateY(110%); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
@keyframes mcb-side-in {
  from { transform: translateX(130%) scale(0.8); opacity: 0; }
  to   { transform: translateX(0)    scale(1);   opacity: 1; }
}
/* Desktop: icon circles */
.mobile-contact-bar {
  display: flex; flex-direction: column;
  position: fixed; right: 24px; bottom: 88px; z-index: 200;
  gap: 12px;
  animation: mcb-side-in .48s cubic-bezier(.34,1.1,.64,1) .5s both;
}
.mobile-contact-bar a {
  position: relative;
  width: 50px; height: 50px; border-radius: 50%;
  display: grid; place-items: center;
  text-decoration: none;
  transition: transform .38s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease, opacity .3s ease-out;
}
.mcb-label { display: none; }
.mobile-contact-bar a::after {
  content: attr(data-label);
  position: absolute; right: calc(100% + 12px); top: 50%;
  transform: translateY(-50%) translateX(6px);
  background: rgba(18,14,40,0.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .01em;
  padding: 6px 12px; border-radius: 8px; white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity .16s ease, transform .18s cubic-bezier(.34,1.1,.64,1);
}
.mobile-contact-bar a:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }
.mobile-contact-bar a:hover { transform: scale(1.12); transition-delay: 0ms; }
.mcb-mail { background: #6B4BFF; color: #fff !important; box-shadow: 0 4px 16px rgba(107,75,255,0.4); opacity: 0; transform: translateX(80px); pointer-events: none; }
body.buttons-visible .mcb-mail { opacity: 1; transform: translateX(0); pointer-events: auto; }
body.buttons-visible .mcb-mail:hover { transform: scale(1.12); transition-delay: 0ms; }
.mcb-discord { background: #5865F2; color: #fff !important; box-shadow: 0 4px 16px rgba(88,101,242,0.4); opacity: 0; transform: translateX(80px); pointer-events: none; }
body.buttons-visible .mcb-discord { opacity: 1; transform: translateX(0); pointer-events: auto; transition-delay: 25ms; }
body.buttons-visible .mcb-discord:hover { transform: scale(1.12); transition-delay: 0ms; }
/* Hidden once the footer is in view (discord-notice.js sets footer-in-view). */
body.footer-in-view .mobile-contact-bar a { opacity: 0 !important; pointer-events: none !important; }
/* Mobile: full-width bottom bar */
@media (max-width: 768px) {
  .mobile-contact-bar {
    flex-direction: column;
    right: 16px; bottom: 90px; left: auto; top: auto;
    gap: 10px; background: none; border: none; padding: 0; box-shadow: none;
    animation: mcb-side-in .48s cubic-bezier(.34,1.1,.64,1) .5s both;
  }
  .mobile-contact-bar a {
    width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center; padding: 0; flex: none;
    transition: transform .28s cubic-bezier(.34,1.4,.64,1), opacity .22s ease;
  }
  .mcb-label { display: none; }
  .mobile-contact-bar a::after { display: none; }
  .mobile-contact-bar a:active { transform: scale(0.9); opacity: 0.85; }
  .back-to-top { bottom: 32px; width: 48px; height: 48px; right: 16px; }
}

/* ── Course testimonials ─────────────────────────────── */
.course-testi-section {
  background: radial-gradient(circle, rgba(139,92,246,0.12) 1.5px, transparent 1.5px), linear-gradient(150deg, #faf8ff 0%, #f3eeff 50%, #fdf0f8 100%);
  background-size: 32px 32px, auto;
  padding: var(--section-pad) 0;
  position: relative; overflow: hidden;
}
.course-testi-section::before {
  content: ''; position: absolute;
  width: 560px; height: 560px; border-radius: 50%;
  background: radial-gradient(circle, rgba(139,92,246,0.09) 0%, transparent 65%);
  top: -160px; right: -100px; pointer-events: none;
}
.course-testi-section::after {
  content: ''; position: absolute;
  width: 480px; height: 480px; border-radius: 50%;
  background: radial-gradient(circle, rgba(236,72,153,0.07) 0%, transparent 65%);
  bottom: -140px; left: -80px; pointer-events: none;
}
.course-testi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-top: 48px;
}
.course-testi-card {
  background: #fff;
  border: 1.5px solid rgba(139,92,246,0.12);
  border-radius: var(--radius-xl);
  padding: 36px;
  display: flex; flex-direction: column; gap: 22px;
  position: relative; overflow: hidden;
  box-shadow: 0 2px 16px rgba(139,92,246,0.07), 0 1px 4px rgba(0,0,0,0.04);
  /* opacity is listed so the scroll reveal (.fade-in) still fades these in:
     this rule comes after .fade-in and replaces its transition, which left
     the cards popping in instantly (found 2026-10-07). */
  transition: opacity .6s cubic-bezier(.4,0,.2,1), transform .38s cubic-bezier(.4,0,.2,1), box-shadow .38s ease, border-color .28s ease;
}
.course-testi-card::before {
  content: '\201C';
  position: absolute; top: 16px; right: 24px;
  font-family: var(--font-display); font-size: 110px; line-height: 1;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  opacity: 0.12; pointer-events: none; user-select: none; font-weight: 700;
}
.course-testi-card:hover {
  transform: translateY(-7px);
  box-shadow: 0 20px 56px rgba(139,92,246,0.14), 0 4px 16px rgba(0,0,0,0.06);
  border-color: rgba(139,92,246,0.26);
}
.course-testi-air {
  display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.course-testi-air-badge {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  color: #fff; padding: 5px 14px; border-radius: 999px;
}
.course-testi-stars { color: #F59E0B; font-size: 13px; letter-spacing: 2px; }
.course-testi-quote {
  font-family: var(--font-display); font-size: 15.5px; font-weight: 600;
  color: var(--ink); line-height: 1.7; letter-spacing: -0.01em;
  flex: 1;
}
.course-testi-footer {
  display: flex; align-items: center; gap: 14px;
  padding-top: 20px; border-top: 1px solid rgba(139,92,246,0.1);
}
.course-testi-avatar {
  width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center;
  font-weight: 700; font-size: 13px; color: #fff;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  box-shadow: 0 2px 10px rgba(139,92,246,0.35);
}
.course-testi-name { font-size: 14px; font-weight: 700; color: var(--ink); }
.course-testi-college { font-size: 11px; color: var(--ink-dim); margin-top: 1px; }
.course-testi-role { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
@media (max-width: 768px) {
  .course-testi-grid { grid-template-columns: 1fr; }
  .course-testi-card { padding: 28px 24px; }
}
@media (hover: none) {
  .course-testi-card:hover { transform: none; box-shadow: 0 2px 16px rgba(139,92,246,0.07); }
  .course-testi-card:active { transform: scale(0.975); transition-duration: .12s; }
}
/* Inline Discord links (withDiscordLink) */
.discord-inline { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: rgba(88,101,242,0.6); transition: color .15s ease, text-decoration-color .15s ease; }
.discord-inline:hover { color: #5865F2; text-decoration-color: #5865F2; }

    /* "Valid till GATE 2027" tag under the individual courses heading (2026-10-15) */
    #individual .section-sub:has(+ .valid-tag) { margin-bottom: 0 !important; }
    .valid-tag { display: inline-block; margin-top: 16px; margin-bottom: 18px; padding: 5px 12px; border-radius: 8px; background: var(--bg-soft); border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--ink); }
    /* ===================================================================
       NEO-BRUTALISM LAYER (2026-10-15, direct request: "do neo brutalism
       but keep all the information of the cards"). Visual only: no markup
       or content changed. Scoped to <main>, so the shared nav and footer
       stay identical to the other 6 pages. Delete this whole block to get
       the previous look back.
       Corners are square on purpose: hard shadow + border-radius on an
       element whose transform animates (the .fade-in reveals) is the
       Chromium detached-node leak noted in CLAUDE.md, and square corners
       avoid it entirely.
       =================================================================== */
    main {
      --nb-ink: #111111;
      --nb-paper: #FFF4D6;
      --nb-paper-2: #FFFBEF;
      --nb-yellow: #FDE047;
      --nb-lilac: #C4B5FD;
      --nb-pink: #F9A8D4;
      --nb-sky: #7DD3FC;
      --nb-lime: #BEF264;
      --nb-orange: #FDBA74;
      --nb-shadow: 6px 6px 0 var(--nb-ink);
      --nb-shadow-sm: 4px 4px 0 var(--nb-ink);
      --nb-mono: 'DM Mono', ui-monospace, Menlo, monospace;
      background: var(--nb-paper);
      color: var(--nb-ink);
    }

    html body main .pmap-section,
    html body main section.page-hero,
    html body main #combos,
    html body main #individual,
    html body main #interview,

    html body main section.page-hero { border-top: 0; }

    /* Type: black, heavy; gradient emphasis becomes a highlighter block */

    html body main h1 em, html body main h2 em {
      font-style: normal;
      background: var(--nb-yellow) !important;
      color: var(--nb-ink) !important;
      -webkit-text-fill-color: var(--nb-ink) !important;

// ── Pricing CSV ───────────────────────────────────────────────────
// Valid IDs — combos: full-course | maths-ml-bundle | maths-bundle
//             individual: statistics | calculus | linear-algebra | probability | machine-learning | python-programming

const parseCSV = text => {
  const parseLine = line => {
    const out = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
      else if (ch === ',' && !inQ) { out.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    out.push(cur.trim()); return out;
  };
  const rows = text.trim().split('\n');
  const headers = parseLine(rows[0]);
  return rows.slice(1).filter(r => r.trim()).map(r => Object.fromEntries(headers.map((h, i) => [h, parseLine(r)[i] || ''])));
};

const fmtPrice    = n => n ? '₹' + Number(n).toLocaleString('en-IN') : '';
const fmtValidity = d => { if (!d) return ''; const dt = new Date(d + 'T00:00:00'); return 'Valid until ' + dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
const fmtDate     = d => { if (!d) return ''; const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
const fmtDeadline = d => { if (!d) return ''; const dt = new Date(d + 'T00:00:00'); return 'Ends ' + dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };

// Pre-fetch pricing before React mounts so cards render once with correct data
// Prices come ONLY from /team (site_pricing, via SITE_PRICING_API below)
// since 2026-10-01. The published Google Sheet (PRICING_CSV_URL) used to be
// the base layer under it, but it had gone stale (e.g. the 2027 Full
// Course at 11,999 vs 7,499 in /team), and because it loaded faster than
// the live endpoint, its old prices showed for the first few seconds of
// every visit. An empty base layer means a card shows "-" for that moment
// instead of a wrong price.
let _pricingCache = {};
const _pricingFetch = Promise.resolve({});

// /team's site_pricing cutover (2026-09-23) — price/discount/validity/
// enrol-link/sold-out-date/card-order are now all genuinely live here,
// read from a single public, unauthenticated endpoint
// (netlify/functions/site-pricing-public.js — every column it returns is
// already meant to be shown publicly, nothing sensitive). This REPLACES
// the earlier order-only cutover (site-pricing-order.js, deleted) with
// one endpoint covering everything /team's Pricing tab now controls
// live, rather than two overlapping fetches. PRICING_CSV_URL/
// _pricingFetch above is kept as the fallback base layer, not replaced
// outright — mergePricingRow() below prefers a live Supabase value per
// field, falling back to the CSV's own value for any field Supabase
// doesn't have yet (a brand-new row, or one field left blank) — so this
// can only ever improve on the CSV, never break the page if a row is
// incomplete or the fetch fails entirely (falls back to an empty map).
const SITE_PRICING_API = '/api/site-pricing-public';
let _sitePricingCache = null;
const _sitePricingFetch = fetch(SITE_PRICING_API)
  .then(r => r.json())
  .then(d => { _sitePricingCache = (d && d.rows) || {}; return _sitePricingCache; })
  .catch(() => { _sitePricingCache = {}; return {}; });

// Merges one course's CSV row (camelCase field names — id, price,
// priceOld, discount, discountReason, discountDeadline, validity, as
// parseCSV/PRICING_CSV_URL already produce) with its live site_pricing
// row (snake_case column names), Supabase winning per-field only where
// it actually has a non-null value. enrollUrl/soldOutDate have no CSV
// equivalent at all — they only ever come from the live row, and stay
// undefined (falling through to each card's own hardcoded c.href/
// c.soldOutDate — see ComboCard/CourseCard) when Supabase has nothing
// for this id yet.
function mergePricingRow(csvRow, apiRow) {
  if (!apiRow) return csvRow || null;
  const merged = Object.assign({}, csvRow);
  if (apiRow.price != null) merged.price = apiRow.price;
  if (apiRow.price_old != null) merged.priceOld = apiRow.price_old;
  if (apiRow.discount != null) merged.discount = apiRow.discount;
  if (apiRow.discount_reason != null) merged.discountReason = apiRow.discount_reason;
  if (apiRow.discount_deadline != null) merged.discountDeadline = apiRow.discount_deadline;
  if (apiRow.validity != null) merged.validity = apiRow.validity;
  if (apiRow.enroll_url) merged.enrollUrl = apiRow.enroll_url;
  if (apiRow.sold_out_date) merged.soldOutDate = apiRow.sold_out_date;
  return merged;
}

// Sorts `list` by sitePricing[c.id].display_order where that's known,
// leaving any card with no known order (a brand-new card not yet in
// site_pricing, or the whole fetch having failed) exactly where it
// already sits in the hardcoded array — never yanked to the front/back
// for having no data. Also renumbers each card's own `num` field (the
// big corner numeral) to match its new visual position, since that
// field is otherwise a static value tied to the object, not the
// position — without this, reordering via /team would leave the
// numerals reading out of sequence.
function sortByDisplayOrder(list, sitePricing) {
  if (!Object.keys(sitePricing).length) return list;
  const orderFor = id => (sitePricing[id] ? sitePricing[id].display_order : null);
  const withIndex = list.map((c, i) => ({ c, i, order: orderFor(c.id) }));
  withIndex.sort((a, b) => {
    if (a.order == null && b.order == null) return a.i - b.i;
    if (a.order == null) return 1;
    if (b.order == null) return -1;
    return a.order - b.order || a.i - b.i;
  });
  return withIndex.map(({ c }, i) => ({ ...c, num: String(i + 1).padStart(2, '0') }));
}

function daysUntilExam() {
  // Real calendar date — no Aug-1 floor here. That floor exists in
  // progress.js only for the tracker's schedule/streak math (which
  // genuinely starts Aug 1); this countdown has no such dependency and
  // should tick down every real day, not sit frozen until then.
  const pad = n => String(n).padStart(2, '0');
  const now = new Date();
  const todayStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  const daysLeft = Math.ceil((new Date('2027-02-06') - new Date(todayStr)) / 864e5);
  return daysLeft > 0 ? daysLeft : null;
}

  const moveTo = React.useCallback((el) => {
    if (resetTimer.current) { clearTimeout(resetTimer.current); resetTimer.current = null; }
    if (!el) return;
    setPill({ left: el.offsetLeft - 10, width: el.offsetWidth + 20, visible: true });
  }, []);

  const reset = React.useCallback(() => {
    resetTimer.current = setTimeout(() => {
      const active = linksRef.current && linksRef.current.querySelector('a.active');
      if (active) moveTo(active.closest('.nav-dropdown-wrap') || active);
      else setPill(p => ({ ...p, visible: false }));
    }, 60);
  }, [moveTo]);

  React.useEffect(() => { reset(); }, [reset]);

  const [menuOpen, setMenuOpen] = React.useState(false);
  React.useEffect(() => {
    if (!menuOpen) return;
    const close = e => { if (!e.target.closest('.nav') && !e.target.closest('.mobile-menu')) setMenuOpen(false); };
    document.addEventListener('pointerdown', close);
    return () => document.removeEventListener('pointerdown', close);

        return;

      setSigninPhase(phases[i]);

                 onMouseEnter={(e) => moveTo(e.currentTarget)}>{l.label}</a>

// ── DOT FIELD (Canvas2D + SVG glow, no external deps) ──────────────
const DOT_FIELD_TWO_PI = Math.PI * 2;
const DotField = React.memo(function DotField({
  dotRadius = 1.5,
  dotSpacing = 14,
  cursorRadius = 500,
  cursorForce = 0.1,
  bulgeOnly = true,
  bulgeStrength = 67,
  glowRadius = 160,
  sparkle = false,
  waveAmplitude = 0,
  gradientFrom = 'rgba(168, 85, 247, 0.35)',
  gradientTo = 'rgba(180, 151, 207, 0.25)',
  glowColor = '#120F17',
  ...rest
}) {
  const canvasRef = React.useRef(null);
  const svgRef = React.useRef(null);
  const glowRef = React.useRef(null);
  const dotsRef = React.useRef([]);
  const mouseRef = React.useRef({ x: -9999, y: -9999, prevX: -9999, prevY: -9999, speed: 0 });
  const rafRef = React.useRef(null);
  const sizeRef = React.useRef({ w: 0, h: 0, offsetX: 0, offsetY: 0 });
  const glowOpacity = React.useRef(0);
  const engagement = React.useRef(0);
  const propsRef = React.useRef({});
  propsRef.current = { dotRadius, dotSpacing, cursorRadius, cursorForce, bulgeOnly, bulgeStrength, glowRadius, sparkle, waveAmplitude, gradientFrom, gradientTo };
  const rebuildRef = React.useRef(null);
  const glowIdRef = React.useRef(`dot-field-glow-${Math.random().toString(36).slice(2, 9)}`);

  React.useEffect(() => {
    const canvas = canvasRef.current;
    const glowEl = glowRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d', { alpha: true });
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let resizeTimer;
    // The dots only ever move in response to a mouse cursor. On touch
    // devices (no hover / no fine pointer) every frame redrew an identical
    // image: on a phone that's a ~780x10800px canvas with ~6,800 dots
    // repainted 60 times a second for as long as the courses page is open,
    // which starved the main thread and made the bundles' scroll reveals
    // fire late and pop ("finicky" on mobile, 2026-10-07). There it's drawn
    // once, and again only after a resize; desktop keeps the live loop.
    const interactive = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

    function resize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(doResize, 100);
    }

    function doResize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      // iOS fires resize whenever Safari's toolbar collapses/expands during a
      // scroll; the section's own size doesn't change then, so don't
      // reallocate the canvas (only its page offset is refreshed).
      if (w === sizeRef.current.w && h === sizeRef.current.h) {
        sizeRef.current.offsetX = rect.left + window.scrollX;
        sizeRef.current.offsetY = rect.top + window.scrollY;
        return;
      }

      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      sizeRef.current = {
        w,
        h,
        offsetX: rect.left + window.scrollX,
        offsetY: rect.top + window.scrollY,
      };

      buildDots(w, h);
      if (!interactive) tick(); // static: one frame per (re)size
    }

    function buildDots(w, h) {
      const p = propsRef.current;
      const step = p.dotRadius + p.dotSpacing;
      const cols = Math.floor(w / step);
      const rows = Math.floor(h / step);
      const padX = (w % step) / 2;
      const padY = (h % step) / 2;
      const dots = new Array(rows * cols);
      let idx = 0;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const ax = padX + col * step + step / 2;
          const ay = padY + row * step + step / 2;
          dots[idx++] = { ax, ay, sx: ax, sy: ay, vx: 0, vy: 0, x: ax, y: ay };
        }
      }
      dotsRef.current = dots;
    }

    function onMouseMove(e) {
      const s = sizeRef.current;
      mouseRef.current.x = e.pageX - s.offsetX;
      mouseRef.current.y = e.pageY - s.offsetY;
    }

    function updateMouseSpeed() {
      const m = mouseRef.current;
      const dx = m.prevX - m.x;
      const dy = m.prevY - m.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      m.speed += (dist - m.speed) * 0.5;
      if (m.speed < 0.001) m.speed = 0;
      m.prevX = m.x;
      m.prevY = m.y;
    }

    const speedInterval = setInterval(updateMouseSpeed, 20);

    let frameCount = 0;

    function tick() {
      frameCount++;
      const dots = dotsRef.current;
      const m = mouseRef.current;
      const { w, h } = sizeRef.current;
      const p = propsRef.current;
      const len = dots.length;
      const t = frameCount * 0.02;

      const targetEngagement = Math.min(m.speed / 5, 1);
      engagement.current += (targetEngagement - engagement.current) * 0.06;
      if (engagement.current < 0.001) engagement.current = 0;
      const eng = engagement.current;

      glowOpacity.current += (eng - glowOpacity.current) * 0.08;

      // Real, measured bug — not the spinning-border cards themselves,
      // but this pre-existing per-frame write is what's actually forcing
      // layout 60x/sec (confirmed via CDP Performance.getMetrics:
      // removing this component's canvas dropped LayoutCount from 180 to
      // 0 across the same 3s window; with it merely disabled it also
      // dropped to 0, ruling out the cards' own transform:rotate spin as
      // the source). r={glowRadius} is a STATIC SVG attribute set once
      // at mount — with glowRadius=0 (the exact usage in #combos, see
      // its own call site), this circle has zero radius and is
      // permanently invisible no matter what cx/cy/opacity are set to,
      // so every one of these per-frame writes was pure waste: forcing
      // an expensive SVG-gradient-attribute layout recalc for an effect
      // that can never actually be seen. Gated on the same glowRadius
      // prop that already controls whether this circle can render at
      // all — zero visual change for this usage, and any OTHER DotField
      // usage with a real glowRadius keeps working exactly as before.
      if (glowEl && p.glowRadius > 0) {
        glowEl.setAttribute('cx', m.x);
        glowEl.setAttribute('cy', m.y);
        glowEl.style.opacity = glowOpacity.current;
      }

      ctx.clearRect(0, 0, w, h);

      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, p.gradientFrom);
      grad.addColorStop(1, p.gradientTo);
      ctx.fillStyle = grad;

      const cr = p.cursorRadius;
      const crSq = cr * cr;
      const rad = p.dotRadius / 2;
      const isBulge = p.bulgeOnly;

      ctx.beginPath();

      for (let i = 0; i < len; i++) {
        const d = dots[i];
        const dx = m.x - d.ax;
        const dy = m.y - d.ay;
        const distSq = dx * dx + dy * dy;

        if (distSq < crSq && eng > 0.01) {
          const dist = Math.sqrt(distSq);
          if (isBulge) {
            const t = 1 - dist / cr;
            const push = t * t * p.bulgeStrength * eng;
            const angle = Math.atan2(dy, dx);
            d.sx += (d.ax - Math.cos(angle) * push - d.sx) * 0.15;
            d.sy += (d.ay - Math.sin(angle) * push - d.sy) * 0.15;
          } else {
            const angle = Math.atan2(dy, dx);
            const move = (500 / dist) * (m.speed * p.cursorForce);
            d.vx += Math.cos(angle) * -move;
            d.vy += Math.sin(angle) * -move;
          }
        } else if (isBulge) {
          d.sx += (d.ax - d.sx) * 0.1;
          d.sy += (d.ay - d.sy) * 0.1;
        }

        if (!isBulge) {
          d.vx *= 0.9;
          d.vy *= 0.9;
          d.x = d.ax + d.vx;
          d.y = d.ay + d.vy;
          d.sx += (d.x - d.sx) * 0.1;
          d.sy += (d.y - d.sy) * 0.1;
        }

        let drawX = d.sx;
        let drawY = d.sy;
        if (p.waveAmplitude > 0) {
          drawY += Math.sin(d.ax * 0.03 + t) * p.waveAmplitude;
          drawX += Math.cos(d.ay * 0.03 + t * 0.7) * p.waveAmplitude * 0.5;
        }

        if (p.sparkle) {
          const hash = ((i * 2654435761) ^ (frameCount >> 3)) >>> 0;
          if ((hash % 100) < 3) {
            ctx.moveTo(drawX + rad * 1.8, drawY);
            ctx.arc(drawX, drawY, rad * 1.8, 0, DOT_FIELD_TWO_PI);
          } else {
            ctx.moveTo(drawX + rad, drawY);
            ctx.arc(drawX, drawY, rad, 0, DOT_FIELD_TWO_PI);
          }
        } else {
          ctx.moveTo(drawX + rad, drawY);
          ctx.arc(drawX, drawY, rad, 0, DOT_FIELD_TWO_PI);
        }
      }

      ctx.fill();

      if (interactive) rafRef.current = requestAnimationFrame(tick);
    }

    doResize();
    window.addEventListener('resize', resize);
    // The section also grows after first paint (live prices load, cards
    // resize, the purchase note) without any window resize, which left
    // its bottom uncovered as a dark band (2026-10-09). Follow the
    // section's own size too; doResize skips work when nothing changed.
    const sizeObserver = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(resize) : null;
    if (sizeObserver) sizeObserver.observe(canvas.parentElement);
    window.addEventListener('mousemove', onMouseMove, { passive: true });
    if (interactive) rafRef.current = requestAnimationFrame(tick);

    rebuildRef.current = () => {
      const { w, h } = sizeRef.current;
      if (w > 0 && h > 0) { buildDots(w, h); if (!interactive) tick(); }
    };

    return () => {
      cancelAnimationFrame(rafRef.current);
      clearInterval(speedInterval);
      clearTimeout(resizeTimer);
      window.removeEventListener('resize', resize);
      if (sizeObserver) sizeObserver.disconnect();
      window.removeEventListener('mousemove', onMouseMove);
    };
    // eslint-disable-next-line
  }, []);

  React.useEffect(() => {
    rebuildRef.current && rebuildRef.current();
  }, [dotRadius, dotSpacing]);

  return (
    <div className="dot-field-container" {...rest}>
      <canvas
        ref={canvasRef}
        style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}
      />
      <svg
        ref={svgRef}
        style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none' }}
      >
        <defs>
          <radialGradient id={glowIdRef.current}>
            <stop offset="0%" stopColor={glowColor} />
            <stop offset="100%" stopColor="transparent" />
          </radialGradient>
        </defs>
        <circle
          ref={glowRef}
          cx="-9999"
          cy="-9999"
          r={glowRadius}
          fill={`url(#${glowIdRef.current})`}
          style={{ opacity: 0, willChange: 'opacity' }}
        />
      </svg>
    </div>
  );
});

// /api/challenge-register (default: the GATE DA 2027 admit card day,
// 2027-01-04; editable in /team). Submissions are insert-only server side.
const CHALLENGE_DEFAULT_CUTOFF = '2027-01-04';
const _challengeFetch = fetch('/api/challenge-register')
  .then(r => r.ok ? r.json() : null)
  .catch(() => null);
function fmtChallengeDate(iso) {
  const d = new Date((iso || CHALLENGE_DEFAULT_CUTOFF) + 'T00:00:00+05:30');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'Asia/Kolkata' });
}
function useChallengeStatus() {
  const [status, setStatus] = React.useState(null);
  React.useEffect(() => { _challengeFetch.then(s => { if (s) setStatus(s); }); }, []);
  const cutoff = (status && status.cutoff) || CHALLENGE_DEFAULT_CUTOFF;
  // Until the API answers, decide from the default cutoff on the client.
  const open = status ? !!status.open : Date.now() <= new Date(cutoff + 'T23:59:59.999+05:30').getTime();
  return { cutoff, open };
}
