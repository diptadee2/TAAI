<style>
:root {
  --bg: #FFFFFF;
  --bg-soft: #FBF9FF;
  --ink: #14102B;
  --ink-dim: #4A4270;
  --ink-soft: #857CAE;
  --line: #ECE6F8;
  --card: #FFFFFF;
  --pink: #FF7FB7;
  --pink-soft: #FFD6E8;
  --purple: #8B5CF6;
  --purple-soft: #E6DCFF;
  --blue: #4D8BFF;
  --blue-soft: #D6E4FF;
  --lilac: #C4B0FF;
  --radius-md: 18px;
  --radius-lg: 26px;
  --radius-xl: 36px;
  --shadow-sm: 0 1px 0 rgba(20,16,43,0.04), 0 2px 6px rgba(20,16,43,0.04);
  --shadow-md: 0 2px 0 rgba(20,16,43,0.03), 0 12px 32px rgba(107,75,255,0.08);
  --shadow-lg: 0 24px 60px rgba(107,75,255,0.16);
  --font-display: 'Fraunces', ui-serif, serif;
  --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace;
  --gutter: 32px;
  --section-pad: 96px;
}

[data-cards="shadowed"] .card { box-shadow: var(--shadow-md); border: 1px solid transparent; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-body); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; font-size: 16px; line-height: 1.5; }
.container { max-width: 1280px; margin: 0 auto; padding: 0 max(var(--gutter), 24px); }

/* ── Nav ─────────────────────────────────────────────── */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: rgba(255,255,255,0.55); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); overflow: visible; }
.nav-spacer { height: 86px; }
.nav.menu-open { background: rgba(248,246,255,0.82); }
.nav-inner { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 28px; height: 86px; padding: 0 32px 0 20px; overflow: visible; }
.nav-logo {
  display: flex; align-items: center; text-decoration: none;
  transition: transform .22s ease-out, opacity .22s ease;
}
.nav-logo svg, .nav-logo img { width: 180px; height: auto; filter: drop-shadow(0 0 10px rgba(255,255,255,0.4)) drop-shadow(0 0 28px rgba(255,255,255,0.18)) drop-shadow(0 0 60px rgba(255,255,255,0.09)); }
.nav-logo:hover { transform: translateY(-2px); opacity: 0.82; }
.nav-logo:active { transform: translateY(1px); opacity: 1; transition-duration: .08s; }
@media (hover: hover) {
  .nav-logo { position: relative; }
  .nav-logo::after { content: 'Home'; position: absolute; bottom: -34px; left: 50%; transform: translateX(-50%) translateY(8px) scale(0.88); font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--purple); background: linear-gradient(135deg, rgba(249,247,255,0.97), rgba(241,237,255,0.97)); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(139,92,246,0.22); border-radius: 20px; padding: 4px 13px; opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .24s cubic-bezier(.34,1.15,.64,1); white-space: nowrap; box-shadow: 0 4px 18px rgba(139,92,246,0.13), 0 1px 4px rgba(0,0,0,0.05); }
  .nav-logo:hover::after { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}
.nav-links { display: flex; gap: 36px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; position: relative;}
.nav-links a { color: var(--ink-dim); text-decoration: none; transition: color .2s, transform .3s cubic-bezier(.34,1.1,.64,1); position: relative; z-index: 1; cursor: pointer; display: inline-block; white-space: nowrap; }
.nav-links a::after { content: ''; position: absolute; inset: -14px -10px; z-index: 0; }
.nav-links a:hover, .nav-links a.active { color: var(--purple); transform: scale(1.08) translateY(-1px); }
.nav-pill {
  position: absolute; top: 50%; transform: translateY(-50%);
  height: 34px; border-radius: 10px; pointer-events: none; z-index: 0;
  overflow: hidden;
  background: linear-gradient(
    150deg,
    rgba(255,255,255,0.36) 0%,
    rgba(180,155,255,0.14) 40%,
    rgba(139,92,246,0.10) 68%,
    rgba(255,255,255,0.24) 100%
  );
  background-size: 300% 300%;
  border: 1px solid rgba(255,255,255,0.55);
  backdrop-filter: blur(14px) saturate(200%) brightness(1.05);
  -webkit-backdrop-filter: blur(14px) saturate(200%) brightness(1.05);
  box-shadow:
    0 2px 12px rgba(139,92,246,0.10),
    inset 0 1.5px 0 rgba(255,255,255,0.82),
    inset 0 -1px 0 rgba(100,80,200,0.08),
    inset 1px 0 0 rgba(255,255,255,0.32),
    inset -1px 0 0 rgba(255,255,255,0.32);
  animation: water-flow 4s ease-in-out infinite;
  transition: left .3s cubic-bezier(0.34,1.2,0.64,1), width .28s cubic-bezier(0.34,1.15,0.64,1), opacity .2s ease;
}
.nav-pill::before {
  content: '';
  position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(125deg, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0.0) 52%);
  animation: glass-shine 5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes water-flow {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
@keyframes glass-shine {
  0%, 100% { opacity: 1; transform: translateX(0); }
  50% { opacity: 0.35; transform: translateX(10px); }
}
/* ── Courses nav dropdown ────────────────────────────── */
.nav-dropdown-wrap { position: relative; display: flex; align-items: center; z-index: 100; }
.nav-dropdown { position: absolute; top: 100%; left: max(-20px, calc(50% - 105px)); transform: translateY(-8px) scaleY(0.9); transform-origin: top center; min-width: 210px; padding: 10px 6px 6px; background: rgba(248,246,255,0.97); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(139,92,246,0.16); border-radius: 14px; box-shadow: 0 8px 32px rgba(20,16,43,0.12), 0 2px 8px rgba(139,92,246,0.08); opacity: 0; pointer-events: none; transition: opacity .14s ease, transform .26s cubic-bezier(.34,1.56,.64,1); z-index: 150; }
.nav-dropdown::before { content: ''; position: absolute; top: -18px; left: 0; right: 0; height: 18px; }
.nav-dropdown-wrap:hover .nav-dropdown { opacity: 1; transform: translateY(12px) scaleY(1); pointer-events: auto; }
.nav-dd-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; text-decoration: none; color: var(--ink-dim); font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; position: relative; opacity: 0; transform: translateY(5px); transition: background .14s ease, color .14s ease, opacity .13s ease, transform .13s ease; }
.nav-dd-item:hover { background: rgba(139,92,246,0.08); color: var(--purple); }
.nav-dropdown-wrap:hover .nav-dd-item { opacity: 1; transform: translateY(0); transition: background .14s ease, color .14s ease, opacity .22s cubic-bezier(.34,1.56,.64,1), transform .28s cubic-bezier(.34,1.56,.64,1); }
.nav-dropdown-wrap:hover .nav-dd-item:nth-child(1) { transition-delay: .04s; }
.nav-dropdown-wrap:hover .nav-dd-item:nth-child(3) { transition-delay: .08s; }
.nav-dropdown-wrap:hover .nav-dd-item:nth-child(5) { transition-delay: .11s; }
.nav-dd-divider { height: 1px; background: rgba(139,92,246,0.22); margin: 2px 10px; opacity: 0; transition: opacity .12s ease; }
.nav-dropdown-wrap:hover .nav-dd-divider { opacity: 1; }
.nav-dropdown-wrap:hover .nav-dd-divider:nth-child(2) { transition-delay: .05s; }
.nav-dropdown-wrap:hover .nav-dd-divider:nth-child(4) { transition-delay: .095s; }
.nav-cta { display: flex; gap: 10px; align-items: center; }
.btn-nav-signin { display: inline-flex; align-items: center; padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; background: rgba(139,92,246,0.07); color: var(--ink); border: 1px solid rgba(139,92,246,0.22); backdrop-filter: blur(10px) saturate(150%); -webkit-backdrop-filter: blur(10px) saturate(150%); box-shadow: 0 1px 2px rgba(139,92,246,0.06), inset 0 1px 0 rgba(255,255,255,0.7); transition: background .2s, transform .32s cubic-bezier(.34,1.1,.64,1), box-shadow .2s, backdrop-filter .2s; white-space: nowrap; }
.btn-nav-signin:hover { background: rgba(139,92,246,0.13); transform: scale(1.06) translateY(-1px); backdrop-filter: blur(18px) saturate(220%) brightness(1.04); -webkit-backdrop-filter: blur(18px) saturate(220%) brightness(1.04); box-shadow: 0 6px 20px rgba(139,92,246,0.18), inset 0 1px 0 rgba(255,255,255,0.85), 0 0 0 1px rgba(139,92,246,0.12); }
.btn-nav-signup { display: inline-flex; align-items: center; padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; background: linear-gradient(160deg, rgba(147,105,255,0.92), rgba(107,75,255,0.88)); color: #fff; border: 1px solid rgba(255,255,255,0.22); backdrop-filter: blur(10px) saturate(140%); -webkit-backdrop-filter: blur(10px) saturate(140%); box-shadow: 0 2px 10px rgba(107,75,255,0.28), inset 0 1px 0 rgba(255,255,255,0.28); transition: transform .32s cubic-bezier(.34,1.1,.64,1), box-shadow .2s; white-space: nowrap; }
.btn-nav-signup:hover { transform: scale(1.06) translateY(-1px); box-shadow: 0 8px 24px rgba(107,75,255,0.45), inset 0 1px 0 rgba(255,255,255,0.36); }
.btn-nav-contact { font-size: 14px; font-weight: 500; color: var(--ink-dim); text-decoration: none; padding: 10px 20px; border-radius: 8px; background: none; border: none; box-shadow: none; transition: color .2s, transform .32s cubic-bezier(.34,1.1,.64,1), background .2s; white-space: nowrap; }
.btn-nav-contact:hover { color: var(--purple); background: rgba(139,92,246,0.07); transform: scale(1.06) translateY(-1px); }
.phone-icon { display: inline-flex; align-items: center; margin-right: 5px; transform-origin: 50% 55%; }
.btn-nav-contact:hover .phone-icon { animation: phone-ring 0.52s ease-in-out; }
.nav-cta .btn-nav-signin,
.nav-cta .btn-nav-signup,
.nav-cta .btn-nav-contact { position: relative; overflow: hidden; }
.nav-cta .btn-nav-signin::before,
.nav-cta .btn-nav-signup::before,
.nav-cta .btn-nav-contact::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(108deg, transparent 20%, rgba(255,255,255,0.42) 48%, rgba(210,195,255,0.25) 56%, transparent 74%);
  transform: translateX(-120%) skewX(-12deg);
  pointer-events: none;
  border-radius: inherit;
  transition: none;
}
.nav-cta .btn-nav-signin:hover::before,
.nav-cta .btn-nav-signup:hover::before,
.nav-cta .btn-nav-contact:hover::before {
  transform: translateX(220%) skewX(-12deg);
  transition: transform .52s cubic-bezier(.2,.8,.4,1);
}
@keyframes phone-ring {
  0%,100% { transform: rotate(0); }
  12%     { transform: rotate(-22deg); }
  28%     { transform: rotate(18deg); }
  44%     { transform: rotate(-12deg); }
  60%     { transform: rotate(8deg); }
  76%     { transform: rotate(-4deg); }
  90%     { transform: rotate(2deg); }
}
/* ── Buttons ─────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 999px; font-family: var(--font-body); font-size: 15px; font-weight: 500; text-decoration: none; border: none; cursor: pointer; transition: transform .15s, box-shadow .15s; }
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff; box-shadow: 0 4px 20px rgba(139,92,246,0.3); }
.btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn-ghost:hover { border-color: var(--purple); color: var(--purple); }

/* ── Hero ────────────────────────────────────────────── */
.hero {
  padding: 80px 0 24px;
  position: relative; overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(circle, rgba(139,92,246,0.14) 1.5px, transparent 1.5px);
  background-size: 32px 32px;
  text-align: center;
}
.hero::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 120px;
  background: linear-gradient(to bottom, transparent, var(--bg));
  pointer-events: none;
}
.hero-orb-1 { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, var(--pink-soft) 0%, transparent 65%); top: -200px; right: -100px; pointer-events: none; animation: orb-drift 13s ease-in-out infinite; }
.hero-orb-2 { position: absolute; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, var(--blue-soft) 0%, transparent 65%); bottom: -180px; left: -120px; pointer-events: none; animation: orb-drift 17s ease-in-out infinite reverse; }
.hero-inner { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; }
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--purple); margin-bottom: 24px;
}
.hero-eyebrow::before { content: ''; display: inline-block; width: 18px; height: 2px; background: linear-gradient(90deg, var(--pink), var(--purple)); border-radius: 2px; }
.hero h1 {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(44px, 5.5vw, 76px);
  line-height: 0.95; letter-spacing: -0.04em;
  margin-bottom: 24px;
}
.hero h1 em { font-style: normal; background: linear-gradient(120deg, var(--pink) 0%, var(--purple) 50%, var(--blue) 100%); background-size: 200% 200%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: gradient-shift 5s ease infinite; }
.hero-sub { font-size: 18px; color: var(--ink-dim); line-height: 1.6; max-width: 560px; margin: 0 auto 36px; }
.hero-stats { display: flex; align-items: center; justify-content: center; gap: 40px; flex-wrap: wrap; }
.hero-stat { text-align: center; }
.hero-stat-num { font-family: var(--font-display); font-size: 40px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; background: linear-gradient(120deg, var(--pink), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-stat-label { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
.hero-stat-div { width: 1px; height: 40px; background: var(--line); }

/* ── Section base ────────────────────────────────────── */
.section { padding: var(--section-pad) 0; scroll-margin-top: 100px; }
.hero + .section { padding-top: 32px; }
.section + .section { border-top: 1px solid transparent; border-image: linear-gradient(90deg, transparent, rgba(139,92,246,0.2) 35%, rgba(236,72,153,0.2) 65%, transparent) 1; }
.section-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--purple); margin-bottom: 18px; }
.section-eyebrow::before { content: ''; display: inline-block; width: 18px; height: 2px; background: linear-gradient(90deg, var(--pink), var(--purple)); border-radius: 2px; }
.section-header { margin-bottom: 0; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 56px; gap: 24px; flex-wrap: wrap; }
.section-head-left { max-width: 720px; }
.results-grid { display: flex; flex-direction: column; gap: 16px; }
.result-hero {
  border-radius: var(--radius-lg); padding: 48px 56px;
  background-image: radial-gradient(circle, rgba(255,255,255,0.09) 1.5px, transparent 1.5px), linear-gradient(135deg, #14102B 0%, #221260 55%, #1a0d50 100%);
  background-size: 28px 28px, auto;
  border: 1px solid rgba(139,92,246,0.35);
  box-shadow: 0 12px 48px rgba(107,75,255,0.28);
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 48px;
  transition: box-shadow .4s ease, border-color .4s ease;
}
.result-hero:hover { box-shadow: 0 20px 64px rgba(107,75,255,0.4); border-color: rgba(139,92,246,0.55); }
.result-hero::before {
  content: ''; position: absolute; top: -80px; right: -60px;
  width: 320px; height: 320px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,127,183,0.22) 0%, transparent 68%);
  pointer-events: none; transition: transform .6s ease;
}
.result-hero:hover::before { transform: scale(1.15) translate(-10px, 10px); }
.result-hero::after {
  content: ''; position: absolute; bottom: -60px; left: 20%;
  width: 240px; height: 240px; border-radius: 50%;
  background: radial-gradient(circle, rgba(139,92,246,0.2) 0%, transparent 68%);
  pointer-events: none; transition: transform .6s ease;
}
.result-hero:hover::after { transform: scale(1.2) translate(10px, -10px); }
.result-hero-num {
  font-family: var(--font-display); font-size: clamp(80px, 10vw, 130px);
  font-weight: 600; letter-spacing: -0.05em; line-height: 1;
  background: linear-gradient(120deg, #fff 0%, #ffc0dc 40%, var(--pink) 75%, var(--lilac) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  position: relative; z-index: 1; flex-shrink: 0;
  filter: drop-shadow(0 0 32px rgba(236,72,153,0.45));
  transition: filter .4s ease, transform .4s cubic-bezier(.34,1.1,.64,1);
}
.result-hero:hover .result-hero-num { filter: drop-shadow(0 0 48px rgba(236,72,153,0.65)); transform: scale(1.04); }
.result-hero-text { position: relative; z-index: 1; }
.result-hero-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-bottom: 10px; }
.result-hero-label { font-family: var(--font-display); font-size: clamp(22px,2.8vw,34px); font-weight: 600; letter-spacing: -0.025em; color: #fff; line-height: 1.15; margin-bottom: 10px; }
.result-hero-sub { font-size: 15px; color: rgba(255,255,255,0.45); line-height: 1.55; max-width: 360px; }
.results-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.result-card {
  border-radius: var(--radius-md); padding: 28px 24px 24px;
  border: 1px solid var(--line); background: #fff;
  position: relative; overflow: hidden;
  transition: transform .4s cubic-bezier(.25,.46,.45,.94), box-shadow .4s ease, border-color .3s ease;
}
.result-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 3px 3px 0 0;
  opacity: 0; transition: opacity .3s ease;
}
.result-card:nth-child(1)::before { background: linear-gradient(90deg, var(--pink), #c45fcf); }
.result-card:nth-child(2)::before { background: linear-gradient(90deg, var(--purple), var(--blue)); }
.result-card:nth-child(3)::before { background: linear-gradient(90deg, var(--blue), #38bdf8); }
.result-card:hover { transform: translateY(-6px); border-color: transparent; }
.result-card:nth-child(1):hover { box-shadow: 0 16px 48px rgba(236,72,153,0.18), 0 4px 12px rgba(236,72,153,0.1); }
.result-card:nth-child(2):hover { box-shadow: 0 16px 48px rgba(139,92,246,0.18), 0 4px 12px rgba(139,92,246,0.1); }
.result-card:nth-child(3):hover { box-shadow: 0 16px 48px rgba(56,189,248,0.18), 0 4px 12px rgba(56,189,248,0.1); }
.result-card:hover::before { opacity: 1; }
.result-card .big {
  font-family: var(--font-display); font-size: clamp(36px, 5vw, 52px);
  font-weight: 600; letter-spacing: -0.04em; line-height: 1;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  transition: transform .4s cubic-bezier(.34,1.1,.64,1);
}
.result-card:nth-child(1) .big { background-image: linear-gradient(120deg, var(--pink), #c45fcf); }
.result-card:nth-child(2) .big { background-image: linear-gradient(120deg, var(--purple), var(--blue)); }
.result-card:nth-child(3) .big { background-image: linear-gradient(120deg, var(--blue), #38bdf8); }
.result-card:hover .big { transform: scale(1.06) translateY(-1px); }
.result-card .lbl { font-size: 13px; color: var(--ink-dim); margin-top: 8px; transition: color .3s ease; }
.result-card:hover .lbl { color: var(--ink); }
.section-h2 { font-family: var(--font-display); font-size: clamp(30px,3.8vw,50px); font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
.section-h2 em { font-style: normal; background: linear-gradient(120deg, var(--pink), var(--purple), var(--blue), var(--purple), var(--pink)); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: grad-drift 9s ease infinite; }
.section-h2 em.blue { background: linear-gradient(120deg, var(--purple), var(--blue), var(--purple)); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: grad-drift 9s ease infinite; }

/* ── Gallery masonry ─────────────────────────────────── */
.gallery-masonry {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
  margin-top: 48px;
  align-items: start;
}
.gallery-col { display: flex; flex-direction: column; gap: 24px; }
.from-left  { --tx: -36px; }
.from-right { --tx:  36px; }
.gallery-item {
  position: relative;
}
.gallery-img-wrap {
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow:
    0 2px 8px rgba(20,16,43,0.06),
    0 8px 28px rgba(255,127,183,0.2),
    0 18px 52px rgba(139,92,246,0.14);
  transition: transform .5s cubic-bezier(0.16,1,0.3,1), box-shadow .5s ease;
}
.gallery-item:hover .gallery-img-wrap {
  transform: translateY(-6px);
  box-shadow:
    0 4px 12px rgba(20,16,43,0.08),
    0 14px 38px rgba(255,127,183,0.3),
    0 28px 68px rgba(139,92,246,0.22);
}
.gallery-img-wrap img { width: 100%; display: block; }
.gallery-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 4px 0;
  flex-wrap: wrap;
}
.gallery-air-badge {
  display: inline-flex;
  align-items: center;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  color: #fff;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 13px;
  border-radius: 999px;
  letter-spacing: .06em;
}

/* ── Batch divider ───────────────────────────────────── */
.batch-divider {
  display: flex;
  align-items: center;
  gap: 20px;
  margin: 0 0 56px;
}
.batch-divider-line { flex: 1; height: 1px; background: var(--line); }
.batch-divider-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-soft);
  white-space: nowrap;
  padding: 6px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
}

/* ── Featured cards ──────────────────────────────────── */
.featured-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 40px; }
@keyframes feat-orb-a { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-14px,16px) scale(1.12)} }
@keyframes feat-orb-b { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(12px,-10px) scale(1.09)} }
.feat-card {
  background:
    radial-gradient(circle at var(--mx,-200%) var(--my,-200%), rgba(139,92,246,0.38) 0%, transparent 50%),
    radial-gradient(ellipse 85% 85% at -8% 108%, rgba(56,189,248,0.22) 0%, rgba(99,102,241,0.12) 45%, transparent 68%),
    radial-gradient(ellipse 60% 50% at 50% 100%, rgba(107,75,255,0.18) 0%, transparent 65%),
    linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px),
    linear-gradient(148deg, #16103c 0%, #0e0a28 45%, #080618 100%);
  background-size: 100% 100%, 100% 100%, 100% 100%, 32px 32px, 32px 32px, 100% 100%;
  border: 1px solid rgba(139,92,246,0.22);
  border-top: 1px solid rgba(196,176,255,0.18);
  border-radius: var(--radius-xl);
  padding: 40px;
  color: #fff;
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; gap: 20px;
  box-shadow: 0 8px 32px rgba(107,75,255,0.18), inset 0 1px 0 rgba(255,255,255,0.06);
}
.feat-card::before {
  content: '';
  position: absolute; top: -90px; right: -70px;
  width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, rgba(139,92,246,0.32) 0%, rgba(99,102,241,0.16) 45%, transparent 68%);
  pointer-events: none; filter: blur(24px);
  animation: feat-orb-a 9s ease-in-out infinite;
}
.feat-card::after {
  content: '';
  position: absolute; bottom: -70px; left: -50px;
  width: 240px; height: 240px; border-radius: 50%;
  background: radial-gradient(circle, rgba(56,189,248,0.32) 0%, rgba(99,102,241,0.18) 40%, transparent 68%);
  pointer-events: none; filter: blur(20px);
  animation: feat-orb-b 12s ease-in-out 2s infinite;
}
.feat-rank-num { font-family: var(--font-display); font-size: 64px; font-weight: 600; letter-spacing: -0.05em; line-height: 1; background: linear-gradient(120deg, var(--pink), var(--lilac)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.feat-quote { font-size: 16px; line-height: 1.65; color: rgba(255,255,255,0.82); font-style: italic; flex: 1; }
.feat-author { display: flex; align-items: center; gap: 14px; }
.feat-avatar { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px; color: #fff; flex-shrink: 0; overflow: hidden; }
.feat-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.feat-name { font-weight: 600; font-size: 15px; color: #fff; }
.feat-role { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; }

/* ── Testimonials grid ───────────────────────────────── */
.testi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 40px; align-items: start; }
.testi-card {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 26px 26px 22px;
  display: flex; flex-direction: column; gap: 16px;
  transition: transform .25s, box-shadow .25s;
  position: relative; overflow: hidden;
}
.testi-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--grad, linear-gradient(135deg, var(--pink), var(--purple)));
  opacity: 0.045;
  pointer-events: none;
}
.testi-card::after {
  content: '\201C';
  font-family: var(--font-display);
  font-size: 156px; font-weight: 900; line-height: 1;
  background: var(--grad, linear-gradient(135deg, var(--pink), var(--purple)));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  opacity: 0.22;
  position: absolute; top: -12px; right: 14px;
  pointer-events: none; user-select: none;
}
.testi-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.testi-rank-badge {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--grad, linear-gradient(135deg, var(--pink), var(--purple)));
  color: #fff;
  font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .08em;
  padding: 5px 14px 5px 11px; border-radius: 999px; width: fit-content;
}
.testi-rank-badge span { font-family: var(--font-display); font-size: 18px; font-weight: 800; line-height: 1.1; }
.testi-quote { font-size: 14px; line-height: 1.75; color: var(--ink-dim); flex: 1; position: relative; z-index: 1; }
.testi-author { display: flex; align-items: center; gap: 13px; padding-top: 14px; border-top: 1px solid var(--line); position: relative; z-index: 1; }
.testi-avatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #fff; flex-shrink: 0; overflow: hidden; }
.testi-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.testi-name { font-weight: 600; font-size: 14px; color: var(--ink); }
.testi-role { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }

/* ── Video thumbnails ────────────────────────────────── */
.vthumb-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.vthumb-header-label { font-size: 12px; font-weight: 700; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .09em; }
.vthumb-header-all { font-size: 13px; color: var(--purple); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; transition: color .2s; }
.vthumb-header-all:hover { color: var(--pink); }
.vthumb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.vthumb { text-decoration: none; color: inherit; display: block; }
.vthumb-wrap { position: relative; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 16/9; }
.vthumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease, opacity .3s ease; opacity: 0.9; }
.vthumb:hover .vthumb-wrap img { transform: scale(1.04); opacity: 0.72; }
.vthumb-play-overlay { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .25s ease; }
.vthumb:hover .vthumb-play-overlay { opacity: 1; }
.vthumb-info { padding: 10px 2px 0; }
.vthumb-air-badge { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--purple); background: var(--purple-soft); padding: 2px 8px; border-radius: 999px; display: inline-block; margin-bottom: 5px; }
.vthumb-name { font-size: 13px; font-weight: 600; color: var(--ink); display: block; }
.vthumb-batch { font-size: 12px; color: var(--ink-soft); display: block; margin-top: 1px; }

/* ── Video CTA ───────────────────────────────────────── */
@keyframes vcta-orb-1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-20px,15px) scale(1.12); } }
@keyframes vcta-orb-2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(16px,-12px) scale(1.08); } }
@keyframes vcta-shimmer { 0%,60% { transform: translateX(-130%) skewX(-15deg); } 80%,100% { transform: translateX(260%) skewX(-15deg); } }
@keyframes vcta-ring { 0%,100% { box-shadow: 0 0 0 0 rgba(139,92,246,0.5); } 50% { box-shadow: 0 0 0 8px rgba(139,92,246,0); } }
.video-cta {
  border-radius: var(--radius-xl); padding: 56px 48px;
  display: flex; align-items: center; justify-content: space-between; gap: 40px;
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, #14102b 0%, #1e1060 50%, #0f1a40 100%);
  border: 1px solid rgba(139,92,246,0.3);
  box-shadow: 0 8px 48px rgba(107,75,255,0.2), inset 0 1px 0 rgba(255,255,255,0.06);
  transition: box-shadow .4s ease, border-color .4s ease;
}
.video-cta:hover { box-shadow: 0 16px 64px rgba(107,75,255,0.32); border-color: rgba(139,92,246,0.5); }
.video-cta::before {
  content: ''; position: absolute; top: -80px; left: -60px;
  width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, rgba(236,72,153,0.22) 0%, transparent 70%);
  pointer-events: none; animation: vcta-orb-1 7s ease-in-out infinite;
}
.video-cta::after {
  content: ''; position: absolute; bottom: -60px; right: -40px;
  width: 260px; height: 260px; border-radius: 50%;
  background: radial-gradient(circle, rgba(56,189,248,0.18) 0%, transparent 70%);
  pointer-events: none; animation: vcta-orb-2 9s ease-in-out infinite;
}
.video-cta-left { position: relative; z-index: 1; }
.video-cta-left h2 { font-family: var(--font-display); font-size: clamp(28px,3vw,42px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; margin-bottom: 14px; color: #fff; }
.video-cta-left h2 em { font-style: normal; background: linear-gradient(120deg, var(--pink), var(--purple), #38bdf8); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: grad-drift 5s ease infinite; }
.video-cta-left p { font-size: 15px; color: rgba(255,255,255,0.55); line-height: 1.6; max-width: 440px; }
.video-cta-right { display: flex; flex-direction: column; gap: 12px; align-items: flex-end; flex-shrink: 0; position: relative; z-index: 1; }
.video-cta-right .btn-primary { position: relative; overflow: hidden; animation: vcta-ring 2.4s ease-in-out infinite; }
.video-cta-right .btn-primary::after { content: ''; position: absolute; inset: 0; width: 45%; background: linear-gradient(90deg,transparent,rgba(255,255,255,0.22),transparent); transform: translateX(-130%) skewX(-15deg); animation: vcta-shimmer 3.6s ease-in-out infinite; pointer-events: none; }
.video-cta-right .btn-ghost { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85); border-color: rgba(255,255,255,0.2); transition: background .25s ease, color .25s ease, border-color .25s ease; }
.video-cta-right .btn-ghost:hover { background: rgba(255,255,255,0.14); color: #fff; border-color: rgba(255,255,255,0.38); }
.video-cta-right .btn-ghost svg { transition: transform .38s cubic-bezier(.34,1.28,.64,1); flex-shrink: 0; }
.video-cta-right .btn-ghost:hover svg { transform: translateX(5px); }

/* ── Footer ──────────────────────────────────────────── */
.footer { padding: 40px 0; border-top: 1px solid var(--line); }
.footer-inner { display: flex; flex-direction: row; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
.footer-socials { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.footer-socials a { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-soft); color: var(--ink-dim); border: 1px solid var(--line); text-decoration: none; transition: background .28s cubic-bezier(.4,0,.2,1), color .28s, transform .28s cubic-bezier(.34,1.15,.64,1), border-color .28s; }
.footer-socials a:hover { background: var(--purple); color: #fff; border-color: var(--purple); transform: translateY(-3px); }
.footer-socials a svg { display: block; width: 22px; height: 22px; }
.footer-copy { font-size: 12px; color: var(--ink-soft); letter-spacing: .02em; }
.footer-email { font-size: 12px; color: var(--ink-dim); text-decoration: none; letter-spacing: .02em; transition: color .2s; }
.footer-email:hover { color: var(--purple); }
.scroll-progress { position: fixed; top: 0; left: 0; z-index: 100; height: 3px; background: linear-gradient(90deg, var(--pink), var(--purple)); pointer-events: none; transition: width 120ms linear; }
.back-to-top { position: fixed; bottom: 24px; right: 24px; z-index: 90; width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #0d9488, #0891b2); color: #fff; border: none; cursor: pointer; display: grid; place-items: center; box-shadow: 0 4px 16px rgba(8,145,178,0.45); opacity: 0; transform: translateY(12px) scale(0.88); transition: opacity .28s ease, transform .4s cubic-bezier(.34,1.56,.64,1), box-shadow .2s; pointer-events: none; }
.back-to-top.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
.back-to-top:hover { box-shadow: 0 6px 28px rgba(8,145,178,0.6); transform: translateY(-2px) scale(1.06); transition-delay: 0ms; }
.back-to-top:active { transform: scale(0.93); }

/* ── Keyframes ───────────────────────────────────────── */
@keyframes orb-drift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33%       { transform: translate(20px, -16px) scale(1.05); }
  66%       { transform: translate(-12px, 12px) scale(0.96); }
}
@keyframes gradient-shift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes reveal {
  from { opacity: 0; transform: translate(var(--tx, 0px), var(--ty, 28px)) scale(var(--ts, 0.97)); }
  to   { opacity: 1; transform: translate(0px, 0px) scale(1); }
}
@keyframes grad-drift {
  0%, 100% { background-position: 0% 50%; }
  50%       { background-position: 100% 50%; }
}

/* ── Scroll reveal ───────────────────────────────────── */
.fade-in {
  animation: reveal 0.78s cubic-bezier(0.16, 1, 0.3, 1) var(--delay, 0ms) both paused;
  will-change: transform, opacity;
}
.fade-in.visible { animation-play-state: running; }
@media (max-width: 768px) {
  .fade-in { animation-duration: .6s; animation-timing-function: cubic-bezier(.34,1.1,.64,1); }
  /* reduce lateral slide on mobile, full width feels jarring */
  .feat-card:nth-child(odd)  { --tx: -22px; --ty: 0px; }
  .feat-card:nth-child(even) { --tx:  22px; --ty: 0px; }
  .testi-card:nth-child(odd)  { --tx: -22px; --ty: 0px; }
  .testi-card:nth-child(even) { --tx:  22px; --ty: 0px; }
}

/* ── Responsive ──────────────────────────────────────── */
@media (max-width: 1024px) {
  .featured-grid { grid-template-columns: 1fr; }
  .vthumb-grid { grid-template-columns: 1fr 1fr; }
  .testi-grid { grid-template-columns: 1fr 1fr; }
  .video-cta { flex-direction: column; align-items: flex-start; padding: 36px 28px; }
  .video-cta-right { align-items: flex-start; width: 100%; }
  .video-cta-right .btn-primary, .video-cta-right .btn-ghost { width: 100%; justify-content: center; }
  .gallery-masonry { grid-template-columns: 1fr; }
  .gallery-col:first-child .gallery-item:nth-child(odd)  { --tx: -44px; }
  .gallery-col:first-child .gallery-item:nth-child(even) { --tx:  44px; }
  .gallery-col:last-child  .gallery-item:nth-child(odd)  { --tx: -44px; }
  .gallery-col:last-child  .gallery-item:nth-child(even) { --tx:  44px; }
}
@media (max-width: 768px) {
  :root { --section-pad: 60px; }
  .testi-grid { grid-template-columns: 1fr; }
  .vthumb-grid { grid-template-columns: 1fr; }
  .hero-stats { gap: 20px; }
  .hero-stat-div { display: none; }
  .feat-card { padding: 28px 24px; }
  .feat-rank-num { font-size: 48px; }
  .video-cta { padding: 36px 24px; }
  .result-hero { flex-direction: column; align-items: flex-start; gap: 20px; padding: 32px 24px; }
  .result-hero-num { font-size: 72px; }
  .result-hero-label { font-size: 24px; }
  .result-hero-text { display: flex; flex-direction: column; }
  .result-hero-label { order: 1; }
  .result-hero-eyebrow { order: 2; margin-bottom: 0; margin-top: 8px; }
  .result-hero-sub { order: 3; }
  .results-row { grid-template-columns: 1fr; }
  .feat-card:nth-child(odd)  { --tx: -44px; --ty: 0px; }
  .feat-card:nth-child(even) { --tx:  44px; --ty: 0px; }
  .testi-card:nth-child(odd)  { --tx: -44px; --ty: 0px; }
  .testi-card:nth-child(even) { --tx:  44px; --ty: 0px; }
  .footer-inner { flex-direction: column; align-items: center; text-align: center; }
  .footer-socials a { width: 44px; height: 44px; }
  .footer-socials a svg { width: 18px; height: 18px; }
}

/* ── Touch-device overrides ──────────────────────────── */
@media (hover: none) {
  .testi-card:hover { transform: none; box-shadow: none; }
  .testi-card:active { transform: scale(0.975); transition-duration: .12s; }
  .result-card:hover { transform: none; box-shadow: none; border-color: var(--line); }
  .result-card:hover::before { opacity: 0; }
  .result-card:active { transform: scale(0.975); transition-duration: .12s; }
  .gallery-item:hover .gallery-img-wrap { transform: none; box-shadow: 0 2px 8px rgba(20,16,43,0.06), 0 8px 28px rgba(255,127,183,0.2), 0 18px 52px rgba(139,92,246,0.14); }
}

/* YouTube link wiggle */
@keyframes yt-wiggle {
  0%   { transform: rotate(0deg); }
  20%  { transform: rotate(-1.5deg); }
  45%  { transform: rotate(1deg); }
  68%  { transform: rotate(-0.5deg); }
  85%  { transform: rotate(0.2deg); }
  100% { transform: rotate(0deg); }
}
a[href*="youtube"]:hover svg, a[href*="youtu.be"]:hover svg {
  animation: yt-wiggle 0.6s cubic-bezier(.4,0,.2,1);
}
/* ── Menu overlay ───────────────────────────────────── */
.menu-overlay { display: none; }
@media (max-width: 768px) {
  .menu-overlay { display: block; position: fixed; inset: 0; z-index: 48; background: rgba(14,10,35,0.52); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  .menu-overlay.open { opacity: 1; pointer-events: auto; }
}

/* ── Mobile hamburger menu ──────────────────────────── */
.nav-hamburger { display: none; flex-direction: column; gap: 5px; align-items: center; justify-content: center; width: 40px; height: 40px; border: none; background: none; cursor: pointer; border-radius: 8px; transition: background .2s; flex-shrink: 0; padding: 0; }
.nav-hamburger:hover { background: rgba(139,92,246,0.08); }
.nav-hamburger span { display: block; width: 22px; height: 2px; border-radius: 2px; background: var(--ink); transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .2s; }
.nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.mobile-menu { position: fixed; top: 86px; left: 0; right: 0; z-index: 49; background: rgba(248,246,255,0.72); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border-bottom: 1px solid rgba(139,92,246,0.15); padding: 8px 12px 20px; display: flex; flex-direction: column; gap: 2px; transform: translateY(-10px); opacity: 0; pointer-events: none; transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .22s ease; box-shadow: 0 8px 40px rgba(20,16,43,0.12); overflow: hidden; }
.mobile-menu::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--purple), rgba(139,92,246,0.15)); pointer-events: none; }
.mobile-menu.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
@keyframes menuItemIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
.mobile-menu-link { display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--ink-dim); text-decoration: none; letter-spacing: .05em; text-transform: uppercase; transition: background .18s, color .18s, transform .12s ease; position: relative; }
.mobile-menu.open .mobile-menu-link { animation: menuItemIn .3s both cubic-bezier(.4,0,.2,1); }
.mobile-menu-link:active { transform: scale(0.97) !important; }
.mobile-menu-link:hover { background: rgba(139,92,246,0.08); color: var(--purple); }
.mobile-menu-link.active { background: rgba(139,92,246,0.1); color: var(--purple); }

/* ── Sticky contact buttons ───────────────────────────── */
@keyframes mcb-slide-up {
  from { transform: translateY(110%); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
@keyframes mcb-side-in {
  from { transform: translateX(130%) scale(0.8); opacity: 0; }
  to   { transform: translateX(0)    scale(1);   opacity: 1; }
}
.mobile-contact-bar {
  display: flex; flex-direction: column;
  position: fixed; right: 24px; bottom: 88px; z-index: 200;
  gap: 12px;
  animation: mcb-side-in .48s cubic-bezier(.34,1.1,.64,1) .5s both;
}
.mobile-contact-bar a {
  position: relative;
  width: 50px; height: 50px; border-radius: 50%;
  display: grid; place-items: center;
  text-decoration: none;
  transition: transform .38s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease, opacity .3s ease-out;
}
.mcb-label { display: none; }
.mobile-contact-bar a::after {
  content: attr(data-label);
  position: absolute; right: calc(100% + 12px); top: 50%;
  transform: translateY(-50%) translateX(6px);
  background: rgba(18,14,40,0.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .01em;
  padding: 6px 12px; border-radius: 8px; white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity .16s ease, transform .18s cubic-bezier(.34,1.1,.64,1);
}
.mobile-contact-bar a:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }
.mobile-contact-bar a:hover { transform: scale(1.12); transition-delay: 0ms; }
.mcb-wa   { background: #25D366; color: #fff !important; box-shadow: 0 4px 16px rgba(37,211,102,0.45); opacity: 0; transform: translateX(80px); pointer-events: none; }
.mcb-call { background: linear-gradient(135deg, #f97316, #dc2626); color: #fff !important; box-shadow: 0 4px 16px rgba(220,38,38,0.38); opacity: 0; transform: translateX(80px); pointer-events: none; }
body.buttons-visible .mcb-call { opacity: 1; transform: translateX(0); pointer-events: auto; }
body.buttons-visible .mcb-wa { opacity: 1; transform: translateX(0); pointer-events: auto; transition-delay: 25ms; }
body.buttons-visible .mcb-call:hover,
body.buttons-visible .mcb-wa:hover { transform: scale(1.12); transition-delay: 0ms; }
@media (max-width: 768px) {
  .mobile-contact-bar {
    flex-direction: column;
    right: 16px; bottom: 90px; left: auto; top: auto;
    gap: 10px; background: none; border: none; padding: 0; box-shadow: none;
    animation: mcb-side-in .48s cubic-bezier(.34,1.1,.64,1) .5s both;
  }
  .mobile-contact-bar a {
    width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center; padding: 0; flex: none;
    transition: transform .28s cubic-bezier(.34,1.4,.64,1), opacity .22s ease;
  }
  .mcb-label { display: none; }
  .mobile-contact-bar a::after { display: none; }
  .mobile-contact-bar a:active { transform: scale(0.9); opacity: 0.85; }
  .back-to-top { bottom: 32px; width: 48px; height: 48px; right: 16px; }
}

const MENU_ICONS = {

function Nav() {
  const linksRef = React.useRef(null);
  const [pill, setPill] = React.useState({ left: 0, width: 0, visible: false });
  const resetTimer = React.useRef(null);

  const moveTo = React.useCallback((el) => {
    if (resetTimer.current) { clearTimeout(resetTimer.current); resetTimer.current = null; }
    if (!el) return;
    setPill({ left: el.offsetLeft - 10, width: el.offsetWidth + 20, visible: true });
  }, []);

  const reset = React.useCallback(() => {
    resetTimer.current = setTimeout(() => {
      const active = linksRef.current && linksRef.current.querySelector('a.active');
      if (active) moveTo(active.closest('.nav-dropdown-wrap') || active);
      else setPill(p => ({ ...p, visible: false }));
    }, 60);
  }, [moveTo]);

  React.useEffect(() => { reset(); }, [reset]);

  const [menuOpen, setMenuOpen] = React.useState(false);
  React.useEffect(() => {
    if (!menuOpen) return;
    const close = e => { if (!e.target.closest('.nav') && !e.target.closest('.mobile-menu')) setMenuOpen(false); };
    document.addEventListener('pointerdown', close);
    return () => document.removeEventListener('pointerdown', close);
  }, [menuOpen]);

  return (
    <>
      <div className={`menu-overlay${menuOpen ? ' open' : ''}`} onClick={() => setMenuOpen(false)} />
      <nav className={`nav${menuOpen ? ' menu-open' : ''}`}>
        <div className="nav-inner" onMouseLeave={reset}>
          <a href="index.html" className="nav-logo">
            <TAAILogo />
          </a>
          <div className="nav-links" ref={linksRef}>
            <div className="nav-pill" style={{ left: pill.left, width: pill.width, opacity: pill.visible ? 1 : 0 }} />
            {NAV_LINKS.map((l) => l.dropdown ? (
              <div key={l.href} className="nav-dropdown-wrap" onMouseEnter={(e) => moveTo(e.currentTarget)}>
                <a href={l.href} className={l.active ? 'active' : ''}>{l.label}</a>
                <div className="nav-dropdown">
                  {l.dropdown.map((d, i) => (
                    <React.Fragment key={i}>
                      {d.dividerBefore && <div className="nav-dd-divider" />}
                      <a href={d.href} className="nav-dd-item">{d.label}</a>
                    </React.Fragment>
                  ))}
                </div>
              </div>
            ) : (
              <a key={l.href} href={l.href} className={l.active ? 'active' : ''}
                 onMouseEnter={(e) => moveTo(e.currentTarget)}>{l.label}</a>
            ))}
          </div>
          <div className="nav-cta">
            <a target="_blank" rel="noopener noreferrer" href="https://learn.taai.live/learn/account/signin" className="btn-nav-signin">Sign In</a>
            <a target="_blank" rel="noopener noreferrer" href="https://learn.taai.live/learn/account/signup" className="btn-nav-signup">Sign Up</a>
            <a href="contact.html" className="btn-nav-contact"><span className="phone-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg></span>Contact Us</a>
          </div>
          <button className={`nav-hamburger${menuOpen ? ' open' : ''}`} onClick={() => setMenuOpen(o => !o)} aria-label="Toggle menu">
            <span /><span /><span />
          </button>
        </div>
      </nav>
      <div className={`mobile-menu${menuOpen ? ' open' : ''}`}>
        {[{ label: 'Home', href: 'index.html' }, ...NAV_LINKS].map((l, i) => (
          <a key={l.href} href={l.href} className={`mobile-menu-link${l.active ? ' active' : ''}`} style={{ animationDelay: `${0.04 + i * 0.05}s` }} onClick={() => setMenuOpen(false)}>
            <span className="mobile-menu-link-icon">{MENU_ICONS[l.href]}</span>
            <span className="mobile-menu-link-label">{l.label}</span>
            <span className="mobile-menu-link-chevron"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M4.5 2.5L8.5 6.5L4.5 10.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg></span>
          </a>
        ))}
        <div className="mobile-menu-divider" />
        <div className="mobile-menu-actions">
          <a target="_blank" rel="noopener noreferrer" href="https://learn.taai.live/learn/account/signin" className="btn-nav-signin">
            <span>Sign In</span>
            <span className="mobile-btn-arrow"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8H13M13 8L8 3M13 8L8 13" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg></span>
          </a>
          <a target="_blank" rel="noopener noreferrer" href="https://learn.taai.live/learn/account/signup" className="btn-nav-signup">
            <span>Sign Up</span>
            <span className="mobile-btn-arrow"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8H13M13 8L8 3M13 8L8 13" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg></span>

      </div>
    </>
  );
}

function BackToTop() {
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const onScroll = () => {
      const past400 = window.scrollY > 400;
      setVisible(past400);
      document.body.classList.toggle('buttons-visible', past400);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => { window.removeEventListener('scroll', onScroll); document.body.classList.remove('buttons-visible'); };
  }, []);
  return (
    <button className={`back-to-top${visible ? ' visible' : ''}`} onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} aria-label="Back to top">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
    </button>
  );
}

function ScrollProgress() {
  React.useEffect(() => {
    const bar = document.getElementById('scroll-progress-bar');
    const update = () => {
      const total = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (total > 0 ? (window.scrollY / total) * 100 : 0) + '%';
    };
    window.addEventListener('scroll', update, { passive: true });
    update();
    return () => window.removeEventListener('scroll', update);
  }, []);
  return <div id="scroll-progress-bar" className="scroll-progress" style={{ width: '0%' }} />;
}

// ── App ───────────────────────────────────────────────────────────
function App() {
  React.useEffect(() => {
    const mobile = window.matchMedia('(max-width: 768px)').matches;
    const io = new IntersectionObserver(entries => {
      const hit = entries.filter(e => e.isIntersecting);
      hit.sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      hit.forEach((e, i) => {
        io.unobserve(e.target);
        const delay = Math.min(i, 5) * (mobile ? 80 : 40);
        if (delay) setTimeout(() => e.target.classList.add('visible'), delay);
        else e.target.classList.add('visible');
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
    document.querySelectorAll('.fade-in').forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <>
      <ScrollProgress />
      <BackToTop />
      <MobileContactBar />
      <Nav />
      <div className="nav-spacer" />
      <Hero />
      <ThisYearGallery />
      <PreviousBatch />
      <VideoCTA />
      <Footer />
    </>
  );
}

function scrollToEl(hash) {
  var el = document.querySelector(hash);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return true; }
  return false;
}
(function tryOnLoad(n) {
  var hash = window.location.hash;
  if (!hash) return;
  if (scrollToEl(hash)) return;
  if (n > 0) setTimeout(function() { tryOnLoad(n - 1); }, 150);
})(8);
document.addEventListener('click', function(e) {
  var a = e.target.closest('a[href]');
  if (!a) return;
  var href = a.getAttribute('href');
  if (!href || href.indexOf('#') === -1) return;
  var hash = href.slice(href.indexOf('#'));
  var pagePart = href.slice(0, href.indexOf('#'));
  var currentPage = window.location.pathname.split('/').pop() || 'index.html';
  if (pagePart && pagePart !== currentPage) return;
  var el = document.querySelector(hash);
  if (!el) return;
  e.preventDefault();
  history.pushState(null, '', hash);
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
