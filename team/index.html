<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17171b">
<link rel="icon" href="/favicon.ico?v=6" sizes="any">
<title>Team Console | TAAI</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  :root {
    --bg: #17171b; --bg-soft: #1b1b20;
    --ink: #F2F2F5; --ink-dim: #B8B8C4; --ink-soft: #79798A;
    --line: rgba(255,255,255,0.09); --card: #1e1e24;
    --purple: #A78BFA; --purple-soft: rgba(139,92,246,0.2);
    --green: #4ade80; --green-soft: rgba(74,222,128,0.14);
    --amber: #fbbf24; --amber-soft: rgba(251,191,36,0.14);
    --red: #f87171; --red-soft: rgba(248,113,113,0.14);
    --radius-md: 14px; --radius-lg: 20px;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--bg-soft); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; padding: 32px 20px 80px; }
  a { color: var(--purple); }

  .wrap { max-width: 900px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  h1 { font-size: 22px; font-weight: 700; }
  .sub { color: var(--ink-soft); font-size: 13px; margin-top: 3px; }

  button { font-family: inherit; cursor: pointer; border: none; }
  .btn { padding: 9px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 600; background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn:hover { border-color: var(--purple); }
  .btn-primary { background: var(--purple); color: #17171b; border: none; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid rgba(248,113,113,0.3); }
  .btn-danger:hover { background: var(--red-soft); }
  .btn-test { background: transparent; color: var(--amber); border: 1px solid rgba(251,191,36,0.35); }
  .btn-test:hover { background: var(--amber-soft); }
  .btn-small { padding: 5px 10px; font-size: 12px; border-radius: 8px; }

  #gate { text-align: center; padding: 80px 20px; color: var(--ink-dim); }

  .tabs { display: flex; gap: 8px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
  .tab-btn { padding: 10px 4px; margin-right: 22px; background: transparent; color: var(--ink-soft); border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 14px; font-weight: 600; }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--purple); border-bottom-color: var(--purple); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }

  .post-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .post-row:last-child { border-bottom: none; }
  .post-main { flex: 1; min-width: 0; }
  .post-title { font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
  .post-meta { color: var(--ink-soft); font-size: 12.5px; margin-top: 3px; }
  /* The raw, literal current Body text (or a sections/blank summary — see
     bodySnippetText) shown right in the list, monospace so placeholder
     syntax like {{name}} reads as code, not prose — the whole point is
     seeing exactly what's configured without opening Edit first. Clamped
     to 2 lines with a native title tooltip carrying the untruncated text
     for anything longer. */
  .post-body-snippet { font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 11.5px; color: var(--ink-dim); margin-top: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .tag-custom { background: var(--purple-soft); color: var(--purple); }
  .tag-builtin { background: var(--amber-soft); color: var(--amber); }
  .tag-disabled { background: var(--red-soft); color: var(--red); }
  .post-actions { display: flex; gap: 6px; flex-shrink: 0; }
  /* Only meaningful within a post's own channel group (posts to
     different channels never interleave from a viewer's perspective) —
     see sortByDispatchOrder/movePost in team.js. Disabled rather than
     hidden at the top/bottom of a group so the column stays aligned
     instead of the row's other content shifting side to side. */
  .post-order-buttons { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .btn-order { width: 22px; height: 18px; padding: 0; border-radius: 4px; border: 1px solid var(--line); background: var(--bg-soft); color: var(--ink-dim); font-size: 10px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
  .btn-order:hover:not(:disabled) { background: var(--purple-soft); border-color: var(--purple); color: var(--purple); }
  .btn-order:disabled { opacity: 0.25; cursor: default; }

  .empty { color: var(--ink-soft); font-size: 13.5px; text-align: center; padding: 30px 0; }
  .post-list-heading { font-size: 13px; font-weight: 700; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 10px; }
  .post-list-heading-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .post-list-heading-row .post-list-heading { margin-bottom: 0; }

  .section-row { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .section-row .field-row { margin-bottom: 12px; }
  .field input[type="color"] { padding: 3px 5px; height: 38px; cursor: pointer; }
  .day-table { width: 100%; border-collapse: collapse; }
  .day-table th { text-align: left; font-size: 11.5px; color: var(--ink-soft); font-weight: 600; padding: 0 6px 6px; }
  .day-table td { padding: 3px; }
  .day-table td:nth-child(1) { width: 90px; }
  .day-table td:nth-child(3) { width: 90px; }
  .day-table td:nth-child(4) { width: 30px; }
  .day-table input { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg-soft); color: var(--ink); font-family: inherit; font-size: 13px; }
  .day-table input:focus { outline: none; border-color: var(--purple); }

  .students-table-wrap { overflow-x: auto; }
  .students-table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
  .students-table th, .students-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  .students-table th { color: var(--ink-dim); font-weight: 600; font-size: 12px; cursor: pointer; user-select: none; }
  .students-table th:hover { color: var(--ink); }
  /* Faint until hovered — signals "this column sorts" at a glance without
     competing with the label text or the active column's real ▲/▼. */
  .sort-hint { opacity: 0.35; font-size: 10px; }
  .students-table th:hover .sort-hint { opacity: 0.8; }
  .students-table tbody tr:last-child td { border-bottom: none; }
  .students-notes-cell { white-space: normal; min-width: 220px; }
  /* Site data's tables reuse .students-table for identical styling, but
     their headers aren't click-to-sort (small, already-ordered datasets —
     see renderSiteDataList) — this class just turns off the inherited
     "this is clickable" cursor/hover so unsortable headers don't look
     like they should be. */
  .sitedata-table th { cursor: default; }
  .sitedata-table th:hover { color: var(--ink-dim); }
  /* Pricing's card-per-course layout (renderPricingGroups/pricingCardHtml
     in team.js) — replaced the old single flat 9-column table (needed
     horizontal scroll, showed "—" for every unset field) with something a
     non-technical admin can scan at a glance: one card per course, grouped
     into "Bundled courses" / "Individual courses" sections, only the
     fields that are actually set are shown at all. Notes/Lectures keep
     the plain .sitedata-table above — fewer columns, no grouping need. */
  .pricing-group { margin-bottom: 24px; }
  .pricing-group:last-child { margin-bottom: 0; }
  .pricing-group-heading { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 14px; color: var(--ink); margin-bottom: 3px; }
  .pricing-group-count { color: var(--ink-soft); font-weight: 500; font-size: 12px; }
  .pricing-group-hint { color: var(--ink-soft); font-size: 12px; margin-bottom: 12px; }
  .pricing-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .pricing-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--bg-soft); display: flex; flex-direction: column; gap: 10px; }
  .pricing-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .pricing-card-name { font-weight: 700; font-size: 14.5px; color: var(--ink); line-height: 1.35; }
  .pricing-card-id { font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 10.5px; color: var(--ink-soft); margin-top: 3px; }
  .pricing-status { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .pricing-status-live { background: var(--green-soft); color: var(--green); }
  .pricing-status-soon { background: var(--amber-soft); color: var(--amber); }
  .pricing-soldout-note { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--red); }
  .pricing-card-price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .pricing-card-price-main { font-size: 21px; font-weight: 800; color: var(--ink); }
  .pricing-card-price-none { font-size: 13px; color: var(--ink-soft); font-style: italic; }
  .pricing-card-price-old { font-size: 12.5px; color: var(--ink-soft); text-decoration: line-through; }
  .pricing-card-discount { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: var(--purple-soft); color: var(--purple); align-self: flex-start; }
  .pricing-card-meta { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-dim); }
  .pricing-card-meta b { color: var(--ink-soft); font-weight: 600; }
  .pricing-card-actions { display: flex; align-items: center; gap: 6px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }
  /* Mouse drag-and-drop reorder (bindPricingCardDrag in team.js) — a
     draggable card gets a visible grip handle (a plain unicode dot-grid
     glyph, no icon asset needed) and a grab cursor; the card being
     physically dragged dims and scales down slightly so it reads as
     "lifted" while every other card stays put until dropped on. */
  .pricing-card--draggable { cursor: grab; position: relative; padding-top: 26px; }
  .pricing-card-drag-handle { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); color: var(--ink-soft); font-size: 13px; line-height: 1; letter-spacing: 1px; user-select: none; }
  .pricing-card--dragging { opacity: 0.45; transform: scale(0.97); cursor: grabbing; }
  .students-notes-cell textarea { width: 100%; min-height: 34px; padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg-soft); color: var(--ink); font-family: inherit; font-size: 12.5px; resize: vertical; margin-bottom: 5px; }
  .students-notes-cell textarea:focus { outline: none; border-color: var(--purple); }
  .students-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .students-summary-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg-soft); }
  .students-summary-card.warn { border-color: var(--amber); background: var(--amber-soft); }
  .students-summary-value { font-size: 19px; font-weight: 700; color: var(--ink); }
  .students-summary-label { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .students-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 6px; }
  .students-filters input[type="text"], .students-filters input[type="number"], .students-filters select { padding: 7px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg-soft); color: var(--ink); font-family: inherit; font-size: 12.5px; }
  .students-filters input[type="text"] { min-width: 200px; }
  .students-filters label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-dim); }
  .inactivity-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .inactivity-fresh { background: var(--green); }
  .inactivity-warm { background: var(--amber); }
  .inactivity-cold { background: var(--red); }
  .inactivity-never { background: var(--ink-soft); }
  .inactivity-legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 2px; }
  .inactivity-legend-item { display: flex; align-items: center; font-size: 11.5px; color: var(--ink-soft); }
  .inactivity-legend-item .inactivity-dot { margin-right: 5px; }

  .channel-group { margin-bottom: 16px; }
  .channel-group:last-child { margin-bottom: 0; }
  .channel-group-heading { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; color: var(--ink-dim); margin-bottom: 4px; padding: 0 2px; }
  .js-rename-start { background: transparent; border: none; color: var(--ink-soft); font-size: 13px; padding: 2px 5px; border-radius: 6px; }
  .js-rename-start:hover { color: var(--purple); background: var(--purple-soft); }
  .rename-input { flex: 1; max-width: 320px; padding: 6px 10px; border-radius: 8px; border: 1.5px solid var(--purple); background: var(--bg-soft); color: var(--ink); font-family: inherit; font-size: 13px; font-weight: 600; }
  .rename-input:focus { outline: none; }
  .channel-group-count { color: var(--ink-soft); font-weight: 500; font-size: 12px; }

  form { display: grid; gap: 22px; }
  .form-section { display: grid; gap: 14px; }
  .form-section-heading { font-weight: 700; color: var(--purple); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px; }
  .field label { display: block; font-size: 12.5px; color: var(--ink-dim); margin-bottom: 5px; font-weight: 600; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--bg-soft); color: var(--ink); font-family: inherit; font-size: 13.5px;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--purple); }
  .field textarea { min-height: 80px; resize: vertical; }
  .field-hint { color: var(--ink-soft); font-size: 11.5px; margin-top: 4px; }
  /* Click-to-insert {{placeholder}} chips above the Body field (see
     placeholderChipsHtml/js-insert-placeholder in team.js) — the actual
     ask this exists for: a non-technical editor shouldn't need to already
     know this curly-brace syntax exists, let alone type it correctly by
     hand, just to make a small wording change. */
  .placeholder-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .placeholder-chips-label { font-size: 11.5px; color: var(--ink-soft); margin-right: 2px; }
  .chip { padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-soft); color: var(--purple); font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 11.5px; }
  .chip:hover { border-color: var(--purple); background: var(--purple-soft); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row input { width: auto; }
  .checkbox-row label { margin: 0; font-size: 13.5px; color: var(--ink); font-weight: 500; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }

  .msg { padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
  .msg-error { background: var(--red-soft); color: var(--red); }
  .msg-ok { background: var(--green-soft); color: var(--green); }

  /* Discord-embed-style preview — approximates the real card look
     (colored left rail, small BOT tag, bold title, wrapped body,
     muted footer) closely enough to judge formatting before it posts,
     not a pixel-perfect Discord clone. */
  .preview-box {
    margin-top: 4px; padding: 12px 14px; border-radius: 6px;
    background: #2b2d31; border-left: 4px solid #8b5cf6;
    font-family: 'gg sans', 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; color: #dbdee1;
  }
  .preview-username { font-weight: 600; color: #f2f3f5; font-size: 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .preview-mention { color: #949ba4; margin-bottom: 6px; }
  .preview-bot-tag { background: #5865f2; color: #fff; font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 3px; letter-spacing: 0.3px; }
  .preview-title { font-weight: 700; color: #00a8fc; margin-bottom: 4px; }
  .preview-description { white-space: pre-wrap; line-height: 1.45; }
  .preview-description a { color: #00a8fc; text-decoration: none; }
  .preview-description a:hover { text-decoration: underline; }
  .preview-footer { margin-top: 8px; color: #949ba4; font-size: 11.5px; }
  /* Telegram's own blue instead of Discord's purple rail/BOT-tag styling
     above, so the two previews read as visibly different platforms, not
     one design pretending to be both. */
  .telegram-preview { border-left-color: #229ED9; background: #17212b; }
  .telegram-preview .preview-username { color: #229ED9; }
  .telegram-preview .preview-description b { color: #f2f3f5; }
  .telegram-preview .preview-description a { color: #6cb2eb; }

  .reference-card { font-size: 13px; }
  .ref-section { margin-bottom: 16px; }
  .ref-section:last-child { margin-bottom: 0; }
  .ref-heading { font-weight: 700; color: var(--purple); font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; }
  .ref-row { color: var(--ink-dim); line-height: 1.6; margin-bottom: 6px; }
  .ref-row:last-child { margin-bottom: 0; }
  .ref-row strong { color: var(--ink); }
  .reference-card code { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 12px; color: var(--purple); font-family: ui-monospace, 'SF Mono', Consolas, monospace; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="/gate-da-subjects.js"></script>
  <script src="/team/team.js"></script>
</body>
</html>
