<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17171b">
<link rel="icon" href="/favicon.ico?v=6" sizes="any">
<title>Team Console | TAAI</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  :root {
    --bg: #17171b; --bg-soft: #1b1b20;
    --ink: #F2F2F5; --ink-dim: #B8B8C4; --ink-soft: #79798A;
    --line: rgba(255,255,255,0.09); --card: #1e1e24;
    --purple: #A78BFA; --purple-soft: rgba(139,92,246,0.2);
    --green: #4ade80; --green-soft: rgba(74,222,128,0.14);
    --amber: #fbbf24; --amber-soft: rgba(251,191,36,0.14);
    --red: #f87171; --red-soft: rgba(248,113,113,0.14);
    --radius-md: 14px; --radius-lg: 20px;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--bg-soft); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; padding: 32px 20px 80px; }
  a { color: var(--purple); }

  .wrap { max-width: 900px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  h1 { font-size: 22px; font-weight: 700; }
  .sub { color: var(--ink-soft); font-size: 13px; margin-top: 3px; }

  button { font-family: inherit; cursor: pointer; border: none; }
  .btn { padding: 9px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 600; background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn:hover { border-color: var(--purple); }
  .btn-primary { background: var(--purple); color: #17171b; border: none; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid rgba(248,113,113,0.3); }
  .btn-danger:hover { background: var(--red-soft); }
  .btn-small { padding: 5px 10px; font-size: 12px; border-radius: 8px; }

  #gate { text-align: center; padding: 80px 20px; color: var(--ink-dim); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }

  .post-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .post-row:last-child { border-bottom: none; }
  .post-main { flex: 1; min-width: 0; }
  .post-title { font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
  .post-meta { color: var(--ink-soft); font-size: 12.5px; margin-top: 3px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .tag-custom { background: var(--purple-soft); color: var(--purple); }
  .tag-builtin { background: var(--amber-soft); color: var(--amber); }
  .tag-disabled { background: var(--red-soft); color: var(--red); }
  .post-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .empty { color: var(--ink-soft); font-size: 13.5px; text-align: center; padding: 30px 0; }

  form { display: grid; gap: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--ink-dim); margin-bottom: 5px; font-weight: 600; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--bg-soft); color: var(--ink); font-family: inherit; font-size: 13.5px;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--purple); }
  .field textarea { min-height: 80px; resize: vertical; }
  .field-hint { color: var(--ink-soft); font-size: 11.5px; margin-top: 4px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row input { width: auto; }
  .checkbox-row label { margin: 0; font-size: 13.5px; color: var(--ink); font-weight: 500; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }

  .msg { padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
  .msg-error { background: var(--red-soft); color: var(--red); }
  .msg-ok { background: var(--green-soft); color: var(--green); }

  /* Discord-embed-style preview — approximates the real card look
     (colored left rail, small BOT tag, bold title, wrapped body,
     muted footer) closely enough to judge formatting before it posts,
     not a pixel-perfect Discord clone. */
  .preview-box {
    margin-top: 4px; padding: 12px 14px; border-radius: 6px;
    background: #2b2d31; border-left: 4px solid #8b5cf6;
    font-family: 'gg sans', 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; color: #dbdee1;
  }
  .preview-username { font-weight: 600; color: #f2f3f5; font-size: 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .preview-mention { color: #949ba4; margin-bottom: 6px; }
  .preview-bot-tag { background: #5865f2; color: #fff; font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 3px; letter-spacing: 0.3px; }
  .preview-title { font-weight: 700; color: #00a8fc; margin-bottom: 4px; }
  .preview-description { white-space: pre-wrap; line-height: 1.45; }
  .preview-description a { color: #00a8fc; text-decoration: none; }
  .preview-description a:hover { text-decoration: underline; }
  .preview-footer { margin-top: 8px; color: #949ba4; font-size: 11.5px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="/team/team.js"></script>
</body>
</html>
