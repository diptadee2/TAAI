[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/learn"
  to = "https://taai.live/"
  status = 301
  force = true

[[redirects]]
  from = "/learn/*"
  to = "https://taai.live/"
  status = 301
  force = true

[[redirects]]
  from = "/courses"
  to = "/courses.html"
  status = 200

[[redirects]]
  from = "/test-series"
  to = "/test-series.html"
  status = 200

[[redirects]]
  from = "/testimonials"
  to = "/testimonials.html"
  status = 200

[[redirects]]
  from = "/resources"
  to = "/resources.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/courses.html"
  to = "/courses"
  status = 301

[[redirects]]
  from = "/test-series.html"
  to = "/test-series"
  status = 301

[[redirects]]
  from = "/testimonials.html"
  to = "/testimonials"
  status = 301

[[redirects]]
  from = "/resources.html"
  to = "/resources"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301

[[redirects]]
