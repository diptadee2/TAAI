[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."sync-schedule"]
  schedule = "30 21 * * *"

# ── Progress tracker (taai.live/progress) ────────────────────────────────
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/progress"
  to = "/progress.html"
  status = 200

[[redirects]]
  from = "/progress.html"
  to = "/progress"
  status = 301

[[redirects]]
  from = "/learn"
  to = "https://taai.live/"
  status = 301
  force = true

[[redirects]]
  from = "/learn/*"
  to = "https://taai.live/"
  status = 301
  force = true

# ── New keyword-rich clean URLs (200 = serve renamed HTML file) ─────────────
[[redirects]]
  from = "/gate-da-courses"
  to = "/gate-da-courses.html"
  status = 200

[[redirects]]
  from = "/gate-da-test-series"
  to = "/gate-da-test-series.html"
  status = 200

[[redirects]]
  from = "/gate-da-toppers"
  to = "/gate-da-toppers.html"
  status = 200

[[redirects]]
  from = "/gate-da-free-notes"
  to = "/gate-da-free-notes.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# ── 301s from old short URLs so existing links/bookmarks don't break ────────
[[redirects]]
  from = "/courses"
  to = "/gate-da-courses"
  status = 301

[[redirects]]
  from = "/test-series"
  to = "/gate-da-test-series"
  status = 301

[[redirects]]
  from = "/testimonials"
  to = "/gate-da-toppers"
  status = 301

[[redirects]]
  from = "/resources"
  to = "/gate-da-free-notes"
  status = 301

# ── 301s from old .html extensions ─────────────────────────────────────────
[[redirects]]
  from = "/courses.html"
  to = "/gate-da-courses"
  status = 301

[[redirects]]
  from = "/test-series.html"
  to = "/gate-da-test-series"
  status = 301

[[redirects]]
  from = "/testimonials.html"
  to = "/gate-da-toppers"
  status = 301

[[redirects]]
  from = "/resources.html"
  to = "/gate-da-free-notes"
  status = 301

[[redirects]]
  from = "/gate-da-courses.html"
  to = "/gate-da-courses"
  status = 301

[[redirects]]
  from = "/gate-da-test-series.html"
  to = "/gate-da-test-series"
  status = 301

[[redirects]]
  from = "/gate-da-toppers.html"
  to = "/gate-da-toppers"
  status = 301

[[redirects]]
  from = "/gate-da-free-notes.html"
  to = "/gate-da-free-notes"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# ── Blog: /blog/* → /blogs/* ────────────────────────────────────────────────
[[redirects]]
  from = "/blog"
  to = "/blogs"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/blogs/:splat"
  status = 301
