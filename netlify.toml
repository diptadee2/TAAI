[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# `netlify dev` serves the SOURCE root (live Babel-in-browser transpile,
# same as the plain `npx serve` workflow), not the compiled dist/ build.
[dev]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Scheduled functions — Netlify's own infrastructure invokes these on the
# cron below automatically, no separate scheduler/dependency needed. Cron
# times are UTC regardless of the function's own logic (same "no
# guaranteed local timezone" reality documented in lib/supabase.js's
# todayIST()).
#
# discord-dispatch.js is the only actual cron entry for Discord posts —
# it runs every 15 minutes and checks the scheduled_posts table (managed
# via /team) for anything due, rather than one cron per post. The 3 posts
# that used to be their own standalone scheduled functions here
# (discord-daily-leader.js, discord-weekly-leaderboard.js,
# discord-monthly-consistency.js — removed, along with their old cron
# entries, once this was verified to reproduce them exactly) are now just
# rows in that table with source = 'daily_leader' / 'weekly_leaderboard' /
# 'monthly_consistency', still on the same 10:00 AM / 10:30 AM Mon /
# 12:00 PM 1st-of-month IST timing they always had.
[functions."discord-dispatch"]
  schedule = "*/15 * * * *"

# Runs once a day at 19:30 UTC (01:00 IST — comfortably after midnight, so
# the previous week has definitely closed) and, if last week's
# pomodoro_stats rows don't have final_rank set yet, computes and stores
# it. Deliberately a daily check rather than a single once-a-week firing
# — self-healing if a run fails, and idempotent either way. See
# weekly-rank-snapshot.js's own comment for why.
[functions."weekly-rank-snapshot"]
  schedule = "30 19 * * *"

# No headers were configured at all before this, so every static asset
# (images, vendor React bundle, favicons) inherited Netlify's default
# `Cache-Control: public, max-age=0, must-revalidate` — the same policy
# meant for HTML, which forces a revalidation round-trip on every single
# load with no local disk cache, even seconds apart. That's expensive for
# a site with a real repeat-visitor base (students reloading the progress
# tracker daily) and was the biggest driver of Web bandwidth credits.
# These files aren't content-hashed, so a real content change needs a
# rename (cache-busting) to take effect immediately for cached visitors —
# acceptable here since none of these change often, and HTML pages
# themselves are deliberately NOT covered by this so they keep
# revalidating on every load as normal.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# ── Progress tracker (taai.live/gate-da-progress-tracker) ────────────────
# Schedule data is provided directly (as PDFs/etc.) and loaded via
# `npm run load-schedule`, not synced automatically from anywhere —
# there is deliberately no cron job or external fetch for this.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/gate-da-progress-tracker"
  to = "/gate-da-progress-tracker.html"
  status = 200

[[redirects]]
  from = "/gate-da-progress-tracker.html"
  to = "/gate-da-progress-tracker"
  status = 301

[[redirects]]
  from = "/progress"
  to = "/gate-da-progress-tracker"
  status = 301

[[redirects]]
  from = "/progress.html"
  to = "/gate-da-progress-tracker"
  status = 301

[[redirects]]
  from = "/learn"
  to = "https://taai.live/"
  status = 301
  force = true

[[redirects]]
  from = "/learn/*"
  to = "https://taai.live/"
  status = 301
  force = true

