[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/learn"
  to = "https://taai.live/"
  status = 301
  force = true

[[redirects]]
  from = "/learn/*"
  to = "https://taai.live/"
  status = 301
  force = true

# ── New keyword-rich clean URLs (200 = serve HTML file at this path) ───────
[[redirects]]
  from = "/gate-da-courses"
  to = "/courses.html"
  status = 200

[[redirects]]
  from = "/gate-da-test-series"
  to = "/test-series.html"
  status = 200

[[redirects]]
  from = "/gate-da-toppers"
  to = "/testimonials.html"
  status = 200

[[redirects]]
  from = "/gate-da-free-notes"
  to = "/resources.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# ── 301s from old short URLs so existing links/bookmarks don't break ────────
[[redirects]]
  from = "/courses"
  to = "/gate-da-courses"
  status = 301

[[redirects]]
  from = "/test-series"
  to = "/gate-da-test-series"
  status = 301

[[redirects]]
  from = "/testimonials"
  to = "/gate-da-toppers"
  status = 301

[[redirects]]
  from = "/resources"
  to = "/gate-da-free-notes"
  status = 301

# ── 301s from .html extensions ──────────────────────────────────────────────
[[redirects]]
  from = "/courses.html"
  to = "/gate-da-courses"
  status = 301

[[redirects]]
  from = "/test-series.html"
  to = "/gate-da-test-series"
  status = 301

[[redirects]]
  from = "/testimonials.html"
  to = "/gate-da-toppers"
  status = 301

[[redirects]]
  from = "/resources.html"
  to = "/gate-da-free-notes"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# ── Blog: /blog/* → /blogs/* ────────────────────────────────────────────────
[[redirects]]
  from = "/blog"
  to = "/blogs"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/blogs/:splat"
  status = 301
