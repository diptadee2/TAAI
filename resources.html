<style>
:root {
  --bg: #FFFFFF; --bg-soft: #FBF9FF; --ink: #14102B; --ink-dim: #4A4270; --ink-soft: #857CAE;
  --line: #ECE6F8; --card: #FFFFFF;
  --pink: #FF7FB7; --pink-soft: #FFD6E8; --purple: #8B5CF6; --purple-soft: #E6DCFF;
  --blue: #4D8BFF; --blue-soft: #D6E4FF; --lilac: #C4B0FF;
  --primary: #6B4BFF; --primary-contrast: #FFFFFF;
  --radius-md: 18px; --radius-lg: 26px; --radius-xl: 36px;
  --shadow-sm: 0 1px 0 rgba(20,16,43,0.04), 0 2px 6px rgba(20,16,43,0.04);
  --shadow-md: 0 2px 0 rgba(20,16,43,0.03), 0 12px 32px rgba(107,75,255,0.08);
  --font-display: 'Poppins', ui-sans-serif, system-ui, sans-serif;
  --font-body: 'Poppins', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'DM Mono', ui-monospace, monospace;
  --font-nav: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --gutter: 32px; --section-pad: 96px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-body); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; font-size: 16px; line-height: 1.5; }
.container { max-width: 1280px; margin: 0 auto; padding: 0 max(var(--gutter),24px); }

/* Nav */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: rgba(255,255,255,0.55); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); overflow: visible; }
.nav-spacer { height: 86px; }
.nav.menu-open { background: rgba(248,246,255,0.82); }
.nav-inner { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 28px; height: 86px; padding: 0 32px 0 20px; overflow: visible; }
.nav-logo { display: flex; align-items: center; text-decoration: none; transition: transform .22s ease-out, opacity .22s ease; }
.nav-logo img { width: 180px; height: auto; }
.nav-logo:hover { transform: translateY(-2px); opacity: 0.82; }
.nav-links { display: flex; gap: 36px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-family: var(--font-nav); position: relative; }
.nav-links a { color: var(--ink-dim); text-decoration: none; transition: color .2s, transform .3s cubic-bezier(.34,1.1,.64,1); position: relative; z-index: 1; cursor: pointer; display: inline-block; white-space: nowrap; }
.nav-links a:hover, .nav-links a.active { color: var(--purple); transform: scale(1.08) translateY(-1px); }
.nav-pill { position: absolute; top: 50%; transform: translateY(-50%); height: 34px; border-radius: 10px; pointer-events: none; z-index: 0; background: linear-gradient(150deg,rgba(255,255,255,0.36) 0%,rgba(180,155,255,0.14) 40%,rgba(139,92,246,0.10) 68%,rgba(255,255,255,0.24) 100%); border: 1px solid rgba(255,255,255,0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 2px 12px rgba(139,92,246,0.10), inset 0 1.5px 0 rgba(255,255,255,0.82); transition: left .3s cubic-bezier(0.34,1.2,0.64,1), width .28s cubic-bezier(0.34,1.15,0.64,1), opacity .2s ease; }
.nav-dropdown-wrap { position: relative; display: flex; align-items: center; z-index: 100; }
.nav-dropdown { position: absolute; top: 100%; left: max(-20px, calc(50% - 105px)); transform: translateY(-8px) scaleY(0.9); transform-origin: top center; min-width: 210px; padding: 10px 6px 6px; background: rgba(248,246,255,0.97); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(139,92,246,0.16); border-radius: 14px; box-shadow: 0 8px 32px rgba(20,16,43,0.12), 0 2px 8px rgba(139,92,246,0.08); opacity: 0; pointer-events: none; transition: opacity .14s ease, transform .26s cubic-bezier(.34,1.56,.64,1); z-index: 150; }
.nav-dropdown::before { content: ''; position: absolute; top: -18px; left: 0; right: 0; height: 18px; }

.nav-dropdown-wrap:hover .nav-dropdown { opacity: 1; transform: translateY(12px) scaleY(1); pointer-events: auto; }
.nav-dd-item::before { content: ''; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--purple); opacity: 0.5; transition: opacity .15s ease, transform .2s cubic-bezier(.34,1.56,.64,1); }
.nav-dd-item:hover::before { opacity: 1; transform: translateY(-50%) scale(1.3); }
.nav-dd-item { display: flex; align-items: center; gap: 0; padding: 9px 12px 9px 26px; border-radius: 9px; text-decoration: none; color: var(--ink-dim); font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; opacity: 0; transform: translateY(5px); transition: background .14s ease, color .14s ease, opacity .13s ease, transform .13s ease; }
.nav-dd-item:hover { background: linear-gradient(90deg, rgba(139,92,246,0.14) 0%, rgba(109,40,217,0.05) 100%); color: var(--purple); }
.nav-dropdown-wrap:hover .nav-dd-item { opacity: 1; transform: translateY(0); transition: background .14s ease, color .14s ease, opacity .22s cubic-bezier(.34,1.56,.64,1), transform .28s cubic-bezier(.34,1.56,.64,1); }
.nav-dd-divider { height: 1px; background: rgba(139,92,246,0.18); margin: 2px 10px; }
.mobile-menu-link-icon { opacity: 0.5; flex-shrink: 0; transition: opacity .18s; display: flex; align-items: center; }
.mobile-menu-link-label { flex: 1; }
.mobile-menu-link-chevron { opacity: 0.22; flex-shrink: 0; display: flex; align-items: center; transition: opacity .18s, transform .2s; }
.mobile-menu-link:hover .mobile-menu-link-chevron, .mobile-menu-link.active .mobile-menu-link-chevron { opacity: 0.65; transform: translateX(3px); }
.mobile-menu-link:hover .mobile-menu-link-icon, .mobile-menu-link.active .mobile-menu-link-icon { opacity: 1; }
.mobile-menu-link.active::before { content: ''; position: absolute; left: 0; top: 22%; bottom: 22%; width: 3px; border-radius: 2px; background: var(--purple); }
.mobile-menu-link { font-family: var(--font-nav); position: relative; }
.nav-cta { display: flex; gap: 10px; align-items: center; }
.btn-nav-signin { display: inline-flex; align-items: center; padding: 12px 28px; border-radius: 999px; font-size: 14px; font-weight: 600; text-decoration: none; background: #FFFFFF; color: var(--ink); border: 1px solid rgba(139,92,246,0.14); box-shadow: 0 3px 10px rgba(139,92,246,0.14), 0 1px 3px rgba(0,0,0,0.04); transition: box-shadow .25s ease, transform .32s cubic-bezier(.34,1.1,.64,1); white-space: nowrap; }
.btn-nav-signin:hover { transform: scale(1.05) translateY(-1px); box-shadow: 0 6px 18px rgba(139,92,246,0.2), 0 2px 5px rgba(0,0,0,0.06); }
.btn-nav-signin:active { transform: scale(0.97); box-shadow: inset 0 2px 6px rgba(139,92,246,0.16); }
.btn-swap { position: relative; overflow: hidden; }
.btn-swap .swap-default, .btn-swap .swap-hover { display: block; transition: transform .32s cubic-bezier(.16,1,.3,1), opacity .24s ease; }
.btn-swap .swap-hover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transform: translateY(100%); opacity: 0; }
.btn-swap:hover .swap-default { transform: translateY(-100%); opacity: 0; }
.btn-swap:hover .swap-hover   { transform: translateY(0);     opacity: 1; }
.btn-nav-signin.btn-swap { justify-content: center; width: 106px; margin-left: 0; position: relative; transition: box-shadow .25s ease, transform .32s cubic-bezier(.34,1.1,.64,1), width .4s ease, margin-left .4s ease, color .4s ease, border-color .4s ease; }
.btn-nav-signin.btn-swap::after { content: ''; position: absolute; inset: 0; border-radius: 999px; background: linear-gradient(135deg, #FF416C 0%, #FF0000 55%, #CC0022 100%); opacity: 0; transition: opacity .4s ease; z-index: 0; pointer-events: none; }
.btn-nav-signin.btn-swap .swap-default { position: relative; z-index: 1; }
.btn-nav-signin.btn-swap .swap-hover { z-index: 1; }
.btn-nav-signin.btn-swap::before { display: none; }
.btn-nav-signin.btn-swap.signin-active { width: 128px; margin-left: -22px; border-color: transparent; color: #fff; box-shadow: 0 8px 28px rgba(255,0,0,0.38), 0 2px 8px rgba(255,65,108,0.22); transition: box-shadow .25s ease, transform .32s cubic-bezier(.34,1.1,.64,1), width .3s cubic-bezier(.34,1.1,.64,1), margin-left .3s cubic-bezier(.34,1.1,.64,1), color .2s ease, border-color .2s ease; }
.btn-nav-signin.btn-swap.signin-active::after { opacity: 1; transition: opacity .2s ease; }
.btn-nav-signup { display: inline-flex; align-items: center; padding: 12px 28px; border-radius: 999px; font-size: 14px; font-weight: 600; text-decoration: none; background: linear-gradient(160deg, #1d1748, var(--ink)); color: #fff; border: none; box-shadow: 6px 6px 16px rgba(20,16,43,0.45), -4px -4px 14px rgba(139,92,246,0.25), inset 0 1px 1px rgba(255,255,255,0.08); transition: box-shadow .25s ease, transform .32s cubic-bezier(.34,1.1,.64,1); white-space: nowrap; }
.btn-nav-signup:hover { transform: scale(1.05) translateY(-1px); box-shadow: 8px 8px 20px rgba(20,16,43,0.5), -5px -5px 16px rgba(139,92,246,0.35), inset 0 1px 1px rgba(255,255,255,0.12); }
.btn-nav-signup:active { transform: scale(0.97); box-shadow: inset 4px 4px 10px rgba(0,0,0,0.5), inset -3px -3px 8px rgba(139,92,246,0.15); }
.btn-nav-contact { font-size: 14px; font-weight: 500; color: var(--ink-dim); text-decoration: none; padding: 10px 20px; border-radius: 8px; background: none; border: none; transition: color .2s, transform .32s cubic-bezier(.34,1.1,.64,1), background .2s; white-space: nowrap; }
.btn-nav-contact:hover { color: var(--purple); background: rgba(139,92,246,0.07); transform: scale(1.06) translateY(-1px); }
.phone-icon { display: inline-flex; align-items: center; margin-right: 5px; transform-origin: 50% 55%; }
.btn-nav-contact:hover .phone-icon { animation: phone-ring 0.52s ease-in-out; }
@keyframes phone-ring { 0%,100%{transform:rotate(0)} 12%{transform:rotate(-22deg)} 28%{transform:rotate(18deg)} 44%{transform:rotate(-12deg)} 60%{transform:rotate(8deg)} 76%{transform:rotate(-4deg)} 90%{transform:rotate(2deg)} }
.nav-hamburger { display: none; flex-direction: column; gap: 5px; align-items: center; justify-content: center; width: 40px; height: 40px; border: none; background: none; cursor: pointer; border-radius: 8px; transition: background .2s; flex-shrink: 0; padding: 0; }
.nav-hamburger span { display: block; width: 22px; height: 2px; border-radius: 2px; background: var(--ink); transition: transform .3s, opacity .2s; }
.nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.menu-overlay { display: none; }
.mobile-menu { position: fixed; top: 86px; left: 0; right: 0; z-index: 49; background: rgba(248,246,255,0.72); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border-bottom: 1px solid rgba(139,92,246,0.15); padding: 8px 12px 20px; display: flex; flex-direction: column; gap: 2px; transform: translateY(-10px); opacity: 0; pointer-events: none; transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .22s ease; box-shadow: 0 8px 40px rgba(20,16,43,0.12); overflow: hidden; }
.mobile-menu::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--purple), rgba(139,92,246,0.15)); pointer-events: none; }
.mobile-menu.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
@keyframes menuItemIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
.mobile-menu-link { font-family: var(--font-nav); display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--ink-dim); text-decoration: none; letter-spacing: .05em; text-transform: uppercase; transition: background .18s, color .18s, transform .12s ease; position: relative; }
.mobile-menu.open .mobile-menu-link { animation: menuItemIn .3s both cubic-bezier(.4,0,.2,1); }
.mobile-menu-link:active { transform: scale(0.97) !important; }
.mobile-menu-link:hover { background: rgba(139,92,246,0.08); color: var(--purple); }
.mobile-menu-link.active { background: rgba(139,92,246,0.1); color: var(--purple); }
.mobile-menu-divider { height: 1px; background: linear-gradient(90deg, rgba(139,92,246,0.25), rgba(139,92,246,0.06), transparent); margin: 8px 4px; }
.mobile-menu.open .mobile-menu-divider { animation: menuItemIn .25s both cubic-bezier(.4,0,.2,1); animation-delay: .22s; }
.mobile-menu.open .mobile-menu-contact { animation: menuItemIn .3s both cubic-bezier(.4,0,.2,1); animation-delay: .40s; }
@keyframes menuBtnIn { from { opacity: 0; transform: translateY(18px) scale(0.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
.mobile-menu.open .mobile-menu-actions .btn-nav-signin { animation: menuBtnIn .42s both cubic-bezier(.34,1.15,.64,1); animation-delay: .26s; }
.mobile-menu.open .mobile-menu-actions .btn-nav-signup { animation: menuBtnIn .42s both cubic-bezier(.34,1.15,.64,1); animation-delay: .34s; }
.mobile-menu-actions { display: flex; flex-direction: row; gap: 10px; padding-top: 4px; }
.mobile-menu-actions .btn-nav-signin { display: flex; justify-content: center; align-items: center; gap: 8px; flex: 1; border-radius: 14px; padding: 15px 14px; font-size: 15px; font-weight: 600; background: rgba(139,92,246,0.07); color: var(--purple); border: 1.5px solid rgba(139,92,246,0.22); transition: background .16s, border-color .16s, transform .16s cubic-bezier(.34,1.4,.64,1), box-shadow .16s; }
.mobile-menu-actions .btn-nav-signin:active { transform: scale(0.93); background: rgba(139,92,246,0.16); border-color: rgba(139,92,246,0.55); box-shadow: 0 0 0 4px rgba(139,92,246,0.13); }
.mobile-menu-actions .btn-nav-signup { display: flex; justify-content: center; align-items: center; gap: 8px; flex: 1; border-radius: 14px; padding: 15px 14px; font-size: 15px; font-weight: 600; background: linear-gradient(135deg, #9333ea, #7c3aed, #6d28d9); color: #fff; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 4px 24px rgba(109,40,217,0.42), inset 0 1px 0 rgba(255,255,255,0.2); transition: transform .16s cubic-bezier(.34,1.4,.64,1), box-shadow .16s, filter .16s; }
.mobile-menu-actions .btn-nav-signup:active { transform: scale(0.93); filter: brightness(1.12); box-shadow: 0 2px 10px rgba(109,40,217,0.3), inset 0 1px 0 rgba(255,255,255,0.2); }
.mobile-btn-arrow { display: flex; align-items: center; transition: transform .18s cubic-bezier(.34,1.4,.64,1); }
.mobile-menu-actions .btn-nav-signin:active .mobile-btn-arrow, .mobile-menu-actions .btn-nav-signup:active .mobile-btn-arrow { transform: translateX(6px); }
.mobile-menu-contact { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 10px; padding: 13px 16px; font-size: 13px; font-weight: 600; color: var(--ink-dim); text-decoration: none; border-radius: 10px; transition: color .18s, background .18s; letter-spacing: .04em; text-transform: uppercase; }
.mobile-menu-contact:hover { color: var(--purple); background: rgba(139,92,246,0.06); }

/* Keyframes */
@keyframes res-in { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
@keyframes res-orb-a { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(14px,-18px) scale(1.08)} }
@keyframes res-orb-b { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-10px,14px) scale(1.06)} }
@keyframes filter-pop { from { opacity: 0; transform: translateY(10px) scale(0.92); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes tab-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes card-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
@keyframes empty-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
@keyframes dash-pulse { 0%,100%{border-color:var(--line)} 50%{border-color:rgba(139,92,246,0.3)} }
@keyframes grad-drift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

/* Hero */
.page-hero { padding: 80px 0 64px; background: var(--bg-soft); background-image: radial-gradient(circle, rgba(139,92,246,0.08) 1.5px, transparent 1.5px); background-size: 28px 28px; border-bottom: none; position: relative; overflow: hidden; }
.page-hero::before { content: ''; position: absolute; top: -120px; right: -80px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle,rgba(139,92,246,0.14) 0%,transparent 68%); pointer-events: none; animation: res-orb-a 10s ease-in-out infinite; }
.page-hero::after { content: ''; position: absolute; bottom: -80px; left: -60px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle,rgba(77,139,255,0.12) 0%,transparent 68%); pointer-events: none; animation: res-orb-b 13s ease-in-out 2s infinite; }
.page-hero-inner { position: relative; z-index: 1; }
.page-eyebrow { font-family: var(--font-mono); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--purple); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; animation: res-in .6s cubic-bezier(.34,1.1,.64,1) .1s both; }
.page-eyebrow::before { content: ''; display: inline-block; width: 20px; height: 2px; background: linear-gradient(90deg,var(--pink),var(--purple)); border-radius: 2px; }
.page-hero h1 { font-family: var(--font-display); font-size: clamp(40px,5vw,72px); font-weight: 600; letter-spacing: -0.01em; line-height: 1; margin-bottom: 18px; animation: res-in .72s cubic-bezier(.34,1.1,.64,1) .22s both; }
.page-hero h1 em { font-style: normal; background: linear-gradient(120deg,var(--pink),var(--purple),var(--blue),var(--purple),var(--pink)); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: grad-drift 8s ease infinite; }
.page-hero-sub { font-size: 18px; color: var(--ink-dim); max-width: 560px; line-height: 1.55; animation: res-in .65s cubic-bezier(.34,1.1,.64,1) .36s both; }

/* Subject filter tabs */
.filter-bar-outer { display: flex; align-items: center; gap: 8px; margin: 48px 0 22px; animation: res-in .6s cubic-bezier(.34,1.1,.64,1) .5s both; }
.filter-arrow { flex-shrink: 0; width: 34px; height: 34px; margin-top: -12px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer; color: var(--ink-dim); box-shadow: var(--shadow-sm); transition: background .2s, color .2s, border-color .2s, transform .28s cubic-bezier(.34,1.2,.64,1), box-shadow .2s, opacity .22s; }
.filter-arrow:hover { background: var(--purple); color: #fff; border-color: var(--purple); transform: scale(1.1); box-shadow: 0 4px 14px rgba(139,92,246,0.35); }
.filter-arrow--hidden { opacity: 0; pointer-events: none; }
.filter-arrow svg { display: block; }
.filter-bar-wrap { flex: 1; min-width: 0; position: relative; overflow-x: auto; -webkit-overflow-scrolling: touch; -ms-overflow-style: none; scrollbar-width: none; }
.filter-bar-wrap::-webkit-scrollbar { display: none; }
.filter-bar-wrap.fade-left  { -webkit-mask-image: linear-gradient(to right, transparent, #000 24px, #000 100%); mask-image: linear-gradient(to right, transparent, #000 24px, #000 100%); }
.filter-bar-wrap.fade-right { -webkit-mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 24px), transparent); }
.filter-bar-wrap.fade-left.fade-right { -webkit-mask-image: linear-gradient(to right, transparent, #000 24px, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, transparent, #000 24px, #000 calc(100% - 24px), transparent); }
.filter-bar { display: flex; gap: 10px; flex-wrap: nowrap; width: max-content; padding: 4px 16px 28px; }
.filter-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 18px 9px 14px; border-radius: 999px;
  font-size: 13px; font-weight: 600; font-family: inherit;
  white-space: nowrap; flex-shrink: 0; cursor: pointer;
  border: 1.5px solid rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.45); color: var(--ink-dim);
  backdrop-filter: blur(10px) saturate(160%); -webkit-backdrop-filter: blur(10px) saturate(160%);
  animation: filter-pop .45s cubic-bezier(.34,1.2,.64,1) calc(var(--i,0) * 45ms + 550ms) both;
  transition: border-color .15s ease, color .15s ease, background .06s, box-shadow .25s cubic-bezier(.4,0,.2,1), transform .25s cubic-bezier(.34,1.4,.64,1);
  position: relative; overflow: hidden;
}
.filter-btn::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; z-index: 0;
  background: var(--subject-accent, linear-gradient(135deg,var(--purple),var(--blue)));
  transform: translateX(-102%); transition: transform .65s cubic-bezier(.4,0,.2,1);
}
.filter-btn:hover {
  border-color: var(--subject-color, var(--purple));
  color: var(--subject-color, var(--purple));
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}
.filter-btn.active {
  border-color: transparent; color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px color-mix(in srgb, var(--subject-color, var(--purple)) 35%, transparent);
}
.filter-btn.active::before { transform: translateX(0); }
.filter-btn-swatch {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--subject-color, var(--purple));
  flex-shrink: 0; position: relative; z-index: 1;
  transition: transform .08s cubic-bezier(.34,1.4,.64,1), box-shadow .06s;
}
.filter-btn:hover .filter-btn-swatch { transform: scale(1.5); }
.filter-btn.active .filter-btn-swatch { background: rgba(255,255,255,0.85); box-shadow: 0 0 0 2px rgba(255,255,255,0.3); transform: scale(1.2); }
.filter-btn-label { position: relative; z-index: 1; }
.filter-btn-count {
  position: relative; z-index: 1;
  background: var(--bg-soft); color: var(--ink-soft);
  border-radius: 999px; padding: 1px 7px;
  font-size: 10px; font-family: var(--font-mono); font-weight: 700; letter-spacing: .04em;
  transition: background .06s, color .06s;
}
.filter-btn.active .filter-btn-count { background: rgba(255,255,255,0.22); color: rgba(255,255,255,0.9); }

/* Subject sections */
.subject-section { margin-bottom: 24px; background: rgba(255,255,255,0.32); border: 1px solid rgba(255,255,255,0.75); border-radius: 24px; padding: 28px 32px; box-shadow: 0 2px 24px rgba(139,92,246,0.1), 0 1px 4px rgba(0,0,0,0.03), inset 0 1px 0 rgba(255,255,255,0.7); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); }
.subject-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; animation: tab-in .38s cubic-bezier(.34,1.1,.64,1) both; }
.subject-icon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #fff; flex-shrink: 0; transition: transform .32s cubic-bezier(.34,1.4,.64,1), box-shadow .28s ease; box-shadow: 0 4px 14px rgba(107,75,255,0.2); animation: icon-pop-in .5s cubic-bezier(.34,1.56,.64,1) .08s both; }
@keyframes icon-pop-in { from { opacity: 0; transform: scale(0.5) rotate(-25deg); } to { opacity: 1; transform: scale(1) rotate(0deg); } }
.subject-header:hover .subject-icon { transform: scale(1.12) rotate(-6deg); box-shadow: 0 8px 24px rgba(107,75,255,0.35); }
.subject-name { font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: -0.025em; }
.subject-count { font-size: 11px; color: var(--ink-soft); font-family: var(--font-mono); letter-spacing: .08em; margin-left: auto; background: rgba(139,92,246,0.07); border: none; padding: 4px 10px; border-radius: 999px; }
.notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.resources-content { position: relative; background: linear-gradient(135deg, #F3EEFF 0%, #FCEEF8 48%, #ECF2FF 100%); overflow: hidden; }
.resources-content::before { content: ''; position: absolute; top: -220px; right: -180px; width: 760px; height: 760px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,0.42) 0%, transparent 62%); pointer-events: none; animation: res-orb-a 12s ease-in-out infinite; }
.resources-content::after { content: ''; position: absolute; bottom: 60px; left: -180px; width: 660px; height: 660px; border-radius: 50%; background: radial-gradient(circle, rgba(77,139,255,0.36) 0%, transparent 62%); pointer-events: none; animation: res-orb-b 15s ease-in-out 2s infinite; }
.resources-content > .container { position: relative; z-index: 1; }
.resources-content-orb3 { position: absolute; top: 45%; left: 50%; transform: translate(-50%,-50%); width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(255,127,183,0.32) 0%, transparent 62%); pointer-events: none; animation: res-orb-a 18s ease-in-out 4s infinite; }

/* Dark strip */
.res-strip { background: #07051a; background-image: radial-gradient(circle,rgba(255,255,255,0.065) 1px,transparent 1px); background-size: 24px 24px; color: #fff; padding: 64px 0; position: relative; overflow: hidden; }
.res-strip::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 40% 80% at 15% 50%,rgba(255,127,183,0.18) 0%,transparent 65%), radial-gradient(ellipse 35% 80% at 50% 50%,rgba(139,92,246,0.15) 0%,transparent 65%), radial-gradient(ellipse 40% 80% at 85% 50%,rgba(77,139,255,0.14) 0%,transparent 65%); pointer-events: none; }
.res-strip-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 0; max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
.res-strip-item { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 40px; position: relative; }
.res-strip-item + .res-strip-item { border-left: 1px solid rgba(255,255,255,0.07); }
.res-strip-item::before { content: ''; display: block; width: 28px; height: 2px; border-radius: 2px; margin-bottom: 20px; }
.res-strip-item:nth-child(1)::before { background: #ec4899; box-shadow: 0 0 10px 2px rgba(236,72,153,0.7); }
.res-strip-item:nth-child(2)::before { background: #8b5cf6; box-shadow: 0 0 10px 2px rgba(139,92,246,0.7); }
.res-strip-item:nth-child(3)::before { background: #38bdf8; box-shadow: 0 0 10px 2px rgba(56,189,248,0.7); }
.res-strip-num { font-family: var(--font-display); font-size: clamp(44px,7vw,72px); font-weight: 600; letter-spacing: -0.01em; line-height: 1; margin-bottom: 12px; -webkit-background-clip: text; background-clip: text; color: transparent; }
.res-strip-item:nth-child(1) .res-strip-num { background-image: linear-gradient(160deg,#fff 25%,#ffc0dc 65%,#ec4899 100%); }
.res-strip-item:nth-child(2) .res-strip-num { background-image: linear-gradient(160deg,#fff 25%,#d8b4fe 65%,#8b5cf6 100%); }
.res-strip-item:nth-child(3) .res-strip-num { background-image: linear-gradient(160deg,#fff 25%,#bae6fd 65%,#38bdf8 100%); }
.res-strip-label { font-size: 11px; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: .13em; line-height: 1.5; }

/* Dark CTA */
.res-cta { padding: var(--section-pad) 0; background: #07051a; position: relative; overflow: hidden; }
.res-cta::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 80% at 50% 50%,rgba(139,92,246,0.14) 0%,transparent 70%); pointer-events: none; }
.res-cta-inner { position: relative; z-index: 1; text-align: center; max-width: 680px; margin: 0 auto; padding: 0 24px; }
.res-cta-eyebrow { font-family: var(--font-mono); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,0.38); margin-bottom: 18px; }
.res-cta h2 { font-family: var(--font-display); font-size: clamp(24px,3.2vw,32px); font-weight: 600; letter-spacing: -0.035em; line-height: 1.2; color: #fff; margin-bottom: 16px; }
.res-cta h2 em { font-style: normal; background: linear-gradient(120deg,var(--pink),var(--lilac),var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.res-cta p { font-size: 16px; color: rgba(255,255,255,0.52); line-height: 1.6; margin-bottom: 36px; }
.res-cta-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn-cta-primary { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; background: linear-gradient(135deg,var(--pink),var(--purple),var(--blue)); color: #fff; box-shadow: 0 8px 28px rgba(139,92,246,0.4); transition: transform .28s cubic-bezier(.34,1.1,.64,1), box-shadow .22s; }
.btn-cta-primary:hover { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(139,92,246,0.55); }
.btn-cta-ghost { display: inline-flex; align-items: center; gap: 8px; padding: 13px 26px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; background: transparent; color: rgba(255,255,255,0.7); border: 1.5px solid rgba(255,255,255,0.2); transition: color .22s, border-color .22s, background .22s, transform .28s cubic-bezier(.34,1.1,.64,1); }
.btn-cta-ghost:hover { color: #fff; border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.07); transform: translateY(-3px); }
@media (max-width: 768px) {
  .res-strip-grid { grid-template-columns: 1fr; gap: 32px; max-width: 280px; }
  .res-strip-item + .res-strip-item { border-left: none; border-top: 1px solid rgba(255,255,255,0.07); padding-top: 32px; }
  .res-strip-item { padding: 0; }
  .res-strip-num { font-size: clamp(40px,10vw,60px); }
  .res-cta-btns { flex-direction: column; align-items: center; }
  .btn-cta-primary, .btn-cta-ghost { width: 100%; justify-content: center; }
}

/* Cards — shared base */
.note-card, .lecture-card { position: relative; background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.7); border-radius: 20px; padding: 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.6); backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); animation: card-in .42s cubic-bezier(.34,1.1,.64,1) calc(var(--i,0) * 55ms + 100ms) both; transition: transform .32s cubic-bezier(.34,1.1,.64,1), box-shadow .32s ease, border-color .24s, background .24s; }
.note-card:hover, .lecture-card:hover { transform: translateY(-9px) scale(1.01); background: rgba(255,255,255,0.65); box-shadow: 0 24px 52px rgba(0,0,0,0.07), 0 6px 20px color-mix(in srgb, var(--note-color, #8B5CF6) 22%, transparent), inset 0 1px 0 rgba(255,255,255,0.8); border-color: color-mix(in srgb, var(--note-color, #8B5CF6) 40%, transparent); }
/* Glass shine sweep on hover */
.note-card::after, .lecture-card::after {
  content: ''; position: absolute; top: -60%; left: -30%; width: 35%; height: 220%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
  transform: skewX(-18deg) translateX(-40px);
  opacity: 0; pointer-events: none; z-index: 5;
}
.note-card:hover::after, .lecture-card:hover::after {
  opacity: 1; transform: skewX(-18deg) translateX(620px);
  transition: transform .9s ease, opacity .9s ease;
}

/* Card banner */
.card-banner { padding: 16px 20px; background: var(--note-accent, linear-gradient(135deg,var(--purple),var(--blue))); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; position: relative; overflow: hidden; }
.card-banner::before { content: ''; position: absolute; bottom: -28px; right: -28px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.10); pointer-events: none; }
.card-banner::after { content: ''; position: absolute; top: -60%; left: -25%; width: 48%; height: 220%; background: linear-gradient(90deg,transparent,rgba(255,255,255,0.13),transparent); transform: skewX(-16deg); transition: left .65s ease; pointer-events: none; }
.note-card:hover .card-banner::after, .lecture-card:hover .card-banner::after { left: 135%; }
.card-banner-label { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,0.8); position: relative; z-index: 1; display: flex; flex-direction: column; gap: 4px; }
.card-banner-sublabel { font-size: 8.5px; color: rgba(255,255,255,0.48); font-weight: 600; letter-spacing: .09em; }
.card-banner-icon { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.22); display: grid; place-items: center; color: #fff; position: relative; z-index: 1; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.14); transition: background .28s, transform .32s cubic-bezier(.34,1.4,.64,1); }
.note-card:hover .card-banner-icon, .lecture-card:hover .card-banner-icon { background: rgba(255,255,255,0.32); transform: scale(1.12); }

/* Card body */
.card-body { padding: 15px 20px 18px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
.card-title { font-weight: 700; font-size: 14.5px; color: var(--ink); line-height: 1.35; }
.note-desc { font-size: 14.5px; color: var(--ink-soft); line-height: 1.6; flex: 1; }
.card-date { font-size: 11px; color: var(--ink-soft); text-align: right; }
.card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 2px; flex-wrap: nowrap; }

/* Action buttons */
.btn-download { display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: auto; padding: 9px 16px; border-radius: 9px; font-size: 12.5px; font-weight: 600; text-decoration: none; background: var(--purple-soft); color: var(--purple); border: 1.5px solid rgba(139,92,246,0.2); transition: background .22s, transform .28s cubic-bezier(.34,1.2,.64,1), box-shadow .22s, color .22s; }
.btn-download:hover { background: var(--purple); color: #fff; transform: translateY(-2px); box-shadow: 0 6px 18px rgba(139,92,246,0.38); }
.btn-download svg { flex-shrink: 0; transition: transform .28s cubic-bezier(.34,1.4,.64,1); }
.btn-download:hover svg { transform: translateY(3px); }
.btn-watch {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 999px;
  font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap;
  background: rgba(220,38,38,0.08); color: #dc2626;
  border: 1.5px solid rgba(220,38,38,0.22);
  transition: background .22s, color .22s, border-color .22s, transform .28s cubic-bezier(.34,1.2,.64,1), box-shadow .22s;
}
.btn-watch:hover {
  background: #dc2626; color: #fff; border-color: #dc2626;
  transform: translateY(-2px); box-shadow: 0 5px 16px rgba(220,38,38,0.32);
}
.btn-watch svg { flex-shrink: 0; transition: transform .28s cubic-bezier(.34,1.4,.64,1); }
.btn-watch:hover svg { transform: scale(1.2); }
.btn-slides { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 9px 13px; border-radius: 9px; font-size: 12.5px; font-weight: 600; text-decoration: none; background: var(--bg-soft); color: var(--ink-dim); border: 1.5px solid var(--line); white-space: nowrap; transition: background .22s, color .22s, border-color .22s, transform .28s; }
.btn-slides:hover { background: var(--purple-soft); color: var(--purple); border-color: rgba(139,92,246,0.25); transform: translateY(-2px); }
.btn-slides svg { flex-shrink: 0; transition: transform .28s cubic-bezier(.34,1.4,.64,1); }
.btn-slides:hover svg { transform: translateY(3px); }

/* Lecture card — video thumbnail style */
.lecture-card .card-banner {
  background: #0d0b1e;
  min-height: 88px;
  padding: 0;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
/* Dark tint + subject colour glow layered over the thumbnail */
.lecture-card .card-banner::before {
  background:
    linear-gradient(to bottom, rgba(6,4,18,0.72) 0%, rgba(6,4,18,0.55) 45%, rgba(6,4,18,0.80) 100%),
    radial-gradient(ellipse at 50% 110%, color-mix(in srgb, var(--note-color, #8B5CF6) 35%, transparent) 0%, transparent 65%);
  inset: 0; width: auto; height: auto; border-radius: 0; bottom: auto; right: auto;
  z-index: 1;
}
.lecture-card .card-banner::after { background: linear-gradient(105deg,transparent 30%,rgba(255,255,255,0.11) 50%,transparent 70%); transform: skewX(-12deg); }
.lecture-thumb-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; opacity: 0.45; filter: saturate(0.5) brightness(0.65); transition: opacity .38s ease, filter .38s ease, transform .42s cubic-bezier(.34,1.1,.64,1); transform-origin: center; }
.lecture-card:hover .lecture-thumb-bg { opacity: 0.78; filter: saturate(1.1) brightness(0.82); transform: scale(1.07); }
/* YouTube thumbnail image */

.lecture-thumb-meta {
  position: absolute; bottom: 10px; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; z-index: 1;
}
.lecture-thumb-num { display: none; }
.lecture-card-num {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft);
}
.lecture-slides-pill {
  font-family: var(--font-mono); font-size: 8.5px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.12);
  padding: 3px 8px; border-radius: 999px;
}
.lecture-card:hover { box-shadow: 0 24px 52px rgba(0,0,0,0.08), 0 6px 20px rgba(229,45,39,0.16); border-color: rgba(229,45,39,0.28); }

/* Subsection labels (Notes / Lectures within a subject) */
.subsection-header { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-soft); margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
.subsection-header::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--purple-soft); border: 1.5px solid var(--purple); flex-shrink: 0; }
.subsection-header::after { display: none; }
.notes-grid--spaced { margin-bottom: 56px; }

/* Empty state */
.notes-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px 24px; background: rgba(255,255,255,0.4); backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); border: 1.5px dashed rgba(139,92,246,0.25); border-radius: var(--radius-lg); text-align: center; gap: 12px; animation: tab-in .38s cubic-bezier(.34,1.1,.64,1) both, dash-pulse 3.5s ease-in-out 1s infinite; }
.notes-empty-icon { width: 56px; height: 56px; border-radius: 16px; background: var(--purple-soft); display: grid; place-items: center; color: var(--purple); animation: empty-float 3s ease-in-out infinite; box-shadow: 0 8px 24px rgba(139,92,246,0.18); }
.notes-empty-text { font-size: 14px; color: var(--ink-soft); }
.notes-empty-label { font-weight: 600; font-size: 16px; color: var(--ink-dim); }

/* Fade-in scroll */
.fade-in { opacity: 0; transform: translateY(24px); transition: opacity .7s cubic-bezier(.4,0,.2,1), transform .7s cubic-bezier(.34,1.1,.64,1); transition-delay: var(--delay, 0ms); }
.fade-in.visible { opacity: 1; transform: translateY(0); }

/* Subject content — color slab slide transition on filter switch */
.subject-content { position: relative; overflow: hidden; transition: height .4s cubic-bezier(.4,0,.2,1); }
.subject-swipe {
  position: absolute; inset: 0; z-index: 20; pointer-events: none;
  border-radius: 28px; opacity: 0.96; overflow: hidden;
  backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.6);
  box-shadow: 0 16px 60px color-mix(in srgb, var(--slab-color, #8B5CF6) 38%, transparent), 0 12px 48px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.75), inset 0 0 60px rgba(255,255,255,0.12);
  transform: translateX(-110%);
  will-change: transform;
}
.subject-swipe::after {
  content: ''; position: absolute; top: -10%; bottom: -10%; right: 0; width: 10px;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.95));
  filter: blur(3px);
}
.subject-swipe.phase-cover  { transform: translateX(0%);   transition: transform .5s cubic-bezier(.22,.61,.36,1); }
.subject-swipe.phase-reveal { transform: translateX(110%); transition: transform .55s cubic-bezier(.22,.61,.36,1); }

/* Dot-grid pattern layer that drifts slower than the slab for a parallax feel */
.subject-swipe-pattern {
  position: absolute; inset: -25% -60%; z-index: 0; pointer-events: none;
  background-image: radial-gradient(circle, rgba(255,255,255,0.9) 2.5px, transparent 2.6px);
  background-size: 38px 38px;
  opacity: 0.45;
  mix-blend-mode: overlay;
  transform: translateX(85%);
}
.subject-swipe.phase-cover  .subject-swipe-pattern { transform: translateX(0%);   transition: transform .5s cubic-bezier(.22,.61,.36,1); }
.subject-swipe.phase-reveal .subject-swipe-pattern { transform: translateX(-85%); transition: transform .55s cubic-bezier(.22,.61,.36,1); }

.subject-swipe-label {
  position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;

/* Floating contact buttons */

.mobile-contact-bar { display: flex; flex-direction: column; position: fixed; right: 24px; bottom: 88px; z-index: 200; gap: 12px; animation: mcb-side-in .48s cubic-bezier(.34,1.1,.64,1) .5s both; }

.mobile-contact-bar a::after { content: attr(data-label); position: absolute; right: calc(100% + 12px); top: 50%; transform: translateY(-50%) translateX(6px); background: rgba(18,14,40,0.82); backdrop-filter: blur(8px); color: #fff; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .16s ease, transform .18s cubic-bezier(.34,1.1,.64,1); }
.mobile-contact-bar a:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }
.mobile-contact-bar a:hover { transform: scale(1.12); }
.mcb-wa   { background: #25D366; color: #fff !important; box-shadow: 0 4px 16px rgba(37,211,102,0.45); opacity: 0; transform: translateX(80px); pointer-events: none; }
.mcb-call { background: linear-gradient(135deg,#f97316,#dc2626); color: #fff !important; box-shadow: 0 4px 16px rgba(220,38,38,0.38); opacity: 0; transform: translateX(80px); pointer-events: none; }
body.buttons-visible .mcb-call { opacity: 1; transform: translateX(0); pointer-events: auto; }
body.buttons-visible .mcb-wa  { opacity: 1; transform: translateX(0); pointer-events: auto; transition-delay: 25ms; }
body.buttons-visible .mcb-call:hover, body.buttons-visible .mcb-wa:hover { transform: scale(1.12); transition-delay: 0ms; }
@media (max-width: 768px) { .mobile-contact-bar { display: none; } .back-to-top { bottom: 24px; width: 44px; height: 44px; right: 16px; } }

@media (max-width: 1024px) {
  .nav-hamburger { display: flex; }

  .mobile-enroll-btn { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; text-decoration: none; background: linear-gradient(135deg,var(--pink),var(--purple)); color: #fff; box-shadow: 0 4px 14px rgba(139,92,246,0.4); white-space: nowrap; }
  .back-to-top { bottom: 80px; width: 40px; height: 40px; right: 14px; }

  /* Footer */

  .btn-cta-ghost:active { transform: scale(0.96); }
}

/* Skeleton loader */
@keyframes shimmer { 0% { background-position: -900px 0; } 100% { background-position: 900px 0; } }
.shimmer {

.skel-bar { display: flex; gap: 10px; margin: 48px 0 40px; overflow: hidden; }
.skel-pill { height: 38px; border-radius: 999px; flex-shrink: 0; }

/* Reduce motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.15s !important; }
  .page-hero::before, .page-hero::after { animation: none; }

}

<body>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">

// ── Nav data ──────────────────────────────────────────────────────
const COURSE_DROPDOWN = [
  { label: 'Bundled Courses',    href: '/courses#combos' },
  { label: 'Individual Courses', href: '/courses#individual', dividerBefore: true },
  { label: 'Interview Prep',     href: '/courses#interview',  dividerBefore: true },
];
const TESTIMONIALS_DROPDOWN = [
  { label: 'Batch of 2026', href: '/testimonials#batch-2026' },
  { label: 'Batch of 2025', href: '/testimonials#batch-2025', dividerBefore: true },
];
const NAV_LINKS = [
  { label: 'Courses',          href: '/courses',      dropdown: COURSE_DROPDOWN },
  { label: 'Test Series 2027', href: '/test-series' },
  { label: 'Testimonials',     href: '/testimonials', dropdown: TESTIMONIALS_DROPDOWN },
  { label: 'Resources',        href: '/resources',    active: true },
];

// ── Data sources ─────────────────────────────────────────────────
// For each sheet: File → Share → Publish to web → Sheet tab → CSV → Copy link
const NOTES_CSV_URL    = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVYXQcKli0NtjXf93cxRwx3A15WiNcETEw26MubPYIihLyMQs2rfZjXKm85fNsOxxlUWkoyR89DKCK/pub?gid=850997370&single=true&output=csv';
const LECTURES_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVYXQcKli0NtjXf93cxRwx3A15WiNcETEw26MubPYIihLyMQs2rfZjXKm85fNsOxxlUWkoyR89DKCK/pub?gid=725480532&single=true&output=csv';

// ── Icons ─────────────────────────────────────────────────────────
const DownloadIcon = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
    <path d="M12 3v13M7 11l5 5 5-5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    <path d="M5 21h14" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
  </svg>
);

const PlayIcon = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
    <path d="M8 5v14l11-7z"/>
  </svg>
);

const FileIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
    <path d="M14 2H6C5.4 2 5 2.4 5 3V21C5 21.6 5.4 22 6 22H18C18.6 22 19 21.6 19 21V7L14 2Z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/>
    <path d="M14 2V7H19" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/>
    <path d="M9 13H15M9 17H13" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
  </svg>
);

// ── Nav ───────────────────────────────────────────────────────────
function TAAILogo() { return <img src="logo.webp" alt="TAAI" />; }

function daysUntilFeb1() {
  const now = new Date();
  const year = now.getFullYear();
  const feb1 = new Date(year, 1, 1); feb1.setHours(0, 0, 0, 0);
  const mar1 = new Date(year, 2, 1); mar1.setHours(0, 0, 0, 0);
  if (now < feb1) return Math.max(1, Math.ceil((feb1 - now) / (1000 * 60 * 60 * 24)));
  if (now < mar1) return null; // dead zone: Feb 1 - Mar 1, no countdown
  const nextFeb1 = new Date(year + 1, 1, 1); nextFeb1.setHours(0, 0, 0, 0);
  return Math.max(1, Math.ceil((nextFeb1 - now) / (1000 * 60 * 60 * 24)));
}

const MENU_ICONS = {
  '/':        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M3 12L12 4L21 12V20C21 20.6 20.6 21 20 21H15V16H9V21H4C3.4 21 3 20.6 3 20V12Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /></svg>,
  '/courses':      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 5C4 4 4.5 3 6 3H11V20H6C4.5 20 4 19 4 18V5Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /><path d="M20 5C20 4 19.5 3 18 3H13V20H18C19.5 20 20 19 20 18V5Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /></svg>,
  '/test-series':  <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" strokeWidth="1.7" /><circle cx="12" cy="12" r="4" stroke="currentColor" strokeWidth="1.7" /><circle cx="12" cy="12" r="1.5" fill="currentColor" /></svg>,
  '/testimonials': <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="9" r="3" stroke="currentColor" strokeWidth="1.7" /><circle cx="16" cy="9" r="3" stroke="currentColor" strokeWidth="1.7" /><path d="M3 19C3 16 5 14 8 14C11 14 13 16 13 19" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /><path d="M13 19C13 16 15 14 18 14C19 14 20 14.3 21 15" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /></svg>,
  '/resources':    <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M14 2H6C5.4 2 5 2.4 5 3V21C5 21.6 5.4 22 6 22H18C18.6 22 19 21.6 19 21V7L14 2Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /><path d="M14 2V7H19" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /><path d="M9 13H15M9 17H13" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /></svg>,
};

function Nav() {
  const daysLeft = daysUntilFeb1();
  const linksRef = React.useRef(null);
  const [pill, setPill] = React.useState({ left: 0, width: 0, visible: false });
  const resetTimer = React.useRef(null);
  const moveTo = React.useCallback((el) => {
    if (resetTimer.current) { clearTimeout(resetTimer.current); resetTimer.current = null; }
    if (!el) return;
    setPill({ left: el.offsetLeft - 10, width: el.offsetWidth + 20, visible: true });
  }, []);
  const reset = React.useCallback(() => {
    resetTimer.current = setTimeout(() => {
      const active = linksRef.current && linksRef.current.querySelector('a.active');
      if (active) moveTo(active.closest('.nav-dropdown-wrap') || active);
      else setPill(p => ({ ...p, visible: false }));
    }, 60);
  }, [moveTo]);
  React.useEffect(() => { reset(); }, [reset]);
  const [menuOpen, setMenuOpen] = React.useState(false);
  React.useEffect(() => {
    if (!menuOpen) return;
    const close = e => { if (!e.target.closest('.nav') && !e.target.closest('.mobile-menu')) setMenuOpen(false); };
    document.addEventListener('pointerdown', close);
    return () => document.removeEventListener('pointerdown', close);
  }, [menuOpen]);

  const [signinPhase, setSigninPhase] = React.useState(0); // 0=Sign In, 1=X days, 2=GATE
  const signinTimerRef = React.useRef(null);
  React.useEffect(() => () => clearInterval(signinTimerRef.current), []);
  const startSigninCycle = (e) => {
    const btn = e.currentTarget;
    const linksEl = linksRef.current;
    const available = linksEl ? btn.getBoundingClientRect().left - linksEl.getBoundingClientRect().right : Infinity;
    if (available < 36) return; // not enough room to grow safely - skip the whole cycle
    const phases = [0, 1, 2];
    let i = 1;
    setSigninPhase(phases[i]);
    clearInterval(signinTimerRef.current);
    signinTimerRef.current = setInterval(() => {
      i++;
      if (i >= phases.length) {
        setSigninPhase(phases[0]);
        clearInterval(signinTimerRef.current);
        signinTimerRef.current = null;
        return;
      }
      setSigninPhase(phases[i]);
    }, 550);
  };
  const stopSigninCycle = () => {
    clearInterval(signinTimerRef.current);
    signinTimerRef.current = null;
    setSigninPhase(0);
  };

  return (
    <>
      <div className={`menu-overlay${menuOpen ? ' open' : ''}`} onClick={() => setMenuOpen(false)} />
      <nav className={`nav${menuOpen ? ' menu-open' : ''}`}>
        <div className="nav-inner" onMouseLeave={reset}>
          <a href="/" className="nav-logo"><TAAILogo /></a>
          <div className="nav-links" ref={linksRef}>
            <div className="nav-pill" style={{ left: pill.left, width: pill.width, opacity: pill.visible ? 1 : 0 }} />
            {NAV_LINKS.map((l) => l.dropdown ? (
              <div key={l.href} className="nav-dropdown-wrap" onMouseEnter={(e) => moveTo(e.currentTarget)}>
                <a href={l.href} className={l.active ? 'active' : ''}>{l.label}</a>
                <div className="nav-dropdown">
                  {l.dropdown.map((d, i) => (
                    <React.Fragment key={i}>
                      {d.dividerBefore && <div className="nav-dd-divider" />}
                      <a href={d.href} className="nav-dd-item">{d.label}</a>
                    </React.Fragment>
                  ))}
                </div>
              </div>
            ) : (
              <a key={l.href} href={l.href} className={l.active ? 'active' : ''} onMouseEnter={(e) => moveTo(e.currentTarget)}>{l.label}</a>
            ))}
          </div>
          <div className="nav-cta">
            {daysLeft !== null ? (
              <a target="_blank" rel="noopener noreferrer" href="https://learn.taai.live/learn/account/signin" className={`btn-nav-signin btn-swap${signinPhase !== 0 ? " signin-active" : ""}`}
                 onMouseEnter={startSigninCycle} onMouseLeave={stopSigninCycle}>
                <span className="swap-default" style={{ transform: signinPhase === 0 ? 'none' : 'translateY(-100%)', opacity: signinPhase === 0 ? 1 : 0, transition: signinPhase === 0 ? 'transform .4s ease, opacity .4s ease' : 'transform .32s cubic-bezier(.16,1,.3,1), opacity .24s ease' }}>Sign In</span>

// ── Filter Bar ────────────────────────────────────────────────────
function smoothScrollBy(el, delta, duration = 480) {
  const start = el.scrollLeft;
  const startTime = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 3); // easeOutCubic
  const step = now => {
    const t = Math.min(1, (now - startTime) / duration);
    el.scrollLeft = start + delta * ease(t);
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function FilterBar({ subjects, active, setActive }) {
  const wrapRef = React.useRef(null);
  const [fades, setFades] = React.useState({ left: false, right: false });

  const updateFades = React.useCallback(() => {
    const el = wrapRef.current;
    if (!el) return;
    setFades({ left: el.scrollLeft > 4, right: el.scrollLeft < el.scrollWidth - el.clientWidth - 4 });
  }, []);

  React.useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    updateFades();
    el.addEventListener('scroll', updateFades, { passive: true });
    window.addEventListener('resize', updateFades);
    return () => { el.removeEventListener('scroll', updateFades); window.removeEventListener('resize', updateFades); };
  }, [updateFades, subjects.length]);

  React.useEffect(() => {
    const wrap = wrapRef.current;
    if (!wrap) return;
    const btn = wrap.querySelector('.filter-btn.active');
    if (!btn) return;
    const wrapRect = wrap.getBoundingClientRect();
    const btnRect  = btn.getBoundingClientRect();
    const offset   = btnRect.left - wrapRect.left - wrapRect.width / 2 + btnRect.width / 2;
    smoothScrollBy(wrap, offset);
  }, [active]);

  const scroll = dir => { const el = wrapRef.current; if (el) smoothScrollBy(el, dir * 220, 380); };

  return (
    <div className="filter-bar-outer">
      <button className={`filter-arrow${fades.left ? '' : ' filter-arrow--hidden'}`} onClick={() => scroll(-1)} aria-label="Scroll left" tabIndex={fades.left ? 0 : -1}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div className={`filter-bar-wrap${fades.left ? ' fade-left' : ''}${fades.right ? ' fade-right' : ''}`} ref={wrapRef}>
        <div className="filter-bar">
          {subjects.map((s, i) => (
            <button key={s.id}
              className={`filter-btn${active === s.id ? ' active' : ''}`}
              onClick={() => setActive(s.id)}
              style={{ '--i': i, '--subject-color': s.color, '--subject-accent': s.accent }}>
              <span className="filter-btn-swatch" />
              <span className="filter-btn-label">{s.name}</span>
            </button>
          ))}
        </div>
      </div>
      <button className={`filter-arrow${fades.right ? '' : ' filter-arrow--hidden'}`} onClick={() => scroll(1)} aria-label="Scroll right" tabIndex={fades.right ? 0 : -1}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────
function App() {
  const [subjects, setSubjects] = React.useState([]);
  const [active, setActive]     = React.useState('');
  const [displayActive, setDisplayActive] = React.useState('');
  const [swipePhase, setSwipePhase] = React.useState('idle');
  const [swipeKey, setSwipeKey] = React.useState(0);
  const [heightLock, setHeightLock] = React.useState(null);
  const [loading, setLoading]   = React.useState(true);
  const contentRef = React.useRef(null);
  const newHRef = React.useRef(null);

  React.useEffect(() => {
    const parseCSV = text => {
      const parseLine = line => {
        const out = []; let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
          else if (ch === ',' && !inQ) { out.push(cur.trim()); cur = ''; }
          else cur += ch;
        }
        out.push(cur.trim()); return out;
      };
      const rows = text.trim().split('\n');
      const headers = parseLine(rows[0]);
      return rows.slice(1).filter(r => r.trim()).map(r => Object.fromEntries(headers.map((h, i) => [h, parseLine(r)[i] || ''])));
    };
    const fetchCSV = url => url ? fetch(url).then(r => r.text()).then(parseCSV).catch(() => []) : Promise.resolve([]);

    Promise.all([
      fetch('notes-data.json').then(r => r.json()),
      fetchCSV(NOTES_CSV_URL),
      fetchCSV(LECTURES_CSV_URL),
    ]).then(([meta, notesRows, lectureRows]) => {
      const groupBy = (rows, key) => rows.reduce((m, r) => { (m[r[key]] = m[r[key]] || []).push(r); return m; }, {});
      const notesMap    = groupBy(notesRows, 'subject');
      const lecturesMap = groupBy(lectureRows, 'subject');
      Object.values(notesMap).forEach(a => a.sort((a, b) => new Date(b.postedOn) - new Date(a.postedOn)));
      Object.values(lecturesMap).forEach(a => a.sort((a, b) => (Number(a.lectureNumber) || 0) - (Number(b.lectureNumber) || 0)));
      const subjects = meta.subjects.map(s => ({ ...s, notes: notesMap[s.id] || [], lectures: lecturesMap[s.id] || [] }));
      setSubjects(subjects);
      setActive(subjects[0]?.id || '');
      setDisplayActive(subjects[0]?.id || '');
      setLoading(false);
    }).catch(() => { setLoading(false); });
  }, []);

  // Color slab slide transition when the active filter changes — only one
  // transition runs at a time (extra clicks while sliding are ignored).
  // The content area stays at the old subject's height while the slab
  // slides, then smoothly animates (slides) to the new subject's height
  // once the slab is gone — so the page below eases into place instead
  // of jumping or moving in lockstep with the slab.
  const selectSubject = id => {
    if (id === active || swipePhase !== 'idle') return;
    if (contentRef.current) setHeightLock(contentRef.current.getBoundingClientRect().height);
    setActive(id);
    setSwipePhase('cover');
  };

  // Measure the new subject's natural height without disturbing layout
  React.useLayoutEffect(() => {
    if (swipePhase !== 'reveal' || !contentRef.current) return;
    const el = contentRef.current;
    const locked = el.style.height;
    el.style.height = 'auto';
    newHRef.current = el.getBoundingClientRect().height;
    el.style.height = locked;
  }, [displayActive]);

  const handleSwipeTransitionEnd = e => {
    if (e.propertyName !== 'transform') return;
    if (swipePhase === 'cover') {
      setDisplayActive(active);
      setSwipePhase('reveal');
    } else if (swipePhase === 'reveal') {
      setSwipePhase('idle');
      setSwipeKey(k => k + 1);
      const newH = newHRef.current;
      if (newH != null && newH !== heightLock) setHeightLock(newH);
      else setHeightLock(null);
    }
  };

  const handleContentTransitionEnd = e => {
    if (e.propertyName === 'height' && swipePhase === 'idle') setHeightLock(null);
  };

  const filtered = subjects.filter(s => s.id === displayActive);
  const SUBJECTS = subjects;

  // Scroll progress
  React.useEffect(() => {
    const bar = document.querySelector('.scroll-progress');
    if (!bar) return;
    const update = () => { const p = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight); bar.style.width = (p * 100) + '%'; };
    window.addEventListener('scroll', update, { passive: true });
    return () => window.removeEventListener('scroll', update);
  }, []);

  // Fade-in observer
  React.useEffect(() => {
    const els = document.querySelectorAll('.fade-in');
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
    }, { threshold: 0.1 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, [displayActive]);

  return (
    <>
      <div className="scroll-progress" />
      <BackToTop />
      <MobileContactBar />
      <MobileEnrollBar />
      <Nav />
      <div className="nav-spacer" />

      {/* Hero */}
      <section className="page-hero">
        <div className="container page-hero-inner">
          <div className="page-eyebrow">Free for all GATE DA aspirants</div>
          <h1>Notes and <em>Lectures.</em></h1>
          <p className="page-hero-sub">
            Subject-wise notes and video lectures for every GATE DA topic. Free to access.
          </p>
        </div>
      </section>

{/* Main content */}
      <section className="resources-content" style={{ padding: '64px 0 96px' }}>
        <div className="resources-content-orb3" />
        <div className="container">

          {/* Skeleton while fetching */}
          {loading && <SkeletonLoading />}

          {/* Filter bar — shown only when subjects exist */}
          {!loading && SUBJECTS.length > 0 && <FilterBar subjects={SUBJECTS} active={active} setActive={selectSubject} />}

          {/* Subject sections — color slab slides across on filter switch */}
          {!loading && <div
            className="subject-content"
            ref={contentRef}
            style={heightLock != null ? { height: heightLock } : undefined}
            onTransitionEnd={handleContentTransitionEnd}
          >
          {(() => {
            const slabSubject = subjects.find(s => s.id === active) || subjects.find(s => s.id === displayActive);
            return (
              <div
                key={swipeKey}
                className={`subject-swipe phase-${swipePhase}`}
                style={{
                  '--slab-color': slabSubject?.color,
                  background: `linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.08) 45%, rgba(255,255,255,0.25) 100%), ${slabSubject?.accent}`,
                }}
                onTransitionEnd={handleSwipeTransitionEnd}
              >
                <div className="subject-swipe-pattern" />
                <div className="subject-swipe-label">
                  <div className="subject-swipe-logo"><img src="logo.webp" alt="TAAI" /></div>
                </div>
              </div>
            );
          })()}
          {filtered.length === 0 ? (
            <div className="notes-empty">
              <div className="notes-empty-icon"><FileIcon /></div>
              <div className="notes-empty-label">Content coming soon</div>
              <div className="notes-empty-text">{SUBJECTS.find(s => s.id === displayActive)?.name} notes and lectures are being prepared.</div>
            </div>
          ) : (
            filtered.map(subject => {
              const hasNotes    = subject.notes.length > 0;
              const hasLectures = subject.lectures.length > 0;
              const showLabels  = hasNotes && hasLectures;
              if (!hasNotes && !hasLectures) {
                return (
                  <div key={subject.id} className="notes-empty">
                    <div className="notes-empty-icon"><FileIcon /></div>
                    <div className="notes-empty-label">Content coming soon</div>
                    <div className="notes-empty-text">{subject.name} notes and lectures are being prepared.</div>
                  </div>
                );
              }
              return (
                <div key={subject.id} className="subject-section">
                  <div className="subject-header">
                    <div className="subject-icon" style={{ background: subject.accent }}><FileIcon /></div>
                    <div className="subject-name" style={{ backgroundImage: subject.accent, WebkitBackgroundClip: 'text', backgroundClip: 'text', color: 'transparent' }}>{subject.name}</div>
                    <div className="subject-count">
                      {hasNotes && `${subject.notes.length} ${subject.notes.length !== 1 ? 'notes' : 'note'}`}
                      {hasNotes && hasLectures && ' · '}
                      {hasLectures && `${subject.lectures.length} ${subject.lectures.length !== 1 ? 'lectures' : 'lecture'}`}
                    </div>
                  </div>
                  {hasNotes && (
                    <>
                      {showLabels && <div className="subsection-header">Notes</div>}

                        ))}
                      </div>
                    </>
                  )}
                </div>
              );
            })
          )}
