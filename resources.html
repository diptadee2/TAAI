<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAAI · Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFFFFF; --bg-soft: #FBF9FF; --ink: #14102B; --ink-dim: #4A4270; --ink-soft: #857CAE;
  --line: #ECE6F8; --card: #FFFFFF;
  --pink: #FF7FB7; --pink-soft: #FFD6E8; --purple: #8B5CF6; --purple-soft: #E6DCFF;
  --blue: #4D8BFF; --blue-soft: #D6E4FF; --lilac: #C4B0FF;
  --primary: #6B4BFF; --primary-contrast: #FFFFFF;
  --radius-md: 18px; --radius-lg: 26px; --radius-xl: 36px;
  --shadow-sm: 0 1px 0 rgba(20,16,43,0.04), 0 2px 6px rgba(20,16,43,0.04);
  --shadow-md: 0 2px 0 rgba(20,16,43,0.03), 0 12px 32px rgba(107,75,255,0.08);
  --font-display: 'Fraunces', ui-serif, serif;
  --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace;
  --gutter: 32px; --section-pad: 96px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-body); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; font-size: 16px; line-height: 1.5; }
.container { max-width: 1280px; margin: 0 auto; padding: 0 max(var(--gutter),24px); }

/* Nav */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: rgba(255,255,255,0.55); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); overflow: visible; }
.nav-spacer { height: 86px; }
.nav.menu-open { background: rgba(248,246,255,0.82); }
.nav-inner { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; height: 86px; padding: 0 32px 0 20px; overflow: visible; }
.nav-logo { display: flex; align-items: center; text-decoration: none; transition: transform .22s ease-out, opacity .22s ease; }
.nav-logo img { width: 180px; height: auto; }
.nav-logo:hover { transform: translateY(-2px); opacity: 0.82; }
.nav-links { display: flex; gap: 36px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; position: relative; }
.nav-links a { color: var(--ink-dim); text-decoration: none; transition: color .2s, transform .3s cubic-bezier(.34,1.1,.64,1); position: relative; z-index: 1; cursor: pointer; display: inline-block; }
.nav-links a:hover, .nav-links a.active { color: var(--purple); transform: scale(1.08) translateY(-1px); }
.nav-pill { position: absolute; top: 50%; transform: translateY(-50%); height: 34px; border-radius: 10px; pointer-events: none; z-index: 0; background: linear-gradient(150deg,rgba(255,255,255,0.36) 0%,rgba(180,155,255,0.14) 40%,rgba(139,92,246,0.10) 68%,rgba(255,255,255,0.24) 100%); border: 1px solid rgba(255,255,255,0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 2px 12px rgba(139,92,246,0.10), inset 0 1.5px 0 rgba(255,255,255,0.82); transition: left .3s cubic-bezier(0.34,1.2,0.64,1), width .28s cubic-bezier(0.34,1.15,0.64,1), opacity .2s ease; }
.nav-dropdown-wrap { position: relative; display: flex; align-items: center; z-index: 100; }
.nav-dropdown { position: absolute; top: 100%; left: max(-20px, calc(50% - 105px)); transform: translateY(-8px) scaleY(0.9); transform-origin: top center; min-width: 210px; padding: 10px 6px 6px; background: rgba(248,246,255,0.97); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(139,92,246,0.16); border-radius: 14px; box-shadow: 0 8px 32px rgba(20,16,43,0.12); opacity: 0; pointer-events: none; transition: opacity .14s ease, transform .26s cubic-bezier(.34,1.56,.64,1); z-index: 150; }
.nav-dropdown::before { content: ''; position: absolute; top: -18px; left: 0; right: 0; height: 18px; }
.nav-dropdown-wrap:hover .nav-dropdown { opacity: 1; transform: translateY(12px) scaleY(1); pointer-events: auto; }
.nav-dd-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; text-decoration: none; color: var(--ink-dim); font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; opacity: 0; transform: translateY(5px); transition: background .14s ease, color .14s ease, opacity .13s ease, transform .13s ease; }
.nav-dd-item:hover { background: rgba(139,92,246,0.08); color: var(--purple); }
.nav-dropdown-wrap:hover .nav-dd-item { opacity: 1; transform: translateY(0); transition: background .14s ease, color .14s ease, opacity .22s cubic-bezier(.34,1.56,.64,1), transform .28s cubic-bezier(.34,1.56,.64,1); }
.nav-dd-divider { height: 1px; background: rgba(139,92,246,0.22); margin: 2px 10px; }
.mobile-menu-link-icon { opacity: 0.5; flex-shrink: 0; transition: opacity .18s; display: flex; align-items: center; }
.mobile-menu-link-label { flex: 1; }
.mobile-menu-link-chevron { opacity: 0.22; flex-shrink: 0; display: flex; align-items: center; }
.mobile-menu-link:hover .mobile-menu-link-icon, .mobile-menu-link.active .mobile-menu-link-icon { opacity: 1; }
.mobile-menu-link.active::before { content: ''; position: absolute; left: 0; top: 22%; bottom: 22%; width: 3px; border-radius: 2px; background: var(--purple); }
.mobile-menu-link { position: relative; }
.nav-cta { display: flex; gap: 10px; align-items: center; }
.btn-nav-signin { display: inline-flex; align-items: center; padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; background: rgba(139,92,246,0.07); color: var(--ink); border: 1px solid rgba(139,92,246,0.22); transition: background .2s, transform .32s cubic-bezier(.34,1.1,.64,1); white-space: nowrap; }
.btn-nav-signin:hover { background: rgba(139,92,246,0.13); transform: scale(1.06) translateY(-1px); }
.btn-nav-signup { display: inline-flex; align-items: center; padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; background: linear-gradient(160deg,rgba(147,105,255,0.92),rgba(107,75,255,0.88)); color: #fff; border: 1px solid rgba(255,255,255,0.22); transition: transform .32s cubic-bezier(.34,1.1,.64,1), box-shadow .2s; white-space: nowrap; }
.btn-nav-signup:hover { transform: scale(1.06) translateY(-1px); box-shadow: 0 8px 24px rgba(107,75,255,0.45); }
.btn-nav-contact { font-size: 14px; font-weight: 500; color: var(--ink-dim); text-decoration: none; padding: 10px 20px; border-radius: 8px; background: none; border: none; transition: color .2s, transform .32s cubic-bezier(.34,1.1,.64,1), background .2s; white-space: nowrap; }
.btn-nav-contact:hover { color: var(--purple); background: rgba(139,92,246,0.07); transform: scale(1.06) translateY(-1px); }
.phone-icon { display: inline-flex; align-items: center; margin-right: 5px; transform-origin: 50% 55%; }
.btn-nav-contact:hover .phone-icon { animation: phone-ring 0.52s ease-in-out; }
@keyframes phone-ring { 0%,100%{transform:rotate(0)} 12%{transform:rotate(-22deg)} 28%{transform:rotate(18deg)} 44%{transform:rotate(-12deg)} 60%{transform:rotate(8deg)} 76%{transform:rotate(-4deg)} 90%{transform:rotate(2deg)} }
.nav-hamburger { display: none; flex-direction: column; gap: 5px; align-items: center; justify-content: center; width: 40px; height: 40px; border: none; background: none; cursor: pointer; border-radius: 8px; transition: background .2s; flex-shrink: 0; padding: 0; }
.nav-hamburger span { display: block; width: 22px; height: 2px; border-radius: 2px; background: var(--ink); transition: transform .3s, opacity .2s; }
.nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.menu-overlay { display: none; }
.mobile-menu { position: fixed; top: 86px; left: 0; right: 0; z-index: 49; background: rgba(248,246,255,0.72); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border-bottom: 1px solid rgba(139,92,246,0.15); padding: 8px 12px 20px; display: flex; flex-direction: column; gap: 2px; transform: translateY(-10px); opacity: 0; pointer-events: none; transition: transform .3s, opacity .22s; box-shadow: 0 8px 40px rgba(20,16,43,0.12); }
.mobile-menu.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
.mobile-menu-link { display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--ink-dim); text-decoration: none; letter-spacing: .05em; text-transform: uppercase; transition: background .18s, color .18s; }
.mobile-menu-link:hover, .mobile-menu-link.active { background: rgba(139,92,246,0.08); color: var(--purple); }
.mobile-menu-divider { height: 1px; background: linear-gradient(90deg,rgba(139,92,246,0.25),rgba(139,92,246,0.06),transparent); margin: 8px 4px; }
.mobile-menu-actions { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.mobile-menu-actions .btn-nav-signin { display: flex; justify-content: space-between; width: 100%; border-radius: 14px; padding: 15px 20px; font-size: 15px; color: var(--purple); }
.mobile-menu-actions .btn-nav-signup { display: flex; justify-content: space-between; width: 100%; border-radius: 14px; padding: 15px 20px; font-size: 15px; background: linear-gradient(135deg,#9333ea,#6d28d9); box-shadow: 0 4px 24px rgba(109,40,217,0.42); }
.mobile-menu-contact { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 16px; font-size: 13px; font-weight: 600; color: var(--ink-dim); text-decoration: none; border-radius: 10px; transition: color .18s, background .18s; letter-spacing: .04em; text-transform: uppercase; }

/* Keyframes */
@keyframes res-in { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
@keyframes res-orb-a { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(14px,-18px) scale(1.08)} }
@keyframes res-orb-b { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-10px,14px) scale(1.06)} }
@keyframes filter-pop { from { opacity: 0; transform: translateY(10px) scale(0.92); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes tab-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes card-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
@keyframes empty-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
@keyframes dash-pulse { 0%,100%{border-color:var(--line)} 50%{border-color:rgba(139,92,246,0.3)} }
@keyframes grad-drift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

/* Hero */
.page-hero { padding: 80px 0 64px; background: var(--bg-soft); background-image: radial-gradient(circle, rgba(139,92,246,0.08) 1.5px, transparent 1.5px); background-size: 28px 28px; border-bottom: 1px solid var(--line); position: relative; overflow: hidden; }
.page-hero::before { content: ''; position: absolute; top: -120px; right: -80px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle,rgba(139,92,246,0.14) 0%,transparent 68%); pointer-events: none; animation: res-orb-a 10s ease-in-out infinite; }
.page-hero::after { content: ''; position: absolute; bottom: -80px; left: -60px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle,rgba(77,139,255,0.12) 0%,transparent 68%); pointer-events: none; animation: res-orb-b 13s ease-in-out 2s infinite; }
.page-hero-inner { position: relative; z-index: 1; }
.page-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--purple); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; animation: res-in .6s cubic-bezier(.34,1.1,.64,1) .1s both; }
.page-eyebrow::before { content: ''; display: inline-block; width: 20px; height: 2px; background: linear-gradient(90deg,var(--pink),var(--purple)); border-radius: 2px; }
.page-hero h1 { font-family: var(--font-display); font-size: clamp(40px,5vw,72px); font-weight: 600; letter-spacing: -0.04em; line-height: 1; margin-bottom: 18px; animation: res-in .72s cubic-bezier(.34,1.1,.64,1) .22s both; }
.page-hero h1 em { font-style: normal; background: linear-gradient(120deg,var(--pink),var(--purple),var(--blue),var(--purple),var(--pink)); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: grad-drift 8s ease infinite; }
.page-hero-sub { font-size: 18px; color: var(--ink-dim); max-width: 560px; line-height: 1.55; animation: res-in .65s cubic-bezier(.34,1.1,.64,1) .36s both; }

/* Subject filter tabs */
.filter-bar-wrap { margin: 48px 0 40px; position: relative; overflow-x: auto; -webkit-overflow-scrolling: touch; -ms-overflow-style: none; scrollbar-width: none; animation: res-in .6s cubic-bezier(.34,1.1,.64,1) .5s both; }
.filter-bar-wrap::-webkit-scrollbar { display: none; }
.filter-bar-wrap::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 60px; background: linear-gradient(to right, transparent, var(--bg)); pointer-events: none; }
.filter-bar { display: flex; gap: 10px; flex-wrap: nowrap; width: max-content; padding: 4px 2px 8px; }
.filter-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 18px 9px 14px; border-radius: 999px;
  font-size: 13px; font-weight: 600; font-family: inherit;
  white-space: nowrap; flex-shrink: 0; cursor: pointer;
  border: 1.5px solid var(--line);
  background: #fff;
  color: var(--ink-dim);
  animation: filter-pop .45s cubic-bezier(.34,1.2,.64,1) calc(var(--i,0) * 45ms + 550ms) both;
  transition: border-color .24s, color .24s, background .24s, box-shadow .28s, transform .3s cubic-bezier(.34,1.2,.64,1);
  position: relative; overflow: hidden;
}
.filter-btn::before {
  content: '';
  position: absolute; inset: 0; border-radius: inherit;
  background: var(--subject-accent, linear-gradient(135deg,var(--purple),var(--blue)));
  opacity: 0;
  transition: opacity .28s ease;
}
.filter-btn:hover {
  border-color: var(--subject-color, var(--purple));
  color: var(--subject-color, var(--purple));
  background: #fff;
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
}
.filter-btn.active {
  border-color: transparent;
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(0,0,0,0.18);
}
.filter-btn.active::before { opacity: 1; }
.filter-btn-swatch {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--subject-color, var(--purple));
  flex-shrink: 0;
  transition: transform .28s cubic-bezier(.34,1.4,.64,1), box-shadow .24s;
  position: relative; z-index: 1;
  box-shadow: 0 0 0 0 var(--subject-color, var(--purple));
}
.filter-btn:hover .filter-btn-swatch { transform: scale(1.5); box-shadow: 0 0 0 3px rgba(0,0,0,0.08); }
.filter-btn.active .filter-btn-swatch { background: rgba(255,255,255,0.8); box-shadow: 0 0 0 2px rgba(255,255,255,0.3); transform: scale(1.2); }
.filter-btn-label { position: relative; z-index: 1; }
.filter-btn-count {
  position: relative; z-index: 1;
  background: var(--bg-soft); color: var(--ink-soft);
  border-radius: 999px; padding: 1px 7px;
  font-size: 10px; font-family: var(--font-mono); font-weight: 700; letter-spacing: .04em;
  transition: background .24s, color .24s;
}
.filter-btn.active .filter-btn-count { background: rgba(255,255,255,0.22); color: rgba(255,255,255,0.9); }

/* Subject sections */
.subject-section { margin-bottom: 56px; }
.subject-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line); animation: tab-in .38s cubic-bezier(.34,1.1,.64,1) both; }
.subject-icon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #fff; flex-shrink: 0; transition: transform .32s cubic-bezier(.34,1.4,.64,1), box-shadow .28s ease; box-shadow: 0 4px 14px rgba(107,75,255,0.2); }
.subject-header:hover .subject-icon { transform: scale(1.12) rotate(-6deg); box-shadow: 0 8px 24px rgba(107,75,255,0.35); }
.subject-name { font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: -0.025em; }
.subject-count { font-size: 11px; color: var(--ink-soft); font-family: var(--font-mono); letter-spacing: .08em; margin-left: auto; background: var(--bg-soft); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; }
.notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

/* Dark strip */
.res-strip { background: #07051a; background-image: radial-gradient(circle,rgba(255,255,255,0.065) 1px,transparent 1px); background-size: 24px 24px; color: #fff; padding: 64px 0; position: relative; overflow: hidden; }
.res-strip::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 40% 80% at 15% 50%,rgba(255,127,183,0.18) 0%,transparent 65%), radial-gradient(ellipse 35% 80% at 50% 50%,rgba(139,92,246,0.15) 0%,transparent 65%), radial-gradient(ellipse 40% 80% at 85% 50%,rgba(77,139,255,0.14) 0%,transparent 65%); pointer-events: none; }
.res-strip-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 0; max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
.res-strip-item { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 40px; position: relative; }
.res-strip-item + .res-strip-item { border-left: 1px solid rgba(255,255,255,0.07); }
.res-strip-item::before { content: ''; display: block; width: 28px; height: 2px; border-radius: 2px; margin-bottom: 20px; }
.res-strip-item:nth-child(1)::before { background: #ec4899; box-shadow: 0 0 10px 2px rgba(236,72,153,0.7); }
.res-strip-item:nth-child(2)::before { background: #8b5cf6; box-shadow: 0 0 10px 2px rgba(139,92,246,0.7); }
.res-strip-item:nth-child(3)::before { background: #38bdf8; box-shadow: 0 0 10px 2px rgba(56,189,248,0.7); }
.res-strip-num { font-family: var(--font-display); font-size: clamp(44px,7vw,72px); font-weight: 600; letter-spacing: -0.05em; line-height: 1; margin-bottom: 12px; -webkit-background-clip: text; background-clip: text; color: transparent; }
.res-strip-item:nth-child(1) .res-strip-num { background-image: linear-gradient(160deg,#fff 25%,#ffc0dc 65%,#ec4899 100%); }
.res-strip-item:nth-child(2) .res-strip-num { background-image: linear-gradient(160deg,#fff 25%,#d8b4fe 65%,#8b5cf6 100%); }
.res-strip-item:nth-child(3) .res-strip-num { background-image: linear-gradient(160deg,#fff 25%,#bae6fd 65%,#38bdf8 100%); }
.res-strip-label { font-size: 11px; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: .13em; line-height: 1.5; }

/* Dark CTA */
.res-cta { padding: var(--section-pad) 0; background: #07051a; position: relative; overflow: hidden; }
.res-cta::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 80% at 50% 50%,rgba(139,92,246,0.14) 0%,transparent 70%); pointer-events: none; }
.res-cta-inner { position: relative; z-index: 1; text-align: center; max-width: 640px; margin: 0 auto; padding: 0 24px; }
.res-cta-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,0.38); margin-bottom: 18px; }
.res-cta h2 { font-family: var(--font-display); font-size: clamp(32px,4vw,54px); font-weight: 600; letter-spacing: -0.035em; line-height: 1.05; color: #fff; margin-bottom: 16px; }
.res-cta h2 em { font-style: normal; background: linear-gradient(120deg,var(--pink),var(--lilac),var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.res-cta p { font-size: 16px; color: rgba(255,255,255,0.52); line-height: 1.6; margin-bottom: 36px; }
.res-cta-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn-cta-primary { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; background: linear-gradient(135deg,var(--pink),var(--purple),var(--blue)); color: #fff; box-shadow: 0 8px 28px rgba(139,92,246,0.4); transition: transform .28s cubic-bezier(.34,1.1,.64,1), box-shadow .22s; }
.btn-cta-primary:hover { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(139,92,246,0.55); }
.btn-cta-ghost { display: inline-flex; align-items: center; gap: 8px; padding: 13px 26px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; background: transparent; color: rgba(255,255,255,0.7); border: 1.5px solid rgba(255,255,255,0.2); transition: color .22s, border-color .22s, background .22s, transform .28s cubic-bezier(.34,1.1,.64,1); }
.btn-cta-ghost:hover { color: #fff; border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.07); transform: translateY(-3px); }
@media (max-width: 768px) {
  .res-strip-grid { grid-template-columns: 1fr; gap: 32px; max-width: 280px; }
  .res-strip-item + .res-strip-item { border-left: none; border-top: 1px solid rgba(255,255,255,0.07); padding-top: 32px; }
  .res-strip-item { padding: 0; }
  .res-strip-num { font-size: clamp(40px,10vw,60px); }
  .res-cta-btns { flex-direction: column; align-items: center; }
  .btn-cta-primary, .btn-cta-ghost { width: 100%; justify-content: center; }
}

/* Note card */
.note-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; animation: card-in .42s cubic-bezier(.34,1.1,.64,1) calc(var(--i,0) * 55ms + 100ms) both; transition: transform .28s cubic-bezier(.34,1.1,.64,1), box-shadow .28s ease, border-color .22s; }
.note-card:hover { transform: translateY(-6px) scale(1.01); box-shadow: 0 16px 44px rgba(107,75,255,0.14), 0 4px 12px rgba(0,0,0,0.06); border-color: rgba(139,92,246,0.28); }
.note-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--note-accent, linear-gradient(90deg,var(--pink),var(--purple))); }
.note-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(139,92,246,0.03) 0%, transparent 60%); opacity: 0; transition: opacity .28s ease; border-radius: inherit; pointer-events: none; }
.note-card:hover::after { opacity: 1; }
.note-title { font-weight: 600; font-size: 15px; color: var(--ink); line-height: 1.3; }
.note-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.5; flex: 1; }
.note-meta { display: flex; align-items: center; gap: 8px; }
.note-type { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); background: var(--bg-soft); border: 1px solid var(--line); padding: 3px 8px; border-radius: 4px; }
.note-date { font-size: 11px; color: var(--ink-soft); margin-left: auto; }
.note-download { display: inline-flex; align-items: center; gap: 6px; margin-top: auto; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; background: var(--purple-soft); color: var(--purple); border: 1.5px solid rgba(139,92,246,0.2); transition: background .22s, transform .28s cubic-bezier(.34,1.2,.64,1), box-shadow .22s, color .22s; }
.note-download:hover { background: var(--purple); color: #fff; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(139,92,246,0.35); }
.note-download svg { flex-shrink: 0; transition: transform .28s cubic-bezier(.34,1.4,.64,1); }
.note-download:hover svg { transform: translateY(3px); }

/* Lecture card */
.lecture-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; animation: card-in .42s cubic-bezier(.34,1.1,.64,1) calc(var(--i,0) * 55ms + 100ms) both; transition: transform .28s cubic-bezier(.34,1.1,.64,1), box-shadow .28s ease, border-color .22s; }
.lecture-card:hover { transform: translateY(-6px) scale(1.01); box-shadow: 0 16px 44px rgba(220,38,38,0.1), 0 4px 12px rgba(0,0,0,0.06); border-color: rgba(220,38,38,0.22); }
.lecture-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--note-accent, linear-gradient(90deg,var(--pink),var(--purple))); }
.lecture-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(220,38,38,0.03) 0%, transparent 60%); opacity: 0; transition: opacity .28s ease; border-radius: inherit; pointer-events: none; }
.lecture-card:hover::after { opacity: 1; }
.lecture-num { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.lecture-title { font-weight: 600; font-size: 15px; color: var(--ink); line-height: 1.3; flex: 1; }
.lecture-actions { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
.lecture-watch { display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: 1; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; background: #fee2e2; color: #dc2626; border: 1.5px solid rgba(220,38,38,0.2); transition: background .22s, transform .28s cubic-bezier(.34,1.2,.64,1), box-shadow .22s, color .22s; }
.lecture-watch:hover { background: #dc2626; color: #fff; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(220,38,38,0.35); }
.lecture-watch svg { flex-shrink: 0; }
/* Subsection labels (Notes / Lectures within a subject) */
.subsection-header { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
.subsection-header::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.notes-grid--spaced { margin-bottom: 32px; }

/* Empty state */
.notes-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px 24px; background: var(--bg-soft); border: 1.5px dashed var(--line); border-radius: var(--radius-lg); text-align: center; gap: 12px; animation: tab-in .38s cubic-bezier(.34,1.1,.64,1) both, dash-pulse 3.5s ease-in-out 1s infinite; }
.notes-empty-icon { width: 56px; height: 56px; border-radius: 16px; background: var(--purple-soft); display: grid; place-items: center; color: var(--purple); animation: empty-float 3s ease-in-out infinite; box-shadow: 0 8px 24px rgba(139,92,246,0.18); }
.notes-empty-text { font-size: 14px; color: var(--ink-soft); }
.notes-empty-label { font-weight: 600; font-size: 16px; color: var(--ink-dim); }

/* Fade-in scroll */
.fade-in { opacity: 0; transform: translateY(24px); transition: opacity .7s cubic-bezier(.4,0,.2,1), transform .7s cubic-bezier(.34,1.1,.64,1); transition-delay: var(--delay, 0ms); }
.fade-in.visible { opacity: 1; transform: translateY(0); }

/* Footer */
.footer { padding: 40px 0; border-top: 1px solid var(--line); }
.footer-inner { display: flex; flex-direction: row; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
.footer-copy { font-size: 12px; color: var(--ink-soft); }
.footer-email { font-size: 12px; color: var(--ink-dim); text-decoration: none; transition: color .2s; }
.footer-email:hover { color: var(--purple); }
.footer-socials { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.footer-socials a { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-soft); color: var(--ink-dim); border: 1px solid var(--line); text-decoration: none; transition: background .28s, color .28s, transform .28s cubic-bezier(.34,1.15,.64,1), border-color .28s; }
.footer-socials a:hover { background: var(--purple); color: #fff; border-color: var(--purple); transform: translateY(-3px); }
.footer-socials a svg { display: block; width: 17px; height: 17px; }

/* Scroll progress */
.scroll-progress { position: fixed; top: 0; left: 0; z-index: 100; height: 3px; background: linear-gradient(90deg,var(--pink),var(--purple)); pointer-events: none; transition: width 120ms linear; }
/* Back to top */
.back-to-top { position: fixed; bottom: 24px; right: 24px; z-index: 90; width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg,#0d9488,#0891b2); color: #fff; border: none; cursor: pointer; display: grid; place-items: center; box-shadow: 0 4px 16px rgba(8,145,178,0.45); opacity: 0; transform: translateY(12px) scale(0.88); transition: opacity .28s ease, transform .4s cubic-bezier(.34,1.56,.64,1), box-shadow .2s; pointer-events: none; }
.back-to-top.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; transition-delay: 180ms; }
.back-to-top:hover { box-shadow: 0 6px 28px rgba(8,145,178,0.6); transform: translateY(-2px) scale(1.06); transition-delay: 0ms; }
.back-to-top:active { transform: scale(0.93); }
/* Floating contact buttons */
@keyframes mcb-side-in { from{transform:translateX(130%) scale(0.8);opacity:0} to{transform:translateX(0) scale(1);opacity:1} }
.mobile-contact-bar { display: flex; flex-direction: column; position: fixed; right: 24px; bottom: 88px; z-index: 200; gap: 12px; animation: mcb-side-in .48s cubic-bezier(.34,1.1,.64,1) .5s both; }
.mobile-contact-bar a { position: relative; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; text-decoration: none; transition: transform .38s cubic-bezier(.34,1.56,.64,1), box-shadow .22s; }
.mobile-contact-bar a::after { content: attr(data-label); position: absolute; right: calc(100% + 12px); top: 50%; transform: translateY(-50%) translateX(6px); background: rgba(18,14,40,0.82); backdrop-filter: blur(8px); color: #fff; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .16s ease, transform .18s cubic-bezier(.34,1.1,.64,1); }
.mobile-contact-bar a:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }
.mobile-contact-bar a:hover { transform: scale(1.12); }
.mcb-wa   { background: #25D366; color: #fff !important; box-shadow: 0 4px 16px rgba(37,211,102,0.45); opacity: 0; transform: translateX(80px); pointer-events: none; }
.mcb-call { background: linear-gradient(135deg,#f97316,#dc2626); color: #fff !important; box-shadow: 0 4px 16px rgba(220,38,38,0.38); opacity: 0; transform: translateX(80px); pointer-events: none; }
body.buttons-visible .mcb-call { opacity: 1; transform: translateX(0); pointer-events: auto; }
body.buttons-visible .mcb-wa  { opacity: 1; transform: translateX(0); pointer-events: auto; transition-delay: 25ms; }
body.buttons-visible .mcb-call:hover, body.buttons-visible .mcb-wa:hover { transform: scale(1.12); transition-delay: 0ms; }
@media (max-width: 768px) { .mobile-contact-bar { display: none; } .back-to-top { bottom: 24px; width: 44px; height: 44px; right: 16px; } }

@media (max-width: 1024px) {
  .nav-hamburger { display: flex; }
  .nav-cta, .nav-links, .btn-nav-contact { display: none; }
  .nav-inner { height: 64px; padding: 0 14px; justify-content: flex-end; }
  .nav-logo { position: absolute; left: 50%; transform: translateX(-50%); }
  .nav-logo img { width: 150px; }
  .nav-spacer { height: 64px; }
  .mobile-menu { top: 64px; }
  .menu-overlay { display: block; position: fixed; inset: 0; z-index: 48; background: rgba(14,10,35,0.52); backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .menu-overlay.open { opacity: 1; pointer-events: auto; }
}
@media (max-width: 768px) {
  :root { --section-pad: 48px; }
  .nav-inner { height: 64px; }

  /* Hero */
  .page-hero { padding: 44px 0 36px; }
  .page-hero h1 { font-size: clamp(36px,10vw,52px); margin-bottom: 14px; }
  .page-hero-sub { font-size: 15px; }
  .page-hero::before { width: 280px; height: 280px; top: -60px; right: -40px; animation: none; }
  .page-hero::after  { width: 200px; height: 200px; bottom: -40px; left: -30px; animation: none; }

  /* Filter bar — edge-to-edge horizontal scroll */
  .filter-bar-wrap { margin: 28px 0 24px; margin-left: -24px; margin-right: -24px; padding: 0 24px; }
  .filter-btn { padding: 7px 14px 7px 11px; font-size: 12px; gap: 6px; }
  .filter-btn-swatch { width: 7px; height: 7px; }
  .filter-btn-count { font-size: 9px; padding: 1px 5px; }

  /* Subject header */
  .subject-section { margin-bottom: 36px; }
  .subject-icon { width: 38px; height: 38px; border-radius: 11px; }
  .subject-name { font-size: 20px; }
  .subject-count { font-size: 10px; padding: 3px 8px; }

  /* Notes grid — single column */
  .notes-grid { grid-template-columns: 1fr; gap: 12px; }
  .note-card { padding: 16px 18px; }

  /* Download button full-width on mobile for easy tapping */
  .note-download { justify-content: center; padding: 12px 18px; font-size: 14px; }

  /* Empty state */
  .notes-empty { padding: 48px 20px; }

  /* Dark CTA */
  .res-cta { padding: 56px 0; }
  .res-cta h2 { font-size: clamp(28px,8vw,42px); }
  .res-cta p { font-size: 14px; margin-bottom: 28px; }
  .btn-cta-primary, .btn-cta-ghost { width: 100%; justify-content: center; max-width: 320px; }

  /* Mobile sticky enroll bar */
  body { padding-bottom: 68px; }
  .mobile-enroll-bar { display: flex; align-items: center; justify-content: space-between; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: rgba(248,246,255,0.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(139,92,246,0.15); padding: 10px 20px calc(10px + env(safe-area-inset-bottom,0px)); box-shadow: 0 -4px 24px rgba(20,16,43,0.08); }
  .mobile-enroll-label { font-size: 13px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
  .mobile-enroll-sub { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .mobile-enroll-btn { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; text-decoration: none; background: linear-gradient(135deg,var(--pink),var(--purple)); color: #fff; box-shadow: 0 4px 14px rgba(139,92,246,0.4); white-space: nowrap; }
  .back-to-top { bottom: 80px; width: 40px; height: 40px; right: 14px; }

  /* Footer */
  .footer-inner { flex-direction: column; align-items: center; text-align: center; }
  .footer-socials a { width: 44px; height: 44px; }
  .footer-socials a svg { width: 16px; height: 16px; }
}

@media (max-width: 480px) {
  .page-hero h1 { font-size: clamp(32px,9vw,44px); }
  .page-hero-sub { font-size: 14px; }
  .subject-name { font-size: 18px; }
  .res-cta h2 { font-size: clamp(26px,8vw,36px); }
}

/* Touch devices — tap feedback instead of hover */
@media (hover: none) {
  .note-card:hover { transform: none; box-shadow: var(--shadow-sm); }
  .note-card:hover::after { opacity: 0; }
  .note-card:active { transform: scale(0.97); transition-duration: .1s; }
  .filter-btn:hover { transform: none; box-shadow: none; }
  .filter-btn:active { transform: scale(0.94); transition-duration: .1s; }
  .note-download:hover { transform: none; }
  .note-download:active { transform: scale(0.96); transition-duration: .1s; }
  .lecture-card:hover { transform: none; box-shadow: var(--shadow-sm); }
  .lecture-card:hover::after { opacity: 0; }
  .lecture-card:active { transform: scale(0.97); transition-duration: .1s; }
  .lecture-watch:hover { transform: none; }
  .lecture-watch:active { transform: scale(0.96); transition-duration: .1s; }
  .subject-icon { transition: none; }
  .btn-cta-primary:hover, .btn-cta-ghost:hover { transform: none; }
  .btn-cta-primary:active { transform: scale(0.96); }
  .btn-cta-ghost:active { transform: scale(0.96); }
}

/* Reduce motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.15s !important; }
  .page-hero::before, .page-hero::after { animation: none; }
}

@media (max-width: 480px) {
  .page-hero h1 { font-size: clamp(32px,9vw,44px); }
  .page-hero-sub { font-size: 14px; }
  .subject-name { font-size: 18px; }
}
</style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">

// ── Nav data ──────────────────────────────────────────────────────
const COURSE_DROPDOWN = [
  { label: 'Bundled Courses',    href: 'courses.html#combos' },
  { label: 'Individual Courses', href: 'courses.html#individual', dividerBefore: true },
  { label: 'Interview Prep',     href: 'courses.html#interview',  dividerBefore: true },
];
const TESTIMONIALS_DROPDOWN = [
  { label: 'Batch of 2026', href: 'testimonials.html#batch-2026' },
  { label: 'Batch of 2025', href: 'testimonials.html#batch-2025', dividerBefore: true },
];
const NAV_LINKS = [
  { label: 'Courses',          href: 'courses.html',      dropdown: COURSE_DROPDOWN },
  { label: 'Test Series 2027', href: 'test-series.html' },
  { label: 'Testimonials',     href: 'testimonials.html', dropdown: TESTIMONIALS_DROPDOWN },
  { label: 'Resources',        href: 'resources.html',    active: true },
];

// ── Data sources ─────────────────────────────────────────────────
// For each sheet: File → Share → Publish to web → Sheet tab → CSV → Copy link
const NOTES_CSV_URL    = '';
const LECTURES_CSV_URL = '';

// ── Icons ─────────────────────────────────────────────────────────
const DownloadIcon = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
    <path d="M12 3v13M7 11l5 5 5-5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    <path d="M5 21h14" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
  </svg>
);

const PlayIcon = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
    <path d="M8 5v14l11-7z"/>
  </svg>
);

const FileIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
    <path d="M14 2H6C5.4 2 5 2.4 5 3V21C5 21.6 5.4 22 6 22H18C18.6 22 19 21.6 19 21V7L14 2Z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/>
    <path d="M14 2V7H19" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/>
    <path d="M9 13H15M9 17H13" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
  </svg>
);

// ── Nav ───────────────────────────────────────────────────────────
function TAAILogo() { return <img src="logo.png" alt="TAAI" />; }

const MENU_ICONS = {
  'index.html':        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M3 12L12 4L21 12V20C21 20.6 20.6 21 20 21H15V16H9V21H4C3.4 21 3 20.6 3 20V12Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /></svg>,
  'courses.html':      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 5C4 4 4.5 3 6 3H11V20H6C4.5 20 4 19 4 18V5Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /><path d="M20 5C20 4 19.5 3 18 3H13V20H18C19.5 20 20 19 20 18V5Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /></svg>,
  'test-series.html':  <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" strokeWidth="1.7" /><circle cx="12" cy="12" r="4" stroke="currentColor" strokeWidth="1.7" /><circle cx="12" cy="12" r="1.5" fill="currentColor" /></svg>,
  'testimonials.html': <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="9" r="3" stroke="currentColor" strokeWidth="1.7" /><circle cx="16" cy="9" r="3" stroke="currentColor" strokeWidth="1.7" /><path d="M3 19C3 16 5 14 8 14C11 14 13 16 13 19" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /><path d="M13 19C13 16 15 14 18 14C19 14 20 14.3 21 15" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /></svg>,
  'resources.html':    <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M14 2H6C5.4 2 5 2.4 5 3V21C5 21.6 5.4 22 6 22H18C18.6 22 19 21.6 19 21V7L14 2Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /><path d="M14 2V7H19" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /><path d="M9 13H15M9 17H13" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /></svg>,
};

function Nav() {
  const linksRef = React.useRef(null);
  const [pill, setPill] = React.useState({ left: 0, width: 0, visible: false });
  const resetTimer = React.useRef(null);
  const moveTo = React.useCallback((el) => {
    if (resetTimer.current) { clearTimeout(resetTimer.current); resetTimer.current = null; }
    if (!el) return;
    setPill({ left: el.offsetLeft - 10, width: el.offsetWidth + 20, visible: true });
  }, []);
  const reset = React.useCallback(() => {
    resetTimer.current = setTimeout(() => {
      const active = linksRef.current && linksRef.current.querySelector('a.active');
      if (active) moveTo(active.closest('.nav-dropdown-wrap') || active);
      else setPill(p => ({ ...p, visible: false }));
    }, 60);
  }, [moveTo]);
  React.useEffect(() => { reset(); }, [reset]);
  const [menuOpen, setMenuOpen] = React.useState(false);
  React.useEffect(() => {
    if (!menuOpen) return;
    const close = e => { if (!e.target.closest('.nav') && !e.target.closest('.mobile-menu')) setMenuOpen(false); };
    document.addEventListener('pointerdown', close);
    return () => document.removeEventListener('pointerdown', close);
  }, [menuOpen]);
  return (
    <>
      <div className={`menu-overlay${menuOpen ? ' open' : ''}`} onClick={() => setMenuOpen(false)} />
      <nav className={`nav${menuOpen ? ' menu-open' : ''}`}>
        <div className="nav-inner" onMouseLeave={reset}>
          <a href="index.html" className="nav-logo"><TAAILogo /></a>
          <div className="nav-links" ref={linksRef}>
            <div className="nav-pill" style={{ left: pill.left, width: pill.width, opacity: pill.visible ? 1 : 0 }} />
            {NAV_LINKS.map((l) => l.dropdown ? (
              <div key={l.href} className="nav-dropdown-wrap" onMouseEnter={(e) => moveTo(e.currentTarget)}>
                <a href={l.href} className={l.active ? 'active' : ''}>{l.label}</a>
                <div className="nav-dropdown">
                  {l.dropdown.map((d, i) => (
                    <React.Fragment key={i}>

// ── App ───────────────────────────────────────────────────────────
function App() {
  const [subjects, setSubjects] = React.useState([]);
  const [active, setActive]     = React.useState('');

  React.useEffect(() => {
    const parseCSV = text => {
      const parseLine = line => {
        const out = []; let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
          else if (ch === ',' && !inQ) { out.push(cur.trim()); cur = ''; }
          else cur += ch;
        }
        out.push(cur.trim()); return out;
      };
      const rows = text.trim().split('\n');
      const headers = parseLine(rows[0]);
      return rows.slice(1).filter(r => r.trim()).map(r => Object.fromEntries(headers.map((h, i) => [h, parseLine(r)[i] || ''])));
    };
    const fetchCSV = url => url ? fetch(url).then(r => r.text()).then(parseCSV).catch(() => []) : Promise.resolve([]);

    Promise.all([
      fetch('notes-data.json').then(r => r.json()),
      fetchCSV(NOTES_CSV_URL),
      fetchCSV(LECTURES_CSV_URL),
    ]).then(([meta, notesRows, lectureRows]) => {
      const groupBy = (rows, key) => rows.reduce((m, r) => { (m[r[key]] = m[r[key]] || []).push(r); return m; }, {});
      const notesMap    = groupBy(notesRows, 'subject');
      const lecturesMap = groupBy(lectureRows, 'subject');
      Object.values(notesMap).forEach(a => a.sort((a, b) => new Date(b.postedOn) - new Date(a.postedOn)));
      Object.values(lecturesMap).forEach(a => a.sort((a, b) => (Number(a.lectureNumber) || 0) - (Number(b.lectureNumber) || 0)));
      const subjects = meta.subjects.map(s => ({ ...s, notes: notesMap[s.id] || [], lectures: lecturesMap[s.id] || [] }));
      setSubjects(subjects);
      setActive(subjects[0]?.id || '');
    }).catch(() => {});
  }, []);

  const filtered = subjects.filter(s => s.id === active);
  const SUBJECTS = subjects;

  // Scroll progress
  React.useEffect(() => {
    const bar = document.querySelector('.scroll-progress');
    if (!bar) return;
    const update = () => { const p = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight); bar.style.width = (p * 100) + '%'; };
    window.addEventListener('scroll', update, { passive: true });
    return () => window.removeEventListener('scroll', update);
  }, []);

  // Fade-in observer
  React.useEffect(() => {
    const els = document.querySelectorAll('.fade-in');
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
    }, { threshold: 0.1 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, [active]);

  return (
    <>
      <div className="scroll-progress" />
      <BackToTop />
      <MobileContactBar />
      <MobileEnrollBar />
      <Nav />
      <div className="nav-spacer" />

      {/* Hero */}
      <section className="page-hero">
        <div className="container page-hero-inner">
          <div className="page-eyebrow">Free for all GATE DA aspirants</div>
          <h1>Study <em>Resources.</em></h1>
          <p className="page-hero-sub">
            Handcrafted notes for every GATE DA subject — downloadable, free, and built with the same depth as the courses.
          </p>
        </div>
      </section>

{/* Main content */}
      <section style={{ padding: '56px 0 96px' }}>
        <div className="container">

          {/* Filter bar — shown only when subjects exist */}
          {SUBJECTS.length > 0 && (
            <div className="filter-bar-wrap">
              <div className="filter-bar">
                {SUBJECTS.map((s, i) => (
                  <button key={s.id}
                    className={`filter-btn${active === s.id ? ' active' : ''}`}
                    onClick={() => setActive(s.id)}
                    style={{ '--i': i, '--subject-color': s.color, '--subject-accent': s.accent }}>
                    <span className="filter-btn-swatch" />
                    <span className="filter-btn-label">{s.name}</span>
                    {(s.notes.length + s.lectures.length) > 0 && <span className="filter-btn-count">{s.notes.length + s.lectures.length}</span>}
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* Subject sections — key on active triggers re-mount → re-animation */}
          <div key={active}>
          {filtered.length === 0 ? (
            <div className="notes-empty">
              <div className="notes-empty-icon"><FileIcon /></div>
              <div className="notes-empty-label">Content coming soon</div>
              <div className="notes-empty-text">{SUBJECTS.find(s => s.id === active)?.name} notes and lectures are being prepared.</div>
            </div>
          ) : (
            filtered.map(subject => {

              const showLabels  = hasNotes && hasLectures;
              if (!hasNotes && !hasLectures) {

                    <div className="notes-empty-icon"><FileIcon /></div>

                    <div className="notes-empty-text">{subject.name} notes and lectures are being prepared.</div>
                  </div>
                );
              }
              return (
                <div key={subject.id} className="subject-section">

                    <div className="subject-icon" style={{ background: subject.accent }}><FileIcon /></div>
                    <div className="subject-name">{subject.name}</div>

                      {hasNotes && `${subject.notes.length} ${subject.notes.length !== 1 ? 'notes' : 'note'}`}

                    </>

                  {hasLectures && (

                        {subject.lectures.map((lec, i) => (
                          <LectureCard key={i} lecture={lec} accent={subject.accent} index={i} />
                        ))}
                      </div>
                    </>
                  )}
                </div>
              );
            })
          )}

        </div>

            <a href="contact.html" className="btn-cta-ghost">Talk to us</a>
          </div>
        </div>
      </section>

      {/* Footer */}
