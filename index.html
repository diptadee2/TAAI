// "From GATE prep to a portfolio" (2026-10-11): the 2028 course's projects,
// shown in the Built differently section with animated lines from the
// GATE DA prep card to each project. Paths are measured from the real
// element positions (ResizeObserver), so they follow any layout: side by
// side on wide screens, stacked on phones.
const PREP_SUBJECTS = ['Linear Algebra', 'Probability & Statistics', 'Calculus', 'Python'];
function PrepToProjects() {
  const projects = PROJECTS_2028;
  const wrapRef = React.useRef(null), prepRef = React.useRef(null), tileRefs = React.useRef([]);
  const [paths, setPaths] = React.useState([]);
  const [box, setBox] = React.useState({ w: 0, h: 0 });
  const [shown, setShown] = React.useState(false);
  const [hover, setHover] = React.useState(-1);
  React.useLayoutEffect(() => {
    const wrap = wrapRef.current, prep = prepRef.current; if (!wrap || !prep) return;
    const measure = () => {
      const W = wrap.getBoundingClientRect(), P = prep.getBoundingClientRect();
      const side = tileRefs.current[0] && tileRefs.current[0].getBoundingClientRect().left > P.right - 4;
      setBox({ w: W.width, h: W.height });
      setPaths(tileRefs.current.filter(Boolean).map(el => {
        const T = el.getBoundingClientRect();
        if (side) {
          const x1 = P.right - W.left, y1 = P.top + P.height / 2 - W.top, x2 = T.left - W.left, y2 = T.top + T.height / 2 - W.top, mx = (x1 + x2) / 2;
          return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
        }
        // Stacked (phones): one rail down the left gutter from the prep
        // card, with a short rounded branch into each tile.
        const x0 = T.left - 11 - W.left, y1 = P.bottom - W.top, x2 = T.left - W.left, y2 = T.top + T.height / 2 - W.top, r = 8;
        return `M${x0},${y1} V${y2 - r} Q${x0},${y2} ${x0 + r},${y2} H${x2}`;
      }));
    };
    measure();
    const ro = new ResizeObserver(measure); ro.observe(wrap);
    window.addEventListener('resize', measure);
    return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
  }, []);
  React.useEffect(() => {
    const el = wrapRef.current; if (!el) return;
    if (!('IntersectionObserver' in window)) { setShown(true); return; }
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { setShown(true); io.disconnect(); } }, { threshold: 0.25 });
    io.observe(el); return () => io.disconnect();
  }, []);
  const lit = hover >= 0 ? (projects[hover] || {}).uses || [] : [];
  return (
    <div className={'prep-projects' + (shown ? ' is-shown' : '')} id="prep-to-projects">
      <div className="prep-projects-head">
        <div className="prep-projects-title">
          <span className="bd-icon prep-projects-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5" /><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 12.5h18" /></svg></span>
          <h3>From GATE prep to a portfolio</h3>
          <p>The maths and Python you learn for GATE DA power these projects. The GATE 2028 Full Course adds 5 of them, so you finish with a portfolio for DS and AI interviews too.</p>
        </div>
        <a href="/gate-da-courses#projects-map" className="prep-projects-link">See how the projects connect <span aria-hidden="true">→</span></a>
      </div>
      <div className="prep-projects-flow" ref={wrapRef}>
        <svg className="prep-lines" width={box.w} height={box.h} viewBox={`0 0 ${box.w || 1} ${box.h || 1}`} aria-hidden="true">
          <defs>
            <linearGradient id="prep-line-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stopColor="#7C3AED" /><stop offset="1" stopColor="#DB2777" /></linearGradient>
          </defs>
          {paths.map((d, i) => (
            <g key={i} className={'prep-line' + (hover === i ? ' is-hot' : '')} style={{ '--d': i * 0.18 + 's' }}>
              <path id={'prep-path-' + i} d={d} pathLength="1" className="prep-line-path" />
              {shown && <circle r="4" className="prep-line-dot"><animateMotion dur={(2.4 + i * 0.3) + 's'} begin={(1 + i * 0.25) + 's'} repeatCount="indefinite"><mpath href={'#prep-path-' + i} /></animateMotion></circle>}
            </g>
          ))}
        </svg>
        <div className="prep-card" ref={prepRef}>
          <div className="prep-card-label">GATE DA prep</div>
          <div className="prep-card-title">What you study for the exam</div>
          <ul className="prep-subjects">
            {PREP_SUBJECTS.map(sj => <li key={sj} className={lit.indexOf(sj) >= 0 ? 'is-lit' : ''}>{sj}</li>)}
          </ul>
        </div>
        <div className="prep-tiles">
          {projects.map((p, i) => (
            <div key={i} ref={el => tileRefs.current[i] = el} className={'project-tile project-tile--' + p.art} style={{ '--d': (0.5 + i * 0.18) + 's' }}
              onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(-1)}>
              <div className="project-art"><ProjectArt kind={p.art} /><span className="project-count" aria-label={p.count + (p.count === 1 ? ' project' : ' projects')}>×{p.count}</span></div>

              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function WhyStrip() {
  const [spec, vis, res] = WHY_PILLARS;

  const gridRef = React.useRef(null);
  const [play, setPlay] = React.useState(false);
  React.useEffect(() => {
    const el = gridRef.current; if (!el) return;
    if (!('IntersectionObserver' in window)) { setPlay(true); return; }
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { setPlay(true); io.disconnect(); } }, { threshold: 0.4 });

  }, []);

// ============ CTA ============
function CTA() {
  const [settings, setSettings] = React.useState(_siteSettingsCache || {});
  // Always subscribes, never gated on "!_siteSettingsCache" — that guard
  // (copied at first from Offer()'s matching _pricingFetch pattern) has a
  // real race: if the fetch resolves between this component's initial
  // render and this effect running, the cache is already non-null by the
  // time the guard checks it, so setSettings would never fire and the
  // stale initial {} would stick around forever. _siteSettingsFetch is
  // already a memoized, once-resolved Promise — chaining .then() on it
  // again costs no extra network call regardless of timing, so there's
  // no downside to just always subscribing.
  React.useEffect(() => { _siteSettingsFetch.then(setSettings); }, []);
  // Admin toggle in /team's Site data > Settings sub-tab — hides this
  // whole section (mobile sticky CTA is a separate, unrelated element
  // and stays untouched regardless).
  if (settings.hideFinancialAssistance) return null;
  return (
    <section className="cta" id="cta">
      <div className="container">
        <div className="cta-card fade-in">

}

function BackToTop() {
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const onScroll = () => {
      const past400 = window.scrollY > 400;
      setVisible(past400);
      document.body.classList.toggle('buttons-visible', past400);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => { window.removeEventListener('scroll', onScroll); document.body.classList.remove('buttons-visible'); };
  }, []);
  return (
    <button className={`back-to-top${visible ? ' visible' : ''}`} onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} aria-label="Back to top">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
    </button>
  );
}

function ScrollProgress() {
  React.useEffect(() => {
    const bar = document.getElementById('scroll-progress-bar');
    const update = () => {
      const total = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (total > 0 ? (window.scrollY / total) * 100 : 0) + '%';
    };
    window.addEventListener('scroll', update, { passive: true });
    update();
    return () => window.removeEventListener('scroll', update);
  }, []);
  return <div id="scroll-progress-bar" className="scroll-progress" style={{ width: '0%' }} />;
}

        </div>
        <div className="fit-acc fade-in">
          {FIT_PATHS.map((p, i) => {
            const open = i === openM;
            return (
              <div key={p.tag} className={`fit-acc-item fit-acc-${p.tone}${open ? ' is-open' : ''}`}>
                <button type="button" className="fit-acc-btn" id={`fit-acc-btn-${i}`} aria-expanded={open} aria-controls={`fit-acc-body-${i}`}
                  onClick={() => setOpenM(open ? -1 : i)}>
                  <span className="fit-acc-swatch" aria-hidden="true" />
                  <span className="fit-acc-label">{p.option}</span>
                  <span className="fit-acc-icon" aria-hidden="true" />
                </button>
                <div className="fit-acc-body" id={`fit-acc-body-${i}`} role="region" aria-labelledby={`fit-acc-btn-${i}`} aria-hidden={!open}>
                  <div className="fit-acc-inner">
                    <h3 className="fit-acc-title">{p.title}</h3>
                    <p className="fit-acc-text">{p.text}</p>
                    <div className="fit-acc-points">
                      <span className="fit-points-label">What you get</span>
                      <ul>{p.points.map(t => <li key={t}>{t}</li>)}</ul>
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </section>
  );
}

function App() {
  React.useEffect(() => { try { sessionStorage.removeItem('_eb'); } catch(e) {} }, []);
  React.useEffect(() => {
    const els = document.querySelectorAll('.fade-in');
    const mobile = window.matchMedia('(max-width: 768px)').matches;
    const io = new IntersectionObserver((entries) => {
      const hit = entries.filter(e => e.isIntersecting);
      hit.sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      hit.forEach((e, i) => {
        io.unobserve(e.target);
        const delay = Math.min(i, 5) * (mobile ? 80 : 40);
        if (delay) setTimeout(() => e.target.classList.add('visible'), delay);
        else e.target.classList.add('visible');
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <>
      <ScrollProgress />
      <BackToTop />
      <MobileContactBar />
      <Nav />
      <div className="nav-spacer" />
      <div className="hero-toppers-bg-wrap">
        <Hero />
        <Stats />
      </div>
      <WhyIndia />
      <WhyStrip />
      <Instructor />
      <WhoItsFor />
      <Testimonials />
      <FAQ />
      <CTA />
      <Footer />
      <MobileStickyCTA />
    </>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: false }; }
  static getDerivedStateFromError() { return { err: true }; }
  componentDidCatch() {
    try {
      const n = +(sessionStorage.getItem('_eb') || 0);
      if (n < 2) { sessionStorage.setItem('_eb', n + 1); window.location.reload(); }
    } catch(e) { window.location.reload(); }
  }
  render() { return this.state.err ? null : this.props.children; }
}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
