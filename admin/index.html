<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex">
  <base href="/admin/">
  <title>TAAI Blog — Content Manager</title>
  <link rel="icon" href="/favicon.ico?v=6">
  <link href="/admin/config.yml" type="text/yaml">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    /* Scoped to .blocks-ref only — never touches Decap's own UI chrome. */
    .blocks-ref { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px 26px; max-width: 720px; }
    .blocks-ref h2 { font-size: 18px; margin: 0 0 4px; }
    .blocks-ref .blocks-ref-sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
    .blocks-ref .blocks-ref-item { border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
    .blocks-ref .blocks-ref-item h3 { font-size: 14.5px; margin: 0 0 4px; color: #111827; }
    .blocks-ref .blocks-ref-item p { font-size: 13px; color: #4b5563; margin: 0 0 8px; line-height: 1.5; }
    .blocks-ref .blocks-ref-fields { font-size: 12.5px; color: #374151; background: #f9fafb; border-radius: 6px; padding: 8px 10px; }
    .blocks-ref .blocks-ref-fields b { color: #111827; }
    .blocks-ref .blocks-ref-note { font-size: 12.5px; color: #6b7280; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 12px; margin-top: 16px; line-height: 1.5; }
    /* LLM-prompt panel — deliberately visually distinct (purple accent)
       from the plain reference cards above it, since this is the thing a
       writer should actually use first, not just read. */
    .blocks-ref .blocks-ref-prompt { border: 1.5px solid #ddd6fe; background: #f5f3ff; border-radius: 10px; padding: 14px 16px 16px; margin-bottom: 22px; }
    .blocks-ref .blocks-ref-prompt h2 { color: #5b21b6; }
    .blocks-ref .blocks-ref-copy-btn { display: inline-block; font-size: 12.5px; font-weight: 600; color: #fff; background: #7c3aed; border: none; border-radius: 999px; padding: 7px 16px; cursor: pointer; margin-bottom: 10px; }
    .blocks-ref .blocks-ref-copy-btn:hover { background: #6d28d9; }
    .blocks-ref .blocks-ref-prompt-box { display: block; width: 100%; box-sizing: border-box; height: 130px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; line-height: 1.5; color: #374151; background: #fff; border: 1px solid #ddd6fe; border-radius: 8px; padding: 10px 12px; }
    /* Actual live preview of what's being written (title/description/
       cover/body) — restores what registering a custom preview template
       otherwise silently removes (Decap's default preview), since a
       writer needs to see their own text, not just a reference panel. */
    .blocks-ref .post-preview { border-bottom: 2px solid #e5e7eb; padding-bottom: 18px; margin-bottom: 22px; }
    .blocks-ref .post-preview-title { font-size: 24px; font-weight: 700; margin: 0 0 8px; color: #111827; }
    .blocks-ref .post-preview-desc { font-size: 14px; color: #6b7280; margin-bottom: 10px; }
    .blocks-ref .post-preview-cover img { max-width: 100%; border-radius: 8px; margin-bottom: 12px; display: block; }
    .blocks-ref .post-preview-body { font-size: 14.5px; line-height: 1.6; color: #1f2937; }
    .blocks-ref .post-preview-body p { margin: 0 0 12px; }
    .blocks-status { margin-top: 14px; border-radius: 8px; padding: 10px 14px; font-size: 13px; }
    .blocks-status-ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    .blocks-status-ok ol { margin: 6px 0 0; padding-left: 20px; }
    .blocks-status-ok li { margin-bottom: 2px; color: #14532d; }
    .blocks-status-error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .blocks-status-error .blocks-status-msg { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; margin-top: 4px; }
    /* Real per-block content preview (renderBlockPreview) — one plain
       bordered card per block, a small uppercase type chip, then the
       writer's actual text/numbers underneath. Not styled to look like
       the live site (no charts/SVG) — just legible enough to confirm
       "is this the content I meant to write." */
    .bp-block { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 14px; margin-top: 10px; font-size: 13.5px; color: #1f2937; }
    .bp-type { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #7c3aed; margin-bottom: 6px; }
    .bp-title { font-weight: 700; margin-bottom: 2px; }
    .bp-subtitle, .bp-caption, .bp-dim { color: #6b7280; font-size: 12.5px; }
    .bp-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #7c3aed; margin-bottom: 2px; }
    .bp-heading { font-size: 17px; font-weight: 700; }
    .bp-text { white-space: pre-wrap; }
    .bp-table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 13px; }
    .bp-table th, .bp-table td { border: 1px solid #e5e7eb; padding: 4px 8px; text-align: left; }
    .bp-table th { background: #f9fafb; font-size: 11px; text-transform: uppercase; color: #6b7280; }
    .bp-table tr.bp-highlight td { background: #fef9c3; font-weight: 700; }
    .bp-step { margin-bottom: 3px; }
    .bp-path { border-left: 3px solid #ddd6fe; padding-left: 10px; margin: 8px 0; }
    .bp-faq-item { margin-bottom: 10px; }
    .bp-raw { font-size: 11px; background: #f9fafb; padding: 8px; border-radius: 6px; overflow-x: auto; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // LLM_PROMPT_TEXT — copy-pasted verbatim into ChatGPT/Claude alongside
    // a source article, so the LLM does the actual authoring (numbers,
    // copy, structure) and the writer's only manual step is pasting the
    // result into the "Blocks — paste from LLM" field (blocks_json in
    // admin/config.yml, read by loadPosts() in build.mjs). The 13 block
    // schemas here are transcribed directly from build.mjs's renderer
    // functions (renderBlockBarChart etc.) — field names must match
    // exactly, since a wrong key silently reads as undefined rather than
    // erroring. Keep this in sync by hand whenever a block type's fields
    // change in build.mjs/admin/config.yml, same as BLOCKS_REFERENCE_HTML
    // below already has to be.
    var LLM_PROMPT_TEXT = 'You are helping write a blog post for a GATE DA (Data Science & AI) exam-prep website using a block-based content system. I will give you an article/content below. Convert it into a single JSON array of "blocks" that will be rendered as charts, tables, and diagrams on the page.\n\n' +
      'OUTPUT RULES (follow exactly):\n' +
      '- Output ONLY the JSON array. No markdown code fences (no ```), no explanation before or after, no comments.\n' +
      '- Valid JSON only: double-quoted keys and strings, no trailing commas, numbers written as numbers (not "12" as a string) for any "value"/"values" field.\n' +
      '- Use ONLY the block "type" values listed below. Every block must have a "type" field plus that type\'s fields.\n' +
      '- Skip any field marked (optional) if you have nothing to put there — don\'t include it as an empty string.\n' +
      '- Keep text concise and in the article\'s own voice — don\'t invent statistics or facts that aren\'t in the article.\n\n' +
      'BLOCK TYPES AND THEIR EXACT FIELDS:\n\n' +
      '1. section_heading — a small label + heading to start a new part of the post.\n' +
      '{"type":"section_heading","eyebrow":"WHY IT MATTERS","heading":"Why this matters"}\n' +
      '- eyebrow (optional): short label shown above the heading, usually caps.\n\n' +
      '2. text — a regular paragraph (Markdown supported: **bold**, links, etc).\n' +
      '{"type":"text","content":"Plain paragraph text here."}\n\n' +
      '3. bar_chart — horizontal bars, one per row.\n' +
      '{"type":"bar_chart","title":"Fig 1: Marks by subject","subtitle":"optional subtitle","bars":[{"label":"Linear Algebra","value":12,"trend":"rising"},{"label":"DBMS","value":8,"trend":"falling"}],"caption":"optional caption"}\n' +
      '- trend must be exactly "rising", "falling", or "steady" — controls the bar\'s color.\n\n' +
      '4. grouped_bar_chart — compares a few categories across the same years/series.\n' +
      '{"type":"grouped_bar_chart","title":"Fig 2: Question types by year","series":["2024","2025","2026"],"groups":[{"label":"MCQ","values":[52,53,49]},{"label":"MSQ","values":[22,28,22]}],"caption":"optional caption"}\n' +
      '- series: the labels for each value in a group, in order (e.g. years).\n' +
      '- each group\'s "values" array must have exactly one number per series label, same order.\n\n' +
      '5. line_chart — a trend over time, one line per thing tracked.\n' +
      '{"type":"line_chart","title":"Fig 3: Trend over years","x_labels":["2024","2025","2026"],"lines":[{"label":"Machine Learning","values":[10,14,18]},{"label":"DBMS","values":[16,14,11]}],"caption":"optional caption"}\n' +
      '- x_labels: the x-axis points, in order (needs at least 2).\n' +
      '- each line\'s "values" array must have exactly one number per x_label, same order.\n\n' +
      '6. data_table — a plain table. Leave "columns" as [] for a simple 2-column key/value table.\n' +
      '{"type":"data_table","title":"optional title","columns":[],"rows":[{"cells":["Questions / marks / time","65 . 100 . 3 hours"]},{"cells":["Negative marking","MCQ only"],"highlight":false}]}\n' +
      '- if "columns" has headers, every row\'s "cells" array must match that count.\n' +
      '- "highlight" (optional, boolean): true for a row that should stand out (e.g. a totals row).\n\n' +
      '7. step_diagram — things building up over steps (e.g. a revision routine).\n' +
      '{"type":"step_diagram","title":"Fig: Rolling revision","subtitle":"optional","steps":[{"step_label":"step 1","items":[{"label":"M1","is_new":true}]},{"step_label":"step 2","items":[{"label":"M1","is_new":false},{"label":"M2","is_new":true}]}],"caption":"optional"}\n' +
      '- each step\'s "items" list bottom-to-top; "is_new": true on whichever item should stand out that step.\n\n' +
      '8. two_path_diagram — one thing splits into two outcomes.\n' +
      '{"type":"two_path_diagram","root_label":"Marks lost","left":{"badge":"YOU KNEW IT","title":"Accuracy leak","description":"Wrong or unfinished on something you understand.","action":"minimise, re-solve clean"},"right":{"badge":"YOU DIDN\'T KNOW IT","title":"Knowledge gap","description":"A topic you haven\'t covered or mastered yet.","action":"study it, then re-test"}}\n' +
      '- "badge" and "action" are both optional but recommended.\n\n' +
      '9. comparison_rows — rows contrasting a wrong way and a right way of doing something.\n' +
      '{"type":"comparison_rows","title":"optional","rows":[{"good":false,"description":"skim the keywords","result":"wrong Q solved"},{"good":true,"description":"read it fully","result":"right answer, first time"}]}\n' +
      '- "good": true marks the correct/positive example (shown with a checkmark instead of an X).\n\n' +
      '10. concept_comparison — a simple side-by-side comparison of two approaches, text only.\n' +
      '{"type":"concept_comparison","left_label":"RESOURCE HOARDING","left_description":"Busy, shallow, no depth.","right_label":"ONE STRUCTURED PATH","right_description":"Forward, with loops back."}\n\n' +
      '11. syllabus_grid — a grid of numbered topic cards.\n' +
      '{"type":"syllabus_grid","title":"optional","cells":[{"number":"01","title":"Linear Algebra","description":"Vector spaces, matrices, eigenvalues.","highlight":false}]}\n' +
      '- "number" is a short code/index shown on the card, e.g. "01" or "GA" — text, not just digits.\n' +
      '- "highlight" (optional, boolean): true for a cell that should stand out.\n\n' +
      '12. faq — an expandable question/answer list.\n' +
      '{"type":"faq","items":[{"question":"What is the full form of GATE DA?","answer":"Graduate Aptitude Test in Engineering, Data Science and Artificial Intelligence."}]}\n\n' +
      '13. resources — a stack of link cards.\n' +
      '{"type":"resources","intro":"optional intro text","items":[{"title":"GATE DA course","subtitle":"A full, structured track","url":"https://taai.live/gate-da-courses","cta_text":"Visit"}]}\n\n' +
      'Blocks render in the order you list them in the array. Mix section_heading/text blocks between charts so the post reads naturally, rather than putting every chart back to back.\n\n' +
      'Now here is the article/content to convert:\n\n' +
      '[PASTE YOUR ARTICLE OR NOTES HERE]';

    // A reference panel for the Blog collection's preview pane — not a
    // live preview of the rendered post (that would mean re-implementing
    // build.mjs's block renderers a second time here, in a second
    // language/runtime, which would drift out of sync with the real
    // thing). Just a persistent, always-visible cheat sheet of what each
    // Blocks type is for and what to fill in, since a non-technical
    // writer using the Blocks field (see admin/config.yml) has no other
    // way to see this while actually writing a post. createClass/h are
    // globals Decap's bundle exposes specifically for this no-build-step
    // customization pattern — same "no bundler" approach as the rest of
    // this site.
    var BLOCKS_REFERENCE_HTML = '' +
      '<h2>Blocks reference</h2>' +
      '<div class="blocks-ref-sub">What each block type does and what to fill in — mainly useful for editing what an LLM already gave you (see the paste-from-LLM box above). This panel does not preview your actual post — publish (or check the live site) to see the real result.</div>' +

      '<div class="blocks-ref-item"><h3>Section heading</h3><p>A small label + a heading, to start a new part of the post.</p>' +
      '<div class="blocks-ref-fields"><b>Eyebrow</b> (small label above), <b>Heading</b></div></div>' +

      '<div class="blocks-ref-item"><h3>Paragraph text</h3><p>Regular prose, same as the Body field above — use this to add more text between charts/tables.</p>' +
      '<div class="blocks-ref-fields"><b>Content</b></div></div>' +

      '<div class="blocks-ref-item"><h3>Bar chart</h3><p>Horizontal bars, one per row — e.g. marks per subject. Trend controls the bar\'s color: rising = green, falling = red, steady = purple.</p>' +
      '<div class="blocks-ref-fields"><b>Title</b>, <b>Subtitle</b> (optional), <b>Bars</b>: each with Label + Value + Trend, <b>Caption</b> (optional)</div></div>' +

      '<div class="blocks-ref-item"><h3>Grouped bar chart</h3><p>Compares a few categories across the same years/series — e.g. question types across 2024/2025/2026.</p>' +
      '<div class="blocks-ref-fields"><b>Title</b>, <b>Series labels</b> (e.g. 2024, 2025, 2026 — in order), <b>Groups</b>: each with a Label + one Value per series (same order as Series labels), <b>Caption</b> (optional)</div></div>' +

      '<div class="blocks-ref-item"><h3>Line chart</h3><p>A trend over time, one line per thing you\'re tracking.</p>' +
      '<div class="blocks-ref-fields"><b>Title</b>, <b>X-axis labels</b> (e.g. 2024, 2025, 2026 — in order), <b>Lines</b>: each with a Label + one Value per x-axis label (each line gets its own color automatically), <b>Caption</b> (optional)</div></div>' +

      '<div class="blocks-ref-item"><h3>Data table</h3><p>A plain table. Leave Column headers empty for a simple 2-column key/value table (like an exam-pattern summary).</p>' +
      '<div class="blocks-ref-fields"><b>Title</b> (optional), <b>Column headers</b> (optional), <b>Rows</b>: each a list of Cells (one per column, in order) + optional Highlight (e.g. for a totals row)</div></div>' +

      '<div class="blocks-ref-item"><h3>Step diagram</h3><p>Shows things building up over steps — e.g. "revise everything before you start something new". Each step lists its items bottom to top; tick "is the new item" for whichever one should stand out that step.</p>' +
      '<div class="blocks-ref-fields"><b>Title</b>, <b>Subtitle</b> (optional), <b>Steps</b>: each with a Step label + Items (Label + "this is the new item"), <b>Caption</b> (optional)</div></div>' +

      '<div class="blocks-ref-item"><h3>Two-path diagram</h3><p>One thing splits into two outcomes — e.g. "marks lost" splitting into "accuracy leak" vs "knowledge gap".</p>' +
      '<div class="blocks-ref-fields"><b>Root label</b>, <b>Left path</b> &amp; <b>Right path</b>: each with a Badge, Title, Description, Action line</div></div>' +

      '<div class="blocks-ref-item"><h3>Comparison rows</h3><p>Rows contrasting a wrong way and a right way of doing something.</p>' +
      '<div class="blocks-ref-fields"><b>Title</b> (optional), <b>Rows</b>: each with "this row is the good example", Description, Result</div></div>' +

      '<div class="blocks-ref-item"><h3>Two-column comparison</h3><p>A simple side-by-side comparison of two approaches/ideas — text only, no chart.</p>' +
      '<div class="blocks-ref-fields"><b>Left label</b> + <b>Left description</b>, <b>Right label</b> + <b>Right description</b></div></div>' +

      '<div class="blocks-ref-item"><h3>Syllabus / topic grid</h3><p>A grid of numbered topic cards — e.g. the seven core sections of a syllabus.</p>' +
      '<div class="blocks-ref-fields"><b>Title</b> (optional), <b>Cells</b>: each with a Number/code (e.g. "01" or "GA"), Title, Description, optional Highlight (spans the full row)</div></div>' +

      '<div class="blocks-ref-item"><h3>FAQ</h3><p>An expandable question/answer list.</p>' +
      '<div class="blocks-ref-fields"><b>Questions</b>: each with a Question + Answer</div></div>' +

      '<div class="blocks-ref-item"><h3>Resource links</h3><p>A stack of link cards, e.g. pointing to your course, notes, or test series.</p>' +
      '<div class="blocks-ref-fields"><b>Intro text</b> (optional), <b>Links</b>: each with Title, Subtitle, URL, Button text (e.g. "visit", "watch", "get it")</div></div>' +

      '<div class="blocks-ref-note">Blocks render in the order you add them, after the Body field. You can mix Paragraph text and Section heading blocks in between charts to keep the post readable — you don\'t have to put every chart back to back.</div>';

    // Real per-block preview — the writer's actual content, in full, not
    // a truncated summary line. Deliberately plain (a real <table> of
    // numbers instead of a styled chart, no chart math/SVG) rather than
    // re-implementing build.mjs's renderers pixel-for-pixel — that
    // duplication was the thing avoided when this panel was first built
    // (see the comment on BLOCKS_REFERENCE_HTML), and it isn't needed
    // here either: the point is to let a writer confirm THEIR data/text
    // is right, not to preview the final visual design (publish, or
    // check the live site, for that). Falls through to a raw JSON dump
    // for an unrecognized type, so a typo'd "type" still shows something
    // instead of silently rendering blank.
    function bp(v) { return v == null ? '' : String(v); }
    function renderBlockPreview(b) {
      b = b || {};
      var type = b.type || 'unknown';
      switch (type) {
        case 'section_heading':
          return h('div', null,
            b.eyebrow ? h('div', { className: 'bp-eyebrow' }, bp(b.eyebrow)) : null,
            h('div', { className: 'bp-heading' }, bp(b.heading)));
        case 'text':
          return h('div', { className: 'bp-text' }, bp(b.content));
        case 'bar_chart':
          return h('div', null,
            b.title ? h('div', { className: 'bp-title' }, bp(b.title)) : null,
            b.subtitle ? h('div', { className: 'bp-subtitle' }, bp(b.subtitle)) : null,
            h('table', { className: 'bp-table' },
              h('tbody', null, (b.bars || []).map(function (row, i) {
                return h('tr', { key: i }, h('td', null, bp(row.label)), h('td', null, bp(row.value)), h('td', { className: 'bp-dim' }, bp(row.trend)));
              }))),
            b.caption ? h('div', { className: 'bp-caption' }, bp(b.caption)) : null);
        case 'grouped_bar_chart':
          return h('div', null,
            b.title ? h('div', { className: 'bp-title' }, bp(b.title)) : null,
            h('table', { className: 'bp-table' },
              h('thead', null, h('tr', null, h('th', null, ''), (b.series || []).map(function (s, i) { return h('th', { key: i }, bp(s)); }))),
              h('tbody', null, (b.groups || []).map(function (g, i) {
                return h('tr', { key: i }, h('td', null, bp(g.label)), (g.values || []).map(function (v, j) { return h('td', { key: j }, bp(v)); }));
              }))),
            b.caption ? h('div', { className: 'bp-caption' }, bp(b.caption)) : null);
        case 'line_chart':
          return h('div', null,
            b.title ? h('div', { className: 'bp-title' }, bp(b.title)) : null,
            h('table', { className: 'bp-table' },
              h('thead', null, h('tr', null, h('th', null, ''), (b.x_labels || []).map(function (x, i) { return h('th', { key: i }, bp(x)); }))),
              h('tbody', null, (b.lines || []).map(function (l, i) {
                return h('tr', { key: i }, h('td', null, bp(l.label)), (l.values || []).map(function (v, j) { return h('td', { key: j }, bp(v)); }));
              }))),
            b.caption ? h('div', { className: 'bp-caption' }, bp(b.caption)) : null);
        case 'data_table':
          var cols = b.columns || [];
          return h('div', null,
            b.title ? h('div', { className: 'bp-title' }, bp(b.title)) : null,
            h('table', { className: 'bp-table' },
              cols.length ? h('thead', null, h('tr', null, cols.map(function (c, i) { return h('th', { key: i }, bp(c)); }))) : null,
              h('tbody', null, (b.rows || []).map(function (r, i) {
                return h('tr', { key: i, className: r.highlight ? 'bp-highlight' : '' }, (r.cells || []).map(function (c, j) { return h('td', { key: j }, bp(c)); }));
              }))));
        case 'step_diagram':
          return h('div', null,
            b.title ? h('div', { className: 'bp-title' }, bp(b.title)) : null,
            b.subtitle ? h('div', { className: 'bp-subtitle' }, bp(b.subtitle)) : null,
            (b.steps || []).map(function (s, i) {
              return h('div', { key: i, className: 'bp-step' },
                h('span', { className: 'bp-dim' }, bp(s.step_label) + ': '),
                (s.items || []).map(function (it) { return it.is_new ? '[' + bp(it.label) + ']' : bp(it.label); }).join(', '));
            }),
            b.caption ? h('div', { className: 'bp-caption' }, bp(b.caption)) : null);
        case 'two_path_diagram':
          var pathBlock = function (p, label) {
            p = p || {};
            return h('div', { className: 'bp-path' },
              h('div', { className: 'bp-dim' }, label + (p.badge ? ' — ' + bp(p.badge) : '')),
              h('div', { className: 'bp-title' }, bp(p.title)),
              h('div', null, bp(p.description)),
              p.action ? h('div', { className: 'bp-dim' }, '→ ' + bp(p.action)) : null);
          };
          return h('div', null,
            h('div', { className: 'bp-title' }, bp(b.root_label)),
            pathBlock(b.left, 'Left'), pathBlock(b.right, 'Right'));
        case 'comparison_rows':
          return h('div', null,
            b.title ? h('div', { className: 'bp-title' }, bp(b.title)) : null,
            (b.rows || []).map(function (r, i) {
              return h('div', { key: i }, (r.good ? '✓ ' : '✗ ') + bp(r.description) + ' → ' + bp(r.result));
            }));
        case 'concept_comparison':
          return h('div', null,
            h('div', null, h('strong', null, bp(b.left_label)), ' — ', bp(b.left_description)),
            h('div', null, h('strong', null, bp(b.right_label)), ' — ', bp(b.right_description)));
        case 'syllabus_grid':
          return h('div', null,
            b.title ? h('div', { className: 'bp-title' }, bp(b.title)) : null,
            (b.cells || []).map(function (c, i) {
              return h('div', { key: i }, h('strong', null, bp(c.number) + ' ' + bp(c.title)), ' — ', bp(c.description));
            }));
        case 'faq':
          return (b.items || []).map(function (it, i) {
            return h('div', { key: i, className: 'bp-faq-item' },
              h('div', { className: 'bp-title' }, bp(it.question)), h('div', null, bp(it.answer)));
          });
        case 'resources':
          return h('div', null,
            b.intro ? h('div', { className: 'bp-text' }, bp(b.intro)) : null,
            (b.items || []).map(function (it, i) {
              return h('div', { key: i },
                h('strong', null, bp(it.title)), ' — ', bp(it.subtitle), ' ',
                h('a', { href: it.url, target: '_blank', rel: 'noopener noreferrer' }, bp(it.cta_text || 'view') + ' → ' + bp(it.url)));
            }));
        default:
          return h('pre', { className: 'bp-raw' }, JSON.stringify(b, null, 2));
      }
    }

    // Validates blocks_json exactly the way build.mjs's loadPosts() will
    // at build time (JSON.parse + Array.isArray) — surfacing the same
    // failure here, live, while writing, is the whole point: a broken
    // paste otherwise isn't caught until a build the writer never sees
    // (Netlify's, after publish). Falls back to the manual Blocks list
    // when blocks_json is empty, so either path shows something real.
    function renderBlocksStatus(entry) {
      var jsonRaw = entry.getIn(['data', 'blocks_json']);
      if (jsonRaw && String(jsonRaw).trim()) {
        var parsed;
        try {
          parsed = JSON.parse(jsonRaw);
        } catch (e) {
          return h('div', { className: 'blocks-status blocks-status-error' },
            h('strong', null, '✗ blocks_json is not valid JSON — this post will fail to build until fixed.'),
            h('div', { className: 'blocks-status-msg' }, e.message)
          );
        }
        if (!Array.isArray(parsed)) {
          return h('div', { className: 'blocks-status blocks-status-error' },
            '✗ blocks_json must be a JSON array (got ' + typeof parsed + ').');
        }
        return h('div', null,
          h('div', { className: 'blocks-status blocks-status-ok' }, '✓ ' + parsed.length + ' block' + (parsed.length === 1 ? '' : 's') + ' parsed from blocks_json'),
          parsed.map(function (b, i) {
            return h('div', { key: i, className: 'bp-block' },
              h('div', { className: 'bp-type' }, (b && b.type) || 'unknown'),
              renderBlockPreview(b));
          })
        );
      }
      var manual = entry.getIn(['data', 'blocks']);
      var manualArr = (manual && manual.toJS) ? manual.toJS() : [];
      if (!manualArr.length) return null;
      return h('div', null,
        h('div', { className: 'blocks-status blocks-status-ok' }, manualArr.length + ' block' + (manualArr.length === 1 ? '' : 's') + ' (manual list)'),
        manualArr.map(function (b, i) {
          return h('div', { key: i, className: 'bp-block' },
            h('div', { className: 'bp-type' }, (b && b.type) || 'unknown'),
            renderBlockPreview(b));
        })
      );
    }

    var BlocksReferencePreview = createClass({
      render: function () {
        var entry = this.props.entry;
        var widgetFor = this.props.widgetFor;
        return h('div', { className: 'blocks-ref' },
          h('div', { className: 'post-preview' },
            h('div', { className: 'post-preview-title' }, widgetFor('title')),
            h('div', { className: 'post-preview-desc' }, widgetFor('description')),
            h('div', { className: 'post-preview-cover' }, widgetFor('cover')),
            h('div', { className: 'post-preview-body' }, widgetFor('body')),
            renderBlocksStatus(entry)
          ),
          h('div', { className: 'blocks-ref-prompt' },
            h('h2', null, 'LLM prompt — copy this'),
            h('div', { className: 'blocks-ref-sub' },
              'Copy the box below, paste it into ChatGPT/Claude together with your article, then paste what it gives back into the "Blocks — paste from LLM" field on the left. That single paste replaces clicking "Add" and typing into every field by hand.'),
            h('textarea', { readOnly: true, className: 'blocks-ref-prompt-box', value: LLM_PROMPT_TEXT,
              onClick: function (e) { e.target.select(); } })
          ),
          h('div', { dangerouslySetInnerHTML: { __html: BLOCKS_REFERENCE_HTML } })
        );
      }
    });
    CMS.registerPreviewTemplate('blog', BlocksReferencePreview);

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', user => {
        if (!user) {
          window.netlifyIdentity.on('login', () => {
            document.location.href = '/admin/';
          });
        }
      });
    }
  </script>
</body>
</html>
