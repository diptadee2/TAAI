  @media (min-width: 561px) { .today-card-right { border-left: 1px solid var(--line); padding-left: 22px; } }
  .hourly-activity { display: flex; flex-direction: column; height: 100%; }
  .hourly-activity-title { font-family: var(--font-nav); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 14px; }
  .hourly-activity-body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .hourly-activity-empty { font-size: 12px; color: var(--ink-soft); line-height: 1.4; margin: 0; }
  .hourly-activity-bars { display: flex; align-items: flex-end; gap: 6px; height: 130px; }
  .hourly-bar-col { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; height: 100%; }
  .hourly-bar-track { width: 100%; flex: 1; display: flex; align-items: flex-end; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; }
  /* One color family for every bar, not a different color for the
     busiest one — direct request ("keep the bars of the same colour but
     with increasing intensity of gradient"). --intensity (0.35-1, set
     inline per bar in JS from that bar's own share of the busiest hour)
     drives opacity instead — the busiest bar is always pct=100 by
     construction (it IS the max), so it's automatically the most vivid
     one, no per-bar color swap needed. A static (never animated) inset
     highlight along the top edge gives each bar a bit of glossy depth —
     safe regardless of the DOM-leak gotcha, since that only applies to
     an ANIMATED box-shadow/transform, not a plain static one.
     --bar-h/--grow-delay (set inline per bar) drive a one-shot grow-in
     on load instead of the bars just popping in at full height —
     "make the graph ... more dynamic" per direct request. Animating
     height (a layout property), not transform, so this doesn't
     implicate the leak gotcha either. Colors read --pomo-g1/--pomo-g2 —
     the same per-student Pomodoro ring/timer theme vars every other
     themed element on this page already reads (buttons, countdown chip,
     ring) — direct request ("make the bar graph colour gradients
     according to the theme selected for the pomodoro timer"), with the
     original 2-stop pairing's exact colors kept as the CSS fallback so
     a student who's never touched the theme picker (or the vars
     genuinely aren't set yet) sees byte-identical bars to before. Set on
     #app by applyPomoGradient() — see renderCalendar's now-unconditional
     call to it, widened from Focus-Mode-only specifically so this card
     (which also renders on the plain checklist) picks up the theme
     there too. */
  /* animation-play-state starts paused, held at the animation's own
     "from" state (height:0, via fill-mode `both`) until
     .hourly-activity picks up `.in-view` — a first-visit scroll
     animation, not something that plays the instant this markup lands
     in the DOM (which is very often below the fold — see
     observeHourlyActivityReveal's own comment). Pausing (not
     reassigning `animation` entirely) means the staggered
     --grow-delay only starts counting once actually played, so the
     cascade still looks right regardless of how long the section sat
     off-screen first. */
  .hourly-bar-fill { width: 100%; height: 0; opacity: var(--intensity); background: linear-gradient(180deg, var(--pomo-g1, #C99CFB), var(--pomo-g2, var(--purple))); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22); border-radius: 3px 3px 0 0; animation: hourly-bar-grow .7s cubic-bezier(.34,1.56,.64,1) both; animation-delay: var(--grow-delay); animation-play-state: paused; transition: filter .18s ease; }
  .hourly-activity.in-view .hourly-bar-fill { animation-play-state: running; }
  .hourly-activity.no-anim .hourly-bar-fill { animation: none; height: var(--bar-h); }
  .hourly-bar-fill:hover { filter: brightness(1.18); }
  @keyframes hourly-bar-grow { to { height: var(--bar-h); } }
  @media (prefers-reduced-motion: reduce) { .hourly-bar-fill { animation: none; height: var(--bar-h); } }
  .hourly-bar-label { position: relative; font-family: var(--font-nav); font-size: 10.5px; font-weight: 600; letter-spacing: .01em; color: var(--ink-soft); margin-top: 8px; white-space: nowrap; }
  /* Marks whichever bar covers this exact moment — "points to the
     current time period" — a small dot under its label, replacing the
     old peak-bar highlight (which pointed at the historically busiest
     bucket, a different concept the busy meter below no longer uses). */
  .hourly-bar-col--now .hourly-bar-label { color: var(--ink); font-weight: 800; }
  /* --pomo-g2 (the "signature" middle stop of the picked theme, same var
     the Reset/Skip button icons already use for their own accent) —
     matches the bars' own theming instead of staying a fixed purple
     regardless of what the student picked. --purple kept as the CSS
     fallback (Sunset's own g2 is literally var(--purple) already, so
     this is byte-identical at the default). */
  .hourly-bar-now-dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--pomo-g2, var(--purple)); margin-left: 4px; vertical-align: middle; }
  /* Reverted from a "reward" badge (glow, pink pill, animated gradient
     text, 🔥 icon) back to a plain informational line — direct
     feedback: "the busiest [line] is just information not a
     celebratory something". Its "dynamic" quality is now the actual
     word choice, not decoration: Chill vs. Intense is computed from the
     real data (see pomoHourlyActivityHtml's spikeRatio — how far the
     busiest window sits above the rest, not a fixed threshold on raw
     minutes), colored to match the read (a calm blue for a fairly even
     day, a warm amber for a real spike) but with no glow/pill/animation
     of any kind. */
  /* A real spectrum meter — Chill on one end, Intense on the other —
     rather than a plain caption ("i want the busiest one like a
     dynamic busy meter"). The track's own gradient represents the full
     spectrum always (fixed, not animated); the marker's position is
     what's actually dynamic, sliding to wherever state.liveCount (how
     many students are in a live session RIGHT NOW, polled separately —
     see hourlyBusyMeterHtml/startLiveCountPoll in progress.js) falls on
     it. Deliberately a different signal than the bars above it, which
     are a cumulative, all-time histogram of past completed sessions —
     direct request: "point to the current time period and base on how
     many people are live currently, this calculation is different from
     the bar graph calculation". No glow/pill/fire-emoji treatment, per
     an earlier round of feedback — this reads as a real gauge, not a
     celebration. Full width, not a narrower centered block — matches
     the bars above it (which already span the column's full width),
     direct feedback: "align and space it properly according to the
     content above". */
  .hourly-busy-meter { width: 100%; margin-top: 22px; }
  /* Plain static title, no live-count/hour-range text at all — direct
     request ("don't show the no of live users and the hourly interval,
     just busy meter and the meter"); that data still drives meterPct
     and the track's own hover tooltip, just isn't shown by default
     anymore. Left-aligned to match .hourly-activity-title above it (was
     centered — direct feedback: "align the heading properly" — the
     two titles in this one card need to share an alignment). Font-size
     and margin-bottom now byte-identical to .hourly-activity-title too
     (was 10.5px/12px vs. 11px/14px — direct follow-up: "can the busy
     meter have equal font size... maintaining equal spacing") — the two
     headings should read as one consistent pair, not two independently
     sized labels that happen to look similar. */
  .hourly-busy-meter-title { font-family: var(--font-nav); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 14px; }
  .hourly-busy-meter-track { position: relative; height: 6px; border-radius: 999px; background: linear-gradient(90deg, #7DD3FC, #A78BFA, #FBBF24); }
  /* A real CSS transition, not a @keyframes animation — a transition
     fires on any genuine property change to an element already in the
     DOM, which is what makes a later live update (see refreshLiveCount)
     glide smoothly from wherever the marker currently sits to its new
     position, rather than resetting to 0 and replaying from scratch on
     every 60s poll tick (direct feedback: "make the meter animations
     flawless" — that reset-and-replay was the actual flaw). The very
     first paint animates the exact same way: the marker starts at
     left:0% in the server-rendered markup, and animateHourlyBusyMeter
     (progress.js) sets the real target a frame later, so the same one
     transition mechanism handles both the initial slide-in and every
     live update after it — not two different systems. Animates `left`
     (a layout property), never `transform` — this marker isn't a leak
     risk either way (border-radius but no box-shadow), but staying
     consistent with the "animate layout position, not transform/
     box-shadow" discipline used for the bars' own grow-in above. The
     translate(-50%,-50%) is a fixed, unanimated centering offset, not
     part of what's moving. */
  /* A real slider-handle look — solid white fill (flat, not a gradient:
     the gradient-swatch saga earlier this session already established
     that any gradient on a circle this small reads as a muddy "shape
     inside the ball" rather than a clean fill), a dark ring for
     separation from the track's own colors at any position along it,
     and a soft drop shadow for a bit of tactile depth — direct request
     ("can the knob on the busy meter look better"). Both the ring and
     shadow are static (never animated — only `left`, via the transition
     below, ever changes), so this stays outside the box-shadow+
     border-radius DOM-leak gotcha regardless of the element carrying
     both. */
  .hourly-busy-meter-marker { position: absolute; top: 50%; left: 0; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(10,10,16,0.55), 0 2px 6px rgba(0,0,0,0.4); transform: translate(-50%, -50%); transition: left .8s cubic-bezier(.34,1.2,.64,1); }
  @media (prefers-reduced-motion: reduce) { .hourly-busy-meter-marker { transition: none; } }
  /* A 🔥 above the knob once it's solidly in Intense territory — direct
     request ("after a certain threshold of busy meter in the intense
     side can we have a fire emoji, on top of the knob maintaining equal
     spacing"). A CSS ::after on the marker itself rather than a separate
     DOM element — it then automatically tracks the marker's own `left`
     (and its transition) with zero extra JS, appearing/disappearing via
     a class toggle from the exact same code paths that already move the
     knob (hourlyMeterMarkerClass at render time, applyLiveCountUpdate on
     every live poll tick), so a session starting or ending that pushes
     the meter across the threshold updates the flame immediately, not
     just at page load. `top: -18px` matches the same spacing this page
     already used for a similarly-placed flame above the (now-removed)
     bar-chart peak indicator, for visual consistency with that earlier
     pattern rather than an arbitrary new offset. */
  .hourly-busy-meter-marker--fire::after { content: '🔥'; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 13px; line-height: 1; }
  .hourly-busy-meter-scale { display: flex; justify-content: space-between; font-family: var(--font-nav); font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); margin-top: 8px; }
  /* Inline Discord links (rename gate hint) */
  .discord-inline { color: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(88,101,242,0.7); }
  .discord-inline:hover { color: #8B9BFF; }
  /* Simplification pass (2026-10-08, "isn't it too much complex?"):
     1. the streak is a small line in the plan card, not its own big panel;
     2. the champions card is just the leaderboard (no up/down arrows);
     3. headings and labels in normal case on this page (the shared site
        nav and the timer's FOCUS/BREAK readout are left as they are);
     4. smaller gold marks in "Progress by subject". */
  /* Streak on the Today card's tag row (right side), 2026-10-08. */
  .today-tag-row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .today-card .today-tag-row .today-tag { margin-bottom: 0; }
  /* A touch larger (same day: "a tad bit small"). */
  /* Streak chip (redesigned 2026-10-08, "can the streak line be better
     looking"): a drawn amber flame instead of the emoji, the number in the
     same gold as the plan card's marks, a muted label, on a faint amber
     tint. At 0 it goes neutral grey. inline-flex + line-height 1 keeps the
     three on one centre line. */
  .today-streak { display: inline-flex; align-items: center; gap: 6px; line-height: 1; padding: 6px 11px 6px 9px; border-radius: 10px; background: rgba(251,146,60,0.10); border: 1px solid rgba(251,146,60,0.28); font-family: var(--font-nav); font-size: 13.5px; color: var(--ink-dim); white-space: nowrap; }
  .today-streak-flame { width: 18px; height: 18px; flex-shrink: 0; fill: #FB923C; }
  .today-streak b { display: inline-block; font-size: 17px; line-height: 1; color: #FBBF24; font-weight: 800; font-variant-numeric: tabular-nums; }
  .today-streak.is-zero { background: rgba(255,255,255,0.04); border-color: var(--line); }
  .today-streak.is-zero .today-streak-flame { fill: var(--ink-soft); }
  .today-streak.is-zero b { color: var(--ink); }
  .today-streak b.bump { animation: plan-bump .5s cubic-bezier(.34,1.56,.64,1); }
  @media (prefers-reduced-motion: reduce) { .today-streak b.bump { animation: none; } }
  .streak-champions-card .champions-section { border-left: 0; }
  #champions-card .leaderboard-row { grid-template-columns: 40px minmax(0,1fr) auto; }
  @media (max-width: 1080px) { .streak-champions-card { display: none; } }
  .leaderboard-title, .today-card .today-tag, .program-day-label, .hourly-activity-title, .hourly-busy-meter-title,
  .hourly-busy-meter-scale, .pomodoro-session-label, .pomo-settings-header, .leaderboard-columns, .leaderboard-you,
  .batch-migration-col-title, .reg-field label, .about-modal-title { text-transform: none; letter-spacing: normal; }
  .subject-breakdown .weightage-marks b { font-size: 13px; font-weight: 600; }

/* Compact desktop nav for laptop windows 1025-1279px (2026-10-19, "all the
   buttons in the nav bar at MacBook Air 13 inch default width, instead of
   hamburger"). Mouse devices keep the full nav down to 1025px; touch devices
   (iPads) still get the hamburger up to 1300px. Measured: the full nav needs
   ~1250px at its normal size, ~1010px with this. */
@media (min-width: 1025px) and (max-width: 1279px) and (pointer: fine) {
  .nav-inner { padding-left: 16px !important; padding-right: 16px !important; gap: 12px !important; }
  .nav-logo svg, .nav-logo img { width: 138px !important; }
  .nav-links { gap: 14px !important; font-size: 12px !important; }
  .nav-cta { gap: 6px !important; }
  .btn-nav-signin, .btn-nav-signup { padding: 10px 16px !important; font-size: 13px !important; }
  .btn-nav-contact { padding: 9px 12px !important; font-size: 13px !important; }
}

/* ==== HAMBURGER MENU, neo-brutalist (2026-10-19, "improve the look of the
   hamburger menu for all screen sizes", same block on all 7 pages and in
   blogs/blog.css). Cream panel, black rules, bordered rows with coloured icon
   tiles, current page in yellow, square Sign In / Sign Up. One column on
   phones, two from 600px (iPads). No border-radius anywhere, so the hard
   shadows never meet the Chromium shadow+radius animation leak. ==== */
body .nav-hamburger { width: 44px; height: 44px; background: #FFFFFF; border: 2px solid #111111; border-radius: 0; box-shadow: 3px 3px 0 #111111; gap: 5px; }
body .nav-hamburger:hover { background: #FDE047; }
body .nav-hamburger span, body .nav-hamburger.open span { background: #111111 !important; width: 20px; border-radius: 0; }
body .nav-hamburger.open { background: #FDE047; }
body .menu-overlay { background: rgba(17,17,17,0.3) !important; -webkit-backdrop-filter: blur(6px) !important; backdrop-filter: blur(6px) !important; }
/* The dimmed, blurred backdrop behind the open hamburger menu shows wherever the hamburger does (iPads too), not only on phones. */
@media (max-width: 1024px), (max-width: 1300px) and (pointer: coarse) { .menu-overlay { display: block; position: fixed; inset: 0; z-index: 48; opacity: 0; pointer-events: none; transition: opacity .3s ease; } .menu-overlay.open { opacity: 1; pointer-events: auto; } }
body .mobile-menu {
  background: rgba(255,244,214,0.62) !important; -webkit-backdrop-filter: blur(22px) saturate(160%) !important; backdrop-filter: blur(22px) saturate(160%) !important;
  border-bottom: 3px solid #111111 !important; box-shadow: none !important; border-radius: 0 !important;
  padding: 16px 16px 20px !important; gap: 8px !important;
  max-height: calc(100dvh - 64px); overflow-y: auto !important;
}
body .mobile-menu-link {
  background: #FFFFFF !important; color: #111111 !important; border: 2px solid #111111 !important; border-radius: 0 !important;
  padding: 10px 14px 10px 10px !important; gap: 12px !important;
  font-family: "Poppins", system-ui, sans-serif !important; font-size: 15px !important; font-weight: 700 !important;
  letter-spacing: 0 !important; text-transform: none !important;
}
body .mobile-menu-link::before { display: none !important; }
body .mobile-menu-link.active { background: #FDE047 !important; box-shadow: 3px 3px 0 #111111; }
@media (hover: hover) and (pointer: fine) { body .mobile-menu-link:hover { background: #FFF8E1 !important; } body .mobile-menu-link.active:hover { background: #FDE047 !important; } }
body .mobile-menu-link-icon {
  width: 34px; height: 34px; justify-content: center; opacity: 1 !important; color: #111111;
  border: 2px solid #111111; background: #F9A8D4;
}
body .mobile-menu-link:nth-of-type(6n+2) .mobile-menu-link-icon { background: #7DD3FC; }
body .mobile-menu-link:nth-of-type(6n+3) .mobile-menu-link-icon { background: #BEF264; }
body .mobile-menu-link:nth-of-type(6n+4) .mobile-menu-link-icon { background: #C4B5FD; }
body .mobile-menu-link:nth-of-type(6n+5) .mobile-menu-link-icon { background: #FDBA74; }
body .mobile-menu-link:nth-of-type(6n) .mobile-menu-link-icon { background: #FDE047; }
body .mobile-menu-link.active .mobile-menu-link-icon { background: #FFFFFF; }
body .mobile-menu-link-chevron { color: #111111 !important; opacity: 1 !important; }

  function daysUntilExam() {
    // Real calendar date — no Aug-1 floor here. That floor exists in
    // progress.js only for the tracker's schedule/streak math (which
    // genuinely starts Aug 1); this countdown has no such dependency and
    // should tick down every real day, not sit frozen until then.
    const pad = n => String(n).padStart(2, '0');
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
    const daysLeft = Math.ceil((new Date('2027-02-06') - new Date(todayStr)) / 864e5);
    return daysLeft > 0 ? daysLeft : null;
  }

    }, []);

    const reset = React.useCallback(() => {
      resetTimer.current = setTimeout(() => {
        const active = linksRef.current && linksRef.current.querySelector('a.active');
        if (active) moveTo(active.closest('.nav-dropdown-wrap') || active);
        else setPill(p => ({ ...p, visible: false }));
      }, 60);
    }, [moveTo]);

      if (!menuOpen) return;
      const close = e => { if (!e.target.closest('.nav') && !e.target.closest('.mobile-menu')) setMenuOpen(false); };

      return () => document.removeEventListener('pointerdown', close);
    }, [menuOpen]);

    const [signinPhase, setSigninPhase] = React.useState(0); // 0=Sign In, 1=X days, 2=GATE
    const signinTimerRef = React.useRef(null);
    React.useEffect(() => () => clearInterval(signinTimerRef.current), []);
    const startSigninCycle = (e) => {
      const btn = e.currentTarget;
      const linksEl = linksRef.current;
      const available = linksEl ? btn.getBoundingClientRect().left - linksEl.getBoundingClientRect().right : Infinity;
      if (available < 36) return; // not enough room to grow safely - skip the whole cycle
      const phases = [0, 1, 2];
      let i = 1;
      setSigninPhase(phases[i]);
      clearInterval(signinTimerRef.current);
      signinTimerRef.current = setInterval(() => {
        i++;
        if (i >= phases.length) {
          setSigninPhase(phases[0]);
          clearInterval(signinTimerRef.current);
          signinTimerRef.current = null;
          return;
        }
        setSigninPhase(phases[i]);
      }, 550);
    };

      clearInterval(signinTimerRef.current);
      signinTimerRef.current = null;
      setSigninPhase(0);
    };

    return (
      <>
        <div className={`menu-overlay${menuOpen ? ' open' : ''}`} onClick={() => setMenuOpen(false)} />
        <nav className={`nav${menuOpen ? ' menu-open' : ''}`}>
          <div className="nav-inner" onMouseLeave={reset}>
            <a href="/" className="nav-logo">
              <TAAILogo />
            </a>
            <div className="nav-links" ref={linksRef}>
              <div className="nav-pill" style={{ left: pill.left, width: pill.width, opacity: pill.visible ? 1 : 0 }} />
              {NAV_LINKS.map((l) => l.dropdown ? (
                <div key={l.href} className="nav-dropdown-wrap" onMouseEnter={(e) => moveTo(e.currentTarget)}>
                  {l.noClick ? <span className={l.active ? 'active' : ''}>{l.label}</span> : <a href={l.href} className={l.active ? 'active' : ''}>{l.label}</a>}
                  <div className="nav-dropdown">
                    {l.dropdown.map((d, i) => (
                      <React.Fragment key={i}>
                        {d.dividerBefore && <div className="nav-dd-divider" />}
                        <a href={d.href} className="nav-dd-item">{d.label}</a>
                      </React.Fragment>
                    ))}
                  </div>
                </div>
              ) : (
                <a key={l.href} href={l.href} className={l.active ? 'active' : ''}
                   onMouseEnter={(e) => moveTo(e.currentTarget)}>{l.label}</a>
              ))}
            </div>
            <div className="nav-cta">
              {daysLeft !== null ? (
                <a target="_blank" rel="noopener noreferrer" href="https://learn.taai.live/learn/account/signin" className={`btn-nav-signin btn-swap${signinPhase !== 0 ? ' signin-active' : ''}`}
                   onMouseEnter={startSigninCycle} onMouseLeave={stopSigninCycle}>
                  <span className="swap-default" style={{ transform: signinPhase === 0 ? 'none' : 'translateY(-100%)', opacity: signinPhase === 0 ? 1 : 0, transition: signinPhase === 0 ? 'transform .4s ease, opacity .4s ease' : 'transform .32s cubic-bezier(.16,1,.3,1), opacity .24s ease' }}>Sign In</span>
                  <span className="swap-hover" style={{ transform: signinPhase === 1 ? 'translateY(0)' : 'translateY(100%)', opacity: signinPhase === 1 ? 1 : 0, transition: signinPhase === 0 ? 'transform .4s ease, opacity .4s ease' : 'transform .32s cubic-bezier(.16,1,.3,1), opacity .24s ease' }}>{daysLeft} days</span>
                  <span className="swap-hover" style={{ transform: signinPhase === 2 ? 'translateY(0)' : 'translateY(100%)', opacity: signinPhase === 2 ? 1 : 0, transition: signinPhase === 0 ? 'transform .4s ease, opacity .4s ease' : 'transform .32s cubic-bezier(.16,1,.3,1), opacity .24s ease' }}>GATE</span>
                </a>
              ) : (
                <a target="_blank" rel="noopener noreferrer" href="https://learn.taai.live/learn/account/signin" className="btn-nav-signin">Sign In</a>
              )}
              <a target="_blank" rel="noopener noreferrer" href="https://learn.taai.live/learn/account/signup" className="btn-nav-signup">Sign Up</a>
              <a href="/contact" className="btn-nav-contact"><span className="phone-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg></span>Contact Us</a>
            </div>
            <button className={`nav-hamburger${menuOpen ? ' open' : ''}`} onClick={() => setMenuOpen(o => !o)} aria-label="Toggle menu">
              <span /><span /><span />
            </button>
          </div>
        </nav>
        <div className={`mobile-menu${menuOpen ? ' open' : ''}`}>
          {[{ label: 'Home', href: '/' }, ...NAV_LINKS].flatMap((l) => l.noClick && l.dropdown ? l.dropdown : l.href === '/gate-da-free-notes' ? [{ ...l, label: 'Free Notes & Lectures' }] : [l]).map((l, i) => (
            <a key={l.href} href={l.href} className={`mobile-menu-link${l.active ? ' active' : ''}`} style={{ animationDelay: `${0.04 + i * 0.05}s` }} onClick={() => setMenuOpen(false)}>
              <span className="mobile-menu-link-icon">{MENU_ICONS[l.href]}</span>
              <span className="mobile-menu-link-label">{l.label}</span>
              <span className="mobile-menu-link-chevron"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M4.5 2.5L8.5 6.5L4.5 10.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg></span>
            </a>
          ))}
          <div className="mobile-menu-divider" />
          <div className="mobile-menu-actions">
            <a target="_blank" rel="noopener noreferrer" href="https://learn.taai.live/learn/account/signin" className="btn-nav-signin">
              <span>Sign In</span>
              <span className="mobile-btn-arrow"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8H13M13 8L8 3M13 8L8 13" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg></span>
            </a>
            <a target="_blank" rel="noopener noreferrer" href="https://learn.taai.live/learn/account/signup" className="btn-nav-signup">
              <span>Sign Up</span>
              <span className="mobile-btn-arrow"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8H13M13 8L8 3M13 8L8 13" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg></span>
            </a>
          </div>
          <a href="/contact" className="mobile-menu-contact"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"/></svg>Contact Us</a>
        </div>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('nav-root')).render(
    <>
      <Nav />
      <div className="nav-spacer" />
    </>
  );
</script>
