     fixed gauge markings rather than another mode-colored element
     competing with the gradient arc/time text. */
  .pomo-tick { stroke: rgba(255,255,255,0.14); stroke-width: 1; stroke-linecap: round; }
  .pomo-tick--major { stroke: rgba(255,255,255,0.24); stroke-width: 1.5; }
  /* Gradient strokes (defs live inline in the SVG markup — see
     renderPomodoro in progress.js) instead of the old flat var(--purple)/
     var(--green), plus a soft matching glow so the ring itself reads as
     the focal point rather than a flat colored line. */
  .pomo-ring-progress { fill: none; stroke: url(#pomo-ring-gradient-work); stroke-width: 10; stroke-linecap: round; filter: drop-shadow(0 0 6px var(--pomo-glow, rgba(167,139,250,0.5))); transition: stroke-dashoffset 1s linear, filter .4s ease; }
  .pomodoro-card.on-break .pomo-ring-progress { stroke: url(#pomo-ring-gradient-break); filter: drop-shadow(0 0 6px var(--pomo-break-glow, rgba(74,222,128,0.5))); }
  /* Split at direct request into two separately-positioned pieces, rather
     than one shared block stacking both — FOCUS/BREAK sits genuinely
     inside the dome (the space the arc encloses), the countdown itself
     sits below the arc's flat diameter line entirely, where the full
     wrapper width is available with no dome-narrowing constraint at all
     (the actual root cause of the earlier clipping, now sidestepped
     rather than just given more room to clip less). 41%/59% is the
     diameter line — matches y=95 of the "M 25 95 A 75 75" path's 160-tall
     viewBox (95/160 ≈ 59%) in renderPomodoro. */
  .pomodoro-mode-wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 41%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; }
  .pomodoro-time-wrap { position: absolute; top: 59%; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  /* Bigger than before (12px -> 14px) plus a slow breathing pulse — the
     word is short (FOCUS/BREAK), nowhere near the width the countdown
     digits needed all this clearance for in the first place, so there's
     plenty of room in the dome for both changes without reintroducing
     the clipping problem documented above. The pulse itself only runs
     while .pomo-active is present — added/removed by updatePomoDisplay()
     based on pomo.running, so it's a "focus session actively happening"
     cue, not a constant idle animation running whether or not anyone's
     actually mid-session. */
  .pomodoro-mode { font-family: var(--font-nav); font-size: 14px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--pomo-g2, var(--purple)); transition: color .3s ease; }
  .pomodoro-mode.pomo-active { animation: pomoModePulse 2.2s ease-in-out infinite; }
  .pomodoro-card.on-break .pomodoro-mode { color: var(--pomo-break-g1, var(--green)); }
  @keyframes pomoModePulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.65; transform: scale(1.08); } }
  /* Same slow-drifting animated gradient .streak-number/.program-day-num
     already use elsewhere on this page (shared @keyframes streak-grad) —
     reused here rather than a new animation, so the whole timer (ring +
     number) reads as one deliberately "premium" gradient treatment, not
     the old flat purple text next to a flat purple ring. */
  .pomodoro-time { font-family: var(--font-body); font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; background: linear-gradient(120deg,var(--pomo-g1,#FF7FB7),var(--pomo-g2,var(--purple)),var(--pomo-g3,#4D8BFF)); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: streak-grad 6s ease infinite; }
  .pomodoro-card.on-break .pomodoro-time { background: linear-gradient(120deg,var(--pomo-break-g1,#4ade80),var(--pomo-break-g2,#22d3ee)); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; }

  .pomodoro-dots { position: relative; font-size: 19px; letter-spacing: 7px; margin-bottom: 4px; opacity: .95; }
  .pomodoro-session-label { font-family: var(--font-nav); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 20px; }
  .pomodoro-controls { position: relative; display: flex; gap: 10px; justify-content: center; }
  /* Icons added 2026-09-08 ("make the ... button animations and look
     better"). Two rounds of hover-lift attempts (combined translateY+scale
     on an overshoot curve, then plain translateY alone) were both still
     reported as having visible motion issues on the icon specifically
     ("still have an uncanny motion", then "still it exists" / "a visible
     jump/snap" once narrowed down). Root cause isn't the easing curve at
     all — even a mathematically smooth translateY(-2px) over ~220ms only
     advances a fraction of a pixel per frame, and browsers snap
     transformed layers to whole device pixels when compositing, so a
     movement this small on something this small (a ~13px icon, where a
     single pixel is ~8% of its own size) reads as a discrete step/snap
     between 2-3 pixel positions rather than a glide — no curve fixes that,
     since it's a rendering-precision limit, not an animation-quality one.
     Fixed by not moving these buttons on hover at all — background/
     box-shadow-only feedback, like .pomo-test-sound already uses nearby.
     The bounce on :active is unaffected — a discrete press has no
     "compare against my own previous frame" continuity for a viewer to
     perceive as jumpy the way an idle, continuously-rendered hover lift
     does. */
  /* Redesigned 2026-10-03 ("the pomodoro buttons look too ai slop"): the
     gradient pill with a colored glow and three equal-weight pills read as
     template chrome. Now one solid primary in the picked theme's middle
     color (dark text, so every preset stays legible), with Reset/Skip as
     quiet round icon buttons either side, like a media player. No
     box-shadow anywhere here, so the :active scale is safe from the
     box-shadow + border-radius leak; no hover movement (see the snap
     history in CLAUDE.md), only color changes. */
  .pomo-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 26px; border-radius: 14px; border: none; font-family: var(--font-nav); font-weight: 700; font-size: 14px; letter-spacing: .01em; cursor: pointer; transition: transform .16s cubic-bezier(.34,1.56,.64,1), background-color .18s ease, color .18s ease, border-color .18s ease, filter .18s ease; }
  /* Skip, greyed out mid-Focus-session (see pomo-skip's own disabled
     attribute/updatePomoDisplay). */
  .pomo-btn:disabled { opacity: .3; cursor: not-allowed; }
  .pomo-btn:focus-visible { outline: 2px solid var(--pomo-g2, var(--purple)); outline-offset: 3px; }
  .pomo-btn-icon { display: inline-flex; }
  .pomo-btn-primary { background: var(--pomo-g2, #A78BFA); color: #121016; min-width: 128px; }
  .pomo-btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
  .pomo-btn-primary:active:not(:disabled) { transform: scale(0.96); }
  .pomodoro-card.on-break .pomodoro-controls .pomo-btn-primary { background: var(--pomo-break-g2, #4ADE80); }
  .pomo-btn-secondary { width: 46px; padding: 0; border-radius: 50%; background: transparent; color: var(--ink-dim); border: 1px solid rgba(255,255,255,0.14); }
  .pomo-btn-secondary .pomo-btn-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .pomo-btn-secondary:hover:not(:disabled) { background: rgba(255,255,255,0.06); color: var(--ink); border-color: rgba(255,255,255,0.28); }
  .pomo-btn-secondary:active:not(:disabled) { transform: scale(0.92); }
  .pomodoro-controls { align-items: center; gap: 14px; }
  /* Fires once whenever Start/Pause actually toggles (see
     updatePomoDisplay) — a small overshoot bounce on just the icon (not
     the whole button, which already has its own press animation) so
     swapping between the play and pause glyphs reads as a deliberate
     confirmation, not an abrupt content swap. */
  .pomo-btn-icon-pop { animation: pomo-btn-icon-pop .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pomo-btn-icon-pop { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1); } }

  /* Enhanced 2026-09-08 ("enhance the pomodoro settings pane make it
     better") — was a bare dashed-line divider over a plain list of number
     inputs with no visual identity of its own. Now a distinct recessed
     panel (var(--bg-soft), one shade off the surrounding var(--card) card,
     same "sits inside" reading a settings drawer wants without a heavy
     shadow) with its own header, and each row gets a real stepper control
     (−/+ buttons either side of the number) instead of a bare input —
     tactile and immediately discoverable, where the old bare field relied
     on someone noticing it was typable or trying the keyboard arrows. */
  .pomo-settings { position: relative; margin-top: 20px; padding: 18px 16px; border-radius: 14px; background: var(--bg-soft); border: 1px solid var(--line); text-align: left; }
  .pomo-settings-header { font-family: var(--font-nav); font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 14px; }
  .pomo-setting-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; font-size: 13px; color: var(--ink-dim); }
  .pomo-setting-row label { flex: 1; }
  .pomo-stepper { display: inline-flex; align-items: stretch; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
  .pomo-stepper-btn { width: 26px; border: none; background: none; color: var(--ink-dim); font-family: var(--font-body); font-size: 15px; font-weight: 700; line-height: 1; cursor: pointer; display: grid; place-items: center; transition: background .2s, color .2s; }
  .pomo-stepper-btn:hover { background: rgba(139,92,246,0.14); color: var(--purple); }
  .pomo-stepper-btn:active { background: rgba(139,92,246,0.22); }
  .pomo-stepper input[type="number"] { width: 40px; padding: 6px 2px; border: none; border-left: 1.5px solid var(--line); border-right: 1.5px solid var(--line); background: none; color: var(--ink); font-family: var(--font-body); font-weight: 700; font-size: 14px; text-align: center; -moz-appearance: textfield; appearance: textfield; }
  /* Native spin buttons render inconsistently dark/near-invisible across
     engines (tried color-scheme + invert filters — still black in some
     browsers). Removing them entirely is the only reliable cross-browser
     fix — the stepper buttons either side of the field are the intended
     primary control now, typing a number directly still works too. */
  .pomo-stepper input[type="number"]::-webkit-inner-spin-button,
  .pomo-stepper input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .pomo-stepper input[type="number"]:focus { outline: none; background: rgba(139,92,246,0.1); }
  .pomo-setting-row span { font-size: 12px; color: var(--ink-soft); width: 26px; }
  /* Real-time feedback while typing into the Focus field (see the
     pomo-set-work 'input' listener) — appears the instant a value over
     POMO_WORK_MAX_MINUTES is typed, auto-hides itself a couple seconds
     later so it doesn't linger as stale UI once the student's moved on.
     Toggled via the .visible class, not the `hidden` attribute — `hidden`
     forces display:none instantly with nothing to transition, which is
     exactly why the fade-out used to look abrupt. opacity/max-height are
     both real transitions here, so showing AND hiding animate the same way
     instead of only the entrance being smooth. */
  .pomo-work-max-alert { font-size: 12px; color: var(--amber); text-align: left; margin: 0; max-height: 0; opacity: 0; overflow: hidden; transition: opacity .35s ease, max-height .35s ease, margin .35s ease; }
  .pomo-work-max-alert.visible { margin: -4px 0 10px; max-height: 32px; opacity: 1; }
  /* Ring color picker ("give people option within the settings pane to
     choose the gradient of their pomodoro, keep five gradients") — plain
     circular swatches, each just a solid preview of that preset's own
     gradient (inline style, set at render time — see
     pomoGradientSwatchesHtml), no separate color logic duplicated in CSS.
     .selected gets a ring rather than relying on the swatch's own color
     changing, since a border-color swap wouldn't read consistently across
     5 very different hues. */
  .pomo-gradient-row { align-items: center; }
  .pomo-gradient-swatches { display: flex; gap: 8px; }
  /* A role="button" <span>, not a real <button> (see
     pomoGradientSwatchesHtml's own comment) — Chrome's native button
     chrome (appearance:none fixed that) and then a separate, harder-to-
     pin Safari-specific native-control quirk both kept leaving a square
     artifact inside the circular clip even after that fix, so this
     sidesteps native control rendering entirely rather than chasing a
     second per-engine override. Scoped as .pomo-gradient-swatches
     .pomo-gradient-swatch (not just .pomo-gradient-swatch alone) because
     plain-tag selector .pomo-setting-row span (used for the stepper
     rows' "min" unit label) would otherwise win the cascade against a
     single-class selector and silently resize/recolor these — a real
     collision introduced by switching to a <span>, not present before. */
  .pomo-gradient-swatches .pomo-gradient-swatch { display: inline-block; width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: pointer; outline: none; transition: transform .2s cubic-bezier(.34,1.1,.64,1), border-color .2s; }
  .pomo-gradient-swatches .pomo-gradient-swatch:hover { transform: scale(1.12); }
  /* Safari focuses an element on a plain mouse click (Chrome doesn't),
     and its native focus ring is a known quirk for small round elements
     — it doesn't shrink/curve to match a tight border-radius, so it can
     render as a squarish halo around a circle. The previous swatch CSS
     had a blanket outline:none covering this by accident; rebuilding the
     swatch as a role="button" span (see the comment above) added real
     keyboard focus, and the :focus-visible-only replacement left plain
     :focus - exactly what a mouse click produces in Safari - with no
     override at all, so Safari's own squarish ring showed straight
     through. This is what "still square" turned out to actually be,
     confirmed by process of elimination once the swatch element itself
     measured as a true 22x22 circle with getBoundingClientRect(). Base
     rule suppresses the native ring outright; :focus-visible below
     restores a deliberate one for real keyboard nav. */
  .pomo-gradient-swatches .pomo-gradient-swatch:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .pomo-gradient-swatches .pomo-gradient-swatch.selected { border-color: var(--ink); box-shadow: 0 0 0 2px var(--card); }
  .pomo-test-row { display: flex; gap: 8px; margin-top: 8px; }
  .pomo-test-sound { flex: 1; padding: 8px 10px; font-size: 12px; font-family: var(--font-body); border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: var(--card); color: var(--ink-dim); cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
  .pomo-test-sound:hover { background: rgba(139,92,246,0.14); border-color: rgba(139,92,246,0.4); color: var(--ink); }
  .pomo-notify-tip { font-size: 11.5px; color: var(--ink-soft); text-align: center; line-height: 1.5; max-width: 300px; margin: 10px auto 0; }
  .pomo-notify-tip b { color: var(--ink-dim); font-weight: 600; }
  .pomo-settings-save { display: flex; width: 100%; margin-top: 14px; height: 44px; padding: 0 24px; font-size: 13px; }

  /* Inline notice shown below Start/Reset/Skip only after Start actually
     needed notification permission and didn't get it — see
     renderPomoNotifyNotice/pomoToggleRun, never shown preemptively. */
  .pomo-notify-notice { margin-top: 18px; padding: 16px 18px; border-radius: 14px; background: rgba(251,191,36,0.06); border: 1px solid rgba(251,191,36,0.25); text-align: left; }
  /* Same box treatment as .pomo-notify-notice above (a real amber "heads
     up" tone for the 2-3-incident warning band, no freeze yet), plus a
     more severe red variant for an active freeze — see
     renderPomoMalpracticeNotice in progress.js. */
  /* Sits IN PLACE OF .pomo-clock-wrap (ring/dots/controls), not below it
     — see renderPomoMalpracticeGateHtml. min-height roughly matches the
     clock area's own real footprint at this breakpoint (ring 272px +
     dots/label/controls) so the card doesn't visibly shrink when gated. */
  /* [hidden] override is required, not just tidy — a bare class rule
     setting `display` has the same specificity as the browser's own
     `[hidden] { display: none }` UA rule, and an author style always wins
     that tie, so without this the `hidden` attribute (toggled by the
     Okay button, see bindCalendarEvents) would silently do nothing and
     both the gate and the clock underneath it would show at once —
     caught from a real screenshot after clicking Okay, not assumed. */
  .pomo-malpractice-gate { margin-bottom: 18px; padding: 24px 22px; border-radius: 16px; text-align: center; min-height: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; opacity: 1; transform: scale(1) translateY(0); transition: opacity .32s cubic-bezier(.4,0,.2,1), transform .32s cubic-bezier(.4,0,.2,1); }
  .pomo-malpractice-gate[hidden] { display: none; }
  /* The clock's own fade-in handoff, coordinated with the gate's fade-out
     below (see the Okay handler in bindCalendarEvents) — an abrupt
     instant pop-in right after a smooth dismiss read as a mismatched,
     jarring handoff; this makes the two feel like one continuous
     transition instead of two unrelated ones stitched together. No
     border-radius/box-shadow on this wrapper, so transform+opacity here
     is safe against this file's own known Chromium DOM-node-leak gotcha. */
  .pomo-clock-wrap { opacity: 1; transform: scale(1); transition: opacity .3s ease, transform .3s ease; }
  .pomo-clock-wrap--revealing { opacity: 0; transform: scale(0.98); }
  @media (prefers-reduced-motion: reduce) { .pomo-clock-wrap { transition: none; } }
  /* Dismiss-on-Okay animation (see the click handler in bindCalendarEvents,
     which adds this class, waits for it to finish, then sets `hidden`) —
     safe to animate `transform` directly on this element since it has no
     `box-shadow` (only `border-radius`), so this doesn't trip the
     Chromium DOM-node-leak gotcha that combination causes elsewhere on
     this page. Respects prefers-reduced-motion (an instant, un-animated
     dismiss rather than the fade+scale). */
  .pomo-malpractice-gate--dismissing { opacity: 0; transform: scale(0.92) translateY(-10px); }
  @media (prefers-reduced-motion: reduce) { .pomo-malpractice-gate { transition: none; } }
  .pomo-malpractice-gate .pomo-gate-title { font-size: 16px; margin-bottom: 0; }
  .pomo-malpractice-gate .pomo-gate-body { max-width: 300px; margin: 0; }
  .pomo-malpractice-gate #pomo-malpractice-okay { margin-top: 8px; width: auto; padding-left: 32px; padding-right: 32px; }
  .pomo-malpractice-gate--warning { background: rgba(251,191,36,0.06); border: 1px solid rgba(251,191,36,0.25); }
  .pomo-malpractice-gate--freeze { background: var(--red-soft); border: 1px solid rgba(248,113,113,0.35); }
  .pomo-malpractice-gate--freeze .pomo-gate-title { color: var(--red); }
  /* Calm purple, not amber/red — this isn't a violation notice, just
     administrative housekeeping (see renderPomoRenameGateHtml), so it
     shouldn't read with the same alarm as the malpractice states it
     shares this box with. */
  .pomo-malpractice-gate--rename { background: var(--purple-soft); border: 1px solid rgba(139,92,246,0.35); }
  .pomo-malpractice-gate--rename .pomo-gate-title { color: var(--purple); }
  .pomo-malpractice-gate--rename .rename-form { justify-content: center; margin-top: 4px; gap: 10px; }
  /* This form reuses .rename-form (also used by the small inline "Rename"
     link at the top of the page), whose own .rename-form input/button
     rules are tuned for that tiny inline context — not big enough or
     visually weighted enough for the main focal action of a full gate
     card. Scoped overrides here, not a new class, so this still benefits
     from any future shared tweak to the base form styling. */
  .pomo-malpractice-gate--rename .rename-form input { min-width: 200px; padding: 11px 16px; font-size: 14px; border-radius: 12px; }
  /* Real bug, not just a size tweak: .rename-form button's own
     background:none/border:none/text-decoration:underline (0,1,1
     specificity) was silently beating .pomo-btn-primary's gradient
     (0,1,0) on this exact button, despite both classes being present in
     the markup — confirmed by the rendered result being a plain
     underlined text link instead of the intended gradient pill. This
     restores it explicitly, at higher specificity, rather than fighting
     the cascade a different way. */
  .pomo-malpractice-gate--rename .rename-form .pomo-btn-primary {
    background: var(--pomo-g2, #A78BFA); color: #121016; text-decoration: none;
    padding: 0 24px; height: 42px; border-radius: 12px;
    display: inline-flex; align-items: center; gap: 6px; min-width: 0;
  }
  .pomo-malpractice-gate--rename .rename-form .pomo-btn-primary:hover:not(:disabled) { opacity: 1; filter: brightness(1.08); }
  .pomo-malpractice-gate--rename .rename-form .pomo-btn-primary:disabled { opacity: .75; cursor: default; }
  .pomo-gate-title { font-family: var(--font-nav); font-weight: 700; font-size: 14px; margin-bottom: 8px; color: var(--amber); }
  .pomo-gate-body { font-size: 13px; color: var(--ink-dim); line-height: 1.55; margin: 0 0 12px; }
  .pomo-gate-hint { font-size: 11.5px; color: var(--ink-soft); margin: 8px 0 0; }
  .pomo-gate-hint--urgent { color: var(--red); font-weight: 600; }
  .pomo-gate-steps { padding-left: 20px; font-size: 13px; color: var(--ink-dim); line-height: 1.6; margin: 0 0 14px; }
  .pomo-gate-steps li { margin-bottom: 6px; }
  .pomo-gate-steps strong { color: var(--ink); }
  .pomo-notify-notice .pomo-btn { min-width: auto; height: 40px; padding: 0 20px; }
  /* Always visible, not conditional on any permission state — most people
     never open the settings panel where this used to be the only place
     explaining that a browser's own "allow notifications" isn't the same
     as the computer's per-app notification permission. */
  .pomo-notify-permanent-tip { font-size: 11.5px; color: var(--ink-soft); text-align: center; line-height: 1.5; max-width: 300px; margin: 14px auto 0; }

  /* Focus leaderboard — public display names, ranked by total focus minutes */
  .leaderboard-card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 18px 20px; margin-bottom: 20px; max-width: 420px; margin-left: auto; margin-right: auto; }
  /* The card is a clickable control (jumps to Focus Mode — see
     bindCalendarEvents), so it needs its own focus-visible ring since
     it's a div with role="button", not a real <button>/<a> that gets one
     automatically. */
  .clickable-card { cursor: pointer; transition: border-color .2s ease, background .2s ease; }
  .clickable-card:hover { border-color: rgba(139,92,246,0.35); background: rgba(139,92,246,0.06); }
  .clickable-card:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .leaderboard-title { font-family: var(--font-nav); font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); text-align: left; }
  /* Real bug, caught from a screenshot: the badge is absolutely
     positioned (see .new-badge-wrap), so it doesn't reserve any space in
     the title's own layout — without this, a long enough title (still
     possible even left-aligned — see text-align above) can flow straight
     through where the badge sits, visibly overlapping/clipping it. Only
     applied when the badge is actually showing (has-badge, added
     conditionally at each render — see renderLastWeekChampions, the only
     one of the two leaderboard cards that still has a badge), so the
     vastly more common badge-free state keeps the title at its natural,
     unpadded width. */
  .leaderboard-title.has-badge { padding-right: 48px; }
  .leaderboard-subtitle { font-size: 11px; color: var(--ink-soft); opacity: .7; text-align: left; margin-bottom: 12px; margin-top: 2px; }
  /* Centering the title/subtitle (tried earlier) looked wrong once the
     RANK/NAME/STREAK/MINUTES column header row shipped underneath it —
     a centered heading floating above a left-anchored table row reads
     as misaligned rather than intentional. Left-aligned instead, so it
     starts at the same edge as RANK below it; sized up (15px, tighter
     letter-spacing, brighter color) so it clearly outranks the 10px
     column labels instead of reading as a same-size sibling to them.
     Still doesn't actually line up with RANK though — .leaderboard-
     columns/.leaderboard-row both carry their own 10px horizontal
     padding (see below) that the title/subtitle never had, leaving a
     real 10px gap between the title's left edge and RANK's. Matched
     here, scoped to #leaderboard-card only (the champions/top-5 card
     shares these same base classes and wasn't part of this request). */
  #leaderboard-card .leaderboard-title,
  #leaderboard-card .leaderboard-subtitle { padding-left: 10px; }
  /* CSS Grid, not flexbox — flexbox's shrink math (each item's share of
     negative space is weighted by flex-shrink*flex-basis) let the streak
     column's flex:1/basis:0% collapse to a literal 0px box whenever the
     row was oversubscribed, even with real ball content inside it
     (confirmed: reproduced at narrow widths). Grid's minmax() gives each
     column a real, unconditional floor instead — name is the only column
     that can shrink toward 0 (via ellipsis), everything else is
     guaranteed its minimum no matter how tight the row gets. */
  /* Base rule — the 3-column shape actually rendered by the champions/
     top-5 card (renderLastWeekChampions: rank, name, minutes only, no
     streak/status/timer). #leaderboard-card below overrides this with
     its own 6-column template. Real regression, caught from a
     screenshot: both cards share .leaderboard-row, but the top-20
     board's 6-column grid-template-columns used to apply here
     unconditionally — with only 3 child elements, grid auto-placement
     shoved them into the wrong tracks (name landed in a 130px column
     squeezed down to 0 width by the champions card's narrower
     container, minutes landed in the *streak* column instead of its
     own, both looking blank/misplaced on the champions card specifically). */
  /* 16px dedicated column for the rank-movement arrow (.rank-move-col),
     right after Rank — its own grid track, not sharing space with or
     positioned relative to the rank number/medal at all. Earlier
     versions tried to attach the arrow directly to the rank cell (inline
     with a gap, then an absolutely-positioned corner badge with a
     different anchor for medals vs digits) and kept fighting the same
     problem: medals and digits are different sizes, so "relative to the
     rank content" was never going to put both groups' arrows at the same
     x. A fully independent column sidesteps that entirely — every row's
     arrow sits in the exact same place regardless of what's in Rank. */
  .leaderboard-row { display: grid; grid-template-columns: 40px 16px minmax(0,1fr) auto; align-items: center; gap: 16px; padding: 12px 14px; border-radius: 10px; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,0.06); text-align: left; }
  /* Staggered entrance for the daily top-10 board on a genuine page
     load/visit ("can i have subtle animation as the daily top 10 loads")
     — see renderTodayLeaderboardRows' animate param in progress.js, which
     deliberately only passes this on the initial render, not on the
     background poll's periodic patch (same "don't replay an entrance
     effect on a routine update" reasoning as every .fade-in element on
     this page). First pass (plain fade + 8px rise on a gentle ease) was
     rejected as too flat ("make a better animation") — re-done with a
     bigger rise (16px), a touch of scale (0.96→1, safe here unlike the
     Pomodoro-button icon incident above since this animates a large
     ~300px-wide row once on load, not a ~13px icon on continuous hover),
     and the site's own signature overshoot-and-settle bezier
     (cubic-bezier(.34,1.56,.64,1), already used for bump/pop moments
     elsewhere on this page) instead of a plain ease, so each row arrives
     with a small deliberate bounce rather than just fading up flatly.
     `both` fill-mode holds the from-keyframe (invisible) during each
     row's animation-delay, so staggered rows don't flash visible-then-
     hide before their own delay elapses. */
  .leaderboard-row--enter { animation: leaderboard-row-in .55s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes leaderboard-row-in { from { opacity: 0; transform: translateY(16px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @media (prefers-reduced-motion: reduce) { .leaderboard-row--enter { animation: none; } }
  /* Day rollover (2026-11-13): yesterday's top-10 lifts away row by row,
     then the card fades, before it's removed (animateTodayBoardOut). */
  .leaderboard-row--exit { animation: leaderboard-row-out .36s cubic-bezier(.4,0,1,1) both; }
  @keyframes leaderboard-row-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-12px) scale(0.96); } }
  #today-leaderboard-card.today-board--leaving { opacity: 0; transform: translateY(10px) scale(0.98); transition: opacity .42s ease, transform .42s ease; }
  @media (prefers-reduced-motion: reduce) { .leaderboard-row--exit { animation: none; } #today-leaderboard-card.today-board--leaving { transition: none; } }
  /* Sized up across the board (row font/padding, rank, streak balls,
     status pill, timer, minutes) rather than adding another metric to
     fill the empty space in the (often-blank) Streak column for
     non-streaking students — the columns themselves stay the same
     layout, just heavier/more substantial content within them, per
     explicit "make stuff bigger, don't add a column" direction. Fixed
     column widths (rank/status/timer/time) widened to match. Scoped to
     #leaderboard-card (the top-20 board specifically) since the
     champions/top-5 card — sharing .leaderboard-row's base rule above —
     never renders streak/status/timer content and needs its own
     simpler shape instead.

     Name's own cap grew 130px→180px ("can we have the same spacing fix
     here" — the same name-truncation problem already fixed on Today's
     Leaders, "GATE DA ASPIRANT" clipping to "GATE DA ASPI…"). The extra
     50px originally came out of the Streak column's own flexible space
     — most rows carry 0-5 small streak balls, nowhere near enough to
     actually need the width that column was otherwise sitting on
     unused. Streak was later capped outright (was the row's one 1fr
     column; Name is now, see below) once effort badges needed real
     room beside the name too — direct request: "all the badges should
     be present beside the name, move the streak column right towards
     the negative space side to free more space for the badges". Streak
     itself never actually needs more than a handful of 10px balls plus
     an overflow chip (~105px worst case), so capping it at 115px still
     comfortably fits every real row while giving Name whatever's left
     over instead of Streak hoarding it unused. */
  /* Name capped rather than left fully open-ended (1fr) — direct
     correction: an unbounded Name column grew to hundreds of pixels on
     a wide viewport, dragging its own centered header label ("NAME")
     visually far from the left-aligned row content beneath it
     ("positioned wrongly"), and left Streak's own (then-capped) column
     hugging the right edge next to Status instead of sitting in the
     freed middle space. 300px comfortably fits a long name + up to 4
     badges (4 × ~22px) with room to spare. Streak is the flexible
     column again, but see .leaderboard-streak below for how its
     content is kept centered within that space rather than pinned to
     its own left edge, which is what actually reads as "the streak
     column sitting in the middle of the negative space." */
  /* 8 columns since the About column (2026-09-30): Name keeps a capped
     width, About is now the ONE flexible column (so a student's About
     stays permanently visible in the middle space instead of hidden
     behind a hover icon), and Streak moved right into a fixed track
     beside Status — sized for its worst case (5 balls + overflow badge).
     Must match .leaderboard-columns below exactly. */
  #leaderboard-card .leaderboard-row { grid-template-columns: 40px 16px minmax(150px,220px) minmax(0,1fr) 140px 76px 60px 44px; }
  .leaderboard-row:last-child { border-bottom: none; }
  .leaderboard-row--top { padding-top: 14px; padding-bottom: 14px; }
  .leaderboard-row--me { background: rgba(139,92,246,0.1); border-bottom-color: transparent; }
  /* min-width:0 on every grid item here, not just .leaderboard-name —
     a grid item's default min-width is auto (its content's min-content
     size), which can override the track's own minmax() lower bound and
     blow the layout out in browser-dependent ways. Explicit 0 everywhere
     closes that off regardless of content length. */
  .leaderboard-rank { font-family: var(--font-nav); font-weight: 700; font-size: 14px; color: var(--purple); text-align: center; min-width: 0; }
  .leaderboard-row--top .leaderboard-rank { font-size: 20px; }
  /* Up/down arrow when the rank changed since the last refresh (see
     previous_week_rank / rankMovementHtml in progress.js) — reuses the
     existing green/amber vocabulary (.day-status.complete / .missed)
     rather than introducing a new red, since this is relative movement,
     not a pass/fail signal.
     Lives in its own dedicated 16px grid column now (see
     .leaderboard-row above), always rendered (blank span when there's
     no movement to show) so the column reserves the same space either
     way — same pattern as the empty-state spans for streak/status/
     timer. This replaced two earlier attempts that tried to position
     the arrow relative to the rank number/medal itself (inline, then an
     absolutely-positioned corner badge with a different anchor per
     rank type) — both kept fighting the fact that a medal and a plain
     digit are different sizes, so anything anchored to "the rank
     content" put top-3 and rank-4+ arrows at different x positions. A
     fully independent column has no such dependency: every row's arrow
     sits in the exact same spot regardless of what Rank contains. */
  /* padding-right nudges the arrow left, off dead-center in its 16px
     column — it otherwise sat close enough to the live-dot (start of
     the Name column right after) that the two small colored shapes
     read as one cluttered pair rather than two distinct signals. */
  .rank-move-col { display: flex; align-items: center; justify-content: center; padding-right: 3px; }
  /* SVG (see rankMovementHtml in progress.js), not the bare Unicode
     ▲/▼ glyph it replaced — rounded corners (stroke-linejoin:round on
     the path itself) read as more polished than a flat glyph without
     needing anything else. A drop-shadow glow was tried here for extra
     polish (matching the streak balls/status pills) and reverted: real
     bug, caught from a screenshot — filter:drop-shadow() at this size
     rendered as a visible rectangular halo around the triangle in
     Chromium instead of hugging its actual outline, looking like a
     stray square artifact rather than a glow. */
  .rank-move { display: block; }
  .rank-up { color: var(--green); }
  .rank-down { color: var(--amber); }
  /* A drop of more than BIG_DROP_THRESHOLD positions (progress.js) —
     amber alone didn't distinguish "slipped one spot" from "fell off a
     cliff", worth calling out more sharply than an ordinary drop. */
  .rank-down-big { color: var(--red); }
  .leaderboard-name { min-width: 0; font-weight: 600; color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leaderboard-name[data-alltime] { cursor: default; }
  /* Custom all-time-minutes hover tooltip (progress.js's setupAllTimeTooltip)
     — one shared element, appended to <body> and positioned `fixed` via JS
     off the hovered name's own rect, not a CSS ::after on .leaderboard-name
     itself: that element already has `overflow: hidden` for its own
     ellipsis-truncation (above), which would clip a pseudo-element tooltip
     outright, and `position: fixed` off <body> also sidesteps
     .streak-champions-card's own `overflow: hidden` clipping #champions-card's
     rows near either edge. */
  /* Leaderboard "About" (WhatsApp-style status) — a small chat icon
     beside the name on the weekly top-20 board, the text itself in a
     chat bubble on hover/tap (progress.js, aboutBubbleHtml/
     showAboutBubble). Flat, same --card/--line idiom as every other
     card on this page, no glow. The bubble is a <body>-level singleton
     like .alltime-tooltip, so .leaderboard-name's overflow:hidden can't
     clip it. */
  .about-bubble-icon { display: inline-flex; align-items: center; justify-content: center; vertical-align: -1px; margin-left: 2px; color: var(--pomo-g2, var(--purple)); opacity: .8; cursor: pointer; border-radius: 4px; transition: opacity .15s ease; }
  .about-bubble-icon:hover, .about-bubble-icon:focus-visible { opacity: 1; outline: none; }
  .leaderboard-col-about { min-width: 0; text-align: center; }
  .leaderboard-about { min-width: 0; display: flex; align-items: center; justify-content: center; }
  /* Drawn from the local cache while the fresh request is in flight. */
  .stale-note { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 400; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 12.5px; color: var(--ink-dim); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .stale-note--err { color: var(--ink); }
  .stale-note button { margin-left: 6px; background: none; border: none; color: var(--pomo-g2, var(--purple)); font: inherit; font-weight: 700; cursor: pointer; padding: 0; }
  #app.is-stale .task-row input[type=checkbox], #app.is-stale #pomo-toggle { cursor: progress; opacity: .6; }
  .today-empty { margin: 14px 0 0; font-size: 14px; color: var(--ink-soft); }
  .today-empty strong { color: var(--ink-dim); }
  .today-preview-note { margin: -4px 0 10px; font-size: 13.5px; color: var(--ink-soft); }
  .schedule-coming-soon { margin: 24px 0; padding: 28px 24px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .schedule-coming-soon-title { font-family: var(--font-nav); font-size: 18px; font-weight: 700; letter-spacing: .01em; color: var(--pomo-g2, var(--purple)); margin-bottom: 6px; }
  .schedule-coming-soon p { margin: 0; font-size: 13.5px; color: var(--ink-dim); }
  .schedule-coming-soon strong { color: var(--ink); }
  .leaderboard-about-chip { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: #2a2a33; border: 1px solid var(--line); border-radius: 10px 10px 10px 3px; padding: 4px 10px; font-size: 12.5px; font-weight: 500; color: var(--ink-dim); line-height: 1.35; cursor: default; }
  .leaderboard-about-chip:focus-visible { outline: 1px solid var(--pomo-g2, var(--purple)); outline-offset: 1px; }
  .leaderboard-row--me .leaderboard-about-chip { color: var(--ink); }
  /* Today's Leaders: only the name text itself truncates, so a long name
     can't clip the About icon or badge that follow it. */
  #today-leaderboard-card .leaderboard-name { display: flex; align-items: center; }
  #today-leaderboard-card .lb-name-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #today-leaderboard-card .leaderboard-about-icon, #today-leaderboard-card .leaderboard-effort-badge { flex-shrink: 0; }
  .leaderboard-about-icon { display: inline-flex; align-items: center; justify-content: center; vertical-align: -2px; margin-left: 7px; color: #fff; opacity: .32; cursor: pointer; border-radius: 4px; transition: opacity .15s ease; }
  .leaderboard-about-icon:hover, .leaderboard-about-icon:focus-visible { opacity: .75; outline: none; }
  /* Unread (outline) sits a little brighter than read (filled), so a new
     About catches the eye without adding any color. */
  .leaderboard-about-icon:not(.is-read) { opacity: .6; }
  .leaderboard-about-icon:not(.is-read):hover { opacity: .9; }
  .leaderboard-about-add { background: transparent; border: 1px dashed var(--line); border-radius: 10px 10px 10px 3px; padding: 4px 10px; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--ink-soft); cursor: pointer; transition: border-color .15s ease, color .15s ease; }
  .leaderboard-about-add:hover { border-color: var(--pomo-g2, var(--purple)); color: var(--ink); }
  .about-bubble { position: fixed; z-index: 9000; max-width: 260px; background: #2a2a33; color: var(--ink); border: 1px solid var(--line); border-radius: 12px 12px 12px 4px; padding: 8px 12px; font-size: 13px; line-height: 1.4; white-space: normal; overflow-wrap: anywhere; box-shadow: 0 8px 24px rgba(0,0,0,0.45); opacity: 0; pointer-events: none; transform: translateY(4px); transition: opacity .15s ease, transform .15s ease; }
  .about-bubble.visible { opacity: 1; transform: translateY(0); }
  /* Thought-bubble tail: two small trailing circles instead of a pointed
     speech tail, matching the thought-bubble icon. */
  .about-bubble { border-radius: 14px; }
  .about-bubble::before, .about-bubble::after { content: ''; position: absolute; background: #2a2a33; border: 1px solid var(--line); border-radius: 50%; }
  .about-bubble::before { width: 9px; height: 9px; left: var(--tail-x, 12px); bottom: -12px; }
  .about-bubble::after { width: 5px; height: 5px; left: calc(var(--tail-x, 12px) - 5px); bottom: -19px; }
  .about-bubble--below { border-radius: 14px; }
  .about-bubble--below::before { bottom: auto; top: -12px; }
  .about-bubble--below::after { bottom: auto; top: -19px; }
  .about-edit-btn { display: inline-flex; align-items: center; gap: 6px; margin: -4px 0 12px 10px; padding: 5px 10px; background: transparent; border: 1px solid var(--line); border-radius: 8px; color: var(--ink-dim); font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: border-color .15s ease, color .15s ease; }
  .about-edit-btn svg { color: var(--pomo-g2, var(--purple)); }
  .about-edit-btn:hover { border-color: var(--pomo-g2, var(--purple)); color: var(--ink); }
  .leaderboard-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .about-edit-btn.about-edit-btn--inline { margin: 0; padding: 4px 9px; font-size: 11.5px; flex-shrink: 0; }
  .about-flag-note { margin: -4px 10px 12px; font-size: 12px; line-height: 1.45; color: var(--red); }
  .about-flag-note[hidden] { display: none; }
  .about-modal-removed { margin: 8px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--red-soft); color: var(--red); font-size: 12.5px; line-height: 1.45; font-weight: 600; }
  .about-modal-backdrop { position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; animation: about-fade .15s ease; }
  .about-modal { width: min(420px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 22px 18px; text-align: left; }
  .about-modal-title { font-family: var(--font-nav); font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); }
  .about-modal-sub { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; margin: 6px 0 16px; }
  .about-modal-sub strong { color: var(--ink-dim); }
  .about-modal-preview { margin-bottom: 12px; }
  .about-modal-preview-bubble { display: inline-block; max-width: 100%; background: #2a2a33; border: 1px solid var(--line); border-radius: 12px 12px 12px 4px; padding: 8px 12px; font-size: 13px; line-height: 1.4; color: var(--ink); overflow-wrap: anywhere; }
  .about-modal-input { width: 100%; box-sizing: border-box; resize: none; background: var(--bg-soft, #1b1b20); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); font-family: inherit; font-size: 14px; line-height: 1.4; }
  .about-modal-input:focus { outline: none; border-color: var(--pomo-g2, var(--purple)); }
  .about-modal-count { text-align: right; font-size: 11px; color: var(--ink-soft); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .about-modal-locked { font-size: 13px; color: var(--ink-dim); margin: 0 0 4px; }
  .about-modal-error { font-size: 12.5px; color: var(--red); font-weight: 600; margin: 8px 0 0; }
  .about-modal-actions { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .about-modal-spacer { flex: 1; }
  .about-modal-cancel, .about-modal-remove { background: transparent; border: none; color: var(--ink-soft); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 8px 6px; }
  .about-modal-cancel:hover { color: var(--ink); }
  .about-modal-remove:hover { color: var(--red); }
  .about-modal-save { padding: 9px 20px; }
  .about-modal button:disabled, .about-modal textarea:disabled { opacity: .5; cursor: not-allowed; }
  @keyframes about-fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .about-modal-backdrop { animation: none; } .about-bubble { transition: none; } }
  .alltime-tooltip { position: fixed; z-index: 200; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; font-size: 12px; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.45); opacity: 0; pointer-events: none; transform: translateY(4px); transition: opacity .15s ease, transform .15s ease; }
  .alltime-tooltip-label { color: var(--ink-soft); font-weight: 500; }
  .alltime-tooltip-value { color: var(--pomo-g2, var(--purple)); font-weight: 700; }
  .alltime-tooltip.visible { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .alltime-tooltip { transition: opacity .15s ease; transform: none; } }
  /* Tap-to-show tooltip on touch screens (see setupTouchTips in progress.js): wraps instead of one long line. */
  .touch-tip { white-space: normal; max-width: min(280px, calc(100vw - 16px)); line-height: 1.4; color: var(--ink); }
  /* Disabled buttons swallow taps; let them pass through so the tap tip can explain why they're greyed out. */
  @media (hover: none) { #app button[disabled][title] { pointer-events: none; } }
  /* Only present when the hovered student has earned at least one
     effort badge (see showAllTimeTooltip) — explains each one right
     next to the "All time" figure it's derived from, rather than
     requiring a separate click on the Name column's "?" toggle. */
  .alltime-tooltip-badges { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
  .alltime-tooltip-badge-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-soft); }
  .alltime-tooltip-badge-row .leaderboard-effort-badge { margin-left: 0; }
  /* "Live now" indicator — a small pulsing green dot before the name of
     anyone currently mid-focus-session (see is_live in pomodoro-
     leaderboard.js). .live-dot-slot is a fixed-width reserved space,
     always rendered whether or not the row is actually live — leaving
     it out entirely for non-live rows meant every name's text started
     at a different x depending on the previous row's live state, same
     misalignment already fixed once for the streak balls. .live-dot-
     wrap (no box-shadow/border-radius of its own) is what's actually
     animated; .live-dot (the glow, via box-shadow+border-radius
     together) stays static — animating transform on an element
     carrying both is the Chromium DOM-node-leak gotcha documented in
     CLAUDE.md. */
  .live-dot-slot { display: inline-block; vertical-align: middle; width: 13px; }
  .live-dot-wrap { display: inline-block; vertical-align: middle; margin-bottom: 1px; animation: live-pulse 1.6s ease-in-out infinite; }
  .live-dot { display: block; width: 7px; height: 7px; border-radius: 50%; background: #34D399; box-shadow: 0 0 5px rgba(52,211,153,0.75); }
  @keyframes live-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(0.75); } }
  .leaderboard-you { display: inline-block; font-family: var(--font-nav); font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--purple); background: rgba(139,92,246,0.16); border-radius: 999px; padding: 1px 7px; margin-left: 4px; vertical-align: middle; }
  /* Each earned milestone is its own small tier-colored badge — several
     can render side by side on one name (see effortBadgesHtml), so each
     needs its own visual boundary to read as a distinct earned badge.
     A bare colorless dot (the very first fix, in response to the
     original "emojis inside circle is a bad idea" report) turned out
     to be an overcorrection of its own — direct follow-up: "can't we
     have some minimal yet illustrative badges?" Holds a small inline
     SVG silhouette now (see the EFFORT_ICON_ constants and EFFORT_TIERS in progress.js)
     instead of either a font emoji or nothing — a hand-authored vector
     shape stays crisp at any size, unlike the emoji glyph that broke at
     13px in the first place, while still being genuinely illustrative
     (a real star/flame/bolt/crown silhouette, not just a color). Grown
     from 13px to 16px to give the icon real room to read clearly —
     still small and minimal, just no longer AS cramped as the size that
     caused the original emoji-legibility problem. Centered via plain
     flex (align-items/justify-content) rather than any pixel-tuned
     padding — an SVG scales/centers cleanly within its own box by
     construction, unlike a font glyph, so none of the old canvas-pixel-
     measured emoji-ink-centering hacks (a padding-top tuned per board)
     are needed here at all. Still flat, no box-shadow/border glow —
     kept from an earlier direct request ("can't the design of the
     badges be a bit more matte than glossy") that predates all of this
     but is equally true of an icon-in-a-flat-circle. box-shadow and
     border-radius are never both animated here (only left/opacity move
     elsewhere on this page), so this doesn't trip the Chromium DOM-leak
     gotcha even if that ever changes. */
  /* Shrunk 16px->13px/icon 10px->8px on direct feedback ("wish they were
     a bit smaller") — back near the original plain-dot era's 13px
     footprint, just with the SVG icon scaling down proportionally
     with it rather than needing its own separate re-tuning. */
  .leaderboard-effort-badge { display: inline-flex; align-items: center; justify-content: center; width: 13px; height: 13px; margin-left: 6px; border-radius: 50%; vertical-align: middle; cursor: default; color: rgba(255,255,255,0.92); }
  .leaderboard-effort-badge svg { width: 8px; height: 8px; }
  /* Solid, near-opaque colors — real saturation is what lets the tier
     read at a glance from across a leaderboard row. Each keeps a loose
     thematic tie to its old emoji (star=gold, flame=orange, lightning=
     blue, crown=purple) while staying visually distinct from the
     streak-ball tier colors just to their left in the Streak column
     (bronze/silver/gold/diamond) — the two badge systems track
     different things (all-time hours vs. consecutive days) and sit on
     the same row, so they shouldn't read as the same achievement
     palette. */
  .leaderboard-effort-badge--star { background: #E0A83E; }
  .leaderboard-effort-badge--flame { background: #E2622F; }
  .leaderboard-effort-badge--lightning { background: #2FA8D9; }
  .leaderboard-effort-badge--crown { background: #8B5CF6; }
  /* justify-content stays flex-start, not center — centering each row's
     ball cluster independently would make the first ball's x-position
     drift row to row depending on that row's own streak length (1 ball
     centers very differently than 5 balls + a "+15" pill), so the balls
     would never line up into a straight column despite the column
     itself being aligned (confirmed the hard way once already — see
     git history on this file from 2026-09-21). Left-anchored means
     every row's first ball starts at the exact same x, and only the
     tail (more balls, then the overflow pill) grows rightward from
     there. To still read as "sitting in the middle of the space after
     Name" (direct request, once Name itself grew wider and Streak
     became the flexible trailing column again — see the row's own
     grid-template-columns), a fixed padding-left shifts that shared
     anchor point rightward instead — the same offset for every row, so
     the column-alignment property this fix depends on is untouched. */
  .leaderboard-streak { display: flex; align-items: center; justify-content: flex-start; gap: 5px; min-width: 0; padding-left: 26px; }
  /* Radial highlight (not just a flat linear gradient) for a glossy,
     gem-like ball instead of a flat dot, plus a soft outer glow and a
     faint inset shadow along the bottom edge for a bit of depth.
     Tiered by streak length ("do 1 and 2 knowing the program is 180
     days, started Aug 1") — a 3-day and a 47-day streak used to render
     as literally identical balls, which is exactly why a long streak
     didn't feel rewarding: nothing distinguished "just started" from
     "the real current maximum, since nobody can be further into a
     streak than the program itself has run." --base is the original
     pink-purple gradient byte-for-byte, so an early streak (days 1-6,
     before any tier applies) looks exactly as it always has. */
  .streak-ball { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px rgba(139,92,246,0.6), inset 0 -1px 1.5px rgba(0,0,0,0.2); }
  .streak-ball--base { background: radial-gradient(circle at 32% 30%, #ffc2e3, #FF7FB7 45%, var(--purple) 100%); }
  .streak-ball--bronze { background: radial-gradient(circle at 32% 30%, #ffd9b3, #d97706 45%, #92400e 100%); box-shadow: 0 0 6px rgba(217,119,6,0.55), inset 0 -1px 1.5px rgba(0,0,0,0.2); }
  /* Richer/higher-contrast than a first pass that read as "too bleak"
     (direct feedback) — a near-white highlight against a deeper,
     more-saturated slate base for real polished-chrome shine, instead
     of two adjacent pale grays that barely registered against the
     dark page background. */
  .streak-ball--silver { background: radial-gradient(circle at 30% 28%, #ffffff, #e2e8f0 30%, #94a3b8 62%, #475569 100%); box-shadow: 0 0 8px rgba(100,116,139,0.85), inset 0 -1px 1.5px rgba(0,0,0,0.25); }
  .streak-ball--gold { background: radial-gradient(circle at 32% 30%, #fef3c7, #FBBF24 45%, #b45309 100%); box-shadow: 0 0 7px rgba(251,191,36,0.65), inset 0 -1px 1.5px rgba(0,0,0,0.2); }
  /* Diamond (180+, the full program length) gets a genuinely different
     treatment, not just another flat color — a slow shimmer across the
     site's own brand gradient (pink->purple->blue), since finishing the
     entire program without ever breaking streak is the single hardest
     thing this product can recognize. Animates background-position on
     an oversized gradient, not transform/box-shadow directly on this
     shadow+radius element — the Chromium DOM-node-leak gotcha this file
     already knows about (animating transform/box-shadow on an element
     that also has both box-shadow and border-radius) applies to exactly
     this shape of element, so background-position sidesteps it entirely
     rather than re-learning that the hard way. */
  .streak-ball--diamond { background: linear-gradient(120deg, #FF7FB7, var(--purple), #4D8BFF, var(--purple), #FF7FB7); background-size: 300% 300%; box-shadow: 0 0 8px rgba(167,139,250,0.8), inset 0 -1px 1.5px rgba(0,0,0,0.2); animation: streak-ball-diamond-shimmer 3.5s ease-in-out infinite; }
  @keyframes streak-ball-diamond-shimmer { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  @media (prefers-reduced-motion: reduce) { .streak-ball--diamond { animation: none; background-position: 30% 50%; } }
  /* A small pill instead of bare text, so a long streak's overflow
     count reads as its own distinct badge rather than an afterthought
     stray number tacked onto the balls, tier-colored to match. A flame
     glyph inside this badge was tried and removed the same day — direct
     feedback ("what is the emoji beside the numbers, i don't like
     them") — the tier color alone still does the actual job (distinct
     from the old flat gray "+N") without an icon nobody asked for. */
  .streak-flame-badge { display: inline-flex; align-items: center; font-family: var(--font-nav); font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 7px; margin-left: 1px; }
  /* Backgrounds bumped to a much higher, near-opaque alpha than a first
     pass (0.14-0.32) — a low-alpha background blends with whatever sits
     behind the badge, and this pill can land on genuinely different
     row backgrounds (a highlighted "this is you"/top-3 row vs. a plain
     transparent one), so the exact same tier was rendering as visibly
     different shades depending only on which row it happened to be in.
     Caught by direct report ("why are there different shades of gold")
     and confirmed by reading getComputedStyle on two real gold badges —
     byte-identical CSS values, genuinely different rendered pixels,
     purely from row-background bleed-through. High alpha makes the
     badge's own color dominate regardless of context. */
  .streak-flame-badge--base { color: #f3e8ff; background: rgba(139,92,246,0.55); }
  .streak-flame-badge--bronze { color: #ffe3bf; background: rgba(146,64,14,0.75); }
  .streak-flame-badge--silver { color: #f1f5f9; background: rgba(71,85,105,0.7); }
  .streak-flame-badge--gold { color: #451a03; background: rgba(251,191,36,0.85); }
  .streak-flame-badge--diamond { color: #f3e8ff; background: rgba(109,40,217,0.65); }
  /* Pomodoro status ("Focus"/"Break") for anyone currently live — see
     pomo_status in pomodoro-leaderboard.js, derived from the same
     pomo_active_session row that drives is_live/the live dot, just
     surfacing which phase rather than only whether they're live at
     all. Blank (not omitted) for non-live rows, same as an empty
     .leaderboard-streak — it's already its own dedicated fixed-width
     grid column, so there's no row-to-row alignment risk from leaving
     it empty the way there was for the inline live-dot-in-name case. */
  .leaderboard-status { font-family: var(--font-nav); font-size: 12px; font-weight: 700; text-align: center; padding: 4px 6px; border-radius: 999px; min-width: 0; }
  .leaderboard-status.pomo-work { color: var(--purple); background: rgba(139,92,246,0.14); }
  .leaderboard-status.pomo-break { color: var(--green); background: var(--green-soft); }
  /* Muted plain text, not a colored pill like Focus/Break — this is a
     lower-emphasis "not active right now" state (see pomo_last_seen_at
     in pomodoro-leaderboard.js), shouldn't visually compete with the
     two states that actually mean "here right now". */
  .leaderboard-status.pomo-idle { color: var(--ink-soft); font-weight: 600; }
  /* The viewer's own weekly-pace figure (see weeklyPaceStatusHtml in
     progress.js) deliberately does NOT reuse .pomo-idle's muted look —
     direct feedback that it should "look different than the other
     numbers in the same column", since it's not a status at all (every
     other value here is "when were they last active"), it's a personal
     stat. Styled as a colored pill like Focus/Break — the text color
     reads the viewer's own picked Pomodoro gradient (--pomo-g2, the same
     var the ring/buttons/hourly-chart already use) rather than a fixed
     color, so it reads as "yours" specifically; the pill's own
     background/border stay a fixed purple tint, same as Focus's pill,
     since that part is just a neutral container, not personalization. */
  .leaderboard-status.pomo-pace { color: var(--pomo-g2, var(--purple)); background: rgba(139,92,246,0.14); box-shadow: 0 0 0 1px rgba(139,92,246,0.3) inset; }
  /* Depleting progress bar (not MM:SS digits) for a live student's
     current phase — ticked client-side every second (see
     startLeaderboardTimerTick/tickLeaderboardTimers in progress.js),
     shrinking .leaderboard-timer-fill's width from data-phase-end/
     data-total (pomo_phase_end_at/pomo_phase_total_seconds) rather than
     a value that's already stale the moment it's rendered. The exact
     remaining time is still available as a title tooltip, kept in sync
     the same way. Work uses the same pink/purple/blue brand gradient as
     the ring itself; break switches to the ring's own green/cyan pair —
     .leaderboard-timer--break flips which gradient the fill's
     background-image resolves to. */
  /* justify-self:center — .leaderboard-timer is a direct grid item inside
     .leaderboard-row (the Timer column has no wrapping cell of its own,
     just this span positioned by the row's grid-template-columns), and a
     fixed-width inline-flex item defaults to sitting at its column's
     start edge rather than centering, unlike the header's plain text
     (which centers via text-align). Left the bar flush-left under a
     centered "TIMER" label — added to actually line the two up. */
  .leaderboard-timer { display: inline-flex; align-items: center; justify-self: center; width: 46px; height: 6px; border-radius: 999px; overflow: hidden; min-width: 0; }
  /* Track background only for a row that actually has a phase to show —
     pomoTimerHtml() renders an empty (attribute-less) span for anyone
     with no active/recent session, same "blank in this column" behavior
     the plain-text version had, rather than every row showing a track
     with nothing in it. */
  .leaderboard-timer[data-phase-end] { background: rgba(255,255,255,0.08); }
  .leaderboard-timer-fill { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#FF7FB7,var(--purple),#4D8BFF); transition: width 1s linear; }
  .leaderboard-timer--break .leaderboard-timer-fill { background: linear-gradient(90deg,#4ade80,#22d3ee); }
  /* Below LEADERBOARD_TIMER_URGENT_PCT (see progress.js), a bar switches
     to a warm amber->red fill regardless of work/break mode — "about to
     finish" reads as more useful information at a glance than which
     phase it is, at that point — plus a slow pulse so it's noticeable
     without staring at the column. Comes after the --break rule above so
     it correctly wins for an urgent row that's also on break (same
     specificity, later source order). Opacity-only, no transform/scale —
     see pomoTimerHtml's own comment on why, given this bar is as small
     as the Pomodoro buttons whose icon-jitter saga is documented above. */
  .leaderboard-timer--urgent .leaderboard-timer-fill { background: linear-gradient(90deg,#FBBF24,#EF4444); animation: leaderboard-timer-urgent-pulse 1.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .leaderboard-timer--urgent .leaderboard-timer-fill { animation: none; } }
  @keyframes leaderboard-timer-urgent-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  /* Centered, not right-aligned — matches .leaderboard-col-time's header
     now that it's centered too (see its own comment). Right-aligned
     content under a centered header looked visibly offset once actually
     rendered (direct follow-up: "the minutes is not properly
     alligned"), the same lesson already learned once on this page for
     Streak's header/content pair — header and content need to share ONE
     alignment, not each pick their own. Harmless on the narrow
     Today's-Leaders companion card too (line 496's override), since that
     column is auto-width/content-sized there with no header of its own,
     so centering vs. right-aligning text inside a box exactly as wide as
     the text makes no visible difference. */
  .leaderboard-time { font-family: var(--font-nav); font-weight: 700; font-size: 14px; color: var(--ink); text-align: center; min-width: 0; }
  /* Greyed-out non-live rows so a student mid-focus-session actually
     stands out from everyone else on the board, instead of every name/
     minutes reading in the same bright ink regardless of who's actually
     here right now. Scoped to the two boards that are themselves about
     "right now" (#leaderboard-card, the current week; #today-leaderboard-
     card, today) — #champions-card (Last Week's Champions) was extended
     into this rule once fetchLastWeekLeaders started returning is_live
     too, but reverted at direct request: that board is a retrospective
     "who did well last week" ranking, and dimming a name just because
     that student isn't mid-session at this exact moment reads as
     unfairly diminishing a real, already-earned achievement — being
     live right now has nothing to do with how well someone did last
     week. */
  #leaderboard-card .leaderboard-row:not(.leaderboard-row--live) .leaderboard-name,
  #today-leaderboard-card .leaderboard-row:not(.leaderboard-row--live) .leaderboard-name { color: var(--ink-soft); }
  #leaderboard-card .leaderboard-row:not(.leaderboard-row--live) .leaderboard-time,
  #today-leaderboard-card .leaderboard-row:not(.leaderboard-row--live) .leaderboard-time { color: var(--ink-dim); }
  #leaderboard-card .leaderboard-row--live .leaderboard-name,
  #today-leaderboard-card .leaderboard-row--live .leaderboard-name,
  #leaderboard-card .leaderboard-row--live .leaderboard-time,
  #today-leaderboard-card .leaderboard-row--live .leaderboard-time { color: var(--ink); }
  /* Effort badges and streak balls both carry their own fixed tier
     colors (gold/orange/blue/purple, bronze/silver/gold/diamond) rather
     than reading --ink, so the name/time dim rule above — a plain color
     swap — has nothing to hook into for them; opacity is the equivalent
     dim here instead. Same scope as that rule (the two "right now"
     boards, not #champions-card — see its own comment just above) and
     same live/not-live split, direct follow-up to the name/time dim
     ("also the badges... also the streak balls?"). Streak balls only
     ever render on #leaderboard-card (the weekly board) — see
     streakBallsHtml's own call sites — so the #today-leaderboard-card
     half of that pair is harmless dead weight there, not a bug. */
  #leaderboard-card .leaderboard-row:not(.leaderboard-row--live) .leaderboard-effort-badge,
  #today-leaderboard-card .leaderboard-row:not(.leaderboard-row--live) .leaderboard-effort-badge,
  #leaderboard-card .leaderboard-row:not(.leaderboard-row--live) .streak-ball,
  #leaderboard-card .leaderboard-row:not(.leaderboard-row--live) .streak-flame-badge { opacity: .45; }
  /* Column header row — identical grid-template-columns to
     .leaderboard-row above (including its 180px Name cap, see that
     rule's own comment), so every label lands exactly above its column
     on every row, not just approximately near it. */
  .leaderboard-columns { display: grid; grid-template-columns: 40px 16px minmax(150px,220px) minmax(0,1fr) 140px 76px 60px 44px; align-items: center; gap: 16px; padding: 0 14px 6px; font-family: var(--font-nav); font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); }
  .leaderboard-col-rank { text-align: center; min-width: 0; }
  /* Was centered per an earlier request ("center align all the column
     names according to their content within") — held up fine while
     Name was capped at a narrow 180px, where a typical name's own text
     roughly spanned the column edge to edge. Reverted back to left
     once Name grew to a much wider, capped-but-generous range (see the
     row's own grid-template-columns) specifically to fit badges beside
     the name — centering "NAME" within that wider column visually
     detached the header from the actual left-aligned name text below
     it, worse the wider the column got ("the name column name is
     positioned wrongly"). Left-aligning alone still wasn't quite right
     though — it put "NAME" flush with .leaderboard-name's own left
     edge, which is where the always-rendered .live-dot-slot (13px, see
     liveDotHtml) starts, not where the actual letters do. Direct
     follow-up: "left align it with the first letter of every name" —
     padding-left matches that slot's width exactly, so the header text
     starts at the same x as the name text itself, dot or no dot. */
  .leaderboard-col-name { min-width: 0; text-align: left; position: relative; padding-left: 13px; }
  /* position:relative so the popover (position:absolute) anchors to
     this header cell specifically, not the whole grid row.
     display:inline-flex + align-items:center — a plain inline span left
     the "Streak" text and the button aligned to the browser's default
     text-baseline instead of each other, which put the button visibly
     off-center against the text's cap-height (direct report: "the ?
     beside streak is not sitting with the text"). Flex alignment is
     exact regardless of the button's own line-height/font quirks;
     inline-flex (not flex) keeps the cell sized to its content instead
     of stretching to fill the grid track, matching how every sibling
     header cell in this same row already behaves. */
  /* Left-aligned, not centered — tried centering twice (once over the
     full flexible column, once within a bounded 160px sub-box) and both
     were reverted at direct request. Left-aligned matches this column's
     own content, which is itself deliberately left-anchored at a fixed
     x regardless of how many balls a given row has (see the streak-ball
     comment above) — this is the one column pair (header + content)
     that reads better matched than centered. Carries the row content's
     own padding-left shift too, so "STREAK ?" still lines up directly
     above the balls' actual (now shifted) starting x rather than the
     two silently drifting apart. */
  .leaderboard-col-streak { display: inline-flex; align-items: center; justify-content: flex-start; gap: 5px; min-width: 0; text-align: left; position: relative; padding-left: 26px; }
  /* Small "?" toggle — costs nothing in the header's own layout until
     clicked (the popover it opens is position:absolute, out of flow),
     "smart use of negative space" per the direct request, rather than a
     permanently-visible legend block competing with the leaderboard
     rows for vertical room. A first pass (13px, near-transparent
     background) was reported as "not visible much" — sized up and
     given a real filled background instead of a barely-there outline.
     The breathing glow (below) makes it genuinely attention-grabbing
     per direct follow-up request, without animating box-shadow/transform
     directly on this element — it already carries both box-shadow and
     border-radius, exactly the combination this file's own known
     Chromium DOM-node-leak gotcha warns about animating directly.
     Opacity alone isn't covered by that gotcha and reads as an
     equally-noticeable pulse at this size. */
  .streak-legend-toggle { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border: none; border-radius: 50%; background: rgba(139,92,246,0.45); color: #f3e8ff; font-size: 10.5px; font-weight: 800; line-height: 1; cursor: pointer; text-transform: none; letter-spacing: normal; box-shadow: 0 0 4px rgba(139,92,246,0.4); animation: streak-legend-toggle-pulse 2.2s ease-in-out infinite; }
  /* .leaderboard-col-streak already gives its own toggle breathing room
     via flex gap — .leaderboard-col-name has no such flex layout (it's
     plain centered text), so its "Name" text and "?" sat with zero
     space between them ("too close, space it adequately"). */
  #effort-legend-toggle { margin-left: 6px; }
  .streak-legend-toggle:hover { background: rgba(139,92,246,0.7); color: #fff; animation: none; opacity: 1; }
  @keyframes streak-legend-toggle-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) { .streak-legend-toggle { animation: none; } }
  .streak-legend-popover { position: absolute; top: calc(100% + 8px); left: 0; z-index: 20; width: 168px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); text-transform: none; letter-spacing: normal; }
  .streak-legend-title { font-size: 11px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .streak-legend-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .streak-legend-row .streak-ball { flex-shrink: 0; }
  .streak-legend-name { font-size: 11.5px; font-weight: 700; color: var(--ink); flex: 1; }
  .streak-legend-range { font-size: 10.5px; font-weight: 600; color: var(--ink-soft); }
  .leaderboard-col-status { text-align: center; min-width: 0; }
  .leaderboard-col-timer { text-align: center; min-width: 0; }
  /* Centered, not right-aligned to match the numbers below it — direct
     request ("the minutes column name is not centrally aligned witht
     it's contents"), confirmed via follow-up as wanting the HEADER
     centered in its own column like Rank/Status/Timer, a deliberate
     choice over matching the right-aligned numeric content — measured
     precisely beforehand and the two were already byte-identical
     right-aligned (this wasn't a rendering bug, it's a requested style
     change). .leaderboard-time (the actual "540m" values) stays
     right-aligned, untouched. */
  .leaderboard-col-time { text-align: center; min-width: 0; }
  .leaderboard-gap { text-align: center; color: var(--ink-soft); font-size: 12px; letter-spacing: .2em; padding: 2px 0; }
  /* "NEW" badge — deliberately more aggressive than .leaderboard-you above
     (shake + an expanding ping ring, both continuous until dismissed),
     since the whole point is catching the eye before the card's even been
     read. Neither .new-badge-wrap::before nor .new-badge combines
     box-shadow with border-radius on the element being animated — see the
     Chromium DOM-node-leak gotcha in CLAUDE.md — the ping ring uses a
     scaling/fading background instead of an actual box-shadow blur. */
  /* Absolutely positioned in the card's corner rather than inline after
     the title text — real bug, caught from a screenshot: with the badge
     inline, .leaderboard-title's own text-align:center centered the
     title+badge as one unit, visibly off-center from .leaderboard-
     subtitle's independently-centered text below it. Pulling the badge
     out of that flow lets the title center correctly on its own again. */
  .new-badge-wrap { position: absolute; top: 14px; right: 16px; }
  .new-badge-wrap::before {
    content: ''; position: absolute; inset: -3px; border-radius: 999px;
    background: linear-gradient(135deg, var(--pink, #FF7FB7), var(--purple));
    opacity: 0.5;
    animation: newBadgePing 1.8s ease-out infinite;
  }
  .new-badge {
    position: relative; display: inline-block;
    background: linear-gradient(135deg, var(--pink, #FF7FB7), var(--purple));
    color: #fff; font-family: var(--font-nav); font-size: 9.5px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .06em;
    padding: 3px 9px; border-radius: 999px;
    animation: newBadgeWobble 1.8s ease-in-out infinite;
  }
  /* Ping ring caps at 1.55x (was 2x) so it doesn't overflow past the
     badge's own margin into the title text next to it, and the wobble
     spreads evenly across the full cycle (was crammed into the first 40%
     with a long static pause after) for a smoother, less jerky loop. */
  @keyframes newBadgePing {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  @keyframes newBadgeWobble {
    0%, 100% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.12) rotate(-6deg); }
    50% { transform: scale(1) rotate(0deg); }
    75% { transform: scale(1.12) rotate(6deg); }
  }

  .today-card { position: relative; overflow: hidden; border: 2px solid var(--purple); border-radius: var(--radius-lg); background: var(--card); padding: 18px 18px 14px; margin-bottom: 20px; }
  .today-card .today-tag { position: relative; font-family: var(--font-nav); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--purple); margin-bottom: 4px; }
  .today-card .today-date { position: relative; font-family: var(--font-nav); font-weight: 700; font-size: 16px; margin-bottom: 10px; color: var(--ink); }
  .catchup-warn { position: relative; background: var(--amber-soft); color: var(--amber); font-size: 13px; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; line-height: 1.4; }
  /* Splits the Today card into the existing checklist (left) and a new
     batch-wide "when does everyone study" bar chart (right) — flex with
     flex-wrap rather than a fixed-breakpoint grid, since .today-card's
     own width already varies a lot depending on whether the page-grid
     sidebar is showing (see .page-grid above) — wrapping to a stacked
     layout once either side drops below its own min comfortable width
     is more robust than guessing one "mobile" pixel number.
     align-items:stretch (the default, stated explicitly) makes the right
     column the same height as the left — the checklist is usually
     taller, and the chart used to just sit pinned to the top of a
     shorter box, leaving a large dead gap below it (direct feedback).
     .hourly-activity-title stays pinned to the top of that stretched
     column (aligned with .today-tag on the left) rather than being
     centered along with everything else — an earlier pass centered the
     WHOLE block including the heading, which threw "Activity by hour"
     out of alignment with "Today" on the left (also direct feedback:
     "the heading position is terrible"). Only .hourly-activity-body (the
     bars + peak caption, everything BELOW the heading) centers within
     the leftover space under that pinned title. */
  .today-card-split { position: relative; display: flex; gap: 22px; align-items: stretch; flex-wrap: wrap; }
  .today-card-left { flex: 2 1 260px; min-width: 0; }
  .today-card-right { flex: 1 1 220px; min-width: 0; }
