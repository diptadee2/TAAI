  @media (max-width: 1024px) { .nav-hamburger { display: flex; } .nav-cta { display: none; } .nav-links { display: none; } .btn-nav-contact { display: none; } .nav-inner { height: 64px; padding: 0 14px; position: relative; justify-content: flex-end; } .mobile-menu { top: 64px; } .nav-spacer { height: 64px; } .nav-logo { position: absolute; left: 50%; transform: translateX(-50%); } .nav-logo:hover { transform: translateX(-50%) translateY(-2px); } .nav-logo:active { transform: translateX(-50%) translateY(1px); } .nav-logo svg, .nav-logo img { width: 150px; height: auto; filter: drop-shadow(0 0 14px rgba(255,255,255,0.22)) drop-shadow(0 0 36px rgba(255,255,255,0.12)) drop-shadow(0 0 72px rgba(255,255,255,0.07)); } .nav-hamburger span { background: var(--purple); } }

  /* Decorative dark background — same radial-glow language as .res-cta elsewhere on the site.
     Orbs drift via CSS transform/opacity only (GPU-composited, no JS ticker) — the same
     lightweight pattern as .page-hero::before/::after's res-orb-a/b elsewhere on the site,
     just with a wider path and real elements so more than two can move independently. */
  body { position: relative; overflow-x: hidden; background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1.5px, transparent 1.5px); background-size: 28px 28px; }
  .bg-orbs { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .orb { position: absolute; border-radius: 50%; will-change: transform; }
  .orb-1 { top: -160px; right: -120px; width: 520px; height: 520px; background: radial-gradient(circle, rgba(139,92,246,0.14) 0%, transparent 68%); animation: orb-fly-1 26s ease-in-out infinite; }
  .orb-2 { bottom: -160px; left: -120px; width: 460px; height: 460px; background: radial-gradient(circle, rgba(77,139,255,0.11) 0%, transparent 68%); animation: orb-fly-2 32s ease-in-out infinite; }
  .orb-3 { top: 40%; left: 50%; width: 340px; height: 340px; background: radial-gradient(circle, rgba(255,127,183,0.07) 0%, transparent 68%); animation: orb-fly-3 22s ease-in-out infinite; }
  @keyframes orb-fly-1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25%      { transform: translate(-70px, 60px) scale(1.1); }
    50%      { transform: translate(-40px, 140px) scale(0.95); }
    75%      { transform: translate(30px, 50px) scale(1.05); }
  }
  @keyframes orb-fly-2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    30%      { transform: translate(80px, -70px) scale(1.08); }
    60%      { transform: translate(40px, -140px) scale(0.94); }
  }
  @keyframes orb-fly-3 {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%      { transform: translate(-50%, -50%) translate(90px, -60px) scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }
  .wrap, .scroll-progress { position: relative; z-index: 1; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 80px; }

  /* Task view only on mobile and iPad portrait (up to 1024px CSS width,
     the largest common iPad portrait size) — the heatmap/subject-progress
     side column is hidden there entirely, not just stacked below, so
     small and portrait-tablet screens show just the checklist. It
     reappears as a real sidebar next to the day list from iPad landscape
     widths up. */
  .page-grid { display: grid; grid-template-columns: 1fr; gap: 0; }
  .side-col { display: none; }
  @media (min-width: 1081px) {
    .wrap { max-width: 1060px; }
    .page-grid { grid-template-columns: 1fr 300px; gap: 28px; align-items: start; }
    .side-col { display: block; margin-top: 0; position: sticky; top: 24px; }
  }

  #app { min-height: 40vh; }

  .center-note { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 60px 0; }

  /* Registration form */
  .reg-card { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-radius: var(--radius-lg); padding: 36px 28px; max-width: 420px; margin: 40px auto; text-align: center; }
  .reg-card h1 { font-family: var(--font-nav); font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .reg-card p { color: var(--ink-soft); font-size: 14px; margin-bottom: 22px; }
  .reg-field { text-align: left; margin-bottom: 14px; }
  .reg-field label { display: block; font-family: var(--font-nav); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-dim); margin-bottom: 6px; }
  .reg-field input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 12px; font-family: var(--font-body); font-size: 14.5px; color: var(--ink); background: var(--bg-soft); }
  .reg-field input:focus { outline: none; border-color: var(--purple); background: var(--bg); }
  .btn-primary { width: 100%; padding: 14px; border: none; border-radius: 999px; background: linear-gradient(135deg,#FF7FB7,var(--purple),#4D8BFF); color: #fff; font-family: var(--font-nav); font-weight: 700; font-size: 14.5px; cursor: pointer; margin-top: 6px; box-shadow: 0 8px 28px rgba(139,92,246,0.4); transition: transform .28s cubic-bezier(.34,1.1,.64,1), box-shadow .22s; }
  .btn-primary:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(139,92,246,0.55); }
  .btn-primary:active:not(:disabled) { transform: scale(0.97); }
  .btn-primary:disabled { opacity: .6; cursor: default; transform: none; box-shadow: none; }
  .form-error { color: #f87171; font-size: 13px; margin-top: 10px; }
  .reg-cancel-link { display: block; width: 100%; text-align: center; background: none; border: none; color: var(--ink-soft); font-family: var(--font-nav); font-size: 12.5px; font-weight: 600; cursor: pointer; margin-top: 14px; padding: 0; transition: color .2s; }
  .reg-cancel-link:hover { color: var(--purple); }

  /* Header / stats */
  .roadmap-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
  .roadmap-head h1 { font-family: var(--font-nav); font-size: 19px; font-weight: 700; }
  .roadmap-sub { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
  .roadmap-sub-left button { background: none; border: none; color: var(--purple); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; transition: opacity .2s; }
  .roadmap-sub-left button:hover { opacity: .7; }

  .focus-toggle-wrap { display: flex; justify-content: center; margin-bottom: 22px; }
  .focus-toggle { display: inline-flex; align-items: center; gap: 8px; padding: 13px 30px; border-radius: 999px; border: none; background: linear-gradient(135deg,#FF7FB7,var(--purple),#4D8BFF); color: #fff; font-family: var(--font-nav); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; box-shadow: 0 8px 24px rgba(139,92,246,0.4); transition: transform .28s cubic-bezier(.34,1.1,.64,1), box-shadow .22s, background .22s, color .22s, border-color .22s; }
  .focus-toggle:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 12px 30px rgba(139,92,246,0.5); }
  .focus-toggle.active { background: var(--card); color: var(--ink-dim); border: 1.5px solid rgba(139,92,246,0.25); box-shadow: none; }
  .focus-toggle.active:hover { color: var(--purple); border-color: var(--purple); box-shadow: 0 8px 20px rgba(139,92,246,0.18); }

  /* Streak hero — the page's primary visual now, replacing the old heatmap-up-top */
  .streak-hero { position: relative; overflow: hidden; text-align: center; padding: 30px 20px 26px; border-radius: var(--radius-lg); margin-bottom: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 10px 36px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.07); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); }
  .streak-hero::before { content: ''; position: absolute; top: -70px; right: -50px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(251,191,36,0.16) 0%, transparent 70%); pointer-events: none; }
  .streak-hero::after { content: ''; position: absolute; bottom: -80px; left: -50px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,0.18) 0%, transparent 70%); pointer-events: none; }
  .streak-flame { position: relative; font-size: 32px; line-height: 1; margin-bottom: 6px; filter: drop-shadow(0 6px 14px rgba(251,191,36,0.3)); }
  .streak-number { position: relative; display: inline-block; font-family: var(--font-body); font-size: 52px; font-weight: 700; line-height: 1; background: linear-gradient(120deg,#FF7FB7,var(--purple),#4D8BFF); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: streak-grad 6s ease infinite; }
  .streak-number.bump { animation: streak-grad 6s ease infinite, streak-bump .55s cubic-bezier(.34,1.5,.64,1); }
  .streak-label { position: relative; font-family: var(--font-nav); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-top: 6px; }
  @keyframes streak-grad { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  @keyframes streak-bump { 0% { transform: scale(1); } 45% { transform: scale(1.35); } 100% { transform: scale(1); } }

  .exam-countdown { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-nav); font-size: 12.5px; font-weight: 600; color: var(--ink-dim); background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.22); border-radius: 999px; padding: 8px 18px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 2px 12px rgba(139,92,246,0.1); align-self: center; }
  .progress-track { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--purple), #a78bfa); border-radius: 999px; transition: width .5s cubic-bezier(.34,1.1,.64,1); }

  /* Focus Mode — one unified card holding the exam countdown, timer,
     today's tasks, and leaderboard, instead of four separate floating
     cards. Each piece keeps its own internal layout/spacing but loses its
     own background/border/shadow, since .focus-card now provides that once. */
  .focus-card { display: flex; flex-direction: column; gap: 22px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: var(--radius-lg); box-shadow: 0 10px 36px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.07); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); padding: 26px 22px 24px; }
  .focus-divider { height: 1px; background: rgba(255,255,255,0.1); flex-shrink: 0; }
  .focus-card .pomodoro-card,
  .focus-card .today-card,
  .focus-card .leaderboard-card { background: none; border: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; margin-bottom: 0; }
  .focus-card .leaderboard-card { max-width: none; margin-left: 0; margin-right: 0; }
  .progress-track { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--purple), #a78bfa); border-radius: 999px; transition: width .5s cubic-bezier(.34,1.1,.64,1); }

  /* Per-subject breakdown */
  .subject-breakdown { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 2px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-radius: var(--radius-md); padding: 16px 18px; margin-top: 20px; max-height: 360px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
  .subject-breakdown::-webkit-scrollbar { width: 6px; }
  .subject-breakdown::-webkit-scrollbar-track { background: transparent; }
  .subject-breakdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 999px; }
  .subject-breakdown::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
  .subject-breakdown-title { font-family: var(--font-nav); font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 14px; }
  .subject-row { margin-bottom: 14px; }
  .subject-row:last-child { margin-bottom: 0; }
  .subject-row-name { font-size: 12.5px; font-weight: 600; color: var(--ink-dim); line-height: 1.35; margin-bottom: 5px; }
  .subject-row-line { display: flex; align-items: center; gap: 10px; }
  .subject-row-line .progress-track { flex: 1; }
  .subject-row-pct { font-family: var(--font-nav); font-size: 12px; font-weight: 700; color: var(--purple); text-align: right; flex-shrink: 0; width: 34px; }
  /* Quizzes/test series aren't a syllabus subject — visually separated and a distinct accent color */
  .subject-row--assessment { margin-top: 16px; padding-top: 14px; border-top: 1px dashed rgba(255,255,255,0.1); }
  .subject-row--assessment + .subject-row--assessment { margin-top: 14px; padding-top: 0; border-top: none; }
  .subject-row--assessment .subject-row-name { color: #7dd3fc; }
  .subject-row--assessment .subject-row-pct { color: #38bdf8; }
  .subject-row--assessment .progress-fill { background: linear-gradient(90deg, #4D8BFF, #38bdf8); }

  /* Heatmap — moved to the bottom as a compact secondary visual, with a legend */
  .heatmap-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 2px 16px rgba(0,0,0,0.2); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); border-radius: var(--radius-md); padding: 16px 18px; max-width: 320px; margin: 0 auto; }
  @media (min-width: 880px) { .heatmap-card { max-width: none; } }
  .heatmap-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .heatmap-title { font-family: var(--font-nav); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .heatmap-legend { display: inline-flex; align-items: center; gap: 3px; font-family: var(--font-nav); font-size: 9.5px; color: var(--ink-soft); }
  .heatmap-legend .heatmap-cell { width: 9px; height: 9px; border-radius: 2.5px; margin: 0 1px; }
  .heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .heatmap-dow { font-family: var(--font-nav); font-size: 9px; font-weight: 700; text-align: center; color: var(--ink-soft); text-transform: uppercase; margin-bottom: 1px; }
  .heatmap-cell { aspect-ratio: 1; border-radius: 4px; background: rgba(255,255,255,0.06); transition: background .35s ease; }
  .heatmap-cell[data-level="0"] { background: transparent; border: 1px dashed rgba(255,255,255,0.14); }
  .heatmap-cell[data-level="1"] { background: rgba(139,92,246,0.22); }
  .heatmap-cell[data-level="2"] { background: rgba(139,92,246,0.45); }
  .heatmap-cell[data-level="3"] { background: rgba(139,92,246,0.72); }
  .heatmap-cell[data-level="4"] { background: #A78BFA; }
  .heatmap-cell.is-today { box-shadow: 0 0 0 1.5px var(--purple); }

  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .month-nav button { background: var(--card); border: 1px solid var(--line); border-radius: 10px; width: 34px; height: 34px; font-size: 16px; cursor: pointer; color: var(--ink-dim); transition: transform .28s cubic-bezier(.34,1.1,.64,1), border-color .2s, color .2s, box-shadow .22s; }
  .month-nav button:hover { border-color: var(--purple); color: var(--purple); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(139,92,246,0.18); }
  .month-nav button:active { transform: scale(0.92); }
  .month-nav button:disabled { opacity: .35; cursor: not-allowed; }
  .month-nav button:disabled:hover { border-color: var(--line); color: var(--ink-dim); transform: none; box-shadow: none; }
  .month-nav .month-label { font-family: var(--font-nav); font-weight: 700; font-size: 15px; }

  .week-label { font-family: var(--font-nav); font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 22px 0 10px; }

  .day { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 2px 14px rgba(0,0,0,0.18); backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); border-radius: 14px; margin-bottom: 8px; transition: box-shadow .22s, transform .28s cubic-bezier(.34,1.1,.64,1); }
  .day:hover { box-shadow: 0 6px 22px rgba(139,92,246,0.18); }
  .day-summary { cursor: pointer; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  .day-chevron { flex-shrink: 0; color: var(--ink-soft); transition: transform .38s cubic-bezier(.34,1.3,.64,1); }
  .day-summary[aria-expanded="true"] .day-chevron { transform: rotate(90deg); }
  .day-date { font-family: var(--font-nav); font-weight: 700; font-size: 13.5px; flex: 1; }
  .day-status { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .day-status.complete { background: var(--green-soft); color: var(--green); }
  .day-status.missed { background: var(--amber-soft); color: var(--amber); }
  .day-status.upcoming { background: var(--line); color: var(--ink-soft); }
  /* Grid-rows trick animates to auto-height without JS measuring the content */
  .day-body-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .42s cubic-bezier(.34,1.1,.64,1); }
  .day-body-wrap.expanded { grid-template-rows: 1fr; }
  .day-body-inner { overflow: hidden; }
  .day-body { padding: 0 16px 14px; }
  .task-row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; font-size: 14px; }
  .task-row input[type="checkbox"] { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--purple); cursor: pointer; flex-shrink: 0; transition: transform .2s cubic-bezier(.34,1.5,.64,1); }
  .task-row input[type="checkbox"]:active { transform: scale(0.85); }
  .task-row .task-subject { font-weight: 600; color: var(--purple); }
  .task-row .task-text { transition: color .25s ease; }
  .task-row.done .task-text { text-decoration: line-through; color: var(--ink-soft); }

  /* Pomodoro timer — Focus Mode only */
  .pomodoro-card { position: relative; overflow: hidden; text-align: center; padding: 26px 20px 22px; border-radius: var(--radius-lg); margin-bottom: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 10px 36px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.07); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); transition: box-shadow .4s ease; }
  .pomodoro-card::before { content: ''; position: absolute; top: -70px; left: -50px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,0.22) 0%, transparent 70%); pointer-events: none; transition: background .5s ease; }
  .pomodoro-card.on-break::before { background: radial-gradient(circle, rgba(74,222,128,0.2) 0%, transparent 70%); }

  .pomo-settings-toggle { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.08); color: var(--ink-dim); display: grid; place-items: center; cursor: pointer; transition: transform .4s cubic-bezier(.34,1.1,.64,1), color .2s, border-color .2s, background .2s, box-shadow .2s; }
  .pomo-settings-toggle:hover { color: var(--purple); background: rgba(139,92,246,0.14); border-color: rgba(139,92,246,0.4); transform: rotate(55deg) scale(1.08); box-shadow: 0 4px 14px rgba(139,92,246,0.25); }
  .pomo-settings-toggle:active { transform: rotate(55deg) scale(0.92); }

  .pomodoro-ring-wrap { position: relative; width: 190px; height: 190px; margin: 4px auto 14px; }
  .pomodoro-ring { width: 100%; height: 100%; transform: rotate(-90deg); }
  .pomo-ring-track { fill: none; stroke: rgba(255,255,255,0.07); stroke-width: 10; }
  .pomo-ring-progress { fill: none; stroke: var(--purple); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke .4s ease; }
  .pomodoro-card.on-break .pomo-ring-progress { stroke: var(--green); }
  .pomodoro-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .pomodoro-mode { font-family: var(--font-nav); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--purple); margin-bottom: 6px; transition: color .3s ease; }
  .pomodoro-card.on-break .pomodoro-mode { color: var(--green); }
  .pomodoro-time { font-family: var(--font-body); font-size: 40px; font-weight: 700; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }

  .pomodoro-dots { position: relative; font-size: 14px; letter-spacing: 5px; margin-bottom: 20px; opacity: .85; }
  .pomodoro-controls { position: relative; display: flex; gap: 10px; justify-content: center; }
  .pomo-btn { padding: 10px 24px; border-radius: 999px; border: none; font-family: var(--font-nav); font-weight: 700; font-size: 13px; cursor: pointer; transition: transform .25s cubic-bezier(.34,1.1,.64,1), box-shadow .2s, background .2s; }
  .pomo-btn-primary { background: linear-gradient(135deg,#FF7FB7,var(--purple),#4D8BFF); color: #fff; box-shadow: 0 8px 24px rgba(139,92,246,0.35); min-width: 84px; }
  .pomo-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(139,92,246,0.5); }
  .pomo-btn-primary:active { transform: scale(0.96); }
  .pomo-btn-secondary { background: rgba(255,255,255,0.06); color: var(--ink-dim); border: 1px solid rgba(255,255,255,0.1); }
  .pomo-btn-secondary:hover { background: rgba(255,255,255,0.11); color: var(--ink); transform: translateY(-2px); }
  .pomo-btn-secondary:active { transform: scale(0.96); }

  .pomo-settings { position: relative; margin-top: 20px; padding-top: 18px; border-top: 1px dashed rgba(255,255,255,0.1); text-align: left; }
  .pomo-setting-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; font-size: 13px; color: var(--ink-dim); }
  .pomo-setting-row label { flex: 1; }
  .pomo-setting-row input { width: 56px; padding: 7px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg-soft); color: var(--ink); font-family: var(--font-body); font-size: 13.5px; text-align: center; -moz-appearance: textfield; appearance: textfield; }
  /* Native spin buttons render inconsistently dark/near-invisible across
     engines (tried color-scheme + invert filters — still black in some
     browsers). Removing them entirely is the only reliable cross-browser
     fix; typing a number directly, or the keyboard up/down arrows (which
     still work with the visual spinner hidden), cover the same need. */
  .pomo-setting-row input::-webkit-inner-spin-button,
  .pomo-setting-row input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .pomo-setting-row input:focus { outline: none; border-color: var(--purple); }
  .pomo-setting-row span { font-size: 12px; color: var(--ink-soft); width: 26px; }
  .pomo-settings-save { display: block; margin: 4px auto 0; padding: 9px 28px; font-size: 12px; }

  /* Focus leaderboard — public display names, ranked by total focus minutes */
  .leaderboard-card { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 2px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-radius: var(--radius-md); padding: 18px 20px; margin-bottom: 20px; max-width: 420px; margin-left: auto; margin-right: auto; }
  .leaderboard-title { font-family: var(--font-nav); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); text-align: center; }
  .leaderboard-subtitle { font-size: 11px; color: var(--ink-soft); opacity: .7; text-align: center; margin-bottom: 12px; margin-top: 2px; }
  .leaderboard-row { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; font-size: 13.5px; border-bottom: 1px solid rgba(255,255,255,0.06); text-align: left; }
  .leaderboard-row:last-child { border-bottom: none; }
  .leaderboard-row--top { padding-top: 10px; padding-bottom: 10px; }
  .leaderboard-row--me { background: rgba(139,92,246,0.1); border-bottom-color: transparent; }
  .leaderboard-rank { font-family: var(--font-nav); font-weight: 700; font-size: 12px; color: var(--purple); width: 24px; flex-shrink: 0; text-align: center; }
  .leaderboard-row--top .leaderboard-rank { font-size: 18px; }
  .leaderboard-name { flex: 1; min-width: 0; font-weight: 600; color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leaderboard-you { display: inline-block; font-family: var(--font-nav); font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--purple); background: rgba(139,92,246,0.16); border-radius: 999px; padding: 1px 7px; margin-left: 4px; vertical-align: middle; }
  .leaderboard-time { font-family: var(--font-nav); font-weight: 700; font-size: 12.5px; color: var(--ink); flex-shrink: 0; }

  .today-card { position: relative; overflow: hidden; border: 2px solid var(--purple); border-radius: var(--radius-lg); background: rgba(255,255,255,0.055); box-shadow: 0 12px 36px rgba(139,92,246,0.28), inset 0 1px 0 rgba(255,255,255,0.08); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); padding: 18px 18px 14px; margin-bottom: 20px; }
  .today-card::before { content: ''; position: absolute; top: -60px; right: -40px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,0.3) 0%, transparent 70%); pointer-events: none; }
  .today-card .today-tag { position: relative; font-family: var(--font-nav); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--purple); margin-bottom: 4px; }
  .today-card .today-date { position: relative; font-family: var(--font-nav); font-weight: 700; font-size: 16px; margin-bottom: 10px; color: var(--ink); }
  .catchup-warn { position: relative; background: var(--amber-soft); color: var(--amber); font-size: 13px; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; line-height: 1.4; }
</style>
</head>
<body>

<div class="bg-orbs" aria-hidden="true">
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
</div>

<div class="scroll-progress" id="scroll-progress-bar"></div>

<div id="nav-root"></div>

<div class="wrap">
  <div id="app"><p class="center-note">Loading your roadmap…</p></div>
</div>

<button class="back-to-top" id="back-to-top" aria-label="Back to top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
</button>

<script type="text/babel">
  // Nav — ported verbatim from index.html/gate-da-courses.html etc. so this
  // page shares the exact same nav as the rest of the site instead of a
  // bespoke one. Its own Progress Tracker link is marked active:true below.
  const COURSE_DROPDOWN = [
    { label: 'Bundled Courses',    href: '/gate-da-courses#combos'    },
    { label: 'Individual Courses', href: '/gate-da-courses#individual', dividerBefore: true },
    { label: 'Interview Prep',     href: '/gate-da-courses#interview',  dividerBefore: true },
  ];
  const TESTIMONIALS_DROPDOWN = [
    { label: 'Batch of 2026', href: '/gate-da-toppers#batch-2026' },
    { label: 'Batch of 2025', href: '/gate-da-toppers#batch-2025', dividerBefore: true },
  ];
  const RESOURCES_DROPDOWN = [
    { label: 'Free Notes & Lectures', href: '/gate-da-free-notes' },
    { label: 'Blogs', href: '/blogs', dividerBefore: true },
  ];
  const NAV_LINKS = [
    { label: 'Courses',      href: '/gate-da-courses',      dropdown: COURSE_DROPDOWN },
    { label: 'Test Series',  href: '/gate-da-test-series' },
    { label: 'Testimonials', href: '/gate-da-toppers', dropdown: TESTIMONIALS_DROPDOWN },
    { label: 'Resources',    href: '/gate-da-free-notes', dropdown: RESOURCES_DROPDOWN },
    { label: 'Progress Tracker', href: '/gate-da-progress-tracker', active: true },
  ];
  const MENU_ICONS = {
    '/':        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M3 12L12 4L21 12V20C21 20.6 20.6 21 20 21H15V16H9V21H4C3.4 21 3 20.6 3 20V12Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /></svg>,
    '/gate-da-courses':      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 5C4 4 4.5 3 6 3H11V20H6C4.5 20 4 19 4 18V5Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /><path d="M20 5C20 4 19.5 3 18 3H13V20H18C19.5 20 20 19 20 18V5Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /></svg>,
    '/gate-da-test-series':  <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" strokeWidth="1.7" /><circle cx="12" cy="12" r="4" stroke="currentColor" strokeWidth="1.7" /><circle cx="12" cy="12" r="1.5" fill="currentColor" /></svg>,
    '/gate-da-toppers': <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="9" r="3" stroke="currentColor" strokeWidth="1.7" /><circle cx="16" cy="9" r="3" stroke="currentColor" strokeWidth="1.7" /><path d="M3 19C3 16 5 14 8 14C11 14 13 16 13 19" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /><path d="M13 19C13 16 15 14 18 14C19 14 20 14.3 21 15" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /></svg>,
    '/gate-da-free-notes':    <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M14 2H6C5.4 2 5 2.4 5 3V21C5 21.6 5.4 22 6 22H18C18.6 22 19 21.6 19 21V7L14 2Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /><path d="M14 2V7H19" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /><path d="M9 13H15M9 17H13" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /></svg>,
    '/blogs':         <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 20h9" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" strokeLinecap="round" /></svg>,
    '/gate-da-progress-tracker': <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M9 12L11 14L15 9" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" /><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C13.4106 3 14.7461 3.32229 15.9376 3.89746" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /></svg>,
  };

  function TAAILogo() {
    return <img src="logo.webp" alt="TAAI" width="360" height="216" />;
  }

  function daysUntilExam() {
    // Same date + same day-count math as EXAM_DATE/DEMO_TODAY_FLOOR in
    // progress.js, so this matches the tracker's countdown exactly. The
    // Aug-1 floor is self-expiring — remove it after 2026-08-01 alongside
    // the matching block in progress.js, not before.
    const pad = n => String(n).padStart(2, '0');
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
    const flooredToday = todayStr > '2026-08-01' ? todayStr : '2026-08-01';
    const daysLeft = Math.ceil((new Date('2027-02-06') - new Date(flooredToday)) / 864e5);
    return daysLeft > 0 ? daysLeft : null;
  }

  function Nav() {
    const daysLeft = daysUntilExam();
    const linksRef = React.useRef(null);
    const [pill, setPill] = React.useState({ left: 0, width: 0, visible: false });
    const resetTimer = React.useRef(null);

    const moveTo = React.useCallback((el) => {
      if (resetTimer.current) { clearTimeout(resetTimer.current); resetTimer.current = null; }
      if (!el) return;
      setPill({ left: el.offsetLeft - 10, width: el.offsetWidth + 20, visible: true });
    }, []);

    const reset = React.useCallback(() => {
      resetTimer.current = setTimeout(() => {
        const active = linksRef.current && linksRef.current.querySelector('a.active');
        if (active) moveTo(active.closest('.nav-dropdown-wrap') || active);
        else setPill(p => ({ ...p, visible: false }));
      }, 60);
    }, [moveTo]);

    React.useEffect(() => { reset(); }, [reset]);

    const [menuOpen, setMenuOpen] = React.useState(false);
    React.useEffect(() => {
      if (!menuOpen) return;
      const close = e => { if (!e.target.closest('.nav') && !e.target.closest('.mobile-menu')) setMenuOpen(false); };
      document.addEventListener('pointerdown', close);
      return () => document.removeEventListener('pointerdown', close);
    }, [menuOpen]);

    const [signinPhase, setSigninPhase] = React.useState(0); // 0=Sign In, 1=X days, 2=GATE
    const signinTimerRef = React.useRef(null);
    React.useEffect(() => () => clearInterval(signinTimerRef.current), []);
    const startSigninCycle = (e) => {
      const btn = e.currentTarget;
      const linksEl = linksRef.current;
      const available = linksEl ? btn.getBoundingClientRect().left - linksEl.getBoundingClientRect().right : Infinity;
      if (available < 36) return; // not enough room to grow safely - skip the whole cycle
      const phases = [0, 1, 2];
      let i = 1;
      setSigninPhase(phases[i]);
      clearInterval(signinTimerRef.current);
      signinTimerRef.current = setInterval(() => {
        i++;
        if (i >= phases.length) {
          setSigninPhase(phases[0]);
          clearInterval(signinTimerRef.current);
          signinTimerRef.current = null;
          return;
        }
        setSigninPhase(phases[i]);
      }, 550);
    };
    const stopSigninCycle = () => {
      clearInterval(signinTimerRef.current);
      signinTimerRef.current = null;
      setSigninPhase(0);
    };

    return (
      <>
        <div className={`menu-overlay${menuOpen ? ' open' : ''}`} onClick={() => setMenuOpen(false)} />
        <nav className={`nav${menuOpen ? ' menu-open' : ''}`}>
          <div className="nav-inner" onMouseLeave={reset}>
            <a href="/" className="nav-logo">
              <TAAILogo />
            </a>
            <div className="nav-links" ref={linksRef}>
              <div className="nav-pill" style={{ left: pill.left, width: pill.width, opacity: pill.visible ? 1 : 0 }} />
              {NAV_LINKS.map((l) => l.dropdown ? (
                <div key={l.href} className="nav-dropdown-wrap" onMouseEnter={(e) => moveTo(e.currentTarget)}>
                  {l.noClick ? <span className={l.active ? 'active' : ''}>{l.label}</span> : <a href={l.href} className={l.active ? 'active' : ''}>{l.label}</a>}
                  <div className="nav-dropdown">
                    {l.dropdown.map((d, i) => (
                      <React.Fragment key={i}>
                        {d.dividerBefore && <div className="nav-dd-divider" />}
                        <a href={d.href} className="nav-dd-item">{d.label}</a>
                      </React.Fragment>
                    ))}
                  </div>
                </div>
              ) : (
                <a key={l.href} href={l.href} className={l.active ? 'active' : ''}
                   onMouseEnter={(e) => moveTo(e.currentTarget)}>{l.label}</a>
              ))}
            </div>
            <div className="nav-cta">
              {daysLeft !== null ? (
                <a target="_blank" rel="noopener noreferrer" href="https://learn.taai.live/learn/account/signin" className={`btn-nav-signin btn-swap${signinPhase !== 0 ? ' signin-active' : ''}`}
                   onMouseEnter={startSigninCycle} onMouseLeave={stopSigninCycle}>
                  <span className="swap-default" style={{ transform: signinPhase === 0 ? 'none' : 'translateY(-100%)', opacity: signinPhase === 0 ? 1 : 0, transition: signinPhase === 0 ? 'transform .4s ease, opacity .4s ease' : 'transform .32s cubic-bezier(.16,1,.3,1), opacity .24s ease' }}>Sign In</span>
                  <span className="swap-hover" style={{ transform: signinPhase === 1 ? 'translateY(0)' : 'translateY(100%)', opacity: signinPhase === 1 ? 1 : 0, transition: signinPhase === 0 ? 'transform .4s ease, opacity .4s ease' : 'transform .32s cubic-bezier(.16,1,.3,1), opacity .24s ease' }}>{daysLeft} days</span>
                  <span className="swap-hover" style={{ transform: signinPhase === 2 ? 'translateY(0)' : 'translateY(100%)', opacity: signinPhase === 2 ? 1 : 0, transition: signinPhase === 0 ? 'transform .4s ease, opacity .4s ease' : 'transform .32s cubic-bezier(.16,1,.3,1), opacity .24s ease' }}>GATE</span>
                </a>
              ) : (
                <a target="_blank" rel="noopener noreferrer" href="https://learn.taai.live/learn/account/signin" className="btn-nav-signin">Sign In</a>
              )}
              <a target="_blank" rel="noopener noreferrer" href="https://learn.taai.live/learn/account/signup" className="btn-nav-signup">Sign Up</a>
              <a href="/contact" className="btn-nav-contact"><span className="phone-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg></span>Contact Us</a>
            </div>
            <button className={`nav-hamburger${menuOpen ? ' open' : ''}`} onClick={() => setMenuOpen(o => !o)} aria-label="Toggle menu">
              <span /><span /><span />
            </button>
          </div>
        </nav>
        <div className={`mobile-menu${menuOpen ? ' open' : ''}`}>
          {[{ label: 'Home', href: '/' }, ...NAV_LINKS].flatMap((l) => l.noClick && l.dropdown ? l.dropdown : [l]).map((l, i) => (
            <a key={l.href} href={l.href} className={`mobile-menu-link${l.active ? ' active' : ''}`} style={{ animationDelay: `${0.04 + i * 0.05}s` }} onClick={() => setMenuOpen(false)}>
              <span className="mobile-menu-link-icon">{MENU_ICONS[l.href]}</span>
              <span className="mobile-menu-link-label">{l.label}</span>
              <span className="mobile-menu-link-chevron"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M4.5 2.5L8.5 6.5L4.5 10.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg></span>
            </a>
          ))}
          <div className="mobile-menu-divider" />
          <div className="mobile-menu-actions">
            <a target="_blank" rel="noopener noreferrer" href="https://learn.taai.live/learn/account/signin" className="btn-nav-signin">
              <span>Sign In</span>
              <span className="mobile-btn-arrow"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8H13M13 8L8 3M13 8L8 13" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg></span>
            </a>
            <a target="_blank" rel="noopener noreferrer" href="https://learn.taai.live/learn/account/signup" className="btn-nav-signup">
              <span>Sign Up</span>
              <span className="mobile-btn-arrow"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8H13M13 8L8 3M13 8L8 13" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg></span>
            </a>
          </div>
          <a href="/contact" className="mobile-menu-contact"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"/></svg>Contact Us</a>
        </div>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('nav-root')).render(
    <>
      <Nav />
      <div className="nav-spacer" />
    </>
  );
</script>
<script async src="progress.js"></script>
</body>
</html>
