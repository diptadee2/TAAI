<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6d28d9">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" href="/favicon.ico?v=6" sizes="any">
<title>My Progress — TAAI GATE DA 2027</title>
<meta name="description" content="Track your daily GATE DA 2027 study schedule and mark tasks complete as you go.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF; --bg-soft: #FBF9FF;
    --ink: #14102B; --ink-dim: #4A4270; --ink-soft: #857CAE;
    --line: #ECE6F8; --card: #FFFFFF;
    --purple: #8B5CF6; --purple-soft: #E6DCFF;
    --green: #16a34a; --green-soft: #DCFCE7;
    --amber: #d97706; --amber-soft: #FEF3C7;
    --radius-md: 18px; --radius-lg: 26px;
    --shadow-sm: 0 1px 0 rgba(20,16,43,0.04), 0 2px 6px rgba(20,16,43,0.04);
    --shadow-md: 0 2px 0 rgba(20,16,43,0.03), 0 12px 32px rgba(107,75,255,0.08);
    --font-body: 'Poppins', ui-sans-serif, system-ui, sans-serif;
    --font-nav: 'Inter', ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { font-family: var(--font-body); background: var(--bg-soft); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }

  /* Scroll progress + back-to-top — same pattern as the rest of the site (blog.css) */
  .scroll-progress { position: fixed; top: 0; left: 0; z-index: 100; height: 3px; background: linear-gradient(90deg, var(--pink, #FF7FB7), var(--purple)); pointer-events: none; transition: width 120ms linear; }
  .back-to-top { position: fixed; bottom: 24px; right: 24px; z-index: 90; width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, var(--purple), #4D8BFF); color: #fff; border: none; cursor: pointer; display: grid; place-items: center; box-shadow: 0 4px 16px rgba(107,75,255,0.45); opacity: 0; transform: translateY(12px) scale(0.88); transition: opacity .28s ease, transform .32s cubic-bezier(.34,1.3,.64,1), box-shadow .2s; pointer-events: none; }
  .back-to-top.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .back-to-top:hover { box-shadow: 0 6px 28px rgba(107,75,255,0.6); transform: translateY(-2px) scale(1.06); }
  .back-to-top:active { transform: scale(0.93); }

  /* Fade-in reveal on scroll — same easing/timing as the rest of the site */
  .fade-in { opacity: 0; transform: translateY(20px) scale(0.97); transition: opacity .7s cubic-bezier(.34,1.1,.64,1), transform .7s cubic-bezier(.34,1.1,.64,1); }
  .fade-in.visible { opacity: 1; transform: translateY(0) scale(1); }

  .top { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .top-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; font-family: var(--font-nav); font-weight: 700; color: var(--ink); font-size: 15px; transition: transform .22s ease-out, opacity .22s ease; }
  .top-logo:hover { transform: translateY(-2px); opacity: .82; }
  .top-logo img { width: 32px; height: 32px; }
  .top-back { font-family: var(--font-nav); font-size: 12.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); text-decoration: none; transition: color .2s, transform .3s cubic-bezier(.34,1.1,.64,1); display: inline-block; }
  .top-back:hover { color: var(--purple); transform: scale(1.06); }

  /* Decorative background — same radial-blob + dot-grid language as .page-hero elsewhere on the site */
  body { position: relative; overflow-x: hidden; background-image: radial-gradient(circle, rgba(139,92,246,0.07) 1.5px, transparent 1.5px); background-size: 28px 28px; }
  body::before { content: ''; position: fixed; top: -140px; right: -100px; width: 480px; height: 480px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,0.13) 0%, transparent 68%); pointer-events: none; z-index: 0; }
  body::after { content: ''; position: fixed; bottom: -120px; left: -80px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(77,139,255,0.1) 0%, transparent 68%); pointer-events: none; z-index: 0; }
  .top, .wrap, .back-to-top, .scroll-progress { position: relative; z-index: 1; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 80px; }

  #app { min-height: 40vh; }

  .center-note { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 60px 0; }

  /* Registration form */
  .reg-card { background: rgba(255,255,255,0.42); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 8px 32px rgba(139,92,246,0.14), inset 0 1px 0 rgba(255,255,255,0.7); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-radius: var(--radius-lg); padding: 36px 28px; max-width: 420px; margin: 40px auto; text-align: center; }
  .reg-card h1 { font-family: var(--font-nav); font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .reg-card p { color: var(--ink-soft); font-size: 14px; margin-bottom: 22px; }
  .reg-field { text-align: left; margin-bottom: 14px; }
  .reg-field label { display: block; font-family: var(--font-nav); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-dim); margin-bottom: 6px; }
  .reg-field input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 12px; font-family: var(--font-body); font-size: 14.5px; color: var(--ink); background: var(--bg-soft); }
  .reg-field input:focus { outline: none; border-color: var(--purple); background: var(--bg); }
  .btn-primary { width: 100%; padding: 14px; border: none; border-radius: 999px; background: linear-gradient(135deg,#FF7FB7,var(--purple),#4D8BFF); color: #fff; font-family: var(--font-nav); font-weight: 700; font-size: 14.5px; cursor: pointer; margin-top: 6px; box-shadow: 0 8px 28px rgba(139,92,246,0.4); transition: transform .28s cubic-bezier(.34,1.1,.64,1), box-shadow .22s; }
  .btn-primary:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(139,92,246,0.55); }
  .btn-primary:active:not(:disabled) { transform: scale(0.97); }
  .btn-primary:disabled { opacity: .6; cursor: default; transform: none; box-shadow: none; }
  .form-error { color: #dc2626; font-size: 13px; margin-top: 10px; }

  /* Header / stats */
  .roadmap-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
  .roadmap-head h1 { font-family: var(--font-nav); font-size: 19px; font-weight: 700; }
  .roadmap-sub { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
  .roadmap-sub-left button { background: none; border: none; color: var(--purple); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; transition: opacity .2s; }
  .roadmap-sub-left button:hover { opacity: .7; }

  .focus-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 999px; border: 1.5px solid rgba(139,92,246,0.25); background: var(--card); color: var(--ink-dim); font-family: var(--font-nav); font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; transition: transform .28s cubic-bezier(.34,1.1,.64,1), box-shadow .22s, background .22s, color .22s, border-color .22s; }
  .focus-toggle:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(139,92,246,0.18); border-color: var(--purple); color: var(--purple); }
  .focus-toggle.active { background: linear-gradient(135deg,var(--purple),#4D8BFF); color: #fff; border-color: transparent; box-shadow: 0 8px 24px rgba(139,92,246,0.35); }
  .focus-toggle.active:hover { color: #fff; }

  /* Streak hero — the page's primary visual now, replacing the old heatmap-up-top */
  .streak-hero { position: relative; overflow: hidden; text-align: center; padding: 30px 20px 26px; border-radius: var(--radius-lg); margin-bottom: 18px; background: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.85); box-shadow: 0 10px 36px rgba(139,92,246,0.16), inset 0 1px 0 rgba(255,255,255,0.75); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); }
  .streak-hero::before { content: ''; position: absolute; top: -70px; right: -50px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(249,115,22,0.16) 0%, transparent 70%); pointer-events: none; }
  .streak-hero::after { content: ''; position: absolute; bottom: -80px; left: -50px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,0.14) 0%, transparent 70%); pointer-events: none; }
  .streak-flame { position: relative; font-size: 32px; line-height: 1; margin-bottom: 6px; filter: drop-shadow(0 6px 14px rgba(249,115,22,0.4)); }
  .streak-number { position: relative; font-family: var(--font-body); font-size: 52px; font-weight: 700; line-height: 1; background: linear-gradient(120deg,#FF7FB7,var(--purple),#4D8BFF); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: streak-grad 6s ease infinite; }
  .streak-label { position: relative; font-family: var(--font-nav); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-top: 6px; }
  @keyframes streak-grad { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  .stats-bar { background: rgba(255,255,255,0.42); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 2px 20px rgba(139,92,246,0.1), inset 0 1px 0 rgba(255,255,255,0.7); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 18px; }
  .stats-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-dim); margin-bottom: 8px; font-family: var(--font-nav); font-weight: 600; }
  .progress-track { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--purple), #a78bfa); border-radius: 999px; transition: width .5s cubic-bezier(.34,1.1,.64,1); }

  /* Per-subject breakdown */
  .subject-breakdown { background: rgba(255,255,255,0.42); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 2px 20px rgba(139,92,246,0.1), inset 0 1px 0 rgba(255,255,255,0.7); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 18px; }
  .subject-breakdown-title { font-family: var(--font-nav); font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 14px; }
  .subject-row { display: grid; grid-template-columns: minmax(0,1fr) 90px 32px; align-items: center; gap: 10px; margin-bottom: 10px; }
  .subject-row:last-child { margin-bottom: 0; }
  .subject-row-name { font-size: 13px; font-weight: 600; color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subject-row-pct { font-family: var(--font-nav); font-size: 12px; font-weight: 700; color: var(--purple); text-align: right; }

  /* Heatmap — moved to the bottom as a compact secondary visual, with a legend */
  .heatmap-card { background: rgba(255,255,255,0.38); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 2px 16px rgba(139,92,246,0.08); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); border-radius: var(--radius-md); padding: 16px 18px; margin-top: 28px; max-width: 320px; margin-left: auto; margin-right: auto; }
  .heatmap-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .heatmap-title { font-family: var(--font-nav); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .heatmap-legend { display: inline-flex; align-items: center; gap: 3px; font-family: var(--font-nav); font-size: 9.5px; color: var(--ink-soft); }
  .heatmap-legend .heatmap-cell { width: 9px; height: 9px; border-radius: 2.5px; margin: 0 1px; }
  .heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .heatmap-cell { aspect-ratio: 1; border-radius: 4px; background: var(--line); }
  .heatmap-cell[data-level="0"] { background: var(--bg-soft); border: 1px dashed rgba(139,92,246,0.18); }
  .heatmap-cell[data-level="1"] { background: #E6DCFF; }
  .heatmap-cell[data-level="2"] { background: #C4B0FF; }
  .heatmap-cell[data-level="3"] { background: #8B5CF6; }
  .heatmap-cell[data-level="4"] { background: #6d28d9; }
  .heatmap-cell.is-today { box-shadow: 0 0 0 1.5px var(--purple); }

  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .month-nav button { background: var(--card); border: 1px solid var(--line); border-radius: 10px; width: 34px; height: 34px; font-size: 16px; cursor: pointer; color: var(--ink-dim); transition: transform .28s cubic-bezier(.34,1.1,.64,1), border-color .2s, color .2s, box-shadow .22s; }
  .month-nav button:hover { border-color: var(--purple); color: var(--purple); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(139,92,246,0.18); }
  .month-nav button:active { transform: scale(0.92); }
  .month-nav .month-label { font-family: var(--font-nav); font-weight: 700; font-size: 15px; }

  .week-label { font-family: var(--font-nav); font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 22px 0 10px; }

  .day { background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 2px 14px rgba(139,92,246,0.06); backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); border-radius: 14px; margin-bottom: 8px; transition: box-shadow .22s, transform .28s cubic-bezier(.34,1.1,.64,1); }
  .day:hover { box-shadow: 0 6px 22px rgba(139,92,246,0.12); }
  .day-summary { cursor: pointer; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  .day-chevron { flex-shrink: 0; color: var(--ink-soft); transition: transform .38s cubic-bezier(.34,1.3,.64,1); }
  .day-summary[aria-expanded="true"] .day-chevron { transform: rotate(90deg); }
  .day-date { font-family: var(--font-nav); font-weight: 700; font-size: 13.5px; flex: 1; }
  .day-status { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .day-status.complete { background: var(--green-soft); color: var(--green); }
  .day-status.missed { background: var(--amber-soft); color: var(--amber); }
  .day-status.upcoming { background: var(--line); color: var(--ink-soft); }
  /* Grid-rows trick animates to auto-height without JS measuring the content */
  .day-body-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .42s cubic-bezier(.34,1.1,.64,1); }
  .day-body-wrap.expanded { grid-template-rows: 1fr; }
  .day-body-inner { overflow: hidden; }
  .day-body { padding: 0 16px 14px; }
  .task-row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; font-size: 14px; }
  .task-row input[type="checkbox"] { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--purple); cursor: pointer; flex-shrink: 0; transition: transform .2s cubic-bezier(.34,1.5,.64,1); }
  .task-row input[type="checkbox"]:active { transform: scale(0.85); }
  .task-row .task-subject { font-weight: 600; color: var(--purple); }
  .task-row .task-text { transition: color .25s ease; }
  .task-row.done .task-text { text-decoration: line-through; color: var(--ink-soft); }
  .task-preview { font-size: 13.5px; color: var(--ink-dim); padding: 2px 0; }
  .task-preview .task-subject { font-weight: 600; color: var(--ink-soft); }

  .today-card { position: relative; overflow: hidden; border: 2px solid var(--purple); border-radius: var(--radius-lg); background: rgba(255,255,255,0.5); box-shadow: 0 12px 36px rgba(139,92,246,0.2), inset 0 1px 0 rgba(255,255,255,0.8); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); padding: 18px 18px 14px; margin-bottom: 20px; }
  .today-card::before { content: ''; position: absolute; top: -60px; right: -40px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,0.16) 0%, transparent 70%); pointer-events: none; }
  .today-card .today-tag { position: relative; font-family: var(--font-nav); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--purple); margin-bottom: 4px; }
  .today-card .today-date { position: relative; font-family: var(--font-nav); font-weight: 700; font-size: 16px; margin-bottom: 10px; }
  .catchup-warn { position: relative; background: var(--amber-soft); color: #92400e; font-size: 13px; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; line-height: 1.4; }
</style>
</head>
<body>

<div class="scroll-progress" id="scroll-progress-bar"></div>

<div class="top">
  <a class="top-logo" href="/">
    <img src="favicon-32.png" alt="">
    TAAI
  </a>
  <a class="top-back" href="/">← taai.live</a>
</div>

<div class="wrap">
  <div id="app"><p class="center-note">Loading your roadmap…</p></div>
</div>

<button class="back-to-top" id="back-to-top" aria-label="Back to top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<script src="progress.js"></script>
</body>
</html>
