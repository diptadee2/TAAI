<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Private</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<!-- Private pair-study tracker (2026-10-23). This file holds no roadmap content;
     everything comes from /api/pair-board. Open to anyone with the link (no
     passcode, at the user's request), but not linked anywhere, not in the
     sitemap, and noindex. -->
<style>
  :root {
    --paper: #FFF4D6; --card: #FFFFFF; --ink: #111111; --ink-dim: #4A4A4A; --ink-soft: #6B6B6B;
    --yellow: #FDE047; --lime: #BEF264; --pink: #F9A8D4; --sky: #7DD3FC; --lilac: #C4B5FD; --orange: #FDBA74;
    --amber: #F59E0B; --green: #16A34A; --red: #DC2626;
    --shadow: 4px 4px 0 var(--ink); --shadow-sm: 3px 3px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Poppins', system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
  button { font: inherit; color: inherit; }
  .mono { font-family: 'DM Mono', ui-monospace, monospace; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 80px; }
  .box { background: var(--card); border: 3px solid var(--ink); box-shadow: var(--shadow); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border: 2px solid var(--ink); background: var(--card); font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform .1s ease, box-shadow .1s ease; }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn-yellow { background: var(--yellow); }
  .btn-ghost { box-shadow: none; border-color: transparent; background: transparent; text-decoration: underline; padding: 6px 4px; font-weight: 600; }
  .btn-ghost:hover { transform: none; box-shadow: none; }
  .hint { color: var(--ink-soft); font-size: 13px; }

  /* Lock screen */
  .lock { min-height: 100svh; display: grid; place-items: center; padding: 16px; }
  .lock-card { width: min(380px, 100%); padding: 26px 22px; }
  .lock-card h1 { margin: 0 0 6px; font-size: 22px; }
  .lock-card form { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .lock-card input { width: 100%; padding: 12px; font: inherit; font-size: 16px; border: 2px solid var(--ink); background: #fff; }
  .lock-card input:focus { outline: 3px solid var(--yellow); outline-offset: 0; }
  .err { color: var(--red); font-weight: 600; font-size: 14px; min-height: 20px; }

  /* Header */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  .top h1 { margin: 0; font-size: clamp(22px, 5vw, 30px); line-height: 1.15; letter-spacing: -.01em; }
  .top .sub { margin-top: 4px; color: var(--ink-dim); font-size: 14px; }
  .who { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .tools { display: flex; gap: 4px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 14px; margin-bottom: 22px; }
  .stat { padding: 14px 16px; }
  .stat-big { font-size: 34px; font-weight: 800; line-height: 1; }
  .stat-label { font-size: 12.5px; font-weight: 600; color: var(--ink-dim); margin-top: 6px; }
  .bar { height: 12px; border: 2px solid var(--ink); background: #fff; margin-top: 12px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--lime); border-right: 2px solid var(--ink); transition: width .4s ease; }
  .bar > span[style*="width: 0%"] { border-right: 0; }
  .split { display: flex; gap: 12px; margin-top: 8px; font-size: 12.5px; color: var(--ink-dim); flex-wrap: wrap; }
  .split b { color: var(--ink); }
  .stat.behind { background: #FFE4C2; }
  .stat.ontrack { background: #E3F9C5; }

  /* Today */
  .today { padding: 18px; background: var(--yellow); margin-bottom: 26px; }
  .today-tag { display: inline-block; background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 700; padding: 3px 8px; letter-spacing: .03em; }
  .today-subject { margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--ink-dim); }
  .today-row { display: flex; gap: 14px; align-items: flex-start; margin-top: 6px; }
  .today-text { font-size: 18px; font-weight: 700; line-height: 1.35; }
  .notes { margin-top: 14px; padding-top: 12px; border-top: 2px solid var(--ink); display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
  .notes b { font-weight: 700; }

  /* Check */
  .check { flex: none; width: 30px; height: 30px; border: 3px solid var(--ink); background: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .check svg { opacity: 0; transform: scale(.4); transition: opacity .15s ease, transform .2s cubic-bezier(.34,1.56,.64,1); }
  .check[aria-checked="true"] { background: var(--ink); }
  .check[aria-checked="true"] svg { opacity: 1; transform: none; }
  .check:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  .check.small { width: 24px; height: 24px; border-width: 2px; }
  .check.busy { opacity: .5; pointer-events: none; }

  /* Sections */
  .section { margin-bottom: 16px; }
  .sec-head { width: 100%; display: grid; grid-template-columns: 1fr auto 26px; align-items: center; gap: 12px; padding: 14px 16px; border: 0; background: transparent; cursor: pointer; text-align: left; }
  .sec-title { font-weight: 800; font-size: 16px; line-height: 1.25; }
  .sec-range { font-size: 12.5px; color: var(--ink-dim); font-weight: 500; margin-top: 2px; }
  .sec-count { font-weight: 700; font-size: 13.5px; white-space: nowrap; text-align: right; }
  .sec-mini { width: 84px; height: 7px; border: 2px solid var(--ink); background: #fff; margin-top: 5px; margin-left: auto; overflow: hidden; }
  .sec-mini > span { display: block; height: 100%; background: var(--ink); }
  .chev { width: 26px; height: 26px; border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 800; transition: transform .2s ease; }
  .section.open .chev { transform: rotate(180deg); }
  .section.done .sec-head { background: #E3F9C5; }
  .section.current .sec-head { background: #FFF7B3; }
  .tasks { display: none; border-top: 3px solid var(--ink); }
  .section.open .tasks { display: block; }
  .task { display: grid; grid-template-columns: 24px 92px 1fr; gap: 12px; align-items: start; padding: 11px 16px; border-top: 1.5px solid #E4DCC4; }
  .task:first-child { border-top: 0; }
  .task-date { font-size: 12.5px; font-weight: 600; color: var(--ink-dim); padding-top: 2px; line-height: 1.3; }
  .task-date b { display: block; color: var(--ink); font-size: 13px; }
  .task-text { font-size: 14.5px; }
  .task-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; font-size: 12px; }
  .chip { display: inline-block; padding: 1px 7px; border: 1.5px solid var(--ink); font-weight: 700; font-size: 11.5px; background: #fff; }
  .chip-test { background: var(--sky); }
  .chip-today { background: var(--yellow); }
  .chip-late { background: #FFD7A8; }
  .by { color: var(--green); font-weight: 600; }
  .task.is-done .task-text { color: var(--ink-soft); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .task.is-late { box-shadow: inset 5px 0 0 var(--amber); }
  .task.is-today { background: #FFFBE0; }

  /* Rename */
  .rename { padding: 16px; margin-bottom: 20px; display: none; }
  .rename.show { display: block; }
  .rename form { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 10px; align-items: end; }
  .rename label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; }
  .rename input { padding: 9px 10px; font: inherit; font-size: 15px; border: 2px solid var(--ink); }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 14px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s ease; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; }
  .sync { font-size: 12px; color: var(--ink-soft); text-align: right; margin-top: 18px; }


  /* Cumulative revision line under each day (2026-10-23) */
  .rev { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 2px 0 2px 10px; border-left: 3px solid var(--lilac); }
  .rev .check.small { width: 20px; height: 20px; }
  .rev .check.small svg { width: 13px; height: 13px; }
  .rev-tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; background: var(--lilac); border: 1.5px solid var(--ink); padding: 0 6px; margin-right: 4px; }
  .rev-text { font-size: 13.5px; font-weight: 600; line-height: 1.4; }
  .rev-label { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: #6D28D9; margin-right: 6px; }
  .rev-sub { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
  .rev.is-done .rev-text { color: var(--ink-soft); text-decoration: line-through; }
  .today .rev { margin-top: 12px; }
  .task.is-done .rev:not(.is-done) .rev-text { text-decoration: none; color: var(--ink); }
  .stat-head { font-size: 11.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 8px; }
  .stat-big-sm { font-size: 22px; }
  /* Plan, extras, notes links (2026-10-23) */
  .plan { list-style: none; margin: 12px 0 0; padding: 0; counter-reset: step; display: flex; flex-direction: column; gap: 10px; }
  .plan > li { counter-increment: step; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; }
  .plan > li::before { content: counter(step); width: 24px; height: 24px; display: grid; place-items: center; background: var(--ink); color: var(--yellow); font-weight: 800; font-size: 13px; margin-top: 2px; }
  .step-row { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 2px solid var(--ink); padding: 10px 12px; }
  .step-kicker { font-size: 12px; font-weight: 700; color: var(--ink-dim); margin-bottom: 2px; }
  .plain-step { background: #fff; border: 2px solid var(--ink); padding: 9px 12px; font-size: 14px; font-weight: 600; }
  .plan .rev, .plan .extra { margin-top: 0; }
  .plan .rev { background: #fff; border: 2px solid var(--ink); border-left: 6px solid var(--lilac); padding: 10px 12px; }
  .plan .extra-test { background: #fff; border: 2px solid var(--ink); padding: 9px 12px; }
  .kind-tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; border: 1.5px solid var(--ink); padding: 0 6px; vertical-align: 1px; }
  .kind-rev { background: var(--lilac); }
  .kind-test { background: var(--sky); }
  .kind-notes { background: var(--lime); }
  .kind-apt { background: #FFD7A8; }
  .rev-notes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .rev-notes:empty { display: none; }
  .extra { margin-top: 8px; font-size: 13.5px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .note-jump { font: inherit; font-size: 13px; font-weight: 700; background: #fff; border: 2px solid var(--ink); padding: 3px 9px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
  .note-jump:hover { background: var(--yellow); }
  .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .links:empty { display: none; }
  .note-chip { display: inline-flex; align-items: stretch; border: 2px solid var(--ink); background: #fff; font-size: 12.5px; max-width: 100%; }
  .note-chip a { color: var(--ink); text-decoration: none; padding: 3px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
  .note-chip a:hover { background: var(--yellow); }
  .note-x { font: inherit; font-weight: 800; border: 0; border-left: 2px solid var(--ink); background: #fff; cursor: pointer; padding: 0 8px; }
  .note-x:hover { background: #FFD7A8; }
  .add-link { font: inherit; font-size: 12.5px; font-weight: 700; background: transparent; border: 0; padding: 2px 0; cursor: pointer; color: var(--ink-dim); text-decoration: underline; text-underline-offset: 3px; }
  .add-link:hover { color: var(--ink); }
  .add-note { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; margin-top: 2px; }
  .add-note input { font: inherit; font-size: 14px; border: 2px solid var(--ink); padding: 7px 9px; background: #fff; flex: 1 1 220px; min-width: 0; }
  .add-note-actions { display: flex; gap: 6px; }
  .views { display: flex; gap: 0; margin: 0 0 18px; border: 2px solid var(--ink); width: max-content; max-width: 100%; }
  .views button { font: inherit; font-size: 14px; font-weight: 700; padding: 8px 16px; background: #fff; border: 0; cursor: pointer; color: var(--ink); }
  .views button + button { border-left: 2px solid var(--ink); }
  .views button[aria-selected="true"] { background: var(--ink); color: var(--yellow); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .filters button { font: inherit; font-size: 13px; font-weight: 700; background: #fff; border: 2px solid var(--ink); padding: 4px 10px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--yellow); }
  .notes-sec { margin-bottom: 14px; }
  .notes-sec-head { padding: 10px 16px; font-weight: 800; border-bottom: 2px solid var(--ink); background: var(--lilac); }
  .notes-day { padding: 10px 16px; border-bottom: 1.5px solid #E5DCC8; }
  .notes-day:last-child { border-bottom: 0; }
  .notes-day-head { font-size: 13.5px; }
  .empty-notes { padding: 18px; font-size: 14.5px; line-height: 1.5; }
  .linkish { font: inherit; background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; color: var(--ink); font-weight: 700; }

  /* Revision map (2026-10-23) */
  .grid-top { display: flex; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .grid-sum { font-size: 14px; }
  .hl-row { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
  .hl-label { font-size: 12px; font-weight: 700; color: var(--ink-dim); margin-right: 8px; }
  .hl-btn { font: inherit; font-size: 12.5px; font-weight: 700; padding: 4px 10px; background: #fff; border: 2px solid var(--ink); cursor: pointer; color: var(--ink); }
  .hl-btn + .hl-btn { border-left: 0; }
  .hl-btn[aria-pressed="true"] { background: var(--ink); color: var(--yellow); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-dim); margin-bottom: 12px; align-items: center; }
  .legend > span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sq { width: 16px; height: 16px; font-size: 10px; cursor: default; }
  .grid-filter { font-size: 13px; margin-bottom: 10px; }
  .grid-box { padding: 6px 0; }
  .grid { display: flex; flex-direction: column; }
  .grow { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 4px 14px; padding: 10px 16px; border-bottom: 1.5px solid #E5DCC8; align-items: center; }
  .grow:last-child { border-bottom: 0; }
  .grow-label b { display: block; font-size: 13.5px; line-height: 1.25; }
  .grow-label span { font-size: 11.5px; color: var(--ink-dim); font-weight: 600; }
  .grow-cells { display: flex; flex-wrap: wrap; gap: 6px; }
  .tl { position: relative; font: inherit; text-align: left; color: var(--ink); background: #fff; border: 2px solid var(--ink); padding: 5px 9px 4px; cursor: pointer; display: inline-flex; flex-direction: column; gap: 1px; min-width: 0; max-width: 190px; }
  .tl-name { font-size: 12.5px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-meta { font-family: 'DM Mono', monospace; font-size: 10.5px; color: var(--ink-dim); }
  .tl-rev { position: absolute; top: -8px; right: -6px; background: var(--ink); color: var(--yellow); font-size: 10px; font-weight: 800; padding: 1px 5px; line-height: 1.3; font-family: 'DM Mono', monospace; }
  .tl.sq-notes { background: #D9F99D; }
  .tl.sq-empty { background: #fff; border-color: #EA580C; }
  .tl.sq-next { background: transparent; border: 2px dashed #C4BBA8; }
  .tl.sq-next .tl-name { color: var(--ink-dim); font-weight: 600; }
  .legend .sw { width: 16px; height: 16px; display: inline-block; border: 2px solid var(--ink); }
  .legend .sw.sq-notes { background: #D9F99D; } .legend .sw.sq-empty { border-color: #EA580C; } .legend .sw.sq-next { border: 2px dashed #C4BBA8; }
  .tl-rev-legend { position: static; display: inline-block; }
  .sq { width: 26px; height: 26px; padding: 0; border: 2px solid var(--ink); background: #fff; cursor: pointer; display: inline-grid; place-items: center; font: inherit; font-size: 11px; font-weight: 800; color: var(--ink); flex: none; }
  .sq-notes { background: #84CC16; }
  .sq-empty { background: #fff; border-color: #EA580C; }
  .sq-next { background: transparent; border: 2px dashed #C4BBA8; }
  .sq-today { outline: 2px solid var(--ink); outline-offset: 2px; }
  .sq-sel { box-shadow: 0 0 0 3px var(--yellow), 0 0 0 5px var(--ink); }
  .sq-dim { opacity: .18; }
  .sq:hover:not(.sq-dim), .tl:hover:not(.sq-dim) { transform: translateY(-1px); }
  .sq-panel { grid-column: 1 / -1; position: relative; margin-top: 8px; border: 2px solid var(--ink); background: #FFFBEA; padding: 10px 40px 12px 12px; }
  .sq-close { position: absolute; top: 4px; right: 6px; font: inherit; font-size: 20px; font-weight: 800; background: none; border: 0; cursor: pointer; color: var(--ink); line-height: 1; padding: 4px 6px; }
  .sq-panel-text { font-weight: 800; font-size: 15px; line-height: 1.35; }
  .sq-panel-meta { font-size: 12.5px; color: var(--ink-dim); margin-top: 3px; }
  .today-map { margin-top: 10px; border: 2px solid var(--ink); background: #fff; }
  .today-map .grow { grid-template-columns: 1fr; padding: 10px 12px; }

  /* Who are you? popup (2026-10-24) */
  .who-me { font-size: 13.5px; }
  .who-modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; }
  .who-modal[hidden] { display: none; }
  .who-backdrop { position: absolute; inset: 0; background: rgba(18,19,22,.45); }
  .who-box { position: relative; width: min(420px, 100%); padding: 22px 20px 18px; background: var(--paper); }
  .who-title { font-size: 22px; font-weight: 800; }
  .who-sub { font-size: 13.5px; color: var(--ink-dim); margin-top: 4px; }
  .who-msg { margin-top: 10px; font-size: 13px; font-weight: 700; color: #B45309; }
  .who-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .who-btn { font: inherit; text-align: center; padding: 16px 10px; border: 2px solid var(--ink); background: #fff; cursor: pointer; display: flex; flex-direction: column; gap: 4px; align-items: center; box-shadow: 3px 3px 0 var(--ink); color: var(--ink); }
  .who-btn b { font-size: 17px; }
  .who-btn:hover:not([disabled]) { background: var(--yellow); }
  .who-btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .who-btn span { font-size: 11px; font-weight: 600; color: var(--ink-dim); }
  .who-reset { margin-top: 14px; font-size: 12.5px; color: var(--ink-dim); }
  .who-x { position: absolute; top: 6px; right: 8px; font: inherit; font-size: 22px; font-weight: 800; background: none; border: 0; cursor: pointer; color: var(--ink); padding: 4px 8px; }

  @media (max-width: 640px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .stat-main { grid-column: 1 / -1; }
    .who { align-items: flex-start; }
    .task { grid-template-columns: 24px 1fr; gap: 6px 12px; }
    .task-date { grid-column: 2; padding-top: 0; }
    .task-date b { display: inline; margin-right: 6px; }
    .task-body { grid-column: 2; }
    .rename form { grid-template-columns: 1fr 1fr; }
    .today-text { font-size: 16.5px; }
    .note-chip a { max-width: 230px; }
    .grow { grid-template-columns: 1fr; padding: 10px 12px; }
    .grow-label { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .grow-label b { display: inline; }
    .plan > li { grid-template-columns: 22px minmax(0, 1fr); gap: 8px; }
    .plan > li::before { width: 22px; height: 22px; font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var BOARD = 'sunitesh101';
  var KEY_CODE = 'pairboard:' + BOARD + ':code', KEY_ME = 'pairboard:' + BOARD + ':me', KEY_OPEN = 'pairboard:' + BOARD + ':open', KEY_VIEW = 'pairboard:' + BOARD + ':view';
  var POLL_MS = 20000;
  var app = document.getElementById('app');
  var S = { code: null, data: null, me: null, open: {}, busy: {}, renaming: false, lastSync: null, view: read('pairboard:sunitesh101:view') === 'notes' ? 'notes' : 'schedule', notesFilter: null, addingFor: null, selTopic: null, mapHl: '' };

  function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function todayIST() { return new Date(Date.now() + 5.5 * 3600000).toISOString().slice(0, 10); }
  function fmtDay(id) { var d = new Date(id + 'T12:00:00Z'); return { wd: d.toLocaleDateString('en-GB', { weekday: 'short', timeZone: 'UTC' }), dm: d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' }) }; }
  function daysBetween(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
  var CHECK_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FDE047" stroke-width="3.5" stroke-linecap="square" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  var toastTimer;
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600); }

  // A random id for this browser, so the server knows which device picked which name.
  var DEVICE = read('pairboard:' + BOARD + ':device');
  if (!DEVICE) { DEVICE = 'd' + Math.random().toString(36).slice(2) + Date.now().toString(36); store('pairboard:' + BOARD + ':device', DEVICE); }
  function api(payload) {
    return fetch('/api/pair-board', { method: 'POST', headers: { 'Content-Type': 'application/json' }, cache: 'no-store',
      body: JSON.stringify(Object.assign({ board: BOARD, code: S.code, device: DEVICE }, payload)) })
      .then(function (r) { return r.json().then(function (b) { if (!r.ok) { var e = new Error(b.error || 'error'); e.status = r.status; throw e; } return b; }); });
  }

  // ── Lock ────────────────────────────────────────────────────────────
  function renderLock(msg) {
    document.title = 'Private';
    app.innerHTML = '<div class="lock"><div class="box lock-card">' +
      '<h1>Private page</h1><div class="hint">Enter the passcode to continue.</div>' +
      '<form id="lock-form" autocomplete="off"><input id="code" type="password" placeholder="Passcode" autocomplete="current-password" required>' +
      '<div class="err" id="lock-err">' + esc(msg || '') + '</div>' +
      '<button class="btn btn-yellow" type="submit" id="unlock">Unlock</button></form></div></div>';
    var input = document.getElementById('code');
    input.focus();
    document.getElementById('lock-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = document.getElementById('unlock');
      btn.disabled = true; btn.textContent = 'Checking…';
      S.code = input.value.trim();
      load().then(function () { store(KEY_CODE, S.code); })
        .catch(function (err) { S.code = null; renderLock(err.status === 401 ? "That passcode isn't right." : "Couldn't reach the server. Try again."); });
    });
  }

  // ── Data ────────────────────────────────────────────────────────────
  function load() {
    return api({ action: 'load' }).then(function (d) {
      d.tickMap = groupTicks(d.ticks);
      d.linkMap = groupLinks(d.links);
      var first = !S.data;
      S.data = d; S.lastSync = new Date();
      syncMe(d);
      if (first) {
        try { S.open = JSON.parse(read(KEY_OPEN) || 'null') || null; } catch (e) { S.open = null; }
        if (!S.open) { S.open = {}; var cur = currentSectionIndex(); if (cur >= 0) S.open[cur] = true; }
      }
      render();
    });
  }
  // Who this device is, from the server's claims: the server's answer wins.
  // A name another device holds can't be used here; an old local pick from
  // before claims existed is claimed quietly if it's still free.
  function syncMe(d) {
    if (!d.claimsReady) return;
    if (d.mine === 0 || d.mine === 1) { if (S.me !== d.mine) { S.me = d.mine; store(KEY_ME, String(S.me)); } return; }
    if (S.me != null && d.taken[S.me]) { S.me = null; store(KEY_ME, null); return; }
    if (S.me != null && !d.taken[S.me]) {
      var who = S.me;
      api({ action: 'claim', who: who }).then(function (r) { d.taken = r.taken || d.taken; }).catch(function () { S.me = null; store(KEY_ME, null); render(); });
    }
  }
  // tickMap[taskId] = { 0: tick, 1: tick }: each person's own tick on that day.
  // A day counts as done for the pair once either of them has ticked it.
  function groupTicks(rows) {
    var map = {};
    (rows || []).forEach(function (t) { (map[t.task_id] = map[t.task_id] || {})[t.done_by] = t; });
    return map;
  }
  // linkMap[taskId] = [notes links attached to that day, oldest first]
  function groupLinks(rows) {
    var map = {};
    (rows || []).forEach(function (n) { (map[n.task_id] = map[n.task_id] || []).push(n); });
    return map;
  }
  function isRevisionSection(i) { return /revision/i.test(S.data.sections[i].title); }
  function topicSections() { return S.data.sections.map(function (s, i) { return i; }).filter(function (i) { return !isRevisionSection(i); }); }
  function allTasks() { var out = []; S.data.sections.forEach(function (s, i) { s.tasks.forEach(function (t) { out.push(Object.assign({ section: i }, t)); }); }); return out; }
  function taskById(id) { var l = allTasks(); for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i]; return null; }
  function currentSectionIndex() {
    var today = todayIST(), list = allTasks();
    for (var i = 0; i < list.length; i++) if (list[i].id >= today) return list[i].section;
    return list.length ? list[list.length - 1].section : -1;
  }
  function notesCountForSection(i) {
    return S.data.sections[i].tasks.reduce(function (n, t) { return n + (S.data.linkMap[t.id] || []).length; }, 0);
  }
  function dayLabel(id) { var f = fmtDay(id); return f.wd + ' ' + f.dm; }
  function everyDayNote() { var n = (S.data.notes || []).filter(function (x) { return /^every day$/i.test(x.label); })[0]; return n ? n.text.replace(/\.$/, '') : ''; }

  // ── Render ──────────────────────────────────────────────────────────
  function render() {
    var d = S.data, names = d.names, today = todayIST(), list = allTasks();
    document.title = 'Roadmap · ' + names.join(' & ');
    var done = list.filter(function (t) { return d.tickMap[t.id]; });
    var pct = list.length ? Math.round(done.length / list.length * 100) : 0;
    var byCount = [0, 0]; done.forEach(function (t) { var m = d.tickMap[t.id]; if (m[0]) byCount[0] += 1; if (m[1]) byCount[1] += 1; });
    var due = list.filter(function (t) { return t.id < today; });
    var late = due.filter(function (t) { return !d.tickMap[t.id]; });
    var revs = list.filter(function (t) { return t.revision; });
    var revDone = revs.filter(function (t) { return d.tickMap[t.revision.id]; }).length;
    var last = list[list.length - 1], first = list[0];
    // Days of the roadmap still ahead, counting today (all of them before it starts).
    var daysLeft = !last ? 0 : today < first.id ? list.length : Math.max(0, daysBetween(today, last.id) + 1);
    var todayTask = list.filter(function (t) { return t.id === today; })[0];
    var linkTotal = (d.links || []).length;

    var html = '<div class="wrap">';
    html += '<div class="top"><div><h1>' + esc(d.title) + '</h1><div class="sub">' + esc(names[0]) + ' &amp; ' + esc(names[1]) +
      ' · ' + list.length + ' days, ' + fmtDay(first.id).dm + ' to ' + fmtDay(last.id).dm + '</div></div>' +
      '<div class="who">' + (S.me != null
          ? '<span class="who-me">You\'re <b>' + esc(names[S.me]) + '</b> · <button type="button" class="linkish" data-who>Not you?</button></span>'
          : '<button type="button" class="btn btn-yellow" data-who>Pick who you are</button>') +
      '<div class="tools"><button class="btn-ghost btn" id="rename-btn" type="button">Rename</button>' + (d.open ? '' : '<button class="btn-ghost btn" id="lock-btn" type="button">Lock</button>') + '</div></div></div>';

    html += '<div class="box rename' + (S.renaming ? ' show' : '') + '"><form id="rename-form"><label>Person 1<input name="n0" maxlength="24" value="' + esc(names[0]) + '" required></label>' +
      '<label>Person 2<input name="n1" maxlength="24" value="' + esc(names[1]) + '" required></label>' +
      '<button class="btn btn-yellow" type="submit">Save</button><button class="btn" type="button" id="rename-cancel">Cancel</button></form></div>';

    html += '<div class="stats">' +
      '<div class="box stat stat-main"><div class="stat-head">Progress</div><div class="stat-big">' + pct + '%</div><div class="stat-label">' + done.length + ' of ' + list.length + ' days done' +
          (revs.length ? ' · revision ' + revDone + ' of ' + revs.length : '') + '</div>' +
        '<div class="bar"><span style="width: ' + pct + '%"></span></div>' +
        '<div class="split"><span>' + esc(names[0]) + ' ticked <b>' + byCount[0] + '</b></span><span>' + esc(names[1]) + ' ticked <b>' + byCount[1] + '</b></span></div></div>' +
      // Catch-up: past days nobody has ticked yet. Before day 1 it says when it starts.
      (due.length
        ? '<div class="box stat ' + (late.length ? 'behind' : 'ontrack') + '"><div class="stat-head">Catch-up</div><div class="stat-big">' + (late.length || '✓') + '</div><div class="stat-label">' +
            (late.length ? (late.length === 1 ? 'past day not ticked' : 'past days not ticked') : 'On track, nothing missed') + '</div></div>'
        : '<div class="box stat"><div class="stat-head">Catch-up</div><div class="stat-big stat-big-sm">' + dayLabel(first.id) + '</div><div class="stat-label">Starts then. Missed days show up here.</div></div>') +
      '<div class="box stat"><div class="stat-head">Countdown</div><div class="stat-big">' + daysLeft + '</div><div class="stat-label">' + (daysLeft === 1 ? 'day left' : 'days left') + '</div></div>' +
    '</div>';

    // Schedule / Notes switch
    html += '<div class="views" role="tablist">' +
      '<button type="button" role="tab" data-view="schedule" aria-selected="' + (S.view !== 'notes') + '">Schedule</button>' +
      '<button type="button" role="tab" data-view="notes" aria-selected="' + (S.view === 'notes') + '">Revision map' + (linkTotal ? ' (' + linkTotal + (linkTotal === 1 ? ' note)' : ' notes)') : '') + '</button></div>';

    if (S.view === 'notes') {
      html += renderNotesView();
    } else {
      html += renderTodayCard(todayTask, today, first, late);
      var cur = currentSectionIndex();
      d.sections.forEach(function (s, i) {
        var sd = s.tasks.filter(function (t) { return d.tickMap[t.id]; }).length;
        var isDone = sd === s.tasks.length;
        var open = !!S.open[i];
        var nCount = notesCountForSection(i);
        html += '<div class="box section' + (open ? ' open' : '') + (isDone ? ' done' : '') + (i === cur && !isDone ? ' current' : '') + '" data-sec="' + i + '">' +
          '<button class="sec-head" type="button" data-toggle="' + i + '" aria-expanded="' + open + '"><div><div class="sec-title">' + (i + 1) + '. ' + esc(s.title) + (isDone ? ' ✓' : '') + '</div>' +
            '<div class="sec-range">' + esc(s.range) + (i === cur && !isDone ? ' · now' : '') + (nCount ? ' · ' + nCount + ' saved note' + (nCount === 1 ? '' : 's') : '') + '</div></div>' +
            '<div><div class="sec-count">' + sd + ' / ' + s.tasks.length + '</div><div class="sec-mini"><span style="width:' + Math.round(sd / s.tasks.length * 100) + '%"></span></div></div>' +
            '<span class="chev" aria-hidden="true">⌄</span></button>' +
          '<div class="tasks">' + s.tasks.map(function (t) {
            var tk = d.tickMap[t.id], f = fmtDay(t.id);
            var cls = 'task' + (tk ? ' is-done' : '') + (!tk && t.id < today ? ' is-late' : '') + (t.id === today ? ' is-today' : '');
            return '<div class="' + cls + '" data-task="' + t.id + '">' + checkHtml(t, true) +
              '<div class="task-date"><b>' + f.wd + '</b>' + f.dm + '</div>' +
              '<div class="task-body"><div class="task-text">' + esc(t.text) + '</div>' + metaHtml(t, today, false) +
                testHtml(t) + reviseSubjectsHtml(t) + linksHtml(t.id, true) + revisionHtml(t) + '</div></div>';
          }).join('') + '</div></div>';
      });
    }

    html += '<div class="sync" id="sync">' + syncText() + '</div></div>';
    app.innerHTML = html;
    bind();
  }

  // Today: a numbered plan, so the extras (revision, test, aptitude) read as
  // part of the day rather than notes at the bottom.
  function renderTodayCard(t, today, first, late) {
    var d = S.data;
    if (!t) {
      if (first && today < first.id) {
        var n = daysBetween(today, first.id);
        return '<div class="box today"><span class="today-tag">STARTS IN ' + n + (n === 1 ? ' DAY' : ' DAYS') + '</span>' +
          '<div class="today-text" style="margin-top:10px;">First up (' + dayLabel(first.id) + '): ' + esc(first.text) + '</div>' +
          (everyDayNote() ? '<div class="hint" style="margin-top:8px;color:var(--ink)">Every day also: ' + esc(everyDayNote()) + '. Each day gets a revision slot once there is something to revise.</div>' : '') + '</div>';
      }
      return '<div class="box today"><span class="today-tag">ROADMAP FINISHED</span><div class="today-text" style="margin-top:10px;">' +
        (late.length ? late.length + ' day' + (late.length === 1 ? '' : 's') + ' still unticked below.' : 'Every day is ticked. Well done, both of you.') + '</div></div>';
    }
    var steps = [];
    steps.push('<li><div class="step-row">' + checkHtml(t, false) + '<div><div class="step-kicker">' + esc(d.sections[t.section].title) + '</div><div class="today-text">' + esc(t.text) + '</div>' +
      metaHtml(t, today, true) + linksHtml(t.id, true) + '</div></div></li>');
    // Revision days: the subjects to revise open right here with their notes.
    if (t.reviseSubjects && !t.reviseAll) steps.push('<li>' + todayMapHtml(t) + '</li>');
    if (t.revision) steps.push('<li>' + revisionHtml(t, true) + '</li>');
    if (t.testCovers) steps.push('<li>' + testHtml(t, true) + '</li>');
    if (everyDayNote()) steps.push('<li><div class="plain-step"><span class="kind-tag kind-apt">Aptitude</span> ' + esc(everyDayNote()) + '</div></li>');
    return '<div class="box today"><span class="today-tag">TODAY · ' + dayLabel(today).toUpperCase() + '</span><ol class="plan">' + steps.join('') + '</ol></div>';
  }

  function checkHtml(t, small) {
    // Your own tick (the person picked under "Ticking as").
    var m = S.data.tickMap[t.id], on = !!(m && S.me != null && m[S.me]);
    return '<button type="button" class="check' + (small ? ' small' : '') + (S.busy[t.id] ? ' busy' : '') + '" role="checkbox" aria-checked="' + on + '" data-tick="' + t.id + '" aria-label="' + esc((on ? 'Done: ' : 'Mark done: ') + (t.text || 'revision')) + '">' + CHECK_SVG + '</button>';
  }
  function whoTicked(tk, withDate) {
    var out = '';
    if (tk) [0, 1].forEach(function (k) { if (tk[k]) out += '<span class="by">✓ ' + esc(S.data.names[k]) + (withDate ? ' · ' + fmtDay(String(tk[k].done_at).slice(0, 10)).dm : '') + '</span>'; });
    return out;
  }
  function metaHtml(t, today, onToday) {
    var tk = S.data.tickMap[t.id], bits = [];
    if (!onToday && t.id === today) bits.push('<span class="chip chip-today">Today</span>');
    if (!tk && t.id < today) bits.push('<span class="chip chip-late">Catch up</span>');
    var who = whoTicked(tk, true);
    if (who) bits.push(who);
    return bits.length ? '<div class="task-meta">' + bits.join('') + '</div>' : '';
  }
  // Weekly test: what it covers.
  function testHtml(t, big) {
    if (!t.testCovers) return '';
    var subjects = t.testCovers.map(function (i) { return S.data.sections[i].title; });
    return '<div class="extra extra-test' + (big ? ' big' : '') + '"><span class="kind-tag kind-test">Weekly test</span> <span>covers ' + esc(subjects.join(', ')) + '</span></div>';
  }
  // Final revision days: one tap to those subjects in the revision map.
  function reviseSubjectsHtml(t) {
    if (!t.reviseSubjects) return '';
    var d = S.data;
    if (t.reviseAll) {
      return '<div class="extra"><span class="kind-tag kind-notes">Revision map</span> <button type="button" class="note-jump" data-jump="all">All subjects →</button></div>';
    }
    return '<div class="extra"><span class="kind-tag kind-notes">Revision map</span> ' + t.reviseSubjects.map(function (i) {
      return '<button type="button" class="note-jump" data-jump="' + i + '">' + esc(d.sections[i].title) + ' →</button>';
    }).join(' ') + '</div>';
  }
  // Today card on a revision day: the grid for the subjects to revise.
  function todayMapHtml(t) {
    return '<div class="today-map">' + gridHtml(t.reviseSubjects, 'today') + '</div>';
  }

  // ── Revision grid ───────────────────────────────────────────────────
  // How many times each topic has been revised, from the ticks you already
  // make: a ticked daily revision slot counts for the topic it points at, and
  // a ticked "Revise <subjects>" day counts for every topic of those subjects.
  function revisionCounts() {
    // Only days up to today count (a future day ticked early is most likely a slip).
    var d = S.data, counts = {}, last = {}, today = todayIST();
    function add(id, day) { counts[id] = (counts[id] || 0) + 1; if (!last[id] || day > last[id]) last[id] = day; }
    allTasks().forEach(function (t) {
      if (t.id > today) return;
      if (t.revision && d.tickMap[t.revision.id]) add(t.revision.fromId, t.id);
      if (t.reviseSubjects && !t.reviseAll && d.tickMap[t.id]) t.reviseSubjects.forEach(function (i) { d.sections[i].tasks.forEach(function (x) { add(x.id, t.id); }); });
    });
    return { counts: counts, last: last };
  }
  // Short name for a topic tile: the text before the first ':', ',', ';', '(' or ' + '
  // ("Sorting I: bubble, ..." -> "Sorting I"), capped at 26 characters.
  function shortTopic(text) {
    var cut = String(text).split(/:|,|;|\(| \+ /)[0].trim();
    if (cut.length < 3) cut = String(text);
    return cut.length > 26 ? cut.slice(0, 25).trim() + '…' : cut;
  }
  function topicState(t, today, rc) {
    var hasN = (S.data.linkMap[t.id] || []).length > 0, studied = t.id <= today, rev = rc.counts[t.id] || 0;
    return { hasN: hasN, studied: studied, rev: rev, today: t.id === today };
  }
  function matchesHl(st) {
    if (S.mapHl === 'unrevised') return st.studied && st.rev === 0;
    if (S.mapHl === 'nonotes') return st.studied && !st.hasN;
    return true;
  }
  // Rows of squares, one row per subject, one square per topic in study order.
  // ctx keeps the map tab and the Today card's copy from sharing a panel.
  function gridHtml(subs, ctx) {
    var d = S.data, today = todayIST(), rc = revisionCounts();
    var sel = S.selTopic && S.selTopic.ctx === ctx ? S.selTopic.id : null;
    return '<div class="grid">' + subs.map(function (i) {
      var tasks = d.sections[i].tasks, studied = 0, withN = 0;
      var cells = tasks.map(function (t) {
        var st = topicState(t, today, rc);
        if (st.studied) { studied += 1; if (st.hasN) withN += 1; }
        var cls = 'tl ' + (!st.studied ? 'sq-next' : st.hasN ? 'sq-notes' : 'sq-empty') + (st.today ? ' sq-today' : '') + (sel === t.id ? ' sq-sel' : '') + (S.mapHl && !matchesHl(st) ? ' sq-dim' : '');
        var label = t.text + '. ' + (!st.studied ? 'Not studied yet' : (st.hasN ? 'Notes saved' : 'No notes') + ', ' + (st.rev ? 'revised ' + st.rev + (st.rev === 1 ? ' time' : ' times') : 'not revised yet'));
        return '<button type="button" class="' + cls + '" data-sq="' + t.id + '" data-ctx="' + ctx + '" aria-pressed="' + (sel === t.id) + '" aria-label="' + esc(label) + '" title="' + esc(dayLabel(t.id) + ': ' + t.text) + '">' +
          '<span class="tl-name">' + esc(shortTopic(t.text)) + '</span><span class="tl-meta">' + fmtDay(t.id).dm + (st.today ? ' · today' : '') + '</span>' +
          (st.rev ? '<span class="tl-rev" title="Times revised">↻' + st.rev + '</span>' : '') + '</button>';
      }).join('');
      var selTask = sel && tasks.filter(function (t) { return t.id === sel; })[0];
      return '<div class="grow"><div class="grow-label"><b>' + esc(d.sections[i].title) + '</b><span>' + (studied ? 'notes ' + withN + '/' + studied : 'starts ' + fmtDay(tasks[0].id).dm) + '</span></div>' +
        '<div class="grow-cells">' + cells + '</div>' + (selTask ? topicPanelHtml(Object.assign({ section: i }, selTask), today, rc, ctx) : '') + '</div>';
    }).join('') + '</div>';
  }
  function topicPanelHtml(t, today, rc, ctx) {
    var d = S.data, st = topicState(t, today, rc);
    var rev = !st.studied ? 'Not studied yet' : st.rev ? 'Revised ' + st.rev + (st.rev === 1 ? ' time' : ' times') + ', last ' + dayLabel(rc.last[t.id]) : 'Not revised yet';
    return '<div class="sq-panel"><button type="button" class="sq-close" data-sq-close aria-label="Close">×</button>' +
      '<div class="sq-panel-text">' + esc(t.text) + '</div>' +
      '<div class="sq-panel-meta">' + esc(d.sections[t.section].title) + ' · ' + (st.studied ? 'studied ' : 'on ') + dayLabel(t.id) + ' · ' + rev + '</div>' +
      (st.studied ? linksHtml(t.id, true) : '') + '</div>';
  }
  // The day's revision: ONE specific earlier topic, with the notes saved that day.
  function revisionHtml(t, big) {
    var r = t.revision;
    if (!r) return '';
    var d = S.data, tk = d.tickMap[r.id];
    var saved = d.linkMap[r.fromId] || [];
    // One quiet line: "Revise <topic>", then subject and the day it was studied.
    // Notes from that day show only if there are any.
    return '<div class="rev' + (tk ? ' is-done' : '') + (big ? ' big' : '') + '">' + checkHtml(Object.assign({ text: 'Revise ' + r.text }, r), true) +
      '<div class="rev-body"><div class="rev-text"><span class="rev-label">Revise</span>' + esc(r.text) + '</div>' +
      '<div class="rev-sub">' + esc(d.sections[r.subject].title) + ' · studied ' + dayLabel(r.fromId) + '</div>' +
      (saved.length ? '<div class="rev-notes">' + saved.map(function (n) { return chipHtml(n, false); }).join('') + '</div>' : '') +
      (tk ? '<div class="task-meta">' + whoTicked(tk, false) + '</div>' : '') + '</div></div>';
  }
  function chipHtml(n, canRemove) {
    var mine = canRemove; // shared notes: either person can remove any link
    var host = ''; try { host = new URL(n.url).hostname.replace(/^www\./, ''); } catch (e) {}
    var icon = /drive\.google|docs\.google/.test(host) ? '📄' : '🔗';
    return '<span class="note-chip"><a href="' + esc(n.url) + '" target="_blank" rel="noopener noreferrer" title="' + esc(n.url) + '">' + icon + ' <b>' + esc(S.data.names[n.added_by]) + '</b>' +
      (n.label ? ' · ' + esc(n.label) : '') + ' ↗</a>' + (mine ? '<button type="button" class="note-x" data-remove="' + esc(n.id) + '" aria-label="Remove this link">×</button>' : '') + '</span>';
  }
  function linksHtml(taskId, canAdd) {
    var d = S.data, list = d.linkMap[taskId] || [];
    if (!d.linksReady && !list.length) return '';
    var html = '<div class="links">' + list.map(function (n) { return chipHtml(n, true); }).join('');
    if (canAdd && d.linksReady) {
      if (S.addingFor === taskId) {
        html += '<form class="add-note" data-add-form="' + taskId + '"><input name="url" type="url" inputmode="url" placeholder="Paste a Google Drive link" required maxlength="600">' +
          '<input name="label" type="text" placeholder="Title (optional), e.g. Pointers handwritten" maxlength="80">' +
          '<div class="add-note-actions"><button class="btn btn-yellow" type="submit">Save link</button><button class="btn" type="button" data-add-cancel>Cancel</button></div></form>';
      } else {
        html += '<button type="button" class="add-link" data-add="' + taskId + '">+ Add notes</button>';
      }
    }
    return html + '</div>';
  }

  // Revision map: the whole syllabus as one grid. Squares show whether a
  // topic has notes and how often it has been revised; two highlights pick
  // out the gaps near the exam; tap a square for its notes.
  function renderNotesView() {
    var d = S.data, today = todayIST(), rc = revisionCounts(), subs = topicSections();
    var shown = S.notesFilter && S.notesFilter.length ? S.notesFilter : subs;
    var studied = 0, withN = 0, unrevised = 0;
    subs.forEach(function (i) { d.sections[i].tasks.forEach(function (t) { var st = topicState(t, today, rc); if (st.studied) { studied += 1; if (st.hasN) withN += 1; if (!st.rev) unrevised += 1; } }); });
    var hl = function (key, text) { return '<button type="button" class="hl-btn" data-hl="' + key + '" aria-pressed="' + (S.mapHl === key) + '">' + text + '</button>'; };
    return '<div class="grid-top">' +
        '<div class="grid-sum">' + (studied ? '<b>' + withN + '</b> of ' + studied + ' studied topics have notes · <b>' + unrevised + '</b> not revised yet' : 'Nothing studied yet. Squares fill in as you go.') + '</div>' +
        '<div class="hl-row"><span class="hl-label">Highlight</span>' + hl('', 'Everything') + hl('nonotes', 'No notes') + hl('unrevised', 'Not revised') + '</div>' +
      '</div>' +
      '<div class="legend"><span><i class="sw sq-notes"></i>Notes saved</span><span><i class="sw sq-empty"></i>Studied, no notes</span><span><i class="sw sq-next"></i>Not studied yet</span><span><b class="tl-rev tl-rev-legend">↻2</b>Revised twice</span><span>Tap a topic for its notes</span></div>' +
      (S.notesFilter && S.notesFilter.length !== subs.length ? '<div class="grid-filter">Showing ' + esc(shown.map(function (i) { return d.sections[i].title; }).join(', ')) + ' · <button type="button" class="linkish" data-filter="">Show all subjects</button></div>' : '') +
      '<div class="box grid-box">' + gridHtml(shown, 'map') + '</div>';
  }

  function syncText() {
    if (!S.lastSync) return '';
    return 'Synced ' + S.lastSync.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) + ' · updates every 20 seconds';
  }
  // Ask who this is the first time they do something (tick, add notes).
  // `then` runs the action once they've picked.
  function needMe(then) {
    if (S.me != null) return false;
    openWho(then);
    return true;
  }
  var whoEl = null, whoThen = null;
  function openWho(then, msg) {
    whoThen = then || null;
    var d = S.data, taken = (d && d.claimsReady && d.taken) || [false, false];
    if (!whoEl) { whoEl = document.createElement('div'); whoEl.className = 'who-modal'; document.body.appendChild(whoEl); }
    whoEl.innerHTML = '<div class="who-backdrop" data-who-close></div><div class="who-box box" role="dialog" aria-modal="true" aria-labelledby="who-title">' +
      '<div class="who-title" id="who-title">Who are you?</div>' +
      '<div class="who-sub">Pick once on this device. Your ticks and notes go under your name.</div>' +
      (msg ? '<div class="who-msg">' + esc(msg) + '</div>' : '') +
      '<div class="who-pick">' + [0, 1].map(function (i) {
        var lock = taken[i] && S.me !== i;
        return '<button type="button" class="who-btn" data-pick="' + i + '"' + (lock ? ' disabled' : '') + '><b>' + esc(d.names[i]) + '</b>' + (lock ? '<span>Already picked on another device</span>' : '') + '</button>';
      }).join('') + '</div>' +
      (taken[0] || taken[1] ? '<div class="who-reset">Same person on a new device? <button type="button" class="linkish" data-who-reset>Reset both names</button></div>' : '') +
      '<button type="button" class="who-x" data-who-close aria-label="Close">×</button></div>';
    whoEl.hidden = false;
    whoEl.querySelectorAll('[data-who-close]').forEach(function (b) { b.addEventListener('click', closeWho); });
    whoEl.querySelectorAll('[data-pick]').forEach(function (b) {
      b.addEventListener('click', function () {
        var who = Number(b.getAttribute('data-pick'));
        whoEl.querySelectorAll('[data-pick]').forEach(function (x) { x.disabled = true; });
        api({ action: 'claim', who: who }).then(function (r) {
          S.me = who; store(KEY_ME, String(who));
          if (r.taken) S.data.taken = r.taken;
          var then = whoThen; closeWho(); render();
          toast("You're " + S.data.names[who]);
          if (then) then();
        }).catch(function (err) {
          if (err.status === 409) { load().then(function () { openWho(whoThen, S.data.names[who] + ' was just picked on another device.'); }).catch(function () {}); return; }
          openWho(whoThen, "Couldn't save that. Try again.");
        });
      });
    });
    var r = whoEl.querySelector('[data-who-reset]');
    if (r) r.addEventListener('click', function () {
      if (!confirm('Free both names? Each of you then picks again on your own device.')) return;
      api({ action: 'reset-claims' }).then(function () { S.me = null; store(KEY_ME, null); return load(); })
        .then(function () { openWho(whoThen); }).catch(function () { toast("Couldn't reset. Try again."); });
    });
    var first = whoEl.querySelector('.who-btn:not([disabled])'); if (first) first.focus();
  }
  function closeWho() { if (whoEl) { whoEl.hidden = true; whoEl.innerHTML = ''; } whoThen = null; }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && whoEl && !whoEl.hidden) closeWho(); });

  function bind() {
    app.querySelectorAll('[data-who]').forEach(function (b) {
      b.addEventListener('click', function () { openWho(null); });
    });
    app.querySelectorAll('[data-toggle]').forEach(function (b) {
      b.addEventListener('click', function () { var i = b.getAttribute('data-toggle'); S.open[i] = !S.open[i]; store(KEY_OPEN, JSON.stringify(S.open)); render(); });
    });
    app.querySelectorAll('[data-tick]').forEach(function (b) {
      b.addEventListener('click', function () { tick(b.getAttribute('data-tick')); });
    });
    app.querySelectorAll('[data-view]').forEach(function (b) {
      b.addEventListener('click', function () { S.view = b.getAttribute('data-view'); S.notesFilter = null; S.selTopic = null; store(KEY_VIEW, S.view); S.addingFor = null; render(); });
    });
    app.querySelectorAll('[data-filter]').forEach(function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-filter');
        S.notesFilter = v === 'all' || v === '' ? null : [Number(v)];
        render();
      });
    });
    app.querySelectorAll('[data-jump]').forEach(function (b) {
      b.addEventListener('click', function () {
        S.view = 'notes'; store(KEY_VIEW, S.view);
        var j = b.getAttribute('data-jump');
        S.notesFilter = j === 'all' ? null : j.split(',').map(Number); S.selTopic = null;
        render(); window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
    app.querySelectorAll('[data-sq]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-sq'), ctx = b.getAttribute('data-ctx');
        S.selTopic = S.selTopic && S.selTopic.id === id && S.selTopic.ctx === ctx ? null : { id: id, ctx: ctx };
        S.addingFor = null; render();
      });
    });
    app.querySelectorAll('[data-sq-close]').forEach(function (b) {
      b.addEventListener('click', function () { S.selTopic = null; S.addingFor = null; render(); });
    });
    app.querySelectorAll('[data-hl]').forEach(function (b) {
      b.addEventListener('click', function () { S.mapHl = b.getAttribute('data-hl'); render(); });
    });
    app.querySelectorAll('[data-add]').forEach(function (b) {
      b.addEventListener('click', function () {
        var addId = b.getAttribute('data-add');
        function go() { S.addingFor = addId; render(); var f = app.querySelector('[data-add-form] input[name=url]'); if (f) f.focus(); }
        if (needMe(go)) return;
        S.addingFor = addId; render();
        var f = app.querySelector('[data-add-form] input[name=url]'); if (f) f.focus();
      });
    });
    app.querySelectorAll('[data-add-cancel]').forEach(function (b) {
      b.addEventListener('click', function () { S.addingFor = null; render(); });
    });
    app.querySelectorAll('[data-add-form]').forEach(function (f) {
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var taskId = f.getAttribute('data-add-form'), btn = f.querySelector('button[type=submit]');
        btn.disabled = true; btn.textContent = 'Saving…';
        api({ action: 'note-add', taskId: taskId, by: S.me, url: f.url.value.trim(), label: f.label.value.trim() }).then(function (r) {
          S.data.links = (S.data.links || []).concat([r.note]); S.data.linkMap = groupLinks(S.data.links);
          S.addingFor = null; render(); toast('Notes link saved');
        }).catch(function (err) { btn.disabled = false; btn.textContent = 'Save link'; toast(err.message && err.status === 400 ? err.message : "Couldn't save the link. Try again."); });
      });
    });
    app.querySelectorAll('[data-remove]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm('Remove this notes link?')) return;
        var id = b.getAttribute('data-remove');
        api({ action: 'note-remove', id: id }).then(function () {
          S.data.links = (S.data.links || []).filter(function (n) { return n.id !== id; }); S.data.linkMap = groupLinks(S.data.links);
          render(); toast('Link removed');
        }).catch(function () { toast("Couldn't remove it. Try again."); });
      });
    });
    var lockBtn = document.getElementById('lock-btn');
    if (lockBtn) lockBtn.addEventListener('click', function () {
      store(KEY_CODE, null); S.code = null; S.data = null; renderLock();
    });
    document.getElementById('rename-btn').addEventListener('click', function () { S.renaming = !S.renaming; render(); });
    document.getElementById('rename-cancel').addEventListener('click', function () { S.renaming = false; render(); });
    document.getElementById('rename-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target, names = [f.n0.value.trim(), f.n1.value.trim()];
      api({ action: 'names', names: names }).then(function (r) { S.data.names = r.names; S.renaming = false; render(); toast('Names saved'); })
        .catch(function () { toast("Couldn't save the names. Try again."); });
    });
  }

  function tick(id) {
    if (needMe(function () { tick(id); })) return;
    var before = S.data.tickMap[id] ? Object.assign({}, S.data.tickMap[id]) : null;
    var want = !(before && before[S.me]);
    var next = Object.assign({}, before || {});
    if (want) next[S.me] = { task_id: id, done_by: S.me, done_at: new Date().toISOString() }; else delete next[S.me];
    if (next[0] || next[1]) S.data.tickMap[id] = next; else delete S.data.tickMap[id];
    S.busy[id] = true; render();
    api({ action: 'tick', taskId: id, done: want, by: S.me }).then(function (r) {
      delete S.busy[id];
      var m = groupTicks(r.ticks)[id];
      if (m) S.data.tickMap[id] = m; else delete S.data.tickMap[id];
      render();
    }).catch(function (err) {
      delete S.busy[id];
      if (before) S.data.tickMap[id] = before; else delete S.data.tickMap[id];
      render();
      if (err.status === 401) { store(KEY_CODE, null); S.code = null; S.data = null; renderLock('The passcode changed. Enter the new one.'); return; }
      toast("Couldn't save that tick. Check your connection and try again.");
    });
  }

  // Poll so one person's ticks show up for the other.
  setInterval(function () {
    if (!S.data || document.hidden || S.renaming || S.addingFor || (whoEl && !whoEl.hidden) || Object.keys(S.busy).length) return;
    load().catch(function () {});
  }, POLL_MS);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && S.data && !S.renaming && !S.addingFor && !Object.keys(S.busy).length) load().catch(function () {});
  });

  // Start
  var savedMe = read(KEY_ME);
  S.me = savedMe === '0' || savedMe === '1' ? Number(savedMe) : null;
  // The board is open (no passcode) since 2026-10-23; the lock screen only
  // appears if a passcode is ever set on it again.
  S.code = read(KEY_CODE) || '';
  app.innerHTML = '<div class="lock"><div class="hint">Loading…</div></div>';
  load().catch(function (err) {
    store(KEY_CODE, null); S.code = null;
    if (err.status === 401) renderLock();
    else app.innerHTML = '<div class="lock"><div class="box lock-card"><h1>Couldn\'t load</h1><div class="hint">Check your connection.</div><button class="btn btn-yellow" style="margin-top:14px" onclick="location.reload()">Try again</button></div></div>';
  });
})();
</script>
</body>
</html>
